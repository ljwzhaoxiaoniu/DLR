# ══════════════════════════════════════════════════════════════════════
# DLR-only 的 Web 版组合（骑在 base + web bundle 之上，用 --patch 引入）
#
# 与 dsh.patch.yml（headless 版）的关系：
#   - 共用：MCP 行、sop 技能、AGENTS.md、.env —— 只是「装配面」不同；
#   - web 的工具归属 **agent preset**；preset-dlr 已随 `dsh-tsm` bundle 分发（见 §三）；
#   - web 已在进程级禁用大部分工具行（tool-bash/fs/search/web/todo…），
#     headless 那串 disable 在这里大半冗余，只补 web 没禁且对 DLR 有影响的；
#   - 技能目录必须**绝对路径**（web 的 cwd = 你在 UI 里选的工作区）；
#   - 注册表默认 preset 指到 dlr（新会话默认就是语义业务助手）。
#
# 启动：bash dsh_dlr/run_web.sh（不用裸 `dsh web`；启动器负责预检后端）
# ══════════════════════════════════════════════════════════════════════

# ── 一、进程级收尾（web 未禁、且会影响 DLR 会话的）─────────────────

- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false

- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: mcp-resources          # 本服务只有 tools，没有 resources
  disabled: true
- id: session-title-llm      # 额外一次标题模型调用，污染 token 口径
  disabled: true

# ── 一·五、目录选择器：钉住 browse 曲面（Windows 修复）──────────────
# Windows 上 native 曲面会崩（官方已知问题：win32 folder dialog worker exited
# before reporting a result）。auto 行在本机解析为 native → 换成应用内
# Miller 分栏浏览器（browse，不弹系统对话框）。
# 注意两点：① 两张曲面不能同挂（duplicate directoryPicker 会 fail loud）；
# ② patch 里的 `name` 只是断言、改不了行的插件 → 必须「禁 auto + 新增 browse」。
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

# ── 二、默认 preset → dlr ───────────────────────────────────────────
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: dlr

# ── 三、DLR / TSM 的行从哪来（bundle）───────────────────────────────
# preset-dlr（persona · AGENTS.md · sop 技能 · MCP 语义网关 · compaction）与
# TSM 状态浮层，已随 **`dsh-tsm` bundle** 分发，见 `DSH-based Agent Service/dsh-tsm/`。
# 安装（本机已装）：
#   dsh plugin --profile web add "<abs>/DSH-based Agent Service/dsh-tsm"
# 本文件自此只保留**本地策略**：上面的禁用清单 / 目录选择器修复 / registry 默认 preset。
