# 叠加层：把语义服务从「Python（SSE + stdio 桥）」切到「TSM Core Service（TS，streamable-http）」
#
# 用法（叠加在 dsh.patch.yml 之后，后者层序在后 = 胜）：
#   dsh --profile headless \
#       --patch "<abs>/dsh.patch.yml" \
#       --patch "<abs>/tsm-ts.patch.yml" --json "Question: ..."
#
# 前置：TS 服务在跑 → npx tsx src/mcp/server.ts --http 28795
# 切换后：不再需要 mcp_sse_stdio_bridge.py，也不需要 Python 语义服务（评测线不受影响）。
- id: mcp-semantic-core
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: semantic-core
    transport: streamable-http
    url: http://127.0.0.1:28795/mcp
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: true
      maxAttempts: 3
