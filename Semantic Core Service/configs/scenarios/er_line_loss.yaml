# ============================================================
# ER (Entity-Relation) — 电力线损分析场景
# ============================================================
# mapping_type: "er"
# 1 entity ≈ 1 physical table
# ============================================================

mapping_type: "er"
version: "2.0"
scenario_name: er_line_loss
description: "ER 范式 — 电力线损分析场景"

databases:
  line_loss_db: sqlite:///storage/sqlite_dbs/line_loss_db2.db

entities:

  - entity_id: line_loss_db.台区
    biz_name: 台区
    description: "配电变压器供电区域，线损核算单元"
    physical_table_id: line_loss_db.台区
    attributes:
      - {attr_id: line_loss_db.台区.台区编号, biz_name: 台区编号, physical_column_id: line_loss_db.台区.台区编号}
      - {attr_id: line_loss_db.台区.台区名称, biz_name: 台区名称, physical_column_id: line_loss_db.台区.台区名称}
      - {attr_id: line_loss_db.台区.台区所属线路编号, biz_name: 所属线路编号, physical_column_id: line_loss_db.台区.台区所属线路编号}
      - {attr_id: line_loss_db.台区.台区考核户编号, biz_name: 考核户编号, physical_column_id: line_loss_db.台区.台区考核户编号}

  - entity_id: line_loss_db.变压器
    biz_name: 变压器
    description: "台区内的配电变压器"
    physical_table_id: line_loss_db.变压器
    attributes:
      - {attr_id: line_loss_db.变压器.变压器编号, biz_name: 变压器编号, physical_column_id: line_loss_db.变压器.变压器编号}
      - {attr_id: line_loss_db.变压器.变压器名称, biz_name: 变压器名称, physical_column_id: line_loss_db.变压器.变压器名称}
      - {attr_id: line_loss_db.变压器.变压器额定容量, biz_name: 额定容量, physical_column_id: line_loss_db.变压器.变压器额定容量}
      - {attr_id: line_loss_db.变压器.变压器运行状态, biz_name: 运行状态, physical_column_id: line_loss_db.变压器.变压器运行状态}
      - {attr_id: line_loss_db.变压器.变压器经度, biz_name: 经度, physical_column_id: line_loss_db.变压器.变压器经度}
      - {attr_id: line_loss_db.变压器.变压器纬度, biz_name: 纬度, physical_column_id: line_loss_db.变压器.变压器纬度}
      - {attr_id: line_loss_db.变压器.变压器所属台区编号, biz_name: 所属台区编号, physical_column_id: line_loss_db.变压器.变压器所属台区编号}

  - entity_id: line_loss_db.线损记录
    biz_name: 线损记录
    description: "台区线损率主表"
    physical_table_id: line_loss_db.线损记录
    attributes:
      - {attr_id: line_loss_db.线损记录.线损台区编号, biz_name: 台区编号, physical_column_id: line_loss_db.线损记录.线损台区编号}
      - {attr_id: line_loss_db.线损记录.线损数据时间, biz_name: 数据时间, physical_column_id: line_loss_db.线损记录.线损数据时间}
      - {attr_id: line_loss_db.线损记录.异常综合判定, biz_name: 异常判定, physical_column_id: line_loss_db.线损记录.异常综合判定}

  - entity_id: line_loss_db.低压用户计量点
    biz_name: 低压用户计量点
    description: "低压用户表计"
    physical_table_id: line_loss_db.低压用户计量点
    attributes:
      - {attr_id: line_loss_db.低压用户计量点.计量点编号, biz_name: 计量点编号, physical_column_id: line_loss_db.低压用户计量点.计量点编号}
      - {attr_id: line_loss_db.低压用户计量点.计量点所属台区编号, biz_name: 所属台区编号, physical_column_id: line_loss_db.低压用户计量点.计量点所属台区编号}
      - {attr_id: line_loss_db.低压用户计量点.计量点所属用户编号, biz_name: 所属用户编号, physical_column_id: line_loss_db.低压用户计量点.计量点所属用户编号}

  - entity_id: line_loss_db.用户
    biz_name: 用户
    description: "电力用户档案"
    physical_table_id: line_loss_db.用户
    attributes:
      - {attr_id: line_loss_db.用户.用户编号, biz_name: 用户编号, physical_column_id: line_loss_db.用户.用户编号}
      - {attr_id: line_loss_db.用户.用户名称, biz_name: 用户名称, physical_column_id: line_loss_db.用户.用户名称}

  - entity_id: line_loss_db.月电量记录
    biz_name: 月电量记录
    description: "月度结算电量"
    physical_table_id: line_loss_db.月电量记录
    attributes:
      - {attr_id: line_loss_db.月电量记录.电量所属计量点编号, biz_name: 所属计量点编号, physical_column_id: line_loss_db.月电量记录.电量所属计量点编号}
      - {attr_id: line_loss_db.月电量记录.计量点电量有功总, biz_name: 有功总, physical_column_id: line_loss_db.月电量记录.计量点电量有功总}

  - entity_id: line_loss_db.违窃电工单
    biz_name: 违窃电工单
    description: "违窃电检查工单"
    physical_table_id: line_loss_db.违窃电工单
    attributes:
      - {attr_id: line_loss_db.违窃电工单.违窃电用户编号, biz_name: 用户编号, physical_column_id: line_loss_db.违窃电工单.违窃电用户编号}

  - entity_id: line_loss_db.户变关系调整日志
    biz_name: 户变关系调整
    description: "用户与台区关系变更记录"
    physical_table_id: line_loss_db.户变关系调整日志
    attributes:
      - {attr_id: line_loss_db.户变关系调整日志.调整用户编号, biz_name: 调整用户编号, physical_column_id: line_loss_db.户变关系调整日志.调整用户编号}
      - {attr_id: line_loss_db.户变关系调整日志.调整前台区编号, biz_name: 调整前台区编号, physical_column_id: line_loss_db.户变关系调整日志.调整前台区编号}
      - {attr_id: line_loss_db.户变关系调整日志.调整后台区编号, biz_name: 调整后台区编号, physical_column_id: line_loss_db.户变关系调整日志.调整后台区编号}

  - entity_id: line_loss_db.计量故障电量退补工单
    biz_name: 计量故障退补
    description: "计量装置故障导致的电量退补"
    physical_table_id: line_loss_db.计量故障电量退补工单
    attributes:
      - {attr_id: line_loss_db.计量故障电量退补工单.追补计量点编号, biz_name: 追补计量点编号, physical_column_id: line_loss_db.计量故障电量退补工单.追补计量点编号}
      - {attr_id: line_loss_db.计量故障电量退补工单.应追补电量, biz_name: 应追补电量, physical_column_id: line_loss_db.计量故障电量退补工单.应追补电量}

  - entity_id: line_loss_db.原始线损率
    biz_name: 原始线损率
    description: "输入/输出/损失电量数值"
    physical_table_id: line_loss_db.原始线损率
    attributes:
      - {attr_id: line_loss_db.原始线损率.线损率_百分比, biz_name: 线损率, physical_column_id: line_loss_db.原始线损率.线损率_百分比}
      - {attr_id: line_loss_db.原始线损率.线损率输入电量_kWh, biz_name: 输入电量, physical_column_id: line_loss_db.原始线损率.线损率输入电量_kWh}
      - {attr_id: line_loss_db.原始线损率.线损率输出电量_kWh, biz_name: 输出电量, physical_column_id: line_loss_db.原始线损率.线损率输出电量_kWh}
      - {attr_id: line_loss_db.原始线损率.线损率损失电量_kWh, biz_name: 损失电量, physical_column_id: line_loss_db.原始线损率.线损率损失电量_kWh}
      - {attr_id: line_loss_db.原始线损率.线损率关联线损Key, biz_name: 线损Key, physical_column_id: line_loss_db.原始线损率.线损率关联线损Key}

  - entity_id: line_loss_db.组合线损率
    biz_name: 组合线损率
    description: "多维度聚合线损率"
    physical_table_id: line_loss_db.组合线损率
    attributes:
      - {attr_id: line_loss_db.组合线损率.线损率_百分比, biz_name: 组合线损率, physical_column_id: line_loss_db.组合线损率.线损率_百分比}
      - {attr_id: line_loss_db.组合线损率.线损率关联线损Key, biz_name: 线损Key, physical_column_id: line_loss_db.组合线损率.线损率关联线损Key}

  - entity_id: line_loss_db.组合分摊线损率
    biz_name: 组合分摊线损率
    description: "分摊后线损率"
    physical_table_id: line_loss_db.组合分摊线损率
    attributes:
      - {attr_id: line_loss_db.组合分摊线损率.线损率_百分比, biz_name: 分摊线损率, physical_column_id: line_loss_db.组合分摊线损率.线损率_百分比}
      - {attr_id: line_loss_db.组合分摊线损率.线损率关联线损Key, biz_name: 线损Key, physical_column_id: line_loss_db.组合分摊线损率.线损率关联线损Key}

  - entity_id: line_loss_db.损失电量
    biz_name: 损失电量
    description: "配变空载损耗、考核损失电量"
    physical_table_id: line_loss_db.损失电量
    attributes:
      - {attr_id: line_loss_db.损失电量.考核损失电量, biz_name: 考核损失电量, physical_column_id: line_loss_db.损失电量.考核损失电量}
      - {attr_id: line_loss_db.损失电量.配变空载损耗, biz_name: 空载损耗, physical_column_id: line_loss_db.损失电量.配变空载损耗}
      - {attr_id: line_loss_db.损失电量.损失电量关联线损Key, biz_name: 线损Key, physical_column_id: line_loss_db.损失电量.损失电量关联线损Key}

  - entity_id: line_loss_db.台区考核户计量点
    biz_name: 台区考核户计量点
    description: "台区考核户"
    physical_table_id: line_loss_db.台区考核户计量点
    attributes:
      - {attr_id: line_loss_db.台区考核户计量点.计量点编号, biz_name: 计量点编号, physical_column_id: line_loss_db.台区考核户计量点.计量点编号}
      - {attr_id: line_loss_db.台区考核户计量点.计量点所属台区编号, biz_name: 所属台区编号, physical_column_id: line_loss_db.台区考核户计量点.计量点所属台区编号}

  - entity_id: line_loss_db.计量点负荷记录
    biz_name: 计量点负荷记录
    description: "电压电流负荷"
    physical_table_id: line_loss_db.计量点负荷记录
    attributes:
      - {attr_id: line_loss_db.计量点负荷记录.负荷记录所属计量点编号, biz_name: 所属计量点编号, physical_column_id: line_loss_db.计量点负荷记录.负荷记录所属计量点编号}
      - {attr_id: line_loss_db.计量点负荷记录.A相电压, biz_name: A相电压, physical_column_id: line_loss_db.计量点负荷记录.A相电压}
      - {attr_id: line_loss_db.计量点负荷记录.B相电压, biz_name: B相电压, physical_column_id: line_loss_db.计量点负荷记录.B相电压}
      - {attr_id: line_loss_db.计量点负荷记录.C相电压, biz_name: C相电压, physical_column_id: line_loss_db.计量点负荷记录.C相电压}

  - entity_id: line_loss_db.线路
    biz_name: 线路
    description: "线路维度"
    physical_table_id: line_loss_db.线路
    attributes:
      - {attr_id: line_loss_db.线路.线路编号, biz_name: 线路编号, physical_column_id: line_loss_db.线路.线路编号}
      - {attr_id: line_loss_db.线路.所属供电所编号, biz_name: 所属供电所编号, physical_column_id: line_loss_db.线路.所属供电所编号}

relations:

  - relation_id: line_loss_db.台区_TO_变压器
    biz_name: 包含
    from_entity_attr_id: line_loss_db.台区.台区编号
    to_entity_attr_id: line_loss_db.变压器.变压器所属台区编号

  - relation_id: line_loss_db.台区_TO_线损记录
    biz_name: 产生线损
    from_entity_attr_id: line_loss_db.台区.台区编号
    to_entity_attr_id: line_loss_db.线损记录.线损台区编号

  - relation_id: line_loss_db.台区_TO_低压用户计量点
    biz_name: 设立计量点
    from_entity_attr_id: line_loss_db.台区.台区编号
    to_entity_attr_id: line_loss_db.低压用户计量点.计量点所属台区编号

  - relation_id: line_loss_db.台区_TO_户变关系调整
    biz_name: 涉及调整
    from_entity_attr_id: line_loss_db.台区.台区编号
    to_entity_attr_id: line_loss_db.户变关系调整日志.调整后台区编号

  - relation_id: line_loss_db.低压用户计量点_TO_用户
    biz_name: 关联用户
    from_entity_attr_id: line_loss_db.低压用户计量点.计量点所属用户编号
    to_entity_attr_id: line_loss_db.用户.用户编号

  - relation_id: line_loss_db.低压用户计量点_TO_月电量记录
    biz_name: 产生电量
    from_entity_attr_id: line_loss_db.低压用户计量点.计量点编号
    to_entity_attr_id: line_loss_db.月电量记录.电量所属计量点编号

  - relation_id: line_loss_db.用户_TO_违窃电工单
    biz_name: 违窃电记录
    from_entity_attr_id: line_loss_db.用户.用户编号
    to_entity_attr_id: line_loss_db.违窃电工单.违窃电用户编号

  - relation_id: line_loss_db.用户_TO_户变关系调整
    biz_name: 发起调整
    from_entity_attr_id: line_loss_db.用户.用户编号
    to_entity_attr_id: line_loss_db.户变关系调整日志.调整用户编号

  - relation_id: line_loss_db.低压用户计量点_TO_计量故障退补
    biz_name: 存在退补
    from_entity_attr_id: line_loss_db.低压用户计量点.计量点编号
    to_entity_attr_id: line_loss_db.计量故障电量退补工单.追补计量点编号

  - relation_id: line_loss_db.线损记录_TO_原始线损率
    biz_name: 线损详情
    from_entity_attr_id: line_loss_db.线损记录.线损台区编号
    to_entity_attr_id: line_loss_db.原始线损率.线损率关联线损Key

  - relation_id: line_loss_db.线损记录_TO_组合线损率
    biz_name: 组合线损
    from_entity_attr_id: line_loss_db.线损记录.线损台区编号
    to_entity_attr_id: line_loss_db.组合线损率.线损率关联线损Key

  - relation_id: line_loss_db.线损记录_TO_组合分摊线损率
    biz_name: 分摊线损
    from_entity_attr_id: line_loss_db.线损记录.线损台区编号
    to_entity_attr_id: line_loss_db.组合分摊线损率.线损率关联线损Key

  - relation_id: line_loss_db.线损记录_TO_损失电量
    biz_name: 损失电量
    from_entity_attr_id: line_loss_db.线损记录.线损台区编号
    to_entity_attr_id: line_loss_db.损失电量.损失电量关联线损Key

  - relation_id: line_loss_db.台区_TO_台区考核户计量点
    biz_name: 考核户
    from_entity_attr_id: line_loss_db.台区.台区编号
    to_entity_attr_id: line_loss_db.台区考核户计量点.计量点所属台区编号

  - relation_id: line_loss_db.低压用户计量点_TO_计量点负荷记录
    biz_name: 负荷记录
    from_entity_attr_id: line_loss_db.低压用户计量点.计量点编号
    to_entity_attr_id: line_loss_db.计量点负荷记录.负荷记录所属计量点编号

  - relation_id: line_loss_db.台区_TO_线路
    biz_name: 所属线路
    from_entity_attr_id: line_loss_db.台区.台区所属线路编号
    to_entity_attr_id: line_loss_db.线路.线路编号
