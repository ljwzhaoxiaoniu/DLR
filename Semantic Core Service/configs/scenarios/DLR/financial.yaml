mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_financial
description: "DLR paradigm - Financial scenario: on-demand fields, 7 PEs aggregated into 7 LEs"
databases:
  financial: "sqlite:///MINIDEV_sqlite/dev_databases/financial/financial.sqlite"
logical_entities:
  - logical_entity_id: LOGICAL.Account
    biz_name: Account
    public_attributes:
      - {attr_id: LOGICAL.Account.AccountID, biz_name: AccountID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Account
        physical_table_name: account
        physical_table_id: financial.account
        A: {cardinality: "1:1", key: account_id}
        R: null
        C: {LOGICAL.Account.AccountID: financial.account.account_id}
        S: "Account master"
        private_attributes:
          - {attr_id: financial.account.frequency, biz_name: frequency, physical_column_id: financial.account.frequency}
          - {attr_id: financial.account.district_id, biz_name: district_id, physical_column_id: financial.account.district_id}
          - {attr_id: financial.account.date, biz_name: date, physical_column_id: financial.account.date}
  - logical_entity_id: LOGICAL.Client
    biz_name: Client
    public_attributes:
      - {attr_id: LOGICAL.Client.ClientID, biz_name: ClientID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Client
        physical_table_name: client
        physical_table_id: financial.client
        A: {cardinality: "1:1", key: client_id}
        R: null
        C: {LOGICAL.Client.ClientID: financial.client.client_id}
        S: "Client master"
        private_attributes:
          - {attr_id: financial.client.gender, biz_name: gender, physical_column_id: financial.client.gender}
          - {attr_id: financial.client.birth_date, biz_name: birth_date, physical_column_id: financial.client.birth_date}
          - {attr_id: financial.client.district_id, biz_name: district_id, physical_column_id: financial.client.district_id}
  - logical_entity_id: LOGICAL.AccountRelation
    biz_name: AccountRelation
    description: "Client-account authorization + credit cards"
    public_attributes:
      - {attr_id: LOGICAL.AccountRelation.Account, biz_name: Account}
      - {attr_id: LOGICAL.AccountRelation.Client, biz_name: Client}
    physical_entities:
      - physical_entity_id: PHYSICAL.Disp
        physical_table_name: disp
        physical_table_id: financial.disp
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.AccountRelation.Account: financial.disp.account_id, LOGICAL.AccountRelation.Client: financial.disp.client_id}
        S: "Client-account authorization"
        private_attributes:
          - {attr_id: financial.disp.disp_id, biz_name: disp_id, physical_column_id: financial.disp.disp_id}
          - {attr_id: financial.disp.type, biz_name: type, physical_column_id: financial.disp.type}
      - physical_entity_id: PHYSICAL.CreditCard
        physical_table_name: card
        physical_table_id: financial.card
        A: {cardinality: "N:1", key: disp_id}
        R: null
        C: {LOGICAL.AccountRelation.Account: financial.card.disp_id}
        S: "Credit card information"
        private_attributes:
          - {attr_id: financial.card.card_id, biz_name: card_id, physical_column_id: financial.card.card_id}
          - {attr_id: financial.card.type, biz_name: type, physical_column_id: financial.card.type}
          - {attr_id: financial.card.issued, biz_name: issued, physical_column_id: financial.card.issued}
  - logical_entity_id: LOGICAL.District
    biz_name: District
    public_attributes:
      - {attr_id: LOGICAL.District.DistrictID, biz_name: DistrictID}
    physical_entities:
      - physical_entity_id: PHYSICAL.District
        physical_table_name: district
        physical_table_id: financial.district
        A: {cardinality: "1:1", key: district_id}
        R: null
        C: {LOGICAL.District.DistrictID: financial.district.district_id}
        S: "District demographic and economic statistics"
        private_attributes:
          - {attr_id: financial.district.A2, biz_name: A2, physical_column_id: financial.district.A2}
          - {attr_id: financial.district.A3, biz_name: A3, physical_column_id: financial.district.A3}
          - {attr_id: financial.district.A4, biz_name: A4, physical_column_id: financial.district.A4}
          - {attr_id: financial.district.A11, biz_name: A11, physical_column_id: financial.district.A11}
          - {attr_id: financial.district.A12, biz_name: A12, physical_column_id: financial.district.A12}
          - {attr_id: financial.district.A13, biz_name: A13, physical_column_id: financial.district.A13}
          - {attr_id: financial.district.A15, biz_name: A15, physical_column_id: financial.district.A15}
  - logical_entity_id: LOGICAL.Loan
    biz_name: Loan
    public_attributes:
      - {attr_id: LOGICAL.Loan.LoanID, biz_name: LoanID}
      - {attr_id: LOGICAL.Loan.Account, biz_name: Account}
    physical_entities:
      - physical_entity_id: PHYSICAL.Loan
        physical_table_name: loan
        physical_table_id: financial.loan
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.Loan.LoanID: financial.loan.loan_id, LOGICAL.Loan.Account: financial.loan.account_id}
        S: "Loan contract table"
        private_attributes:
          - {attr_id: financial.loan.amount, biz_name: amount, physical_column_id: financial.loan.amount}
          - {attr_id: financial.loan.date, biz_name: date, physical_column_id: financial.loan.date}
          - {attr_id: financial.loan.duration, biz_name: duration, physical_column_id: financial.loan.duration}
          - {attr_id: financial.loan.payments, biz_name: payments, physical_column_id: financial.loan.payments}
          - {attr_id: financial.loan.status, biz_name: status, physical_column_id: financial.loan.status}
  - logical_entity_id: LOGICAL.Transaction
    biz_name: Transaction
    public_attributes:
      - {attr_id: LOGICAL.Transaction.Account, biz_name: Account}
    physical_entities:
      - physical_entity_id: PHYSICAL.Trans
        physical_table_name: trans
        physical_table_id: financial.trans
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.Transaction.Account: financial.trans.account_id}
        S: "Transaction details"
        private_attributes:
          - {attr_id: financial.trans.trans_id, biz_name: trans_id, physical_column_id: financial.trans.trans_id}
          - {attr_id: financial.trans.date, biz_name: date, physical_column_id: financial.trans.date}
          - {attr_id: financial.trans.type, biz_name: type, physical_column_id: financial.trans.type}
          - {attr_id: financial.trans.operation, biz_name: operation, physical_column_id: financial.trans.operation}
          - {attr_id: financial.trans.amount, biz_name: amount, physical_column_id: financial.trans.amount}
          - {attr_id: financial.trans.balance, biz_name: balance, physical_column_id: financial.trans.balance}
          - {attr_id: financial.trans.k_symbol, biz_name: k_symbol, physical_column_id: financial.trans.k_symbol}
          - {attr_id: financial.trans.bank, biz_name: bank, physical_column_id: financial.trans.bank}
          - {attr_id: financial.trans.account, biz_name: account, physical_column_id: financial.trans.account}
  - logical_entity_id: LOGICAL.PermanentOrder
    biz_name: PermanentOrder
    public_attributes:
      - {attr_id: LOGICAL.PermanentOrder.Account, biz_name: Account}
    physical_entities:
      - physical_entity_id: PHYSICAL.Order
        physical_table_name: order
        physical_table_id: financial.order
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.PermanentOrder.Account: financial.order.account_id}
        S: "Permanent payment orders"
        private_attributes:
          - {attr_id: financial.order.order_id, biz_name: order_id, physical_column_id: financial.order.order_id}
          - {attr_id: financial.order.bank_to, biz_name: bank_to, physical_column_id: financial.order.bank_to}
          - {attr_id: financial.order.account_to, biz_name: account_to, physical_column_id: financial.order.account_to}
          - {attr_id: financial.order.amount, biz_name: amount, physical_column_id: financial.order.amount}
          - {attr_id: financial.order.k_symbol, biz_name: k_symbol, physical_column_id: financial.order.k_symbol}
pas_relations:
  - relation_id: LOGICAL.Client_TO_LOGICAL.AccountRelation
    relation_name: Holds
    P: {forward: {verb: holds, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Client
    S: "1 client holds many account authorizations"
  - relation_id: LOGICAL.Account_TO_LOGICAL.AccountRelation
    relation_name: HasAuthorization
    P: {forward: {verb: has, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account has many authorizations (including credit cards)"
  - relation_id: LOGICAL.Account_TO_LOGICAL.Loan
    relation_name: HasLoan
    P: {forward: {verb: has, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account has many loans"
  - relation_id: LOGICAL.Account_TO_LOGICAL.Transaction
    relation_name: Generates
    P: {forward: {verb: generates, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account generates N transactions"
  - relation_id: LOGICAL.Account_TO_LOGICAL.PermanentOrder
    relation_name: HasOrder
    P: {forward: {verb: has, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account has N permanent orders"
  - relation_id: LOGICAL.District_TO_LOGICAL.Account
    relation_name: Contains
    P: {forward: {verb: contains, cardinality: '1:N'}, reverse: {verb: is located in, cardinality: 'N:1'}}
    A: DistrictID
    S: "1 district contains N accounts"
