mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_financial
description: "DLR paradigm - Financial: clients (gender, birth_date, district) hold accounts via disp authorization; accounts have loans, transactions, permanent orders; districts with demographic statistics"
databases:
  financial: "sqlite:///MINIDEV_sqlite/dev_databases/financial/financial.sqlite"
logical_entities:
  - logical_entity_id: LOGICAL.Account
    biz_name: Account
    description: "Bank account — identified by account_id, located in a district, with open date and statement frequency; has loans, transactions, permanent orders, and client authorizations"
    public_attributes:
      - {attr_id: LOGICAL.Account.AccountID, biz_name: AccountID}
      - {attr_id: LOGICAL.Account.DistrictID, biz_name: DistrictID, description: 'District where the account branch is located'}
      - {attr_id: LOGICAL.Account.Date, biz_name: date, description: 'Account open date'}
    physical_entities:
      - physical_entity_id: PHYSICAL.Account
        physical_table_name: account
        physical_table_id: financial.account
        A: {cardinality: "1:1", key: account_id}
        R: null
        C: {LOGICAL.Account.AccountID: financial.account.account_id, LOGICAL.Account.DistrictID: financial.account.district_id, LOGICAL.Account.Date: financial.account.date}
        S: "Account master — account_id, district, open date, frequency"
        private_attributes:
          - {attr_id: financial.account.frequency, biz_name: frequency, physical_column_id: financial.account.frequency, description: 'Statement frequency: monthly, weekly, etc.'}
          - {attr_id: financial.account.district_id, biz_name: district_id, physical_column_id: financial.account.district_id, description: 'FK to district'}
  - logical_entity_id: LOGICAL.Client
    biz_name: Client
    description: "Bank client — gender (M/F), birth_date, district of residence; identified by client_id; holds account authorizations via disp; often referred to as 'customer' in queries"
    public_attributes:
      - {attr_id: LOGICAL.Client.ClientID, biz_name: ClientID}
      - {attr_id: LOGICAL.Client.DistrictID, biz_name: DistrictID, description: 'District where the client resides'}
      - {attr_id: LOGICAL.Client.Gender, biz_name: gender, description: 'Gender: M (male) or F (female)'}
      - {attr_id: LOGICAL.Client.BirthDate, biz_name: birth_date, description: 'Birth date of the client, YYYY-MM-DD format'}
    physical_entities:
      - physical_entity_id: PHYSICAL.Client
        physical_table_name: client
        physical_table_id: financial.client
        A: {cardinality: "1:1", key: client_id}
        R: null
        C: {LOGICAL.Client.ClientID: financial.client.client_id, LOGICAL.Client.DistrictID: financial.client.district_id, LOGICAL.Client.Gender: financial.client.gender, LOGICAL.Client.BirthDate: financial.client.birth_date}
        S: "Client master — client_id, gender, birth_date, district"
        private_attributes:
          - {attr_id: financial.client.district_id, biz_name: district_id, physical_column_id: financial.client.district_id, description: 'FK to district'}
  - logical_entity_id: LOGICAL.AccountRelation
    biz_name: AccountRelation
    description: "Client-account authorization (disp) — links clients to accounts; also includes credit cards; junction table that is absorbed as PE under this LE for Agent transparency"
    public_attributes:
      - {attr_id: LOGICAL.AccountRelation.Account, biz_name: Account}
      - {attr_id: LOGICAL.AccountRelation.Client, biz_name: Client}
    physical_entities:
      - physical_entity_id: PHYSICAL.Disp
        physical_table_name: disp
        physical_table_id: financial.disp
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.AccountRelation.Account: financial.disp.account_id, LOGICAL.AccountRelation.Client: financial.disp.client_id}
        S: "Client-account authorization — disp_id, type (OWNER/DISPONENT)"
        private_attributes:
          - {attr_id: financial.disp.disp_id, biz_name: disp_id, physical_column_id: financial.disp.disp_id}
          - {attr_id: financial.disp.type, biz_name: type, physical_column_id: financial.disp.type, description: 'Authorization type: OWNER or DISPONENT'}
      - physical_entity_id: PHYSICAL.CreditCard
        physical_table_name: card
        physical_table_id: financial.card
        A: {cardinality: "N:1", key: disp_id}
        R: null
        C: {LOGICAL.AccountRelation.Account: financial.card.disp_id}
        S: "Credit card information — card_id, type, issued date"
        private_attributes:
          - {attr_id: financial.card.card_id, biz_name: card_id, physical_column_id: financial.card.card_id}
          - {attr_id: financial.card.type, biz_name: type, physical_column_id: financial.card.type, description: 'Card type: classic, junior, gold'}
          - {attr_id: financial.card.issued, biz_name: issued, physical_column_id: financial.card.issued, description: 'Card issue date'}
  - logical_entity_id: LOGICAL.District
    biz_name: District
    description: "Demographic district — district name (A2), region (A3), inhabitants, average salary (A11), unemployment rates (A12/A13), crime statistics (A15)"
    public_attributes:
      - {attr_id: LOGICAL.District.DistrictID, biz_name: DistrictID}
      - {attr_id: LOGICAL.District.DistrictName, biz_name: DistrictName, description: 'District name (column A2), e.g. Sokolov, Praha'}
      - {attr_id: LOGICAL.District.AvgSalary, biz_name: AvgSalary, description: 'Average salary (column A11)'}
      - {attr_id: LOGICAL.District.UnempRate96, biz_name: UnempRate96, description: 'Unemployment rate 1996 (column A13)'}
      - {attr_id: LOGICAL.District.Crimes95, biz_name: Crimes95, description: 'Number of crimes 1995 (column A15)'}
    physical_entities:
      - physical_entity_id: PHYSICAL.District
        physical_table_name: district
        physical_table_id: financial.district
        A: {cardinality: "1:1", key: district_id}
        R: null
        C: {LOGICAL.District.DistrictID: financial.district.district_id, LOGICAL.District.DistrictName: financial.district.A2, LOGICAL.District.AvgSalary: financial.district.A11, LOGICAL.District.UnempRate96: financial.district.A13, LOGICAL.District.Crimes95: financial.district.A15}
        S: "District demographic and economic statistics — A2(name), A3(region), A4(inhabitants), A11(avg salary), A12/A13(unemployment), A15(crimes)"
        private_attributes:
          - {attr_id: financial.district.A3, biz_name: Region, physical_column_id: financial.district.A3, description: 'Region name'}
          - {attr_id: financial.district.A4, biz_name: Inhabitants, physical_column_id: financial.district.A4, description: 'Number of inhabitants'}
          - {attr_id: financial.district.A12, biz_name: UnempRate95, physical_column_id: financial.district.A12, description: 'Unemployment rate 1995'}
  - logical_entity_id: LOGICAL.Loan
    biz_name: Loan
    description: "Bank loan — amount, date, duration, payments, status; belongs to an account"
    public_attributes:
      - {attr_id: LOGICAL.Loan.LoanID, biz_name: LoanID}
      - {attr_id: LOGICAL.Loan.Account, biz_name: Account}
    physical_entities:
      - physical_entity_id: PHYSICAL.Loan
        physical_table_name: loan
        physical_table_id: financial.loan
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.Loan.LoanID: financial.loan.loan_id, LOGICAL.Loan.Account: financial.loan.account_id}
        S: "Loan contract table — amount, date, duration, payments, status"
        private_attributes:
          - {attr_id: financial.loan.amount, biz_name: amount, physical_column_id: financial.loan.amount, description: 'Loan amount'}
          - {attr_id: financial.loan.date, biz_name: date, physical_column_id: financial.loan.date, description: 'Loan date'}
          - {attr_id: financial.loan.duration, biz_name: duration, physical_column_id: financial.loan.duration, description: 'Loan duration in months'}
          - {attr_id: financial.loan.payments, biz_name: payments, physical_column_id: financial.loan.payments, description: 'Monthly payment amount'}
          - {attr_id: financial.loan.status, biz_name: status, physical_column_id: financial.loan.status, description: 'Loan status: A=active, B=finished, C=running, D=in debt'}
  - logical_entity_id: LOGICAL.Transaction
    biz_name: Transaction
    description: "Bank transaction — date, type, operation, amount, balance; belongs to an account"
    public_attributes:
      - {attr_id: LOGICAL.Transaction.Account, biz_name: Account}
    physical_entities:
      - physical_entity_id: PHYSICAL.Trans
        physical_table_name: trans
        physical_table_id: financial.trans
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.Transaction.Account: financial.trans.account_id}
        S: "Transaction details — date, type, operation, amount, balance"
        private_attributes:
          - {attr_id: financial.trans.trans_id, biz_name: trans_id, physical_column_id: financial.trans.trans_id}
          - {attr_id: financial.trans.date, biz_name: date, physical_column_id: financial.trans.date, description: 'Transaction date'}
          - {attr_id: financial.trans.type, biz_name: type, physical_column_id: financial.trans.type, description: 'Transaction type: credit/debit'}
          - {attr_id: financial.trans.operation, biz_name: operation, physical_column_id: financial.trans.operation, description: 'Operation type: collection, withdrawal, etc.'}
          - {attr_id: financial.trans.amount, biz_name: amount, physical_column_id: financial.trans.amount, description: 'Transaction amount'}
          - {attr_id: financial.trans.balance, biz_name: balance, physical_column_id: financial.trans.balance, description: 'Account balance after transaction'}
          - {attr_id: financial.trans.k_symbol, biz_name: k_symbol, physical_column_id: financial.trans.k_symbol}
          - {attr_id: financial.trans.bank, biz_name: bank, physical_column_id: financial.trans.bank, description: 'Partner bank code'}
          - {attr_id: financial.trans.account, biz_name: account, physical_column_id: financial.trans.account, description: 'Partner account number'}
  - logical_entity_id: LOGICAL.PermanentOrder
    biz_name: PermanentOrder
    description: "Permanent payment order — bank_to, account_to, amount; belongs to an account"
    public_attributes:
      - {attr_id: LOGICAL.PermanentOrder.Account, biz_name: Account}
    physical_entities:
      - physical_entity_id: PHYSICAL.Order
        physical_table_name: order
        physical_table_id: financial.order
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.PermanentOrder.Account: financial.order.account_id}
        S: "Permanent payment orders — bank_to, account_to, amount, k_symbol"
        private_attributes:
          - {attr_id: financial.order.order_id, biz_name: order_id, physical_column_id: financial.order.order_id}
          - {attr_id: financial.order.bank_to, biz_name: bank_to, physical_column_id: financial.order.bank_to, description: 'Target bank code'}
          - {attr_id: financial.order.account_to, biz_name: account_to, physical_column_id: financial.order.account_to, description: 'Target account number'}
          - {attr_id: financial.order.amount, biz_name: amount, physical_column_id: financial.order.amount, description: 'Order amount'}
          - {attr_id: financial.order.k_symbol, biz_name: k_symbol, physical_column_id: financial.order.k_symbol}
pas_relations:
  - relation_id: LOGICAL.Client_TO_LOGICAL.AccountRelation
    relation_name: Holds
    P: {forward: {verb: holds, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Client
    S: "1 client holds many account authorizations — disp.client_id → client.client_id"
  - relation_id: LOGICAL.Account_TO_LOGICAL.AccountRelation
    relation_name: HasAuthorization
    P: {forward: {verb: has, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account has many authorizations (including credit cards) — disp.account_id → account.account_id"
  - relation_id: LOGICAL.Account_TO_LOGICAL.Loan
    relation_name: HasLoan
    P: {forward: {verb: has, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account has many loans — loan.account_id → account.account_id"
  - relation_id: LOGICAL.Account_TO_LOGICAL.Transaction
    relation_name: Generates
    P: {forward: {verb: generates, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account generates N transactions — trans.account_id → account.account_id"
  - relation_id: LOGICAL.Account_TO_LOGICAL.PermanentOrder
    relation_name: HasOrder
    P: {forward: {verb: has, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: Account
    S: "1 account has N permanent orders — order.account_id → account.account_id"
  - relation_id: LOGICAL.Client_TO_LOGICAL.District
    relation_name: ResidesIn
    P: {forward: {verb: resides in, cardinality: 'N:1'}, reverse: {verb: contains, cardinality: '1:N'}}
    A: DistrictID
    S: "N clients reside in 1 district — client.district_id → district.district_id"
  - relation_id: LOGICAL.District_TO_LOGICAL.Account
    relation_name: Contains
    P: {forward: {verb: contains, cardinality: '1:N'}, reverse: {verb: is located in, cardinality: 'N:1'}}
    A: DistrictID
    S: "1 district contains N accounts — account.district_id → district.district_id"
