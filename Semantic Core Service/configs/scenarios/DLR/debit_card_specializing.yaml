mapping_type: dlr
version: '2.0'
scenario_name: dlr_debit_card
description: 'DLR paradigm - Debit card consumption scenario: on-demand fields, 5 PEs aggregated into 4 LEs'
databases:
  debit_card_specializing: sqlite:///MINIDEV_sqlite/dev_databases/debit_card_specializing/debit_card_specializing.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Customer
  biz_name: Customer
  description: Identity and classification of debit card customers
  physical_entities:
  - physical_entity_id: PHYSICAL.Customer
    physical_table_name: customers
    physical_table_id: debit_card_specializing.customers
    A:
      cardinality: '1:1'
      key: CustomerID
    R: null
    S: Customer master data
    attributes:
    - column: debit_card_specializing.customers.CustomerID
      biz_name: CustomerID
      description: 'Customer ID: unique identifier for the customer'
      public: true
    - column: debit_card_specializing.customers.Segment
      biz_name: Segment
      description: 'Customer segment: SME=Small Business, LAM=Local, KAM=Key Account'
      public: true
    - column: debit_card_specializing.customers.Currency
      biz_name: Currency
      description: 'Currency: CZK=Czech Koruna, EUR=Euro'
      public: true
- logical_entity_id: LOGICAL.Consumption
  biz_name: Consumption
  description: 'Customer consumption records: monthly bills (yearmonth) + transaction details (transactions_1k) — Consumption,
    UnitPrice, Quantity'
  physical_entities:
  - physical_entity_id: PHYSICAL.YearMonth
    physical_table_name: yearmonth
    physical_table_id: debit_card_specializing.yearmonth
    A:
      cardinality: N:1
      key: CustomerID
    R: null
    S: Monthly customer spending summary
    attributes:
    - column: debit_card_specializing.yearmonth.CustomerID
      biz_name: Customer
      description: 'Customer ID: FK to customers table'
      public: true
    - column: debit_card_specializing.yearmonth.Date
      biz_name: Date
      description: 'Date: in yearmonth table = year-month YYYYMM (201301 = January 2013); in transactions_1k table = calendar
        date YYYY-MM-DD (2013-01-13). Slash-form dates in questions (2012/8/24) mean calendar date'
      public: true
    - column: debit_card_specializing.yearmonth.Consumption
      biz_name: Consumption
      description: 'Monthly spending amount (CZK): total customer spending in this month'
      public: true
  - physical_entity_id: PHYSICAL.Transaction
    physical_table_name: transactions_1k
    physical_table_id: debit_card_specializing.transactions_1k
    A:
      cardinality: N:1
      key: CustomerID
    R: null
    S: Gas station single transaction details — Price per item, Quantity, GasStation, Product
    attributes:
    - column: debit_card_specializing.transactions_1k.CustomerID
      biz_name: Customer
      description: 'Customer ID: FK to customers table'
      public: true
    - column: debit_card_specializing.transactions_1k.Date
      biz_name: Date
      description: 'Date: in yearmonth table = year-month YYYYMM (201301 = January 2013); in transactions_1k table = calendar
        date YYYY-MM-DD (2013-01-13). Slash-form dates in questions (2012/8/24) mean calendar date'
      public: true
    - column: debit_card_specializing.transactions_1k.Price
      biz_name: UnitPrice
      description: Unit price per item (CZK)
      public: true
    - column: debit_card_specializing.transactions_1k.Amount
      biz_name: Quantity
      description: 'Quantity: number of items purchased in this transaction'
      public: true
    - column: debit_card_specializing.transactions_1k.GasStationID
      biz_name: GasStationID
      description: 'Gas station ID: FK to gasstations table'
      public: true
    - column: debit_card_specializing.transactions_1k.ProductID
      biz_name: ProductID
      description: 'Product ID: FK to products table'
      public: true
    - column: debit_card_specializing.transactions_1k.TransactionID
      biz_name: Transaction ID
      description: Transaction ID
    - column: debit_card_specializing.transactions_1k.Time
      biz_name: Time
      description: Time
    - column: debit_card_specializing.transactions_1k.CardID
      biz_name: Card ID
      description: Card ID
- logical_entity_id: LOGICAL.GasStation
  biz_name: GasStation
  description: Fuel service stations
  physical_entities:
  - physical_entity_id: PHYSICAL.GasStation
    physical_table_name: gasstations
    physical_table_id: debit_card_specializing.gasstations
    A:
      cardinality: '1:1'
      key: GasStationID
    R: null
    S: Gas station information
    attributes:
    - column: debit_card_specializing.gasstations.GasStationID
      biz_name: GasStationID
      description: Gas station unique identifier
      public: true
    - column: debit_card_specializing.gasstations.Country
      biz_name: Country
      description: 'Country code: CZE=Czech Republic, SVK=Slovakia'
      public: true
    - column: debit_card_specializing.gasstations.ChainID
      biz_name: ChainID
      description: 'Chain ID: gas station chain brand identifier'
      public: true
    - column: debit_card_specializing.gasstations.Segment
      biz_name: chain segment
      description: chain segment
- logical_entity_id: LOGICAL.Product
  biz_name: Product
  description: Products sold at gas stations
  physical_entities:
  - physical_entity_id: PHYSICAL.Product
    physical_table_name: products
    physical_table_id: debit_card_specializing.products
    A:
      cardinality: '1:1'
      key: ProductID
    R: null
    S: Product dictionary
    attributes:
    - column: debit_card_specializing.products.ProductID
      biz_name: ProductID
      description: Product unique identifier
      public: true
    - column: debit_card_specializing.products.Description
      biz_name: Description
      description: Description
pas_relations:
- relation_id: LOGICAL.Customer_TO_LOGICAL.Consumption
  relation_name: Generates
  P:
    forward:
      verb: generates
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: CustomerID
  S: 1 customer generates N consumption records
- relation_id: LOGICAL.GasStation_TO_LOGICAL.Consumption
  relation_name: Hosts
  P:
    forward:
      verb: hosts
      cardinality: 1:N
    reverse:
      verb: occurs at
      cardinality: '1:1'
  A: GasStationID
  S: 1 gas station hosts N transactions
- relation_id: LOGICAL.Product_TO_LOGICAL.Consumption
  relation_name: Purchased
  P:
    forward:
      verb: is purchased
      cardinality: 1:N
    reverse:
      verb: purchased
      cardinality: '1:1'
  A: ProductID
  S: 1 product is purchased in N transactions
