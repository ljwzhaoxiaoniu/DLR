mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_codebase
description: "DLR 范式 — 开源社区场景：按需字段，8 PE 聚合 6 LE，帖子互动多视图解耦"
databases:
  codebase_community: "sqlite:///MINIDEV_sqlite/dev_databases/codebase_community/codebase_community.sqlite"

logical_entities:
  # ── 1. 社区用户 ──
  - logical_entity_id: LOGICAL.社区用户
    biz_name: 社区用户
    description: "参与社区互动的用户"
    public_attributes:
      - {attr_id: LOGICAL.社区用户.用户编号, biz_name: 用户编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.用户表
        physical_table_name: users
        physical_table_id: codebase_community.users
        A: {cardinality: "1:1", key: Id}
        R: null
        C:
          LOGICAL.社区用户.用户编号: codebase_community.users.Id
        S: "用户主表"
        private_attributes:
          - {attr_id: codebase_community.users.DisplayName, biz_name: 显示名称, physical_column_id: codebase_community.users.DisplayName}
          - {attr_id: codebase_community.users.Reputation, biz_name: 声望值, physical_column_id: codebase_community.users.Reputation}
          - {attr_id: codebase_community.users.Age, biz_name: 年龄, physical_column_id: codebase_community.users.Age}
          - {attr_id: codebase_community.users.Location, biz_name: 位置, physical_column_id: codebase_community.users.Location}
          - {attr_id: codebase_community.users.UpVotes, biz_name: 赞数, physical_column_id: codebase_community.users.UpVotes}
          - {attr_id: codebase_community.users.CreationDate, biz_name: 创建日期, physical_column_id: codebase_community.users.CreationDate}
          - {attr_id: codebase_community.users.LastAccessDate, biz_name: 最后访问, physical_column_id: codebase_community.users.LastAccessDate}

  # ── 2. 社区帖子 ──
  - logical_entity_id: LOGICAL.社区帖子
    biz_name: 社区帖子
    description: "用户发表的问题或文章"
    public_attributes:
      - {attr_id: LOGICAL.社区帖子.帖子编号, biz_name: 帖子编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.帖子表
        physical_table_name: posts
        physical_table_id: codebase_community.posts
        A: {cardinality: "1:1", key: Id}
        R: null
        C:
          LOGICAL.社区帖子.帖子编号: codebase_community.posts.Id
        S: "帖子内容与统计表"
        private_attributes:
          - {attr_id: codebase_community.posts.Title, biz_name: 标题, physical_column_id: codebase_community.posts.Title}
          - {attr_id: codebase_community.posts.OwnerUserId, biz_name: 发帖人, physical_column_id: codebase_community.posts.OwnerUserId}
          - {attr_id: codebase_community.posts.Score, biz_name: 得分, physical_column_id: codebase_community.posts.Score}
          - {attr_id: codebase_community.posts.ViewCount, biz_name: 查看数, physical_column_id: codebase_community.posts.ViewCount}
          - {attr_id: codebase_community.posts.AnswerCount, biz_name: 回答数, physical_column_id: codebase_community.posts.AnswerCount}
          - {attr_id: codebase_community.posts.CommentCount, biz_name: 评论数, physical_column_id: codebase_community.posts.CommentCount}
          - {attr_id: codebase_community.posts.FavoriteCount, biz_name: 收藏数, physical_column_id: codebase_community.posts.FavoriteCount}
          - {attr_id: codebase_community.posts.Tags, biz_name: 标签, physical_column_id: codebase_community.posts.Tags}
          - {attr_id: codebase_community.posts.Body, biz_name: 正文, physical_column_id: codebase_community.posts.Body}
          - {attr_id: codebase_community.posts.CreationDate, biz_name: 创建日期, physical_column_id: codebase_community.posts.CreationDate}
          - {attr_id: codebase_community.posts.ClosedDate, biz_name: 关闭日期, physical_column_id: codebase_community.posts.ClosedDate}
          - {attr_id: codebase_community.posts.LastEditorUserId, biz_name: 最后编辑人, physical_column_id: codebase_community.posts.LastEditorUserId}

  # ── 3. 帖子互动 (3 PE — 多视图核心) ──
  - logical_entity_id: LOGICAL.帖子互动
    biz_name: 帖子互动
    description: "用户对帖子的各类互动：评论+编辑历史+链接"
    public_attributes:
      - {attr_id: LOGICAL.帖子互动.关联帖子, biz_name: 关联帖子}
    physical_entities:
      - physical_entity_id: PHYSICAL.评论表
        physical_table_name: comments
        physical_table_id: codebase_community.comments
        A: {cardinality: "N:1", key: PostId}
        R: null
        C:
          LOGICAL.帖子互动.关联帖子: codebase_community.comments.PostId
        S: "帖子评论"
        private_attributes:
          - {attr_id: codebase_community.comments.Id, biz_name: 评论ID, physical_column_id: codebase_community.comments.Id}
          - {attr_id: codebase_community.comments.UserId, biz_name: 评论人, physical_column_id: codebase_community.comments.UserId}
          - {attr_id: codebase_community.comments.Text, biz_name: 评论内容, physical_column_id: codebase_community.comments.Text}
          - {attr_id: codebase_community.comments.Score, biz_name: 得分, physical_column_id: codebase_community.comments.Score}
          - {attr_id: codebase_community.comments.CreationDate, biz_name: 创建日期, physical_column_id: codebase_community.comments.CreationDate}
      - physical_entity_id: PHYSICAL.帖子历史表
        physical_table_name: postHistory
        physical_table_id: codebase_community.postHistory
        A: {cardinality: "N:1", key: PostId}
        R: null
        C:
          LOGICAL.帖子互动.关联帖子: codebase_community.postHistory.PostId
        S: "帖子编辑历史"
        private_attributes:
          - {attr_id: codebase_community.postHistory.PostHistoryTypeId, biz_name: 历史类型, physical_column_id: codebase_community.postHistory.PostHistoryTypeId}
          - {attr_id: codebase_community.postHistory.UserId, biz_name: 编辑人, physical_column_id: codebase_community.postHistory.UserId}
          - {attr_id: codebase_community.postHistory.Comment, biz_name: 编辑备注, physical_column_id: codebase_community.postHistory.Comment}
          - {attr_id: codebase_community.postHistory.Text, biz_name: 文本, physical_column_id: codebase_community.postHistory.Text}
          - {attr_id: codebase_community.postHistory.CreationDate, biz_name: 创建日期, physical_column_id: codebase_community.postHistory.CreationDate}
      - physical_entity_id: PHYSICAL.帖子链接表
        physical_table_name: postLinks
        physical_table_id: codebase_community.postLinks
        A: {cardinality: "N:1", key: PostId}
        R: null
        C:
          LOGICAL.帖子互动.关联帖子: codebase_community.postLinks.PostId
        S: "帖子间关联链接"
        private_attributes:
          - {attr_id: codebase_community.postLinks.Id, biz_name: 链接ID, physical_column_id: codebase_community.postLinks.Id}
          - {attr_id: codebase_community.postLinks.RelatedPostId, biz_name: 关联帖子, physical_column_id: codebase_community.postLinks.RelatedPostId}
          - {attr_id: codebase_community.postLinks.CreationDate, biz_name: 创建日期, physical_column_id: codebase_community.postLinks.CreationDate}

  # ── 4. 标签 ──
  - logical_entity_id: LOGICAL.标签
    biz_name: 标签
    description: "帖子分类标签"
    public_attributes:
      - {attr_id: LOGICAL.标签.标签名称, biz_name: 标签名称}
    physical_entities:
      - physical_entity_id: PHYSICAL.标签表
        physical_table_name: tags
        physical_table_id: codebase_community.tags
        A: {cardinality: "1:1", key: TagName}
        R: null
        C:
          LOGICAL.标签.标签名称: codebase_community.tags.TagName
        S: "标签字典"
        private_attributes:
          - {attr_id: codebase_community.tags.Id, biz_name: 标签ID, physical_column_id: codebase_community.tags.Id}
          - {attr_id: codebase_community.tags.ExcerptPostId, biz_name: 摘要帖, physical_column_id: codebase_community.tags.ExcerptPostId}
          - {attr_id: codebase_community.tags.WikiPostId, biz_name: Wiki帖, physical_column_id: codebase_community.tags.WikiPostId}

  # ── 5. 徽章 ──
  - logical_entity_id: LOGICAL.徽章
    biz_name: 徽章
    description: "用户获得的徽章"
    public_attributes:
      - {attr_id: LOGICAL.徽章.关联用户, biz_name: 关联用户}
    physical_entities:
      - physical_entity_id: PHYSICAL.徽章表
        physical_table_name: badges
        physical_table_id: codebase_community.badges
        A: {cardinality: "N:1", key: UserId}
        R: null
        C:
          LOGICAL.徽章.关联用户: codebase_community.badges.UserId
        S: "用户徽章"
        private_attributes:
          - {attr_id: codebase_community.badges.Id, biz_name: 徽章ID, physical_column_id: codebase_community.badges.Id}
          - {attr_id: codebase_community.badges.Name, biz_name: 徽章名称, physical_column_id: codebase_community.badges.Name}
          - {attr_id: codebase_community.badges.Date, biz_name: 获得日期, physical_column_id: codebase_community.badges.Date}

  # ── 6. 投票 ──
  - logical_entity_id: LOGICAL.投票
    biz_name: 投票
    description: "用户对帖子的投票"
    public_attributes:
      - {attr_id: LOGICAL.投票.关联帖子, biz_name: 关联帖子}
      - {attr_id: LOGICAL.投票.关联用户, biz_name: 关联用户}
    physical_entities:
      - physical_entity_id: PHYSICAL.投票表
        physical_table_name: votes
        physical_table_id: codebase_community.votes
        A: {cardinality: "N:1", key: PostId}
        R: null
        C:
          LOGICAL.投票.关联帖子: codebase_community.votes.PostId
          LOGICAL.投票.关联用户: codebase_community.votes.UserId
        S: "投票记录"
        private_attributes:
          - {attr_id: codebase_community.votes.Id, biz_name: 投票ID, physical_column_id: codebase_community.votes.Id}
          - {attr_id: codebase_community.votes.VoteTypeId, biz_name: 投票类型, physical_column_id: codebase_community.votes.VoteTypeId}
          - {attr_id: codebase_community.votes.BountyAmount, biz_name: 悬赏金额, physical_column_id: codebase_community.votes.BountyAmount}
          - {attr_id: codebase_community.votes.CreationDate, biz_name: 创建日期, physical_column_id: codebase_community.votes.CreationDate}

pas_relations:
  - relation_id: LOGICAL.社区用户_TO_LOGICAL.社区帖子
    relation_name: 帖子发布
    P: {forward: {verb: 发布, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 用户编号
    S: "1个用户发布N篇帖子"
  - relation_id: LOGICAL.社区帖子_TO_LOGICAL.帖子互动
    relation_name: 互动产生
    P: {forward: {verb: 产生, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联帖子
    S: "1篇帖子产生N条互动（评论+历史+链接）"
  - relation_id: LOGICAL.社区用户_TO_LOGICAL.徽章
    relation_name: 徽章获得
    P: {forward: {verb: 获得, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联用户
    S: "1个用户获得N个徽章"
  - relation_id: LOGICAL.社区用户_TO_LOGICAL.投票
    relation_name: 投票发起
    P: {forward: {verb: 发起, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联用户
    S: "1个用户发起N次投票"
