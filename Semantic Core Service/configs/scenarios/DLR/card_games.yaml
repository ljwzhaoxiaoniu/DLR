mapping_type: dlr
version: '2.0'
scenario_name: dlr_card_games
description: 'DLR paradigm - Card games scenario: on-demand fields, 6 PEs aggregated
  into 4 LEs, card extension multi-view decoupling'
databases:
  card_games: sqlite:///MINIDEV_sqlite/dev_databases/card_games/card_games.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Card
  biz_name: Card
  description: Individual card entity with attributes, printings, and game mechanics
  public_attributes:
  - attr_id: LOGICAL.Card.CardID
    biz_name: CardID
    description: The globally unique identifier for the card (UUID). Same card name may have multiple printings with different UUIDs.
  - attr_id: LOGICAL.Card.PrintID
    biz_name: PrintID
    description: The integer primary key for a specific printing version. Different printings of the same card name have different IDs.
  physical_entities:
  - physical_entity_id: PHYSICAL.Card
    physical_table_name: cards
    physical_table_id: card_games.cards
    A:
      cardinality: '1:1'
      key: uuid
    R: null
    C:
      LOGICAL.Card.CardID: card_games.cards.uuid
      LOGICAL.Card.PrintID: card_games.cards.id
    S: Card attributes
    private_attributes:
    - attr_id: card_games.cards.id
      biz_name: id
      physical_column_id: card_games.cards.id
      description: 'Unique identifier for a specific card printing.'
    - attr_id: card_games.cards.name
      biz_name: name
      physical_column_id: card_games.cards.name
      description: 'The name of the card.'
    - attr_id: card_games.cards.setCode
      biz_name: setCode
      physical_column_id: card_games.cards.setCode
      description: 'The set code the card belongs to. Links to sets.code.'
    - attr_id: card_games.cards.borderColor
      biz_name: borderColor
      physical_column_id: card_games.cards.borderColor
      description: 'The border color of the card: black, white, borderless.'
    - attr_id: card_games.cards.rarity
      biz_name: rarity
      physical_column_id: card_games.cards.rarity
      description: 'The rarity of the card: common, uncommon, rare, mythic.'
    - attr_id: card_games.cards.convertedManaCost
      biz_name: convertedManaCost
      physical_column_id: card_games.cards.convertedManaCost
      description: 'The converted mana cost of the card. Used to compare which card costs more.'
    - attr_id: card_games.cards.power
      biz_name: power
      physical_column_id: card_games.cards.power
      description: 'The power value of the card. Special value ''*'' means infinite power.'
    - attr_id: card_games.cards.artist
      biz_name: artist
      physical_column_id: card_games.cards.artist
      description: 'The name of the artist that illustrated the card art.'
    - attr_id: card_games.cards.frameVersion
      biz_name: frameVersion
      physical_column_id: card_games.cards.frameVersion
      description: 'The card frame version (e.g., 2003, 2015).'
    - attr_id: card_games.cards.layout
      biz_name: layout
      physical_column_id: card_games.cards.layout
      description: 'The layout of the card (e.g., normal, split, flip, transform).'
    - attr_id: card_games.cards.types
      biz_name: types
      physical_column_id: card_games.cards.types
      description: 'The types of the card (e.g., Artifact, Creature, Enchantment).'
    - attr_id: card_games.cards.originalType
      biz_name: originalType
      physical_column_id: card_games.cards.originalType
      description: 'The original printed type of the card before errata.'
    - attr_id: card_games.cards.colors
      biz_name: colors
      physical_column_id: card_games.cards.colors
      description: 'The colors of the card. B=Black, W=White, R=Red, G=Green, U=Blue.'
    - attr_id: card_games.cards.subtypes
      biz_name: subtypes
      physical_column_id: card_games.cards.subtypes
      description: 'The subtypes of the card (e.g., Angel, Goblin, Equipment).'
    - attr_id: card_games.cards.supertypes
      biz_name: supertypes
      physical_column_id: card_games.cards.supertypes
      description: 'The supertypes of the card (e.g., Legendary, Basic, Snow).'
    - attr_id: card_games.cards.hasContentWarning
      biz_name: hasContentWarning
      physical_column_id: card_games.cards.hasContentWarning
      description: 'Indicates missing or degraded card properties. 1 = has content warning.'
    - attr_id: card_games.cards.isPromo
      biz_name: isPromo
      physical_column_id: card_games.cards.isPromo
      description: 'Indicates promotional printing. 1 = promo card.'
    - attr_id: card_games.cards.isStorySpotlight
      biz_name: isStorySpotlight
      physical_column_id: card_games.cards.isStorySpotlight
      description: 'Indicates a Story Spotlight card. 1 = story spotlight.'
    - attr_id: card_games.cards.isTextless
      biz_name: isTextless
      physical_column_id: card_games.cards.isTextless
      description: 'Indicates the card has no text box. 1 = textless.'
    - attr_id: card_games.cards.edhrecRank
      biz_name: edhrecRank
      physical_column_id: card_games.cards.edhrecRank
      description: 'The rank on EDHRec. Rank 1 means most popular.'
    - attr_id: card_games.cards.availability
      biz_name: availability
      physical_column_id: card_games.cards.availability
      description: 'A list of available printing types for this card.'
    - attr_id: card_games.cards.cardKingdomFoilId
      biz_name: cardKingdomFoilId
      physical_column_id: card_games.cards.cardKingdomFoilId
      description: 'The foil listing ID on Card Kingdom marketplace. Non-null when card has a foil version.'
    - attr_id: card_games.cards.cardKingdomId
      biz_name: cardKingdomId
      physical_column_id: card_games.cards.cardKingdomId
      description: 'The listing ID on Card Kingdom marketplace.'
    - attr_id: card_games.cards.side
      biz_name: side
      physical_column_id: card_games.cards.side
      description: 'Which face of a double-faced card. NULL = single-faced card.'
    - attr_id: card_games.cards.duelDeck
      biz_name: duelDeck
      physical_column_id: card_games.cards.duelDeck
      description: 'The duel deck identifier (e.g., a, b, c).'
- logical_entity_id: LOGICAL.CardExtension
  biz_name: CardExtension
  description: Card extensions — format legality (commander/modern/legacy etc.) with status, official rulings (text/date), and foreign language translations; linked to card via uuid
  public_attributes:
  - attr_id: LOGICAL.CardExtension.Card
    biz_name: Card
  - attr_id: LOGICAL.CardExtension.Format
    biz_name: format
    description: 'Format name: e.g. commander, modern, legacy, vintage, pauper, duel, premodern, penny'
  - attr_id: LOGICAL.CardExtension.LegalStatus
    biz_name: status
    description: 'The legality status of the card in this format: Legal, Banned, or Restricted.'
  - attr_id: LOGICAL.CardExtension.Language
    biz_name: language
    description: 'Foreign language: e.g. Chinese Simplified, Japanese, German, French'
  physical_entities:
  - physical_entity_id: PHYSICAL.Legality
    physical_table_name: legalities
    physical_table_id: card_games.legalities
    A:
      cardinality: N:1
      key: uuid
    R: null
    C:
      LOGICAL.CardExtension.Card: card_games.legalities.uuid
      LOGICAL.CardExtension.Format: card_games.legalities.format
      LOGICAL.CardExtension.LegalStatus: card_games.legalities.status
    S: Format legalities — format name and legality status per card
    private_attributes: []
  - physical_entity_id: PHYSICAL.Ruling
    physical_table_name: rulings
    physical_table_id: card_games.rulings
    A:
      cardinality: N:1
      key: uuid
    R: null
    C:
      LOGICAL.CardExtension.Card: card_games.rulings.uuid
    S: Rulings
    private_attributes:
    - attr_id: card_games.rulings.text
      biz_name: text
      physical_column_id: card_games.rulings.text
  - physical_entity_id: PHYSICAL.ForeignData
    physical_table_name: foreign_data
    physical_table_id: card_games.foreign_data
    A:
      cardinality: N:1
      key: uuid
    R: null
    C:
      LOGICAL.CardExtension.Card: card_games.foreign_data.uuid
      LOGICAL.CardExtension.Language: card_games.foreign_data.language
    S: Foreign translations
    private_attributes:
    - attr_id: card_games.foreign_data.name
      biz_name: name
      physical_column_id: card_games.foreign_data.name
    - attr_id: card_games.foreign_data.flavorText
      biz_name: flavorText
      physical_column_id: card_games.foreign_data.flavorText
    - attr_id: card_games.foreign_data.multiverseid
      biz_name: multiverseid
      physical_column_id: card_games.foreign_data.multiverseid
- logical_entity_id: LOGICAL.CardSet
  biz_name: CardSet
  description: Card expansion sets grouped by block
  public_attributes:
  - attr_id: LOGICAL.CardSet.SetID
    biz_name: SetID
    description: 'The set code (e.g., ARC, CMD).'
  physical_entities:
  - physical_entity_id: PHYSICAL.Set
    physical_table_name: sets
    physical_table_id: card_games.sets
    A:
      cardinality: '1:1'
      key: code
    R: null
    C:
      LOGICAL.CardSet.SetID: card_games.sets.code
    S: Set information — set name, block, size, and marketplace identifiers
    private_attributes:
    - attr_id: card_games.sets.name
      biz_name: name
      physical_column_id: card_games.sets.name
      description: 'The name of the set (e.g., Coldsnap, Eighth Edition).'
    - attr_id: card_games.sets.block
      biz_name: block
      physical_column_id: card_games.sets.block
      description: 'The block name the set belongs to (e.g., Commander, Ice Age).'
    - attr_id: card_games.sets.baseSetSize
      biz_name: baseSetSize
      physical_column_id: card_games.sets.baseSetSize
      description: 'The number of cards in the set.'
    - attr_id: card_games.sets.mcmName
      biz_name: mcmName
      physical_column_id: card_games.sets.mcmName
      description: 'The name of the set on the Magic Card Market (e.g., Archenemy).'
    - attr_id: card_games.sets.mtgoCode
      biz_name: mtgoCode
      physical_column_id: card_games.sets.mtgoCode
      description: 'The code for Magic: The Gathering Online.'
    - attr_id: card_games.sets.isForeignOnly
      biz_name: isForeignOnly
      physical_column_id: card_games.sets.isForeignOnly
      description: 'Indicates the set is only available outside the United States.'
- logical_entity_id: LOGICAL.SetTranslation
  biz_name: SetTranslation
  description: Set translations
  public_attributes:
  - attr_id: LOGICAL.SetTranslation.Set
    biz_name: Set
  - attr_id: LOGICAL.SetTranslation.Language
    biz_name: Language
  physical_entities:
  - physical_entity_id: PHYSICAL.SetTranslation
    physical_table_name: set_translations
    physical_table_id: card_games.set_translations
    A:
      cardinality: N:1
      key: setCode
    R: null
    C:
      LOGICAL.SetTranslation.Set: card_games.set_translations.setCode
      LOGICAL.SetTranslation.Language: card_games.set_translations.language
    S: Set translations
    private_attributes:
    - attr_id: card_games.set_translations.translation
      biz_name: translation
      physical_column_id: card_games.set_translations.translation
pas_relations:
- relation_id: LOGICAL.CardSet_TO_LOGICAL.Card
  relation_name: Contains
  P:
    forward:
      verb: contains
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: SetID
  S: 1 set contains N cards
- relation_id: LOGICAL.Card_TO_LOGICAL.CardExtension
  relation_name: HasExtension
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Card
  S: 1 card has N extensions (legalities/rulings/foreign)
- relation_id: LOGICAL.CardSet_TO_LOGICAL.SetTranslation
  relation_name: HasTranslation
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Set
  S: 1 set has N language translations
