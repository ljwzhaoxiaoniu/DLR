mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_card_games
description: "DLR 范式 — 卡牌游戏场景：按需字段，6 PE 聚合 4 LE，卡牌扩展信息多视图解耦"
databases:
  card_games: "sqlite:///MINIDEV_sqlite/dev_databases/card_games/card_games.sqlite"

logical_entities:
  # ── 1. 卡牌 ──
  - logical_entity_id: LOGICAL.卡牌
    biz_name: 卡牌
    description: "卡牌游戏中的单张卡牌实体"
    public_attributes:
      - {attr_id: LOGICAL.卡牌.卡牌编号, biz_name: 卡牌编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.卡牌表
        physical_table_name: cards
        physical_table_id: card_games.cards
        A: {cardinality: "1:1", key: uuid}
        R: null
        C:
          LOGICAL.卡牌.卡牌编号: card_games.cards.uuid
        S: "卡牌属性表"
        private_attributes:
          - {attr_id: card_games.cards.id, biz_name: 卡牌ID, physical_column_id: card_games.cards.id}
          - {attr_id: card_games.cards.name, biz_name: 卡牌名称, physical_column_id: card_games.cards.name}
          - {attr_id: card_games.cards.setCode, biz_name: 系列代码, physical_column_id: card_games.cards.setCode}
          - {attr_id: card_games.cards.borderColor, biz_name: 边框颜色, physical_column_id: card_games.cards.borderColor}
          - {attr_id: card_games.cards.rarity, biz_name: 稀有度, physical_column_id: card_games.cards.rarity}
          - {attr_id: card_games.cards.convertedManaCost, biz_name: 法术力消耗, physical_column_id: card_games.cards.convertedManaCost}
          - {attr_id: card_games.cards.power, biz_name: 力量, physical_column_id: card_games.cards.power}
          - {attr_id: card_games.cards.artist, biz_name: 画师, physical_column_id: card_games.cards.artist}
          - {attr_id: card_games.cards.frameVersion, biz_name: 边框版本, physical_column_id: card_games.cards.frameVersion}
          - {attr_id: card_games.cards.layout, biz_name: 布局, physical_column_id: card_games.cards.layout}
          - {attr_id: card_games.cards.types, biz_name: 类型, physical_column_id: card_games.cards.types}
          - {attr_id: card_games.cards.originalType, biz_name: 原始类型, physical_column_id: card_games.cards.originalType}
          - {attr_id: card_games.cards.colors, biz_name: 颜色, physical_column_id: card_games.cards.colors}
          - {attr_id: card_games.cards.subtypes, biz_name: 子类型, physical_column_id: card_games.cards.subtypes}
          - {attr_id: card_games.cards.supertypes, biz_name: 超类型, physical_column_id: card_games.cards.supertypes}
          - {attr_id: card_games.cards.hasContentWarning, biz_name: 内容警告, physical_column_id: card_games.cards.hasContentWarning}
          - {attr_id: card_games.cards.isPromo, biz_name: 是否促销, physical_column_id: card_games.cards.isPromo}
          - {attr_id: card_games.cards.isStorySpotlight, biz_name: 故事焦点, physical_column_id: card_games.cards.isStorySpotlight}
          - {attr_id: card_games.cards.isTextless, biz_name: 是否无文本, physical_column_id: card_games.cards.isTextless}
          - {attr_id: card_games.cards.edhrecRank, biz_name: EDHRec排名, physical_column_id: card_games.cards.edhrecRank}
          - {attr_id: card_games.cards.availability, biz_name: 可用性, physical_column_id: card_games.cards.availability}
          - {attr_id: card_games.cards.cardKingdomFoilId, biz_name: FoilID, physical_column_id: card_games.cards.cardKingdomFoilId}
          - {attr_id: card_games.cards.cardKingdomId, biz_name: KingdomID, physical_column_id: card_games.cards.cardKingdomId}
          - {attr_id: card_games.cards.side, biz_name: 面, physical_column_id: card_games.cards.side}
          - {attr_id: card_games.cards.duelDeck, biz_name: 决斗组, physical_column_id: card_games.cards.duelDeck}

  # ── 2. 卡牌扩展信息 (3 PE — 多视图核心) ──
  - logical_entity_id: LOGICAL.卡牌扩展信息
    biz_name: 卡牌扩展信息
    description: "卡牌的规则、合法性、外语翻译"
    public_attributes:
      - {attr_id: LOGICAL.卡牌扩展信息.关联卡牌, biz_name: 关联卡牌}
    physical_entities:
      - physical_entity_id: PHYSICAL.合法性表
        physical_table_name: legalities
        physical_table_id: card_games.legalities
        A: {cardinality: "N:1", key: uuid}
        R: null
        C:
          LOGICAL.卡牌扩展信息.关联卡牌: card_games.legalities.uuid
        S: "卡牌在不同赛制中的合法性"
        private_attributes:
          - {attr_id: card_games.legalities.format, biz_name: 赛制, physical_column_id: card_games.legalities.format}
          - {attr_id: card_games.legalities.status, biz_name: 状态, physical_column_id: card_games.legalities.status}
      - physical_entity_id: PHYSICAL.规则表
        physical_table_name: rulings
        physical_table_id: card_games.rulings
        A: {cardinality: "N:1", key: uuid}
        R: null
        C:
          LOGICAL.卡牌扩展信息.关联卡牌: card_games.rulings.uuid
        S: "卡牌规则说明"
        private_attributes:
          - {attr_id: card_games.rulings.text, biz_name: 规则文本, physical_column_id: card_games.rulings.text}
      - physical_entity_id: PHYSICAL.外语数据表
        physical_table_name: foreign_data
        physical_table_id: card_games.foreign_data
        A: {cardinality: "N:1", key: uuid}
        R: null
        C:
          LOGICAL.卡牌扩展信息.关联卡牌: card_games.foreign_data.uuid
        S: "卡牌外语翻译版本"
        private_attributes:
          - {attr_id: card_games.foreign_data.name, biz_name: 外语名, physical_column_id: card_games.foreign_data.name}
          - {attr_id: card_games.foreign_data.language, biz_name: 语言, physical_column_id: card_games.foreign_data.language}
          - {attr_id: card_games.foreign_data.flavorText, biz_name: 风味文本, physical_column_id: card_games.foreign_data.flavorText}
          - {attr_id: card_games.foreign_data.multiverseid, biz_name: 多元宇宙号, physical_column_id: card_games.foreign_data.multiverseid}

  # ── 3. 卡牌系列 ──
  - logical_entity_id: LOGICAL.卡牌系列
    biz_name: 卡牌系列
    description: "卡牌发行的扩展包或系列"
    public_attributes:
      - {attr_id: LOGICAL.卡牌系列.系列编号, biz_name: 系列编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.系列表
        physical_table_name: sets
        physical_table_id: card_games.sets
        A: {cardinality: "1:1", key: code}
        R: null
        C:
          LOGICAL.卡牌系列.系列编号: card_games.sets.code
        S: "卡包系列信息"
        private_attributes:
          - {attr_id: card_games.sets.name, biz_name: 系列名称, physical_column_id: card_games.sets.name}
          - {attr_id: card_games.sets.block, biz_name: 所属环境, physical_column_id: card_games.sets.block}
          - {attr_id: card_games.sets.baseSetSize, biz_name: 基础卡数, physical_column_id: card_games.sets.baseSetSize}
          - {attr_id: card_games.sets.mcmName, biz_name: MCM名称, physical_column_id: card_games.sets.mcmName}
          - {attr_id: card_games.sets.mtgoCode, biz_name: MTGO代码, physical_column_id: card_games.sets.mtgoCode}
          - {attr_id: card_games.sets.isForeignOnly, biz_name: 仅海外, physical_column_id: card_games.sets.isForeignOnly}

  # ── 4. 系列翻译 ──
  - logical_entity_id: LOGICAL.系列翻译
    biz_name: 系列翻译
    description: "卡牌系列的多语言翻译"
    public_attributes:
      - {attr_id: LOGICAL.系列翻译.关联系列, biz_name: 关联系列}
      - {attr_id: LOGICAL.系列翻译.语言, biz_name: 语言}
    physical_entities:
      - physical_entity_id: PHYSICAL.系列翻译表
        physical_table_name: set_translations
        physical_table_id: card_games.set_translations
        A: {cardinality: "N:1", key: setCode}
        R: null
        C:
          LOGICAL.系列翻译.关联系列: card_games.set_translations.setCode
          LOGICAL.系列翻译.语言: card_games.set_translations.language
        S: "系列多语言翻译"
        private_attributes:
          - {attr_id: card_games.set_translations.translation, biz_name: 翻译名, physical_column_id: card_games.set_translations.translation}

pas_relations:
  - relation_id: LOGICAL.卡牌系列_TO_LOGICAL.卡牌
    relation_name: 卡牌收录
    P: {forward: {verb: 收录, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 系列编号
    S: "1个系列收录N张卡牌"
  - relation_id: LOGICAL.卡牌_TO_LOGICAL.卡牌扩展信息
    relation_name: 扩展信息
    P: {forward: {verb: 拥有, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联卡牌
    S: "1张卡牌拥有N条扩展信息（合法性+规则+翻译）"
  - relation_id: LOGICAL.卡牌系列_TO_LOGICAL.系列翻译
    relation_name: 翻译版本
    P: {forward: {verb: 拥有, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联系列
    S: "1个系列拥有N种语言翻译"
