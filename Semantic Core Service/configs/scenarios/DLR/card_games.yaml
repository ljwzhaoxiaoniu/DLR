mapping_type: dlr
version: '2.0'
scenario_name: dlr_card_games
description: 'DLR paradigm - Card games scenario: on-demand fields, 6 PEs aggregated into 4 LEs, card extension multi-view
  decoupling'
databases:
  card_games: sqlite:///MINIDEV_sqlite/dev_databases/card_games/card_games.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Card
  biz_name: Card
  description: Individual card entity with attributes, printings, and game mechanics
  public_attributes:
  - attr_id: LOGICAL.Card.CardID
    biz_name: CardID
    description: The globally unique identifier for the card (UUID). Same card name may have multiple printings with different
      UUIDs.
  - attr_id: LOGICAL.Card.PrintID
    biz_name: PrintID
    description: The integer primary key for a specific printing version. Different printings of the same card name have different
      IDs.
  physical_entities:
  - physical_entity_id: PHYSICAL.Card
    physical_table_name: cards
    physical_table_id: card_games.cards
    A:
      cardinality: '1:1'
      key: uuid
    R: null
    C:
      LOGICAL.Card.CardID: card_games.cards.uuid
      LOGICAL.Card.PrintID: card_games.cards.id
    S: Card attributes
    private_attributes:
    - attr_id: card_games.cards.id
      biz_name: unique id number identifying the cards
      physical_column_id: card_games.cards.id
      description: unique id number identifying the cards
    - attr_id: card_games.cards.name
      biz_name: name
      physical_column_id: card_games.cards.name
      description: The name of the card.. Cards with multiple faces, like "Split" and "Meld" cards are given a delimiter.
    - attr_id: card_games.cards.setCode
      biz_name: Set Code
      physical_column_id: card_games.cards.setCode
      description: The set printing code that the card is from.
    - attr_id: card_games.cards.borderColor
      biz_name: border Color
      physical_column_id: card_games.cards.borderColor
      description: The color of the card border.. "black", "borderless", "gold", "silver", "white"
    - attr_id: card_games.cards.rarity
      biz_name: rarity
      physical_column_id: card_games.cards.rarity
      description: The card printing rarity.
    - attr_id: card_games.cards.convertedManaCost
      biz_name: converted Mana Cost
      physical_column_id: card_games.cards.convertedManaCost
      description: The converted mana cost of the card. Use the manaValue property.. if value is higher, it means that this
        card cost more converted mana
    - attr_id: card_games.cards.power
      biz_name: power
      physical_column_id: card_games.cards.power
      description: 'The power of the card.. commonsense evidence: ∞ means infinite power null or * refers to unknown power'
    - attr_id: card_games.cards.artist
      biz_name: artist
      physical_column_id: card_games.cards.artist
      description: The name of the artist that illustrated the card art.
    - attr_id: card_games.cards.frameVersion
      biz_name: frame Version
      physical_column_id: card_games.cards.frameVersion
      description: The version of the card frame style.. "1993", "1997", "2003", "2015", "future"
    - attr_id: card_games.cards.layout
      biz_name: layout
      physical_column_id: card_games.cards.layout
      description: The type of card layout. For a token card, this will be "token"
    - attr_id: card_games.cards.types
      biz_name: types
      physical_column_id: card_games.cards.types
      description: A list of all card types of the card, including Un‑sets and gameplay variants.
    - attr_id: card_games.cards.originalType
      biz_name: originalType
      physical_column_id: card_games.cards.originalType
      description: original Type. The type of the card as originally printed. Includes any supertypes and subtypes.
    - attr_id: card_games.cards.colors
      biz_name: colors
      physical_column_id: card_games.cards.colors
      description: A list of all the colors in manaCost and colorIndicator.. Some cards may not have values, such as cards
        with "Devoid" in its text.
    - attr_id: card_games.cards.subtypes
      biz_name: subtypes
      physical_column_id: card_games.cards.subtypes
