mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_superhero
description: "DLR 范式 — 超级英雄场景：按需字段，10 PE 聚合 5 LE，英雄特征+维度字典多视图解耦"
databases:
  superhero: "sqlite:///MINIDEV_sqlite/dev_databases/superhero/superhero.sqlite"

logical_entities:
  # ── 1. 超级英雄 ──
  - logical_entity_id: LOGICAL.超级英雄
    biz_name: 超级英雄
    description: "超级英雄角色主体"
    public_attributes:
      - {attr_id: LOGICAL.超级英雄.英雄编号, biz_name: 英雄编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.英雄表
        physical_table_name: superhero
        physical_table_id: superhero.superhero
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.超级英雄.英雄编号: superhero.superhero.id
        S: "英雄主数据表"
        private_attributes:
          - {attr_id: superhero.superhero.superhero_name, biz_name: 英雄名称, physical_column_id: superhero.superhero.superhero_name}
          - {attr_id: superhero.superhero.full_name, biz_name: 全名, physical_column_id: superhero.superhero.full_name}
          - {attr_id: superhero.superhero.height_cm, biz_name: 身高, physical_column_id: superhero.superhero.height_cm}
          - {attr_id: superhero.superhero.weight_kg, biz_name: 体重, physical_column_id: superhero.superhero.weight_kg}
          - {attr_id: superhero.superhero.publisher_id, biz_name: 出版商ID, physical_column_id: superhero.superhero.publisher_id}
          - {attr_id: superhero.superhero.race_id, biz_name: 种族ID, physical_column_id: superhero.superhero.race_id}
          - {attr_id: superhero.superhero.gender_id, biz_name: 性别ID, physical_column_id: superhero.superhero.gender_id}
          - {attr_id: superhero.superhero.eye_colour_id, biz_name: 眼睛颜色ID, physical_column_id: superhero.superhero.eye_colour_id}
          - {attr_id: superhero.superhero.hair_colour_id, biz_name: 头发颜色ID, physical_column_id: superhero.superhero.hair_colour_id}
          - {attr_id: superhero.superhero.skin_colour_id, biz_name: 肤色ID, physical_column_id: superhero.superhero.skin_colour_id}
          - {attr_id: superhero.superhero.alignment_id, biz_name: 阵营ID, physical_column_id: superhero.superhero.alignment_id}

  # ── 2. 英雄特征 (2 PE — 多视图) ──
  - logical_entity_id: LOGICAL.英雄特征
    biz_name: 英雄特征
    description: "英雄的超能力与属性值"
    public_attributes:
      - {attr_id: LOGICAL.英雄特征.所属英雄, biz_name: 所属英雄}
    physical_entities:
      - physical_entity_id: PHYSICAL.英雄能力关联表
        physical_table_name: hero_power
        physical_table_id: superhero.hero_power
        A: {cardinality: "N:1", key: hero_id}
        R: null
        C:
          LOGICAL.英雄特征.所属英雄: superhero.hero_power.hero_id
        S: "英雄-超能力多对多关联"
        private_attributes:
          - {attr_id: superhero.hero_power.power_id, biz_name: 能力ID, physical_column_id: superhero.hero_power.power_id}
      - physical_entity_id: PHYSICAL.英雄属性关联表
        physical_table_name: hero_attribute
        physical_table_id: superhero.hero_attribute
        A: {cardinality: "N:1", key: hero_id}
        R: null
        C:
          LOGICAL.英雄特征.所属英雄: superhero.hero_attribute.hero_id
        S: "英雄-属性值关联（力量/速度/智力等）"
        private_attributes:
          - {attr_id: superhero.hero_attribute.attribute_id, biz_name: 属性ID, physical_column_id: superhero.hero_attribute.attribute_id}
          - {attr_id: superhero.hero_attribute.attribute_value, biz_name: 属性值, physical_column_id: superhero.hero_attribute.attribute_value}

  # ── 3. 超能力字典 ──
  - logical_entity_id: LOGICAL.超能力
    biz_name: 超能力
    description: "超能力名称字典"
    public_attributes:
      - {attr_id: LOGICAL.超能力.能力编号, biz_name: 能力编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.能力表
        physical_table_name: superpower
        physical_table_id: superhero.superpower
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.超能力.能力编号: superhero.superpower.id
        S: "超能力字典表"
        private_attributes:
          - {attr_id: superhero.superpower.power_name, biz_name: 能力名称, physical_column_id: superhero.superpower.power_name}

  # ── 4. 属性字典 ──
  - logical_entity_id: LOGICAL.属性
    biz_name: 属性
    description: "英雄属性名称字典"
    public_attributes:
      - {attr_id: LOGICAL.属性.属性编号, biz_name: 属性编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.属性字典表
        physical_table_name: attribute
        physical_table_id: superhero.attribute
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.属性.属性编号: superhero.attribute.id
        S: "属性字典"
        private_attributes:
          - {attr_id: superhero.attribute.attribute_name, biz_name: 属性名称, physical_column_id: superhero.attribute.attribute_name}

  # ── 5. 英雄维度 (5 PE — 多视图核心) ──
  - logical_entity_id: LOGICAL.英雄维度
    biz_name: 英雄维度
    description: "英雄的各类分类维度：出版商/种族/性别/颜色/阵营"
    public_attributes:
      - {attr_id: LOGICAL.英雄维度.维度编号, biz_name: 维度编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.出版商表
        physical_table_name: publisher
        physical_table_id: superhero.publisher
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.英雄维度.维度编号: superhero.publisher.id
        S: "出版商维度"
        private_attributes:
          - {attr_id: superhero.publisher.publisher_name, biz_name: 出版商名称, physical_column_id: superhero.publisher.publisher_name}
      - physical_entity_id: PHYSICAL.种族表
        physical_table_name: race
        physical_table_id: superhero.race
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.英雄维度.维度编号: superhero.race.id
        S: "种族维度"
        private_attributes:
          - {attr_id: superhero.race.race, biz_name: 种族名称, physical_column_id: superhero.race.race}
      - physical_entity_id: PHYSICAL.性别表
        physical_table_name: gender
        physical_table_id: superhero.gender
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.英雄维度.维度编号: superhero.gender.id
        S: "性别维度"
        private_attributes:
          - {attr_id: superhero.gender.gender, biz_name: 性别, physical_column_id: superhero.gender.gender}
      - physical_entity_id: PHYSICAL.颜色表
        physical_table_name: colour
        physical_table_id: superhero.colour
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.英雄维度.维度编号: superhero.colour.id
        S: "颜色维度（眼睛/头发/皮肤共用）"
        private_attributes:
          - {attr_id: superhero.colour.colour, biz_name: 颜色, physical_column_id: superhero.colour.colour}
      - physical_entity_id: PHYSICAL.阵营表
        physical_table_name: alignment
        physical_table_id: superhero.alignment
        A: {cardinality: "1:1", key: id}
        R: null
        C:
          LOGICAL.英雄维度.维度编号: superhero.alignment.id
        S: "阵营维度（善/恶/中立）"
        private_attributes:
          - {attr_id: superhero.alignment.alignment, biz_name: 阵营, physical_column_id: superhero.alignment.alignment}

pas_relations:
  - relation_id: LOGICAL.超级英雄_TO_LOGICAL.英雄特征
    relation_name: 特征拥有
    P: {forward: {verb: 拥有, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 英雄编号
    S: "1个英雄拥有N个能力/属性"
  - relation_id: LOGICAL.超能力_TO_LOGICAL.英雄特征
    relation_name: 能力赋予
    P: {forward: {verb: 赋予, cardinality: '1:N'}, reverse: {verb: 引用, cardinality: '1:1'}}
    A: 能力编号
    S: "1种能力赋予N个英雄"
  - relation_id: LOGICAL.属性_TO_LOGICAL.英雄特征
    relation_name: 属性关联
    P: {forward: {verb: 关联, cardinality: '1:N'}, reverse: {verb: 引用, cardinality: '1:1'}}
    A: 属性编号
    S: "1种属性关联N个英雄"
  - relation_id: LOGICAL.超级英雄_TO_LOGICAL.英雄维度
    relation_name: 维度归属
    P: {forward: {verb: 属于, cardinality: 'N:1'}, reverse: {verb: 包含, cardinality: '1:N'}}
    A: 维度编号
    S: "英雄归属于各维度（出版商/种族/性别/颜色/阵营）"
