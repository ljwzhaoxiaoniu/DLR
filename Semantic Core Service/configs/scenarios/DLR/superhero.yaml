mapping_type: dlr
version: '2.0'
scenario_name: dlr_superhero
description: 'DLR paradigm - Superhero: 1 LE 收敛碎片化维度表 + Power/Attribute 独立 LE + PAS 多对多, 业务原生建模'
databases:
  superhero: sqlite:///MINIDEV_sqlite/dev_databases/superhero/superhero.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Superhero
  biz_name: Superhero
  description: 超级英雄本体，集成了所有 1:1 维度查表（颜色/种族/性别/出版商/阵营），碎片化物理表对 Agent 透明
  public_attributes:
  - {attr_id: LOGICAL.Superhero.HeroID, biz_name: HeroID, description: '英雄ID: 超级英雄唯一标识符'}
  - {attr_id: LOGICAL.Superhero.HeroName, biz_name: HeroName, description: '英雄代号: 如 "Batman", "Spider-Man"'}
  - {attr_id: LOGICAL.Superhero.EyeColour, biz_name: EyeColour, description: '眼睛颜色: 如 Blue, Brown, Gold, Red, Green'}
  - {attr_id: LOGICAL.Superhero.PublisherName, biz_name: PublisherName, description: '出版商名称: 如 Marvel Comics, DC Comics'}
  - {attr_id: LOGICAL.Superhero.Race, biz_name: Race, description: '种族: 如 Human, Kryptonian, Mutant'}
  - {attr_id: LOGICAL.Superhero.Gender, biz_name: Gender, description: '性别: Male / Female'}
  - {attr_id: LOGICAL.Superhero.Alignment, biz_name: Alignment, description: '阵营: Good / Bad / Neutral'}
  - {attr_id: LOGICAL.Superhero.Height_cm, biz_name: Height_cm, description: '身高(cm)'}
  - {attr_id: LOGICAL.Superhero.Weight_kg, biz_name: Weight_kg, description: '体重(kg)'}
  physical_entities:
  - physical_entity_id: PHYSICAL.Superhero
    physical_table_name: superhero
    physical_table_id: superhero.superhero
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Superhero.HeroID: superhero.superhero.id
      LOGICAL.Superhero.HeroName: superhero.superhero.superhero_name
      LOGICAL.Superhero.Height_cm: superhero.superhero.height_cm
      LOGICAL.Superhero.Weight_kg: superhero.superhero.weight_kg
    S: Hero master — 主记录, FK→colour/race/gender/publisher/alignment
    private_attributes:
    - attr_id: superhero.superhero.full_name
      biz_name: full_name
      physical_column_id: superhero.superhero.full_name
      description: '全名: 超级英雄的真实姓名'
    - attr_id: superhero.superhero.eye_colour_id
      biz_name: eye_colour_id
      physical_column_id: superhero.superhero.eye_colour_id
      description: 'FK→colour.id: 眼睛颜色ID'
    - attr_id: superhero.superhero.hair_colour_id
      biz_name: hair_colour_id
      physical_column_id: superhero.superhero.hair_colour_id
      description: 'FK→colour.id: 头发颜色ID'
    - attr_id: superhero.superhero.skin_colour_id
      biz_name: skin_colour_id
      physical_column_id: superhero.superhero.skin_colour_id
      description: 'FK→colour.id: 皮肤颜色ID'
    - attr_id: superhero.superhero.race_id
      biz_name: race_id
      physical_column_id: superhero.superhero.race_id
      description: 'FK→race.id: 种族ID'
    - attr_id: superhero.superhero.gender_id
      biz_name: gender_id
      physical_column_id: superhero.superhero.gender_id
      description: 'FK→gender.id: 性别ID'
    - attr_id: superhero.superhero.publisher_id
      biz_name: publisher_id
      physical_column_id: superhero.superhero.publisher_id
      description: 'FK→publisher.id: 出版商ID'
    - attr_id: superhero.superhero.alignment_id
      biz_name: alignment_id
      physical_column_id: superhero.superhero.alignment_id
      description: 'FK→alignment.id: 阵营ID (Good/Bad/Neutral)'
  - physical_entity_id: PHYSICAL.Colour
    physical_table_name: colour
    physical_table_id: superhero.colour
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Superhero.HeroID: superhero.colour.id
      LOGICAL.Superhero.EyeColour: superhero.colour.colour
    S: 颜色字典 — superhero.eye_colour_id / hair_colour_id / skin_colour_id 三条 FK 路径均指向此表
    private_attributes: []
  - physical_entity_id: PHYSICAL.HeroRace
    physical_table_name: race
    physical_table_id: superhero.race
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Superhero.HeroID: superhero.race.id
      LOGICAL.Superhero.Race: superhero.race.race
    S: 种族字典 — superhero.race_id → race.id
    private_attributes: []
  - physical_entity_id: PHYSICAL.Gender
    physical_table_name: gender
    physical_table_id: superhero.gender
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Superhero.HeroID: superhero.gender.id
      LOGICAL.Superhero.Gender: superhero.gender.gender
    S: 性别字典 — superhero.gender_id → gender.id
    private_attributes: []
  - physical_entity_id: PHYSICAL.Publisher
    physical_table_name: publisher
    physical_table_id: superhero.publisher
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Superhero.HeroID: superhero.publisher.id
      LOGICAL.Superhero.PublisherName: superhero.publisher.publisher_name
    S: 出版商字典 — superhero.publisher_id → publisher.id
    private_attributes: []
  - physical_entity_id: PHYSICAL.Alignment
    physical_table_name: alignment
    physical_table_id: superhero.alignment
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Superhero.HeroID: superhero.alignment.id
      LOGICAL.Superhero.Alignment: superhero.alignment.alignment
    S: 阵营字典 — superhero.alignment_id → alignment.id
    private_attributes: []
- logical_entity_id: LOGICAL.Power
  biz_name: Power
  description: Superpowers — e.g. Super Strength, Agility, Flight, Telepathy, Energy Blast; linked to heroes via hero_power junction table (many-to-many)
  public_attributes:
  - attr_id: LOGICAL.Power.PowerID
    biz_name: PowerID
    description: 'Power ID: unique identifier'
  - attr_id: LOGICAL.Power.HeroID
    biz_name: HeroID
    description: 'HeroID: FK→superhero.id'
  - attr_id: LOGICAL.Power.PowerName
    biz_name: power_name
    description: 'Power name: e.g. Super Strength, Agility, Flight, Telepathy, Energy Blast, etc.'
  physical_entities:
  - physical_entity_id: PHYSICAL.HeroPower
    physical_table_name: hero_power
    physical_table_id: superhero.hero_power
    A:
      cardinality: N:1
      key: hero_id
    R: null
    C:
      LOGICAL.Power.HeroID: superhero.hero_power.hero_id
    S: Junction 表 — hero_id→superhero.id + power_id→superpower.id, 1 英雄可有 N 条记录
    private_attributes:
    - attr_id: superhero.hero_power.power_id
      biz_name: power_id
      physical_column_id: superhero.hero_power.power_id
      description: 'FK→superpower.id: 超能力ID'
  - physical_entity_id: PHYSICAL.Superpower
    physical_table_name: superpower
    physical_table_id: superhero.superpower
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Power.PowerID: superhero.superpower.id
      LOGICAL.Power.PowerName: superhero.superpower.power_name
    S: 超能力字典
    private_attributes: []
- logical_entity_id: LOGICAL.Attribute
  biz_name: Attribute
  description: Hero attributes with numeric values — Intelligence, Strength, Speed, Agility, Durability, Power, Combat; linked to heroes via hero_attribute junction table (many-to-many)
  public_attributes:
  - attr_id: LOGICAL.Attribute.AttrID
    biz_name: AttrID
    description: 'Attribute ID: unique identifier'
  - attr_id: LOGICAL.Attribute.HeroID
    biz_name: HeroID
    description: 'HeroID: FK→superhero.id'
  - attr_id: LOGICAL.Attribute.AttrName
    biz_name: attribute_name
    description: 'Attribute name: e.g. Intelligence, Strength, Speed, Agility, Durability, Power, Combat'
  - attr_id: LOGICAL.Attribute.AttrValue
    biz_name: attribute_value
    description: 'Attribute value: numeric score of the attribute for a specific hero'
  physical_entities:
  - physical_entity_id: PHYSICAL.HeroAttribute
    physical_table_name: hero_attribute
    physical_table_id: superhero.hero_attribute
    A:
      cardinality: N:1
      key: hero_id
    R: null
    C:
      LOGICAL.Attribute.HeroID: superhero.hero_attribute.hero_id
      LOGICAL.Attribute.AttrValue: superhero.hero_attribute.attribute_value
    S: Junction 表 — hero_id→superhero.id + attribute_id→attribute.id, 含属性值
    private_attributes:
    - attr_id: superhero.hero_attribute.attribute_id
      biz_name: attribute_id
      physical_column_id: superhero.hero_attribute.attribute_id
      description: 'FK→attribute.id: 属性ID'
  - physical_entity_id: PHYSICAL.Attribute
    physical_table_name: attribute
    physical_table_id: superhero.attribute
    A:
      cardinality: '1:1'
      key: id
    R: null
    C:
      LOGICAL.Attribute.AttrID: superhero.attribute.id
      LOGICAL.Attribute.AttrName: superhero.attribute.attribute_name
    S: 属性字典
    private_attributes: []
pas_relations:
- relation_id: LOGICAL.Superhero_TO_LOGICAL.Power
  relation_name: Possesses
  P:
    forward:
      verb: possesses
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: HeroID
  S: '1 英雄拥有 N 个超能力; 逆: 1 个能力属于 1 个英雄'
- relation_id: LOGICAL.Superhero_TO_LOGICAL.Attribute
  relation_name: HasAttribute
  P:
    forward:
      verb: has attribute
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: HeroID
  S: '1 英雄有 N 个属性值; 逆: 1 个属性值属于 1 个英雄'
