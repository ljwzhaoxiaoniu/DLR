mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_football
description: "DLR paradigm - European football scenario: on-demand fields, 6 PEs aggregated into 4 LEs, player/team attributes multi-view decoupling"
databases:
  european_football_2: "sqlite:///MINIDEV_sqlite/dev_databases/european_football_2/european_football_2.sqlite"
logical_entities:
  - logical_entity_id: LOGICAL.Player
    biz_name: Player
    description: "Player basic info and attributes"
    public_attributes:
      - {attr_id: LOGICAL.Player.PlayerID, biz_name: PlayerID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Player
        physical_table_name: Player
        physical_table_id: european_football_2.Player
        A: {cardinality: "1:1", key: player_api_id}
        R: null
        C: {LOGICAL.Player.PlayerID: european_football_2.Player.player_api_id}
        S: "Player basic info"
        private_attributes:
          - {attr_id: european_football_2.Player.player_name, biz_name: player_name, physical_column_id: european_football_2.Player.player_name}
          - {attr_id: european_football_2.Player.birthday, biz_name: birthday, physical_column_id: european_football_2.Player.birthday}
          - {attr_id: european_football_2.Player.height, biz_name: height, physical_column_id: european_football_2.Player.height}
          - {attr_id: european_football_2.Player.weight, biz_name: weight, physical_column_id: european_football_2.Player.weight}
      - physical_entity_id: PHYSICAL.PlayerAttribute
        physical_table_name: Player_Attributes
        physical_table_id: european_football_2.Player_Attributes
        A: {cardinality: "N:1", key: player_api_id}
        R: null
        C: {LOGICAL.Player.PlayerID: european_football_2.Player_Attributes.player_api_id}
        S: "Player attributes - FIFA ratings"
        private_attributes:
          - {attr_id: european_football_2.Player_Attributes.overall_rating, biz_name: overall_rating, physical_column_id: european_football_2.Player_Attributes.overall_rating}
          - {attr_id: european_football_2.Player_Attributes.preferred_foot, biz_name: preferred_foot, physical_column_id: european_football_2.Player_Attributes.preferred_foot}
          - {attr_id: european_football_2.Player_Attributes.attacking_work_rate, biz_name: attacking_work_rate, physical_column_id: european_football_2.Player_Attributes.attacking_work_rate}
          - {attr_id: european_football_2.Player_Attributes.defensive_work_rate, biz_name: defensive_work_rate, physical_column_id: european_football_2.Player_Attributes.defensive_work_rate}
          - {attr_id: european_football_2.Player_Attributes.crossing, biz_name: crossing, physical_column_id: european_football_2.Player_Attributes.crossing}
          - {attr_id: european_football_2.Player_Attributes.finishing, biz_name: finishing, physical_column_id: european_football_2.Player_Attributes.finishing}
          - {attr_id: european_football_2.Player_Attributes.heading_accuracy, biz_name: heading_accuracy, physical_column_id: european_football_2.Player_Attributes.heading_accuracy}
          - {attr_id: european_football_2.Player_Attributes.short_passing, biz_name: short_passing, physical_column_id: european_football_2.Player_Attributes.short_passing}
          - {attr_id: european_football_2.Player_Attributes.volleys, biz_name: volleys, physical_column_id: european_football_2.Player_Attributes.volleys}
          - {attr_id: european_football_2.Player_Attributes.dribbling, biz_name: dribbling, physical_column_id: european_football_2.Player_Attributes.dribbling}
          - {attr_id: european_football_2.Player_Attributes.curve, biz_name: curve, physical_column_id: european_football_2.Player_Attributes.curve}
          - {attr_id: european_football_2.Player_Attributes.free_kick_accuracy, biz_name: free_kick_accuracy, physical_column_id: european_football_2.Player_Attributes.free_kick_accuracy}
          - {attr_id: european_football_2.Player_Attributes.long_shots, biz_name: long_shots, physical_column_id: european_football_2.Player_Attributes.long_shots}
          - {attr_id: european_football_2.Player_Attributes.sprint_speed, biz_name: sprint_speed, physical_column_id: european_football_2.Player_Attributes.sprint_speed}
          - {attr_id: european_football_2.Player_Attributes.`date`, biz_name: date, physical_column_id: european_football_2.Player_Attributes.`date`}
          - {attr_id: european_football_2.Player_Attributes.jumping, biz_name: jumping, physical_column_id: european_football_2.Player_Attributes.jumping}
          - {attr_id: european_football_2.Player_Attributes.potential, biz_name: potential, physical_column_id: european_football_2.Player_Attributes.potential}
          - {attr_id: european_football_2.Player_Attributes.ball_control, biz_name: ball_control, physical_column_id: european_football_2.Player_Attributes.ball_control}
  - logical_entity_id: LOGICAL.Team
    biz_name: Team
    description: "Team basic info and tactics"
    public_attributes:
      - {attr_id: LOGICAL.Team.TeamID, biz_name: TeamID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Team
        physical_table_name: Team
        physical_table_id: european_football_2.Team
        A: {cardinality: "1:1", key: team_api_id}
        R: null
        C: {LOGICAL.Team.TeamID: european_football_2.Team.team_api_id}
        S: "Team basic info"
        private_attributes:
          - {attr_id: european_football_2.Team.team_long_name, biz_name: team_long_name, physical_column_id: european_football_2.Team.team_long_name}
          - {attr_id: european_football_2.Team.team_short_name, biz_name: team_short_name, physical_column_id: european_football_2.Team.team_short_name}
      - physical_entity_id: PHYSICAL.TeamAttribute
        physical_table_name: Team_Attributes
        physical_table_id: european_football_2.Team_Attributes
        A: {cardinality: "N:1", key: team_api_id}
        R: null
        C: {LOGICAL.Team.TeamID: european_football_2.Team_Attributes.team_api_id}
        S: "Team tactical attributes"
        private_attributes:
          - {attr_id: european_football_2.Team_Attributes.buildUpPlaySpeed, biz_name: buildUpPlaySpeed, physical_column_id: european_football_2.Team_Attributes.buildUpPlaySpeed}
          - {attr_id: european_football_2.Team_Attributes.buildUpPlaySpeedClass, biz_name: buildUpPlaySpeedClass, physical_column_id: european_football_2.Team_Attributes.buildUpPlaySpeedClass}
          - {attr_id: european_football_2.Team_Attributes.buildUpPlayPassing, biz_name: buildUpPlayPassing, physical_column_id: european_football_2.Team_Attributes.buildUpPlayPassing}
          - {attr_id: european_football_2.Team_Attributes.buildUpPlayPassingClass, biz_name: buildUpPlayPassingClass, physical_column_id: european_football_2.Team_Attributes.buildUpPlayPassingClass}
          - {attr_id: european_football_2.Team_Attributes.chanceCreationPassing, biz_name: chanceCreationPassing, physical_column_id: european_football_2.Team_Attributes.chanceCreationPassing}
          - {attr_id: european_football_2.Team_Attributes.chanceCreationPassingClass, biz_name: chanceCreationPassingClass, physical_column_id: european_football_2.Team_Attributes.chanceCreationPassingClass}
          - {attr_id: european_football_2.Team_Attributes.defenceAggressionClass, biz_name: defenceAggressionClass, physical_column_id: european_football_2.Team_Attributes.defenceAggressionClass}
          - {attr_id: european_football_2.Team_Attributes.`date`, biz_name: date, physical_column_id: european_football_2.Team_Attributes.`date`}
  - logical_entity_id: LOGICAL.Match
    biz_name: Match
    description: "League matches"
    public_attributes:
      - {attr_id: LOGICAL.Match.MatchID, biz_name: MatchID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Match
        physical_table_name: Match
        physical_table_id: european_football_2.Match
        A: {cardinality: "1:1", key: id}
        R: null
        C: {LOGICAL.Match.MatchID: european_football_2.Match.id}
        S: "Match records"
        private_attributes:
          - {attr_id: european_football_2.Match.league_id, biz_name: league_id, physical_column_id: european_football_2.Match.league_id}
          - {attr_id: european_football_2.Match.season, biz_name: season, physical_column_id: european_football_2.Match.season}
          - {attr_id: european_football_2.Match.home_team_api_id, biz_name: home_team_api_id, physical_column_id: european_football_2.Match.home_team_api_id}
          - {attr_id: european_football_2.Match.away_team_api_id, biz_name: away_team_api_id, physical_column_id: european_football_2.Match.away_team_api_id}
          - {attr_id: european_football_2.Match.home_team_goal, biz_name: home_team_goal, physical_column_id: european_football_2.Match.home_team_goal}
          - {attr_id: european_football_2.Match.away_team_goal, biz_name: away_team_goal, physical_column_id: european_football_2.Match.away_team_goal}
          - {attr_id: european_football_2.Match.`date`, biz_name: date, physical_column_id: european_football_2.Match.`date`}
          - {attr_id: european_football_2.Match.country_id, biz_name: country_id, physical_column_id: european_football_2.Match.country_id}
  - logical_entity_id: LOGICAL.League
    biz_name: League
    description: "League information"
    public_attributes:
      - {attr_id: LOGICAL.League.LeagueID, biz_name: LeagueID}
    physical_entities:
      - physical_entity_id: PHYSICAL.League
        physical_table_name: League
        physical_table_id: european_football_2.League
        A: {cardinality: "1:1", key: id}
        R: null
        C: {LOGICAL.League.LeagueID: european_football_2.League.id}
        S: "League information"
        private_attributes:
          - {attr_id: european_football_2.League.name, biz_name: name, physical_column_id: european_football_2.League.name}
          - {attr_id: european_football_2.League.country_id, biz_name: country_id, physical_column_id: european_football_2.League.country_id}
pas_relations:
  - relation_id: LOGICAL.League_TO_LOGICAL.Match
    relation_name: Contains
    P: {forward: {verb: contains, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: LeagueID
    S: "1 league contains N matches"
  - relation_id: LOGICAL.Team_TO_LOGICAL.Match
    relation_name: Participates
    P: {forward: {verb: participates, cardinality: '1:N'}, reverse: {verb: involves, cardinality: '1:N'}}
    A: TeamID
    S: "Teams participate in many matches (home or away)"
