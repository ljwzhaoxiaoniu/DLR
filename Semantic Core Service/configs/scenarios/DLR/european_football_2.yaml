mapping_type: dlr
version: '2.0'
scenario_name: dlr_football
description: 'DLR paradigm - European football: players with FIFA skill ratings, teams with tactical attributes (buildUpPlay/chanceCreation/defence),
  league matches (home/away goals), and leagues'
databases:
  european_football_2: sqlite:///MINIDEV_sqlite/dev_databases/european_football_2/european_football_2.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Player
  biz_name: Player
  description: Football player — player_name, birthday, height, weight, and FIFA skill ratings (overall_rating, potential,
    finishing, dribbling, sprint_speed, etc.) tracked by date
  public_attributes:
  - attr_id: LOGICAL.Player.PlayerID
    biz_name: PlayerID
    description: '球员API ID: 球员唯一标识符'
  - attr_id: LOGICAL.Player.Name
    biz_name: player_name
    description: '球员姓名: 球员的全名'
  - attr_id: LOGICAL.Player.Birthday
    biz_name: birthday
    description: '生日: 球员出生日期'
  - attr_id: LOGICAL.Player.Height
    biz_name: height
    description: '身高: 球员身高(cm)'
  - attr_id: LOGICAL.Player.Weight
    biz_name: weight
    description: '体重: 球员体重(kg)'
  - attr_id: LOGICAL.Player.OverallRating
    biz_name: overall_rating
    description: '综合评分: FIFA综合能力评分'
  - attr_id: LOGICAL.Player.Potential
    biz_name: potential
    description: '潜力值: FIFA潜力评分'
  - attr_id: LOGICAL.Player.Date
    biz_name: date
    description: '日期: FIFA数据记录日期'
  - attr_id: LOGICAL.Player.HeadingAccuracy
    biz_name: heading_accuracy
    description: 'Heading accuracy: head ball precision score'
  - attr_id: LOGICAL.Player.SprintSpeed
    biz_name: sprint_speed
    description: 'Sprint speed: sprinting speed score'
  - attr_id: LOGICAL.Player.Finishing
    biz_name: finishing
    description: 'Finishing: shot finishing ability score'
  - attr_id: LOGICAL.Player.Dribbling
    biz_name: dribbling
    description: 'Dribbling: ball control while running score'
  - attr_id: LOGICAL.Player.BallControl
    biz_name: ball_control
    description: 'Ball control: overall ball handling score'
  - attr_id: LOGICAL.Player.Crossing
    biz_name: crossing
    description: 'Crossing: cross pass accuracy score'
  - attr_id: LOGICAL.Player.ShortPassing
    biz_name: short_passing
    description: 'Short passing: short distance pass accuracy score'
  - attr_id: LOGICAL.Player.LongShots
    biz_name: long_shots
    description: 'Long shots: long distance shooting score'
  - attr_id: LOGICAL.Player.FreeKickAccuracy
    biz_name: free_kick_accuracy
    description: 'Free kick accuracy: free kick precision score'
  - attr_id: LOGICAL.Player.Jumping
    biz_name: jumping
    description: 'Jumping: jumping height/ability score'
  physical_entities:
  - physical_entity_id: PHYSICAL.Player
    physical_table_name: Player
    physical_table_id: european_football_2.Player
    A:
      cardinality: '1:1'
      key: player_api_id
    R: null
    C:
      LOGICAL.Player.PlayerID: european_football_2.Player.player_api_id
      LOGICAL.Player.Name: european_football_2.Player.player_name
      LOGICAL.Player.Birthday: european_football_2.Player.birthday
      LOGICAL.Player.Height: european_football_2.Player.height
      LOGICAL.Player.Weight: european_football_2.Player.weight
    S: Player basic info — name, birthday, height, weight
    private_attributes:
    - attr_id: european_football_2.Player.player_fifa_api_id
      biz_name: player federation international football association api id
      physical_column_id: european_football_2.Player.player_fifa_api_id
      description: the id of the player fifa api
    - attr_id: european_football_2.Player.id
      biz_name: id
      physical_column_id: european_football_2.Player.id
      description: the unique id for players
  - physical_entity_id: PHYSICAL.PlayerAttribute
    physical_table_name: Player_Attributes
    physical_table_id: european_football_2.Player_Attributes
    A:
      cardinality: N:1
      key: player_api_id
    R: null
    C:
      LOGICAL.Player.PlayerID: european_football_2.Player_Attributes.player_api_id
      LOGICAL.Player.OverallRating: european_football_2.Player_Attributes.overall_rating
      LOGICAL.Player.Potential: european_football_2.Player_Attributes.potential
      LOGICAL.Player.Date: european_football_2.Player_Attributes.date
      LOGICAL.Player.HeadingAccuracy: european_football_2.Player_Attributes.heading_accuracy
      LOGICAL.Player.SprintSpeed: european_football_2.Player_Attributes.sprint_speed
      LOGICAL.Player.Finishing: european_football_2.Player_Attributes.finishing
      LOGICAL.Player.Dribbling: european_football_2.Player_Attributes.dribbling
      LOGICAL.Player.BallControl: european_football_2.Player_Attributes.ball_control
      LOGICAL.Player.Crossing: european_football_2.Player_Attributes.crossing
      LOGICAL.Player.ShortPassing: european_football_2.Player_Attributes.short_passing
      LOGICAL.Player.LongShots: european_football_2.Player_Attributes.long_shots
      LOGICAL.Player.FreeKickAccuracy: european_football_2.Player_Attributes.free_kick_accuracy
      LOGICAL.Player.Jumping: european_football_2.Player_Attributes.jumping
    S: Player FIFA attributes — overall_rating, potential, and skill ratings tracked by date
    private_attributes:
    - attr_id: european_football_2.Player_Attributes.preferred_foot
      biz_name: preferred foot
      physical_column_id: european_football_2.Player_Attributes.preferred_foot
      description: the player's preferred foot when attacking. right/ left
    - attr_id: european_football_2.Player_Attributes.attacking_work_rate
      biz_name: attacking work rate
      physical_column_id: european_football_2.Player_Attributes.attacking_work_rate
      description: "the player's attacking work rate. commonsense reasoning: \x95 high: implies that the player is going to\
        \ be in all of your attack moves \x95 medium: implies that the player will select the attack actions he will join\
        \ in \x95 low: remain in his position while the team attacks"
    - attr_id: european_football_2.Player_Attributes.defensive_work_rate
      biz_name: defensive_work_rate
      physical_column_id: european_football_2.Player_Attributes.defensive_work_rate
      description: "the player's defensive work rate. commonsense reasoning: \x95 high: remain in his position and defense\
        \ while the team attacks \x95 medium: implies that the player will select the defensive actions he will join in \x95\
        \ low: implies that the player is going to be in all of your attack moves instead of defensing"
    - attr_id: european_football_2.Player_Attributes.volleys
      biz_name: volleys
      physical_column_id: european_football_2.Player_Attributes.volleys
      description: the player's volley score. 0-100 which is calculated by FIFA
    - attr_id: european_football_2.Player_Attributes.curve
