pas_relations:
- relation_id: LOGICAL.League_TO_LOGICAL.Match
  relation_name: Contains
  P:
    forward:
      verb: contains
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: LeagueID
  S: 1 league contains N matches — Match.league_id → League.id
- relation_id: LOGICAL.Team_TO_LOGICAL.Match
  relation_name: Participates
  P:
    forward:
      verb: participates
      cardinality: 1:N
    reverse:
      verb: involves
      cardinality: 1:N
  A: TeamID
  S: Teams participate in matches as home or away — Match.home_team_api_id → Team.team_api_id, Match.away_team_api_id → Team.team_api_id
    (use home_team_api_id for home, away_team_api_id for away)
