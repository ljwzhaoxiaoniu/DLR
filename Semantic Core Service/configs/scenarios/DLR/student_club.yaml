mapping_type: dlr
version: '2.0'
scenario_name: dlr_student_club
description: 'DLR paradigm - Student club: members attend events, incur expenses funded by event budgets, and receive income; majors and zip codes as dimension tables'
databases:
  student_club: sqlite:///MINIDEV_sqlite/dev_databases/student_club/student_club.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Member
  biz_name: Member
  description: Student club member — first_name, last_name, position, phone, T-shirt size, zip code, and major; the central entity for member activities, expenses, and income
  public_attributes:
  - attr_id: LOGICAL.Member.MemberID
    biz_name: MemberID
    description: '成员ID: 社团成员唯一标识符'
  physical_entities:
  - physical_entity_id: PHYSICAL.Member
    physical_table_name: member
    physical_table_id: student_club.member
    A:
      cardinality: '1:1'
      key: member_id
    R: null
    C:
      LOGICAL.Member.MemberID: student_club.member.member_id
    S: Member master
    private_attributes:
    - attr_id: student_club.member.first_name
      biz_name: first_name
      physical_column_id: student_club.member.first_name
      description: '名: 成员的名字'
    - attr_id: student_club.member.last_name
      biz_name: last_name
      physical_column_id: student_club.member.last_name
      description: '姓: 成员的姓氏'
    - attr_id: student_club.member.position
      biz_name: position
      physical_column_id: student_club.member.position
    - attr_id: student_club.member.t_shirt_size
      biz_name: t_shirt_size
      physical_column_id: student_club.member.t_shirt_size
      description: 'T恤尺码: 成员的T恤尺码'
    - attr_id: student_club.member.phone
      biz_name: phone
      physical_column_id: student_club.member.phone
    - attr_id: student_club.member.zip
      biz_name: zip
      physical_column_id: student_club.member.zip
    - attr_id: student_club.member.link_to_major
      biz_name: link_to_major
      physical_column_id: student_club.member.link_to_major
      description: '专业ID: 成员所属专业ID，关联 major 表'
- logical_entity_id: LOGICAL.Event
  biz_name: Event
  description: Club events — event_name, event_date, type, location, status; has budgets and records member attendance
  public_attributes:
  - {attr_id: LOGICAL.Event.EventID, biz_name: EventID, description: 'Event ID: unique identifier'}
  - {attr_id: LOGICAL.Event.EventName, biz_name: EventName, description: 'Event name'}
  - {attr_id: LOGICAL.Event.EventDate, biz_name: EventDate, description: 'Event date'}
  - {attr_id: LOGICAL.Event.Type, biz_name: Type, description: 'Event type: Meeting, fundraiser, etc.'}
  physical_entities:
  - physical_entity_id: PHYSICAL.Event
    physical_table_name: event
    physical_table_id: student_club.event
    A:
      cardinality: '1:1'
      key: event_id
    R: null
    C:
      LOGICAL.Event.EventID: student_club.event.event_id
      LOGICAL.Event.EventName: student_club.event.event_name
      LOGICAL.Event.EventDate: student_club.event.event_date
      LOGICAL.Event.Type: student_club.event.type
    S: Event records
    private_attributes: []
- logical_entity_id: LOGICAL.Attendance
  biz_name: Attendance
  description: Member attendance at events — many-to-many junction linking members to events they attended
  public_attributes:
  - attr_id: LOGICAL.Attendance.Event
    biz_name: Event
    description: '关联活动ID: 参加的活动ID，关联 event 表'
  - attr_id: LOGICAL.Attendance.Member
    biz_name: Member
    description: '关联成员ID: 参加的成员ID，关联 member 表'
  physical_entities:
  - physical_entity_id: PHYSICAL.Attendance
    physical_table_name: attendance
    physical_table_id: student_club.attendance
    A:
      cardinality: N:1
      key: link_to_event
    R: null
    C:
      LOGICAL.Attendance.Event: student_club.attendance.link_to_event
      LOGICAL.Attendance.Member: student_club.attendance.link_to_member
    S: Member-event many-to-many
    private_attributes: []
- logical_entity_id: LOGICAL.Budget
  biz_name: Budget
  description: Event budget tracking — allocated amount, spent, remaining, category, and status per event; funds member expenses
  public_attributes:
  - attr_id: LOGICAL.Budget.BudgetID
    biz_name: BudgetID
    description: '预算ID: 预算项唯一标识符'
  - attr_id: LOGICAL.Budget.Event
    biz_name: Event
    description: 'Event ID: FK to event table'
  - attr_id: LOGICAL.Budget.Amount
    biz_name: Amount
    description: 'Budget amount: total allocated budget'
  - attr_id: LOGICAL.Budget.Spent
    biz_name: Spent
    description: 'Spent amount: actual expenses charged to this budget'
  physical_entities:
  - physical_entity_id: PHYSICAL.Budget
    physical_table_name: budget
    physical_table_id: student_club.budget
    A:
      cardinality: N:1
      key: link_to_event
    R: null
    C:
      LOGICAL.Budget.BudgetID: student_club.budget.budget_id
      LOGICAL.Budget.Event: student_club.budget.link_to_event
      LOGICAL.Budget.Amount: student_club.budget.amount
      LOGICAL.Budget.Spent: student_club.budget.spent
    S: Event budget item — amount, spent, remaining, category
    private_attributes:
    - attr_id: student_club.budget.category
      biz_name: category
      physical_column_id: student_club.budget.category
    - attr_id: student_club.budget.remaining
      biz_name: remaining
      physical_column_id: student_club.budget.remaining
    - attr_id: student_club.budget.event_status
      biz_name: event_status
      physical_column_id: student_club.budget.event_status
- logical_entity_id: LOGICAL.Expense
  biz_name: Expense
  description: Member expense records — individual spending with cost, expense_date, description, and approval status; incurred by members, funded by event budgets
  public_attributes:
  - attr_id: LOGICAL.Expense.ExpenseID
    biz_name: ExpenseID
    description: '开支ID: 开支记录唯一标识符'
  - attr_id: LOGICAL.Expense.Member
    biz_name: Member
    description: '成员ID: FK→member，花钱的人'
  - attr_id: LOGICAL.Expense.Budget
    biz_name: Budget
    description: '预算ID: FK→budget，所属预算项'
  - attr_id: LOGICAL.Expense.Cost
    biz_name: cost
    description: '金额: 开支金额'
  - attr_id: LOGICAL.Expense.Date
    biz_name: expense_date
    description: '日期: 支出日期 YYYY-MM-DD 格式'
  physical_entities:
  - physical_entity_id: PHYSICAL.Expense
    physical_table_name: expense
    physical_table_id: student_club.expense
    A:
      cardinality: N:1
      key: link_to_member
    R: null
    C:
      LOGICAL.Expense.ExpenseID: student_club.expense.expense_id
      LOGICAL.Expense.Member: student_club.expense.link_to_member
      LOGICAL.Expense.Budget: student_club.expense.link_to_budget
      LOGICAL.Expense.Cost: student_club.expense.cost
      LOGICAL.Expense.Date: student_club.expense.expense_date
    S: Individual member expense at an event — cost, date, description, approval status
    private_attributes:
    - attr_id: student_club.expense.expense_description
      biz_name: expense_description
      physical_column_id: student_club.expense.expense_description
      description: '描述: 开支说明'
    - attr_id: student_club.expense.approved
      biz_name: approved
      physical_column_id: student_club.expense.approved
      description: '审批状态: 是否已批准 true/false'
- logical_entity_id: LOGICAL.Income
  biz_name: Income
  description: Funds received by the club — amount, source, date_received, and notes; received by members
  public_attributes:
  - attr_id: LOGICAL.Income.IncomeID
    biz_name: IncomeID
  - attr_id: LOGICAL.Income.Member
    biz_name: Member
  physical_entities:
  - physical_entity_id: PHYSICAL.Income
    physical_table_name: income
    physical_table_id: student_club.income
    A:
      cardinality: N:1
      key: link_to_member
    R: null
    C:
      LOGICAL.Income.IncomeID: student_club.income.income_id
      LOGICAL.Income.Member: student_club.income.link_to_member
    S: Income records
    private_attributes:
    - attr_id: student_club.income.amount
      biz_name: amount
      physical_column_id: student_club.income.amount
    - attr_id: student_club.income.source
      biz_name: source
      physical_column_id: student_club.income.source
    - attr_id: student_club.income.date_received
      biz_name: date_received
      physical_column_id: student_club.income.date_received
    - attr_id: student_club.income.notes
      biz_name: notes
      physical_column_id: student_club.income.notes
- logical_entity_id: LOGICAL.Major
  biz_name: Major
  description: Academic major — major_name, department, and college
  public_attributes:
  - attr_id: LOGICAL.Major.MajorID
    biz_name: MajorID
    description: '专业ID: 专业唯一标识符'
  physical_entities:
  - physical_entity_id: PHYSICAL.Major
    physical_table_name: major
    physical_table_id: student_club.major
    A:
      cardinality: '1:1'
      key: major_id
    R: null
    C:
      LOGICAL.Major.MajorID: student_club.major.major_id
    S: Major dictionary
    private_attributes:
    - attr_id: student_club.major.major_name
      biz_name: major_name
      physical_column_id: student_club.major.major_name
      description: '专业名称: 专业的名称'
    - attr_id: student_club.major.department
      biz_name: department
      physical_column_id: student_club.major.department
    - attr_id: student_club.major.college
      biz_name: college
      physical_column_id: student_club.major.college
- logical_entity_id: LOGICAL.ZipCode
  biz_name: ZipCode
  description: Zip code geographic information — city, state, and county
  public_attributes:
  - attr_id: LOGICAL.ZipCode.Zip
    biz_name: Zip
  physical_entities:
  - physical_entity_id: PHYSICAL.ZipCode
    physical_table_name: zip_code
    physical_table_id: student_club.zip_code
    A:
      cardinality: '1:1'
      key: zip_code
    R: null
    C:
      LOGICAL.ZipCode.Zip: student_club.zip_code.zip_code
    S: Zip code dictionary
    private_attributes:
    - attr_id: student_club.zip_code.city
      biz_name: city
      physical_column_id: student_club.zip_code.city
    - attr_id: student_club.zip_code.state
      biz_name: state
      physical_column_id: student_club.zip_code.state
    - attr_id: student_club.zip_code.county
      biz_name: county
      physical_column_id: student_club.zip_code.county
pas_relations:
- relation_id: LOGICAL.Member_TO_LOGICAL.Event
  relation_name: Participates
  P:
    forward:
      verb: participates
      cardinality: 1:N
    reverse:
      verb: involves
      cardinality: 1:N
  A: MemberID
  S: Members participate in events via attendance
- relation_id: LOGICAL.Event_TO_LOGICAL.Budget
  relation_name: HasBudget
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Event
  S: 1 event has N budget items — amount, spent, remaining per event
- relation_id: LOGICAL.Budget_TO_LOGICAL.Expense
  relation_name: Funds
  P:
    forward:
      verb: funds
      cardinality: 1:N
    reverse:
      verb: is funded by
      cardinality: N:1
  A: Budget
  S: 1 budget item funds N member expenses — expense.link_to_budget → budget.budget_id
- relation_id: LOGICAL.Member_TO_LOGICAL.Expense
  relation_name: Incurs
  P:
    forward:
      verb: incurs
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: N:1
  A: Member
  S: 1 member incurs N expenses at events — expense.link_to_member → member.member_id
- relation_id: LOGICAL.Member_TO_LOGICAL.Income
  relation_name: Receives
  P:
    forward:
      verb: receives
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Member
  S: 1 member receives N income entries
- relation_id: LOGICAL.Member_TO_LOGICAL.Major
  relation_name: BelongsTo
  P:
    forward:
      verb: belongs to
      cardinality: N:1
    reverse:
      verb: contains
      cardinality: 1:N
  A: MajorID
  S: Members belong to a major
- relation_id: LOGICAL.Member_TO_LOGICAL.ZipCode
  relation_name: LivesIn
  P:
    forward:
      verb: lives in
      cardinality: N:1
    reverse:
      verb: contains
      cardinality: 1:N
  A: Zip
  S: Members live in a zip code area
