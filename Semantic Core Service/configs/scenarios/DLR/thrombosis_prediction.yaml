mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_thrombosis
description: "DLR 范式 — 血栓预测场景：按需字段，3 PE 聚合 3 LE，实验室与临床检查解耦"
databases:
  thrombosis_prediction: "sqlite:///MINIDEV_sqlite/dev_databases/thrombosis_prediction/thrombosis_prediction.sqlite"

logical_entities:
  # ── 1. 患者 ──
  - logical_entity_id: LOGICAL.患者
    biz_name: 患者
    description: "就诊患者的基础信息与诊断结果"
    public_attributes:
      - {attr_id: LOGICAL.患者.患者编号, biz_name: 患者编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.患者表
        physical_table_name: Patient
        physical_table_id: thrombosis_prediction.Patient
        A: {cardinality: "1:1", key: ID}
        R: null
        C:
          LOGICAL.患者.患者编号: thrombosis_prediction.Patient.ID
        S: "患者主索引"
        private_attributes:
          - {attr_id: thrombosis_prediction.Patient.SEX, biz_name: 性别, physical_column_id: thrombosis_prediction.Patient.SEX}
          - {attr_id: thrombosis_prediction.Patient.Birthday, biz_name: 出生日期, physical_column_id: thrombosis_prediction.Patient.Birthday}
          - {attr_id: thrombosis_prediction.Patient.Diagnosis, biz_name: 诊断结果, physical_column_id: thrombosis_prediction.Patient.Diagnosis}
          - {attr_id: thrombosis_prediction.Patient.Admission, biz_name: 住院状态, physical_column_id: thrombosis_prediction.Patient.Admission}
          - {attr_id: thrombosis_prediction.Patient.Description, biz_name: 描述, physical_column_id: thrombosis_prediction.Patient.Description}
          - {attr_id: thrombosis_prediction.Patient.`First Date`, biz_name: 首诊日期, physical_column_id: thrombosis_prediction.Patient.`First Date`}

  # ── 2. 实验室检验 ──
  - logical_entity_id: LOGICAL.实验室检验
    biz_name: 实验室检验
    description: "患者血液等生化指标的实验室检验结果"
    public_attributes:
      - {attr_id: LOGICAL.实验室检验.所属患者, biz_name: 所属患者}
      - {attr_id: LOGICAL.实验室检验.检验日期, biz_name: 检验日期}
    physical_entities:
      - physical_entity_id: PHYSICAL.检验表
        physical_table_name: Laboratory
        physical_table_id: thrombosis_prediction.Laboratory
        A: {cardinality: "N:1", key: ID}
        R: null
        C:
          LOGICAL.实验室检验.所属患者: thrombosis_prediction.Laboratory.ID
          LOGICAL.实验室检验.检验日期: thrombosis_prediction.Laboratory.Date
        S: "生化指标记录表"
        private_attributes:
          - {attr_id: thrombosis_prediction.Laboratory.HGB, biz_name: 血红蛋白, physical_column_id: thrombosis_prediction.Laboratory.HGB}
          - {attr_id: thrombosis_prediction.Laboratory.PLT, biz_name: 血小板, physical_column_id: thrombosis_prediction.Laboratory.PLT}
          - {attr_id: thrombosis_prediction.Laboratory.UA, biz_name: 尿酸, physical_column_id: thrombosis_prediction.Laboratory.UA}
          - {attr_id: thrombosis_prediction.Laboratory.LDH, biz_name: 乳酸脱氢酶, physical_column_id: thrombosis_prediction.Laboratory.LDH}
          - {attr_id: thrombosis_prediction.Laboratory.`T-CHO`, biz_name: 总胆固醇, physical_column_id: thrombosis_prediction.Laboratory.`T-CHO`}
          - {attr_id: thrombosis_prediction.Laboratory.GPT, biz_name: 谷丙转氨酶, physical_column_id: thrombosis_prediction.Laboratory.GPT}
          - {attr_id: thrombosis_prediction.Laboratory.ALB, biz_name: 白蛋白, physical_column_id: thrombosis_prediction.Laboratory.ALB}
          - {attr_id: thrombosis_prediction.Laboratory.IGG, biz_name: IgG, physical_column_id: thrombosis_prediction.Laboratory.IGG}
          - {attr_id: thrombosis_prediction.Laboratory.IGM, biz_name: IgM, physical_column_id: thrombosis_prediction.Laboratory.IGM}
          - {attr_id: thrombosis_prediction.Laboratory.IGA, biz_name: IgA, physical_column_id: thrombosis_prediction.Laboratory.IGA}
          - {attr_id: thrombosis_prediction.Laboratory.CRP, biz_name: C反应蛋白, physical_column_id: thrombosis_prediction.Laboratory.CRP}
          - {attr_id: thrombosis_prediction.Laboratory.RNP, biz_name: 抗RNP, physical_column_id: thrombosis_prediction.Laboratory.RNP}
          - {attr_id: thrombosis_prediction.Laboratory.SM, biz_name: 抗SM, physical_column_id: thrombosis_prediction.Laboratory.SM}
          - {attr_id: thrombosis_prediction.Laboratory.SC170, biz_name: 抗Scl70, physical_column_id: thrombosis_prediction.Laboratory.SC170}
          - {attr_id: thrombosis_prediction.Laboratory.SSB, biz_name: 抗SSB, physical_column_id: thrombosis_prediction.Laboratory.SSB}
          - {attr_id: thrombosis_prediction.Laboratory.CENTROMEA, biz_name: 抗着丝粒, physical_column_id: thrombosis_prediction.Laboratory.CENTROMEA}
          - {attr_id: thrombosis_prediction.Laboratory.`T-BIL`, biz_name: 总胆红素, physical_column_id: thrombosis_prediction.Laboratory.`T-BIL`}
          - {attr_id: thrombosis_prediction.Laboratory.UN, biz_name: 尿素氮, physical_column_id: thrombosis_prediction.Laboratory.UN}
          - {attr_id: thrombosis_prediction.Laboratory.CRE, biz_name: 肌酐, physical_column_id: thrombosis_prediction.Laboratory.CRE}
          - {attr_id: thrombosis_prediction.Laboratory.WBC, biz_name: 白细胞, physical_column_id: thrombosis_prediction.Laboratory.WBC}
          - {attr_id: thrombosis_prediction.Laboratory.FG, biz_name: 纤维蛋白原, physical_column_id: thrombosis_prediction.Laboratory.FG}
          - {attr_id: thrombosis_prediction.Laboratory.RBC, biz_name: 红细胞, physical_column_id: thrombosis_prediction.Laboratory.RBC}
          - {attr_id: thrombosis_prediction.Laboratory.PT, biz_name: 凝血酶原时间, physical_column_id: thrombosis_prediction.Laboratory.PT}
          - {attr_id: thrombosis_prediction.Laboratory.CPK, biz_name: 肌酸激酶, physical_column_id: thrombosis_prediction.Laboratory.CPK}
          - {attr_id: thrombosis_prediction.Laboratory.GOT, biz_name: 谷草转氨酶, physical_column_id: thrombosis_prediction.Laboratory.GOT}
          - {attr_id: thrombosis_prediction.Laboratory.GLU, biz_name: 血糖, physical_column_id: thrombosis_prediction.Laboratory.GLU}
          - {attr_id: thrombosis_prediction.Laboratory.TG, biz_name: 甘油三酯, physical_column_id: thrombosis_prediction.Laboratory.TG}

  # ── 3. 临床检查 ──
  - logical_entity_id: LOGICAL.临床检查
    biz_name: 临床检查
    description: "患者的临床体格检查与凝血功能评估"
    public_attributes:
      - {attr_id: LOGICAL.临床检查.所属患者, biz_name: 所属患者}
      - {attr_id: LOGICAL.临床检查.检查日期, biz_name: 检查日期}
    physical_entities:
      - physical_entity_id: PHYSICAL.检查表
        physical_table_name: Examination
        physical_table_id: thrombosis_prediction.Examination
        A: {cardinality: "N:1", key: ID}
        R: null
        C:
          LOGICAL.临床检查.所属患者: thrombosis_prediction.Examination.ID
          LOGICAL.临床检查.检查日期: thrombosis_prediction.Examination.`Examination Date`
        S: "临床检查 — 血栓评估、抗体检测"
        private_attributes:
          - {attr_id: thrombosis_prediction.Examination.Thrombosis, biz_name: 血栓等级, physical_column_id: thrombosis_prediction.Examination.Thrombosis}
          - {attr_id: thrombosis_prediction.Examination.RVVT, biz_name: RVVT, physical_column_id: thrombosis_prediction.Examination.RVVT}
          - {attr_id: thrombosis_prediction.Examination.KCT, biz_name: KCT, physical_column_id: thrombosis_prediction.Examination.KCT}
          - {attr_id: thrombosis_prediction.Examination.LAC, biz_name: LAC, physical_column_id: thrombosis_prediction.Examination.LAC}
          - {attr_id: thrombosis_prediction.Examination.`ANA Pattern`, biz_name: ANA模式, physical_column_id: thrombosis_prediction.Examination.`ANA Pattern`}
          - {attr_id: thrombosis_prediction.Examination.`aCL IgM`, biz_name: aCL IgM, physical_column_id: thrombosis_prediction.Examination.`aCL IgM`}
          - {attr_id: thrombosis_prediction.Examination.`aCL IgG`, biz_name: aCL IgG, physical_column_id: thrombosis_prediction.Examination.`aCL IgG`}
          - {attr_id: thrombosis_prediction.Examination.`aCL IgA`, biz_name: aCL IgA, physical_column_id: thrombosis_prediction.Examination.`aCL IgA`}
          - {attr_id: thrombosis_prediction.Examination.Symptoms, biz_name: 症状, physical_column_id: thrombosis_prediction.Examination.Symptoms}

pas_relations:
  - relation_id: LOGICAL.患者_TO_LOGICAL.实验室检验
    relation_name: 检验申请
    P: {forward: {verb: 产生, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 患者编号
    S: "1个患者产生N条实验室检验记录"
  - relation_id: LOGICAL.患者_TO_LOGICAL.临床检查
    relation_name: 临床检查
    P: {forward: {verb: 接受, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 患者编号
    S: "1个患者接受N次临床检查"
