      physical_column_id: formula_1.driverStandings.driverStandingsId
    - attr_id: formula_1.driverStandings.points
      biz_name: points
      physical_column_id: formula_1.driverStandings.points
    - attr_id: formula_1.driverStandings.position
      biz_name: position
      physical_column_id: formula_1.driverStandings.position
    - attr_id: formula_1.driverStandings.wins
      biz_name: wins
      physical_column_id: formula_1.driverStandings.wins
