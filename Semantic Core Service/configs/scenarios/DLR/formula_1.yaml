mapping_type: dlr
version: '2.0'
scenario_name: dlr_formula_1
description: 'DLR paradigm - F1 racing scenario: on-demand fields, 11 PEs aggregated
  into 8 LEs, driver/constructor race data multi-view decoupling'
databases:
  formula_1: sqlite:///MINIDEV_sqlite/dev_databases/formula_1/formula_1.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Driver
  biz_name: Driver
  public_attributes:
  - attr_id: LOGICAL.Driver.DriverID
    biz_name: DriverID
    description: '车手ID: F1车手唯一标识符'
  physical_entities:
  - physical_entity_id: PHYSICAL.Driver
    physical_table_name: drivers
    physical_table_id: formula_1.drivers
    A:
      cardinality: '1:1'
      key: driverId
    R: null
    C:
      LOGICAL.Driver.DriverID: formula_1.drivers.driverId
    S: Driver master data
    private_attributes:
    - attr_id: formula_1.drivers.driverRef
      biz_name: driverRef
      physical_column_id: formula_1.drivers.driverRef
      description: '车手引用名: 车手英文引用名'
    - attr_id: formula_1.drivers.nationality
      biz_name: nationality
      physical_column_id: formula_1.drivers.nationality
    - attr_id: formula_1.drivers.forename
      biz_name: forename
      physical_column_id: formula_1.drivers.forename
    - attr_id: formula_1.drivers.surname
      biz_name: surname
      physical_column_id: formula_1.drivers.surname
      description: '姓氏: 车手的姓氏'
    - attr_id: formula_1.drivers.dob
      biz_name: dob
      physical_column_id: formula_1.drivers.dob
    - attr_id: formula_1.drivers.number
      biz_name: number
      physical_column_id: formula_1.drivers.number
      description: 'Driver number: permanent race car number of the driver, e.g. 44=Hamilton, 33=Verstappen'
    - attr_id: formula_1.drivers.code
      biz_name: code
      physical_column_id: formula_1.drivers.code
    - attr_id: formula_1.drivers.url
      biz_name: url
      physical_column_id: formula_1.drivers.url
- logical_entity_id: LOGICAL.Circuit
  biz_name: Circuit
  public_attributes:
  - attr_id: LOGICAL.Circuit.CircuitID
    biz_name: CircuitID
    description: '赛道ID: F1赛道唯一标识符'
  physical_entities:
  - physical_entity_id: PHYSICAL.Circuit
    physical_table_name: circuits
    physical_table_id: formula_1.circuits
    A:
      cardinality: '1:1'
      key: circuitId
    R: null
    C:
      LOGICAL.Circuit.CircuitID: formula_1.circuits.circuitId
    S: Circuit information
    private_attributes:
    - attr_id: formula_1.circuits.name
      biz_name: name
      physical_column_id: formula_1.circuits.name
    - attr_id: formula_1.circuits.country
      biz_name: country
      physical_column_id: formula_1.circuits.country
    - attr_id: formula_1.circuits.circuitRef
      biz_name: circuitRef
      physical_column_id: formula_1.circuits.circuitRef
    - attr_id: formula_1.circuits.location
      biz_name: location
      physical_column_id: formula_1.circuits.location
    - attr_id: formula_1.circuits.lat
      biz_name: lat
      physical_column_id: formula_1.circuits.lat
    - attr_id: formula_1.circuits.lng
      biz_name: lng
      physical_column_id: formula_1.circuits.lng
- logical_entity_id: LOGICAL.Race
  biz_name: Race
  description: 'Formula 1 Grand Prix race — year, name (e.g. Bahrain Grand Prix), date, circuit; drivers participate and produce results (position, time, points, laps)'
  public_attributes:
  - {attr_id: LOGICAL.Race.RaceID, biz_name: RaceID, description: 'Race ID: unique identifier'}
  - {attr_id: LOGICAL.Race.Year, biz_name: Year, description: 'Year: race season year'}
  - {attr_id: LOGICAL.Race.Name, biz_name: Name, description: 'Race name: e.g. Bahrain Grand Prix'}
  physical_entities:
  - physical_entity_id: PHYSICAL.Race
    physical_table_name: races
    physical_table_id: formula_1.races
    A:
      cardinality: '1:1'
      key: raceId
    R: null
    C:
      LOGICAL.Race.RaceID: formula_1.races.raceId
      LOGICAL.Race.Year: formula_1.races.year
      LOGICAL.Race.Name: formula_1.races.name
    S: Race master record
    private_attributes: []
      description: '比赛名称: 大奖赛名称'
    - attr_id: formula_1.races.circuitId
      biz_name: circuitId
      physical_column_id: formula_1.races.circuitId
      description: '赛道ID: 比赛赛道ID，关联 circuits 表'
    - attr_id: formula_1.races.date
      biz_name: date
      physical_column_id: formula_1.races.date
    - attr_id: formula_1.races.time
      biz_name: time
      physical_column_id: formula_1.races.time
    - attr_id: formula_1.races.url
      biz_name: url
      physical_column_id: formula_1.races.url
- logical_entity_id: LOGICAL.DriverRaceData
  biz_name: DriverRaceData
  description: 'Driver performance in a race: qualifying + race results + lap times'
  public_attributes:
  - attr_id: LOGICAL.DriverRaceData.Driver
    biz_name: Driver
    description: '车手ID: 参加排位赛的车手ID'
  - attr_id: LOGICAL.DriverRaceData.Race
    biz_name: Race
    description: '比赛ID: 所属比赛ID'
  physical_entities:
  - physical_entity_id: PHYSICAL.Qualifying
    physical_table_name: qualifying
    physical_table_id: formula_1.qualifying
    A:
      cardinality: N:1
      key: raceId
    R: null
    C:
      LOGICAL.DriverRaceData.Driver: formula_1.qualifying.driverId
      LOGICAL.DriverRaceData.Race: formula_1.qualifying.raceId
    S: Qualifying results
    private_attributes:
    - attr_id: formula_1.qualifying.qualifyId
      biz_name: qualifyId
      physical_column_id: formula_1.qualifying.qualifyId
    - attr_id: formula_1.qualifying.number
      biz_name: number
      physical_column_id: formula_1.qualifying.number
      description: 'Qualifying position: final grid position (1=pole, 2=second...), NOT driver number'
    - attr_id: formula_1.qualifying.position
      biz_name: position
      physical_column_id: formula_1.qualifying.position
    - attr_id: formula_1.qualifying.q1
      biz_name: q1
      physical_column_id: formula_1.qualifying.q1
      description: 'Q1成绩: 排位赛Q1阶段成绩（毫秒）'
    - attr_id: formula_1.qualifying.q2
      biz_name: q2
      physical_column_id: formula_1.qualifying.q2
      description: 'Q2成绩: 排位赛Q2阶段成绩（毫秒），NULL=未进Q2'
    - attr_id: formula_1.qualifying.q3
      biz_name: q3
      physical_column_id: formula_1.qualifying.q3
  - physical_entity_id: PHYSICAL.Result
    physical_table_name: results
    physical_table_id: formula_1.results
    A:
      cardinality: N:1
      key: raceId
    R: null
    C:
      LOGICAL.DriverRaceData.Driver: formula_1.results.driverId
      LOGICAL.DriverRaceData.Race: formula_1.results.raceId
    S: Race results
    private_attributes:
    - attr_id: formula_1.results.resultId
      biz_name: resultId
      physical_column_id: formula_1.results.resultId
    - attr_id: formula_1.results.constructorId
      biz_name: constructorId
      physical_column_id: formula_1.results.constructorId
    - attr_id: formula_1.results.number
      biz_name: number
      physical_column_id: formula_1.results.number
      description: 'Race finishing position: final race result, NOT driver number'
    - attr_id: formula_1.results.grid
      biz_name: grid
      physical_column_id: formula_1.results.grid
    - attr_id: formula_1.results.position
      biz_name: position
      physical_column_id: formula_1.results.position
    - attr_id: formula_1.results.positionOrder
      biz_name: positionOrder
      physical_column_id: formula_1.results.positionOrder
    - attr_id: formula_1.results.points
      biz_name: points
      physical_column_id: formula_1.results.points
    - attr_id: formula_1.results.laps
      biz_name: laps
      physical_column_id: formula_1.results.laps
    - attr_id: formula_1.results.time
      biz_name: time
      physical_column_id: formula_1.results.time
    - attr_id: formula_1.results.fastestLap
      biz_name: fastestLap
      physical_column_id: formula_1.results.fastestLap
    - attr_id: formula_1.results.fastestLapTime
      biz_name: fastestLapTime
      physical_column_id: formula_1.results.fastestLapTime
    - attr_id: formula_1.results.fastestLapSpeed
      biz_name: fastestLapSpeed
      physical_column_id: formula_1.results.fastestLapSpeed
    - attr_id: formula_1.results.rank
      biz_name: rank
      physical_column_id: formula_1.results.rank
    - attr_id: formula_1.results.statusId
      biz_name: statusId
      physical_column_id: formula_1.results.statusId
  - physical_entity_id: PHYSICAL.LapTime
    physical_table_name: lapTimes
    physical_table_id: formula_1.lapTimes
    A:
      cardinality: N:1
      key: raceId
    R: null
    C:
      LOGICAL.DriverRaceData.Driver: formula_1.lapTimes.driverId
      LOGICAL.DriverRaceData.Race: formula_1.lapTimes.raceId
    S: Lap times
    private_attributes:
    - attr_id: formula_1.lapTimes.lap
      biz_name: lap
      physical_column_id: formula_1.lapTimes.lap
    - attr_id: formula_1.lapTimes.position
      biz_name: position
      physical_column_id: formula_1.lapTimes.position
    - attr_id: formula_1.lapTimes.time
      biz_name: time
      physical_column_id: formula_1.lapTimes.time
    - attr_id: formula_1.lapTimes.milliseconds
      biz_name: milliseconds
      physical_column_id: formula_1.lapTimes.milliseconds
- logical_entity_id: LOGICAL.DriverStandings
  biz_name: DriverStandings
  public_attributes:
  - attr_id: LOGICAL.DriverStandings.Driver
