    - attr_id: formula_1.constructorStandings.wins
      biz_name: wins
      physical_column_id: formula_1.constructorStandings.wins
pas_relations:
- relation_id: LOGICAL.Circuit_TO_LOGICAL.Race
  relation_name: Hosts
  P:
    forward:
      verb: hosts
      cardinality: 1:N
    reverse:
      verb: is located at
      cardinality: '1:1'
  A: CircuitID
  S: 1 circuit hosts many races
- relation_id: LOGICAL.Race_TO_LOGICAL.DriverRaceData
  relation_name: Produces
  P:
    forward:
      verb: produces
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Race
  S: 1 race produces N driver race data records
- relation_id: LOGICAL.Driver_TO_LOGICAL.DriverRaceData
  relation_name: Participates
  P:
    forward:
      verb: participates
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Driver
  S: 1 driver participates in N races
- relation_id: LOGICAL.Constructor_TO_LOGICAL.ConstructorRaceData
  relation_name: Participates
  P:
    forward:
      verb: participates
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Constructor
  S: 1 constructor participates in N races
