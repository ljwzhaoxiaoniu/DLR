  public_attributes:
  - attr_id: LOGICAL.ConstructorRaceData.Constructor
    biz_name: Constructor
  - attr_id: LOGICAL.ConstructorRaceData.Race
    biz_name: Race
  physical_entities:
  - physical_entity_id: PHYSICAL.ConstructorResult
