mapping_type: dlr
version: '2.0'
scenario_name: dlr_formula_1
description: 'DLR paradigm - F1 racing scenario: on-demand fields, 11 PEs aggregated into 8 LEs, driver/constructor race data
  multi-view decoupling'
databases:
  formula_1: sqlite:///MINIDEV_sqlite/dev_databases/formula_1/formula_1.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Driver
  biz_name: Driver
  public_attributes:
  - attr_id: LOGICAL.Driver.DriverID
    biz_name: DriverID
    description: 'Driver ID: unique F1 driver identifier'
  physical_entities:
  - physical_entity_id: PHYSICAL.Driver
    physical_table_name: drivers
    physical_table_id: formula_1.drivers
    A:
      cardinality: '1:1'
      key: driverId
    R: null
    C:
      LOGICAL.Driver.DriverID: formula_1.drivers.driverId
    S: Driver master data
    private_attributes:
    - attr_id: formula_1.drivers.driverRef
      biz_name: driver reference name
      physical_column_id: formula_1.drivers.driverRef
      description: driver reference name
    - attr_id: formula_1.drivers.nationality
      biz_name: nationality
      physical_column_id: formula_1.drivers.nationality
      description: nationality of drivers
    - attr_id: formula_1.drivers.forename
      biz_name: forename
      physical_column_id: formula_1.drivers.forename
      description: forename
    - attr_id: formula_1.drivers.surname
      biz_name: surname
      physical_column_id: formula_1.drivers.surname
      description: surname
    - attr_id: formula_1.drivers.dob
      biz_name: date of birth
      physical_column_id: formula_1.drivers.dob
      description: date of birth
    - attr_id: formula_1.drivers.number
      biz_name: number
      physical_column_id: formula_1.drivers.number
      description: number
    - attr_id: formula_1.drivers.code
      biz_name: code
      physical_column_id: formula_1.drivers.code
      description: abbreviated code for drivers. if "null" or empty, it means it doesn't have code
    - attr_id: formula_1.drivers.url
      biz_name: url
      physical_column_id: formula_1.drivers.url
      description: the introduction website of the drivers
- logical_entity_id: LOGICAL.Circuit
  biz_name: Circuit
  public_attributes:
  - attr_id: LOGICAL.Circuit.CircuitID
    biz_name: CircuitID
    description: 'Circuit ID: unique F1 circuit identifier'
  physical_entities:
  - physical_entity_id: PHYSICAL.Circuit
    physical_table_name: circuits
    physical_table_id: formula_1.circuits
    A:
      cardinality: '1:1'
      key: circuitId
    R: null
    C:
      LOGICAL.Circuit.CircuitID: formula_1.circuits.circuitId
    S: Circuit information
    private_attributes:
    - attr_id: formula_1.circuits.name
      biz_name: name
      physical_column_id: formula_1.circuits.name
      description: full name of circuit
    - attr_id: formula_1.circuits.country
      biz_name: country
      physical_column_id: formula_1.circuits.country
      description: country of circuit
    - attr_id: formula_1.circuits.circuitRef
      biz_name: circuit reference name
      physical_column_id: formula_1.circuits.circuitRef
      description: circuit reference name
    - attr_id: formula_1.circuits.location
      biz_name: location
      physical_column_id: formula_1.circuits.location
      description: location of circuit
    - attr_id: formula_1.circuits.lat
      biz_name: latitude
      physical_column_id: formula_1.circuits.lat
      description: latitude of location of circuit
    - attr_id: formula_1.circuits.lng
      biz_name: longitude
      physical_column_id: formula_1.circuits.lng
      description: 'longitude of location of circuit. commonsense evidence: Location coordinates: (lat, lng)'
    - attr_id: formula_1.circuits.alt
      biz_name: alt
      physical_column_id: formula_1.circuits.alt
      description: alt. not useful
    - attr_id: formula_1.circuits.url
      biz_name: url
      physical_column_id: formula_1.circuits.url
      description: url
- logical_entity_id: LOGICAL.Race
  biz_name: Race
  description: F1 race event — year, race name, date, circuit; drivers compete with qualifying results, race results (position,
    time, laps), and lap times
  public_attributes:
  - attr_id: LOGICAL.Race.RaceID
    biz_name: RaceID
    description: 'Race ID: unique identifier'
  - attr_id: LOGICAL.Race.Year
    biz_name: Year
    description: 'Year: race season year'
  - attr_id: LOGICAL.Race.Name
    biz_name: Name
    description: 'Race name: e.g. Bahrain Grand Prix'
  physical_entities:
  - physical_entity_id: PHYSICAL.Race
    physical_table_name: races
    physical_table_id: formula_1.races
    A:
      cardinality: '1:1'
      key: raceId
    R: null
    C:
      LOGICAL.Race.RaceID: formula_1.races.raceId
      LOGICAL.Race.Year: formula_1.races.year
      LOGICAL.Race.Name: formula_1.races.name
    S: Race master record
    private_attributes:
    - attr_id: formula_1.races.round
      biz_name: round
      physical_column_id: formula_1.races.round
      description: round
    - attr_id: formula_1.races.circuitId
      biz_name: Circuit Id
      physical_column_id: formula_1.races.circuitId
      description: circuit Id
    - attr_id: formula_1.races.date
      biz_name: date
      physical_column_id: formula_1.races.date
      description: duration time
    - attr_id: formula_1.races.time
      biz_name: time
      physical_column_id: formula_1.races.time
      description: time of the location
    - attr_id: formula_1.races.url
      biz_name: url
      physical_column_id: formula_1.races.url
      description: introduction of races
- logical_entity_id: LOGICAL.DriverRaceData
  biz_name: DriverRaceData
  description: 'Driver performance in a race: qualifying + race results + lap times'
  public_attributes:
  - attr_id: LOGICAL.DriverRaceData.Driver
    biz_name: Driver
    description: 'Driver ID: FK to drivers table'
  - attr_id: LOGICAL.DriverRaceData.Race
    biz_name: Race
    description: 'Race ID: FK to races table'
  physical_entities:
  - physical_entity_id: PHYSICAL.Qualifying
    physical_table_name: qualifying
    physical_table_id: formula_1.qualifying
    A:
      cardinality: N:1
      key: raceId
    R: null
    C:
      LOGICAL.DriverRaceData.Driver: formula_1.qualifying.driverId
      LOGICAL.DriverRaceData.Race: formula_1.qualifying.raceId
    S: Qualifying results
    private_attributes:
    - attr_id: formula_1.qualifying.qualifyId
      biz_name: qualify Id
      physical_column_id: formula_1.qualifying.qualifyId
      description: "the unique identification number identifying qualifying. How does F1 Sprint qualifying work? Sprint qualifying\
        \ is essentially a short-form Grand Prix \x96 a race that is one-third the number of laps of the main event on Sunday.\
        \ However, the drivers are battling for positions on the grid for the start of Sunday's race."
    - attr_id: formula_1.qualifying.number
      biz_name: number
      physical_column_id: formula_1.qualifying.number
      description: number
    - attr_id: formula_1.qualifying.position
      biz_name: position
      physical_column_id: formula_1.qualifying.position
      description: position or track of circuit
    - attr_id: formula_1.qualifying.q1
      biz_name: qualifying 1
      physical_column_id: formula_1.qualifying.q1
      description: 'time in qualifying 1. in minutes / seconds / ... commonsense evidence: Q1 lap times determine pole position
        and the order of the front 10 positions on the grid. The slowest driver in Q1 starts 10th, the next starts ninth and
        so on. All 20 F1 drivers participate in the first period, called Q1, with each trying to set the fastest time possible.
        Those in the top 15 move on to the next period of qualifying, called Q2. The five slowest drivers are eliminated and
        will start the race in the last five positions on the grid.'
    - attr_id: formula_1.qualifying.q2
      biz_name: qualifying 2
      physical_column_id: formula_1.qualifying.q2
      description: 'time in qualifying 2. in minutes / seconds / ... commonsense evidence: only top 15 in the q1 has the record
        of q2 Q2 is slightly shorter but follows the same format. Drivers try to put down their best times to move on to Q1
        as one of the 10 fastest cars. The five outside of the top 10 are eliminated and start the race from 11th to 15th
        based on their best lap time.'
    - attr_id: formula_1.qualifying.q3
      biz_name: qualifying 3
      physical_column_id: formula_1.qualifying.q3
      description: 'time in qualifying 3. in minutes / seconds / ... commonsense evidence: only top 10 in the q2 has the record
        of q3'
    - attr_id: formula_1.qualifying.constructorId
      biz_name: constructor id
      physical_column_id: formula_1.qualifying.constructorId
      description: constructor Id
  - physical_entity_id: PHYSICAL.Result
    physical_table_name: results
    physical_table_id: formula_1.results
    A:
      cardinality: N:1
      key: raceId
    R: null
    C:
      LOGICAL.DriverRaceData.Driver: formula_1.results.driverId
      LOGICAL.DriverRaceData.Race: formula_1.results.raceId
    S: Race results
    private_attributes:
    - attr_id: formula_1.results.resultId
      biz_name: Result ID
      physical_column_id: formula_1.results.resultId
      description: the unique identification number identifying race result
    - attr_id: formula_1.results.constructorId
      biz_name: constructor Id
      physical_column_id: formula_1.results.constructorId
      description: the identification number identifying which constructors
    - attr_id: formula_1.results.number
      biz_name: number
      physical_column_id: formula_1.results.number
      description: number
    - attr_id: formula_1.results.grid
      biz_name: grid
      physical_column_id: formula_1.results.grid
      description: the number identifying the area where cars are set into a grid formation in order to start the race.
    - attr_id: formula_1.results.position
      biz_name: position
      physical_column_id: formula_1.results.position
      description: The finishing position or track of circuits
    - attr_id: formula_1.results.positionOrder
      biz_name: position order
      physical_column_id: formula_1.results.positionOrder
      description: the finishing order of positions
    - attr_id: formula_1.results.points
      biz_name: points
      physical_column_id: formula_1.results.points
      description: points
    - attr_id: formula_1.results.laps
      biz_name: laps
      physical_column_id: formula_1.results.laps
      description: lap number
    - attr_id: formula_1.results.time
      biz_name: time
      physical_column_id: formula_1.results.time
      description: 'finish time. commonsense evidence: 1. if the value exists, it means the driver finished the race. 2. Only
        the time of the champion shows in the format of "minutes: seconds.millionsecond", the time of the other drivers shows
        as "seconds.millionsecond" , which means their actual time is the time of the champion adding the value in this cell.'
    - attr_id: formula_1.results.fastestLap
      biz_name: fastest lap
      physical_column_id: formula_1.results.fastestLap
      description: fastest lap number
    - attr_id: formula_1.results.fastestLapTime
      biz_name: fastest Lap Time
      physical_column_id: formula_1.results.fastestLapTime
      description: fastest Lap Time. faster (smaller in the value) "fastestLapTime" leads to higher rank (smaller is higher
        rank)
    - attr_id: formula_1.results.fastestLapSpeed
      biz_name: fastest Lap Speed
      physical_column_id: formula_1.results.fastestLapSpeed
      description: fastest Lap Speed. (km / h)
    - attr_id: formula_1.results.rank
      biz_name: rank
      physical_column_id: formula_1.results.rank
      description: starting rank positioned by fastest lap speed
    - attr_id: formula_1.results.statusId
      biz_name: status Id
      physical_column_id: formula_1.results.statusId
      description: status ID. its category description appear in the table status
    - attr_id: formula_1.results.positionText
      biz_name: position text
      physical_column_id: formula_1.results.positionText
      description: position text. not quite useful
    - attr_id: formula_1.results.milliseconds
      biz_name: milliseconds
      physical_column_id: formula_1.results.milliseconds
      description: the actual finishing time of drivers in milliseconds. the actual finishing time of drivers
  - physical_entity_id: PHYSICAL.LapTime
    physical_table_name: lapTimes
    physical_table_id: formula_1.lapTimes
    A:
      cardinality: N:1
      key: raceId
    R: null
    C:
      LOGICAL.DriverRaceData.Driver: formula_1.lapTimes.driverId
      LOGICAL.DriverRaceData.Race: formula_1.lapTimes.raceId
    S: Lap times
    private_attributes:
    - attr_id: formula_1.lapTimes.lap
      biz_name: lap
      physical_column_id: formula_1.lapTimes.lap
      description: lap number
    - attr_id: formula_1.lapTimes.position
      biz_name: position
      physical_column_id: formula_1.lapTimes.position
      description: position or track of circuits
    - attr_id: formula_1.lapTimes.time
      biz_name: time
      physical_column_id: formula_1.lapTimes.time
      description: lap time. in minutes / seconds / ...
    - attr_id: formula_1.lapTimes.milliseconds
      biz_name: milliseconds
      physical_column_id: formula_1.lapTimes.milliseconds
      description: milliseconds
- logical_entity_id: LOGICAL.DriverStandings
  biz_name: DriverStandings
  public_attributes:
  - attr_id: LOGICAL.DriverStandings.Driver
