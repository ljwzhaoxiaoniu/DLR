    - attr_id: formula_1.pitStops.time
      biz_name: time
      physical_column_id: formula_1.pitStops.time
    - attr_id: formula_1.pitStops.duration
      biz_name: duration
      physical_column_id: formula_1.pitStops.duration
- logical_entity_id: LOGICAL.Constructor
  biz_name: Constructor
  public_attributes:
  - attr_id: LOGICAL.Constructor.ConstructorID
    biz_name: ConstructorID
    description: '车队ID: F1车队唯一标识符'
  physical_entities:
  - physical_entity_id: PHYSICAL.Constructor
    physical_table_name: constructors
    physical_table_id: formula_1.constructors
    A:
      cardinality: '1:1'
      key: constructorId
    R: null
