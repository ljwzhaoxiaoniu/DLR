    - attr_id: california_schools.schools.Virtual
      biz_name: Virtual
      physical_column_id: california_schools.schools.Virtual
      description: 'This field identifies the type of virtual instruction offered by the school. Virtual instruction is instruction
        in which students and teachers are separated by time and/or location, and interaction occurs via computers and/or
        telecommunications technologies.. The field is coded as follows: · F = Exclusively Virtual – The school has no physical
        building where students meet with each other or with teachers, all instruction is virtual. · V = Primarily Virtual
        – The school focuses on a systematic program of virtual instruction but includes some physical meetings among students
        or with teachers. · C = Primarily Classroom – The school offers virtual courses but virtual instruction is not the
        primary means of instruction. · N = Not Virtual – The school does not offer any virtual instruction. · P = Partial
        Virtual – The school offers some, but not all, instruction through virtual instruction. Note: This value was retired
        and replaced with the Primarily Virtual and Primarily Classroom values beginning with the 2016–17 school year.'
    - attr_id: california_schools.schools.Charter
      biz_name: Charter
      physical_column_id: california_schools.schools.Charter
      description: 'This field identifies a charter school.. The field is coded as follows: · 1 = The school is a charter
        · 0 = The school is not a charter'
    - attr_id: california_schools.schools.CharterNum
      biz_name: CharterNum
      physical_column_id: california_schools.schools.CharterNum
      description: The charter school number,. 4-digit number assigned to a charter school.
    - attr_id: california_schools.schools.FundingType
      biz_name: FundingType
      physical_column_id: california_schools.schools.FundingType
      description: 'Indicates the charter school funding type. Values are as follows: · Not in CS (California School) funding
        model · Locally funded · Directly funded'
    - attr_id: california_schools.schools.DOC
      biz_name: District Ownership Code
      physical_column_id: california_schools.schools.DOC
      description: 'District Ownership Code. The District Ownership Code (DOC) is the numeric code used to identify the category
        of the Administrative Authority. • 00 - County Office of Education • 02 – State Board of Education • 03 – Statewide
        Benefit Charter • 31 – State Special Schools • 34 – Non-school Location* • 52 – Elementary School District • 54 –
        Unified School District • 56 – High School District • 98 – Regional Occupational Center/Program (ROC/P) commonsense
        evidence: *Only the California Education Authority has been included in the non-school location category.'
    - attr_id: california_schools.schools.SOC
      biz_name: School Ownership Code
      physical_column_id: california_schools.schools.SOC
      description: The School Ownership Code is a numeric code used to identify the type of school.. • 08 - Preschool • 09
        – Special Education Schools (Public) • 11 – Youth Authority Facilities (CEA) • 13 – Opportunity Schools • 14 – Juvenile
        Court Schools • 15 – Other County or District Programs • 31 – State Special Schools • 60 – Elementary School (Public)
        • 61 – Elementary School in 1 School District (Public) • 62 – Intermediate/Middle Schools (Public) • 63 – Alternative
        Schools of Choice • 64 – Junior High Schools (Public) • 65 – K-12 Schools (Public) • 66 – High Schools (Public) •
        67 – High Schools in 1 School District (Public) • 68 – Continuation High Schools • 69 – District Community Day Schools
        • 70 – Adult Education Centers • 98 – Regional Occupational Center/Program (ROC/P)
    - attr_id: california_schools.schools.EdOpsCode
      biz_name: Education Option Code
      physical_column_id: california_schools.schools.EdOpsCode
      description: The Education Option Code is a short text description of the type of education offered.. • ALTSOC – Alternative
        School of Choice • COMM – County Community School • COMMDAY – Community Day School • CON – Continuation School • JUV
        – Juvenile Court School • OPP – Opportunity School • YTH – Youth Authority School • SSS – State Special School • SPEC
        – Special Education School • TRAD – Traditional • ROP – Regional Occupational Program • HOMHOS – Home and Hospital
        • SPECON – District Consortia Special Education School
    - attr_id: california_schools.schools.Magnet
      biz_name: Magnet
      physical_column_id: california_schools.schools.Magnet
      description: 'This field identifies whether a school is a magnet school and/or provides a magnet program.. The field
        is coded as follows: · 1 = Magnet - The school is a magnet school and/or offers a magnet program. · 0 = Not Magnet
        - The school is not a magnet school and/or does not offer a magnet program. commonsense evidence: Note: Preschools
        and adult education centers do not contain a magnet school indicator.'
    - attr_id: california_schools.schools.OpenDate
      biz_name: OpenDate
      physical_column_id: california_schools.schools.OpenDate
      description: The date the school opened.
    - attr_id: california_schools.schools.ClosedDate
      biz_name: ClosedDate
      physical_column_id: california_schools.schools.ClosedDate
      description: The date the school closed.
    - attr_id: california_schools.schools.StatusType
      biz_name: StatusType
      physical_column_id: california_schools.schools.StatusType
      description: 'This field identifies the status of the district.. Definitions of the valid status types are listed below:
        · Active: The district is in operation and providing instructional services. · Closed: The district is not in operation
        and no longer providing instructional services. · Merged: The district has combined with another district or districts.
        · Pending: The district has not opened for operation and instructional services yet, but plans to open within the
        next 9–12 months.'
    - attr_id: california_schools.schools.GSoffered
      biz_name: grade span offered
      physical_column_id: california_schools.schools.GSoffered
      description: 'The grade span offered is the lowest grade and the highest grade offered or supported by the school, district,
        or administrative authority. This field might differ from the grade span served as reported in the most recent certified
        California Longitudinal Pupil Achievement (CALPADS) Fall 1 data collection.. For example XYZ School might display
        the following data: GSoffered = P–Adult GSserved = K–12'
    - attr_id: california_schools.schools.GSserved
      biz_name: grade span served.
      physical_column_id: california_schools.schools.GSserved
      description: 'It is the lowest grade and the highest grade of student enrollment as reported in the most recent certified
        CALPADS Fall 1 data collection. Only K–12 enrollment is reported through CALPADS. This field may differ from the grade
        span offered.. commonsense evidence: 1. Only K–12 enrollment is reported through CALPADS 2. Note: Special programs
        at independent study, alternative education, and special education schools will often exceed the typical grade span
        for schools of that type'
    - attr_id: california_schools.schools.MailStreet
      biz_name: MailStreet
      physical_column_id: california_schools.schools.MailStreet
      description: 'MailStreet. The unabbreviated mailing address of the school, district, or administrative authority. Note:
        1) Some entities (primarily closed or retired schools) may not have data in this field; 2) Many active entities have
        not provided a mailing street address. For your convenience we have filled the unpopulated MailStreet cells with Street
        data.'
    - attr_id: california_schools.schools.AdmFName1
