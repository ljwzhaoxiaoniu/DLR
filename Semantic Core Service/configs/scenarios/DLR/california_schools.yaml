mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_california_schools
description: "DLR paradigm - California schools scenario: on-demand fields, 3 PEs aggregated into 2 LEs, school performance multi-view decoupling"
databases:
  california_schools: "sqlite:///MINIDEV_sqlite/dev_databases/california_schools/california_schools.sqlite"
logical_entities:
  - logical_entity_id: LOGICAL.School
    biz_name: School
    description: "California school profile"
    public_attributes:
      - {attr_id: LOGICAL.School.SchoolCode, biz_name: SchoolCode}
    physical_entities:
      - physical_entity_id: PHYSICAL.School
        physical_table_name: schools
        physical_table_id: california_schools.schools
        A: {cardinality: "1:1", key: CDSCode}
        R: null
        C: {LOGICAL.School.SchoolCode: california_schools.schools.CDSCode}
        S: "School master"
        private_attributes:
          - {attr_id: california_schools.schools.School, biz_name: School, physical_column_id: california_schools.schools.School}
          - {attr_id: california_schools.schools.City, biz_name: City, physical_column_id: california_schools.schools.City}
          - {attr_id: california_schools.schools.County, biz_name: County, physical_column_id: california_schools.schools.County}
          - {attr_id: california_schools.schools.District, biz_name: District, physical_column_id: california_schools.schools.District}
          - {attr_id: california_schools.schools.Street, biz_name: Street, physical_column_id: california_schools.schools.Street}
          - {attr_id: california_schools.schools.State, biz_name: State, physical_column_id: california_schools.schools.State}
          - {attr_id: california_schools.schools.Zip, biz_name: Zip, physical_column_id: california_schools.schools.Zip}
          - {attr_id: california_schools.schools.Phone, biz_name: Phone, physical_column_id: california_schools.schools.Phone}
          - {attr_id: california_schools.schools.Virtual, biz_name: Virtual, physical_column_id: california_schools.schools.Virtual}
          - {attr_id: california_schools.schools.Charter, biz_name: Charter, physical_column_id: california_schools.schools.Charter}
          - {attr_id: california_schools.schools.CharterNum, biz_name: CharterNum, physical_column_id: california_schools.schools.CharterNum}
          - {attr_id: california_schools.schools.FundingType, biz_name: FundingType, physical_column_id: california_schools.schools.FundingType}
          - {attr_id: california_schools.schools.DOC, biz_name: DOC, physical_column_id: california_schools.schools.DOC}
          - {attr_id: california_schools.schools.SOC, biz_name: SOC, physical_column_id: california_schools.schools.SOC}
          - {attr_id: california_schools.schools.EdOpsCode, biz_name: EdOpsCode, physical_column_id: california_schools.schools.EdOpsCode}
          - {attr_id: california_schools.schools.Magnet, biz_name: Magnet, physical_column_id: california_schools.schools.Magnet}
          - {attr_id: california_schools.schools.OpenDate, biz_name: OpenDate, physical_column_id: california_schools.schools.OpenDate}
          - {attr_id: california_schools.schools.ClosedDate, biz_name: ClosedDate, physical_column_id: california_schools.schools.ClosedDate}
          - {attr_id: california_schools.schools.StatusType, biz_name: StatusType, physical_column_id: california_schools.schools.StatusType}
          - {attr_id: california_schools.schools.GSoffered, biz_name: GSoffered, physical_column_id: california_schools.schools.GSoffered}
          - {attr_id: california_schools.schools.GSserved, biz_name: GSserved, physical_column_id: california_schools.schools.GSserved}
          - {attr_id: california_schools.schools.MailStreet, biz_name: MailStreet, physical_column_id: california_schools.schools.MailStreet}
          - {attr_id: california_schools.schools.AdmFName1, biz_name: AdmFName1, physical_column_id: california_schools.schools.AdmFName1}
          - {attr_id: california_schools.schools.AdmLName1, biz_name: AdmLName1, physical_column_id: california_schools.schools.AdmLName1}
          - {attr_id: california_schools.schools.AdmFName2, biz_name: AdmFName2, physical_column_id: california_schools.schools.AdmFName2}
          - {attr_id: california_schools.schools.AdmLName2, biz_name: AdmLName2, physical_column_id: california_schools.schools.AdmLName2}
          - {attr_id: california_schools.schools.AdmFName3, biz_name: AdmFName3, physical_column_id: california_schools.schools.AdmFName3}
          - {attr_id: california_schools.schools.AdmLName3, biz_name: AdmLName3, physical_column_id: california_schools.schools.AdmLName3}
          - {attr_id: california_schools.schools.AdmEmail1, biz_name: AdmEmail1, physical_column_id: california_schools.schools.AdmEmail1}
          - {attr_id: california_schools.schools.AdmEmail2, biz_name: AdmEmail2, physical_column_id: california_schools.schools.AdmEmail2}
          - {attr_id: california_schools.schools.longitude, biz_name: longitude, physical_column_id: california_schools.schools.longitude}
  - logical_entity_id: LOGICAL.SchoolPerformance
    biz_name: SchoolPerformance
    description: "SAT scores and FRPM statistics"
    public_attributes:
      - {attr_id: LOGICAL.SchoolPerformance.School, biz_name: School}
    physical_entities:
      - physical_entity_id: PHYSICAL.SATScore
        physical_table_name: satscores
        physical_table_id: california_schools.satscores
        A: {cardinality: "1:1", key: cds}
        R: null
        C: {LOGICAL.SchoolPerformance.School: california_schools.satscores.cds}
        S: "SAT scores"
        private_attributes:
          - {attr_id: california_schools.satscores.AvgScrMath, biz_name: AvgScrMath, physical_column_id: california_schools.satscores.AvgScrMath}
          - {attr_id: california_schools.satscores.AvgScrRead, biz_name: AvgScrRead, physical_column_id: california_schools.satscores.AvgScrRead}
          - {attr_id: california_schools.satscores.AvgScrWrite, biz_name: AvgScrWrite, physical_column_id: california_schools.satscores.AvgScrWrite}
          - {attr_id: california_schools.satscores.NumTstTakr, biz_name: NumTstTakr, physical_column_id: california_schools.satscores.NumTstTakr}
          - {attr_id: california_schools.satscores.NumGE1500, biz_name: NumGE1500, physical_column_id: california_schools.satscores.NumGE1500}
      - physical_entity_id: PHYSICAL.FRPM
        physical_table_name: frpm
        physical_table_id: california_schools.frpm
        A: {cardinality: "1:1", key: CDSCode}
        R: null
        C: {LOGICAL.SchoolPerformance.School: california_schools.frpm.CDSCode}
        S: "Free/reduced price meal statistics"
        private_attributes:
          - {attr_id: california_schools.frpm.`Enrollment (K-12)`, biz_name: Enrollment_K12, physical_column_id: california_schools.frpm.`Enrollment (K-12)`}
          - {attr_id: california_schools.frpm.`Enrollment (Ages 5-17)`, biz_name: Enrollment_5_17, physical_column_id: california_schools.frpm.`Enrollment (Ages 5-17)`}
          - {attr_id: california_schools.frpm.`Free Meal Count (K-12)`, biz_name: FreeMeal_K12, physical_column_id: california_schools.frpm.`Free Meal Count (K-12)`}
          - {attr_id: california_schools.frpm.`Free Meal Count (Ages 5-17)`, biz_name: FreeMeal_5_17, physical_column_id: california_schools.frpm.`Free Meal Count (Ages 5-17)`}
          - {attr_id: california_schools.frpm.`FRPM Count (K-12)`, biz_name: FRPM_K12, physical_column_id: california_schools.frpm.`FRPM Count (K-12)`}
          - {attr_id: california_schools.frpm.`FRPM Count (Ages 5-17)`, biz_name: FRPM_5_17, physical_column_id: california_schools.frpm.`FRPM Count (Ages 5-17)`}
          - {attr_id: california_schools.frpm.`NSLP Provision Status`, biz_name: NSLP_Status, physical_column_id: california_schools.frpm.`NSLP Provision Status`}
          - {attr_id: california_schools.frpm.`Charter Funding Type`, biz_name: CharterFundingType, physical_column_id: california_schools.frpm.`Charter Funding Type`}
          - {attr_id: california_schools.frpm.`District Name`, biz_name: DistrictName, physical_column_id: california_schools.frpm.`District Name`}
          - {attr_id: california_schools.frpm.`School Name`, biz_name: SchoolName, physical_column_id: california_schools.frpm.`School Name`}
          - {attr_id: california_schools.frpm.`School Type`, biz_name: SchoolType, physical_column_id: california_schools.frpm.`School Type`}
          - {attr_id: california_schools.frpm.`Academic Year`, biz_name: AcademicYear, physical_column_id: california_schools.frpm.`Academic Year`}
          - {attr_id: california_schools.frpm.`District Code`, biz_name: DistrictCode, physical_column_id: california_schools.frpm.`District Code`}
pas_relations:
  - relation_id: LOGICAL.School_TO_LOGICAL.SchoolPerformance
    relation_name: HasPerformance
    P: {forward: {verb: has, cardinality: '1:1'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: SchoolCode
    S: "1 school has 1 SAT record and 1 FRPM record"
