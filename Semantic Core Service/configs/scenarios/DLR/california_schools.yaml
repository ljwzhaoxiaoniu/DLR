      description: This field represents the 7-digit National Center for Educational Statistics (NCES) school district identification
        number. The first 2 digits identify the state and the last 5 digits identify the school district. Combined, they make
        a unique 7-digit ID for each school district.
    - attr_id: california_schools.schools.NCESSchool
