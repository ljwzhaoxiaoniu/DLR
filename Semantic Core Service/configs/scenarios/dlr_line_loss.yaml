# ============================================================
# DLR (Logical-Physical Dual Layer) — 电力线损分析场景
# ============================================================
# mapping_type: "dlr"
# 1 LE ≈ N PE (多视图聚合) + PAS 语义路由
# ============================================================

mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_line_loss
description: "DLR 范式 — 多视图语义模型：8LE 聚合 18PE，LE 稳定、PE 多对一"

databases:
  line_loss_db2: "sqlite:///storage/sqlite_dbs/line_loss_db2.db"

# ════════════════════════════════════════════════════════════
#  LE = 业务概念（稳定）  PE = 物理视图（多对一）
#  核心优势：一个 LE 聚合多张物理表，物理层变化不影响 LE 层
# ════════════════════════════════════════════════════════════
logical_entities:

  # ── 1. 台区 (2 PE) ──────────────────────────────────────
  - logical_entity_id: LOGICAL.台区
    biz_name: 台区
    description: "配网管理核心单元，承载设备归属、用户关系与线损考核的最小边界"
    public_attributes:
      - {attr_id: LOGICAL.台区.台区编号, biz_name: 台区编号}
      - {attr_id: LOGICAL.台区.台区名称, biz_name: 台区名称}
    physical_entities:
      - physical_entity_id: PHYSICAL.台区
        physical_table_name: 台区
        physical_table_id: line_loss_db2.台区
        A: {cardinality: "1:1", key: 台区编号}
        R: null
        C:
          LOGICAL.台区.台区编号: line_loss_db2.台区.台区编号
          LOGICAL.台区.台区名称: line_loss_db2.台区.台区名称
        S: "台区主档案"
        private_attributes:
          - {attr_id: line_loss_db2.台区.台区所属线路编号, biz_name: 所属线路编号, physical_column_id: line_loss_db2.台区.台区所属线路编号}
          - {attr_id: line_loss_db2.台区.台区考核户编号, biz_name: 考核户编号, physical_column_id: line_loss_db2.台区.台区考核户编号}
      - physical_entity_id: PHYSICAL.线路
        physical_table_name: 线路
        physical_table_id: line_loss_db2.线路
        A: {cardinality: "1:1", key: 线路编号}
        R: null
        C: {LOGICAL.台区.台区编号: line_loss_db2.线路.所属供电所编号}
        S: "线路维度 — 负荷割接排查中定位同线路台区"
        private_attributes:
          - {attr_id: line_loss_db2.线路.所属供电所编号, biz_name: 所属供电所编号, physical_column_id: line_loss_db2.线路.所属供电所编号}

  # ── 2. 变压器 (1 PE) ────────────────────────────────────
  - logical_entity_id: LOGICAL.变压器
    biz_name: 变压器
    description: "产生损耗的物理源头"
    public_attributes:
      - {attr_id: LOGICAL.变压器.变压器编号, biz_name: 变压器编号}
      - {attr_id: LOGICAL.变压器.额定容量, biz_name: 额定容量}
      - {attr_id: LOGICAL.变压器.运行状态, biz_name: 运行状态}
    physical_entities:
      - physical_entity_id: PHYSICAL.变压器
        physical_table_name: 变压器
        physical_table_id: line_loss_db2.变压器
        A: {cardinality: "1:1", key: 变压器编号}
        R: null
        C:
          LOGICAL.变压器.变压器编号: line_loss_db2.变压器.变压器编号
          LOGICAL.变压器.额定容量: line_loss_db2.变压器.变压器额定容量
          LOGICAL.变压器.运行状态: line_loss_db2.变压器.变压器运行状态
        S: "变压器是产生损耗的物理源头"
        private_attributes:
          - {attr_id: line_loss_db2.变压器.变压器名称, biz_name: 名称, physical_column_id: line_loss_db2.变压器.变压器名称}
          - {attr_id: line_loss_db2.变压器.变压器所属台区编号, biz_name: 所属台区编号, physical_column_id: line_loss_db2.变压器.变压器所属台区编号}
          - {attr_id: line_loss_db2.变压器.变压器经度, biz_name: 经度, physical_column_id: line_loss_db2.变压器.变压器经度}
          - {attr_id: line_loss_db2.变压器.变压器纬度, biz_name: 纬度, physical_column_id: line_loss_db2.变压器.变压器纬度}

  # ── 3. 线损 (5 PE — 多视图核心) ─────────────────────────
  - logical_entity_id: LOGICAL.线损
    biz_name: 线损
    description: "台区线损率及其分解维度：原始/组合/分摊/损失电量"
    public_attributes:
      - {attr_id: LOGICAL.线损.台区编号, biz_name: 台区编号}
      - {attr_id: LOGICAL.线损.统计日期, biz_name: 统计日期}
      - {attr_id: LOGICAL.线损.线损Key, biz_name: 线损Key, description: "子表关联键"}
    physical_entities:
      - physical_entity_id: PHYSICAL.线损记录
        physical_table_name: 线损记录
        physical_table_id: line_loss_db2.线损记录
        A: {cardinality: "N:1", key: 台区编号}
        R: "异常综合判定 = '不合格'"
        C: {LOGICAL.线损.台区编号: line_loss_db2.线损记录.线损台区编号, LOGICAL.线损.统计日期: line_loss_db2.线损记录.线损数据时间, LOGICAL.线损.线损Key: line_loss_db2.线损记录.线损Key}
        S: "主表 — 异常线损记录筛选"
        private_attributes:
          - {attr_id: line_loss_db2.线损记录.线损数据时间类型, biz_name: 时间类型, physical_column_id: line_loss_db2.线损记录.线损数据时间类型}
          - {attr_id: line_loss_db2.线损记录.线损数据时间, biz_name: 数据时间, physical_column_id: line_loss_db2.线损记录.线损数据时间}
          - {attr_id: line_loss_db2.线损记录.理论线损值_取值, biz_name: 理论线损值, physical_column_id: line_loss_db2.线损记录.理论线损值_取值}
          - {attr_id: line_loss_db2.线损记录.异常综合判定, biz_name: 异常判定, physical_column_id: line_loss_db2.线损记录.异常综合判定}
      - physical_entity_id: PHYSICAL.原始线损率
        physical_table_name: 原始线损率
        physical_table_id: line_loss_db2.原始线损率
        A: {cardinality: "N:1", key: 台区编号}
        R: null
        C: {LOGICAL.线损.线损Key: line_loss_db2.原始线损率.线损率关联线损Key}
        S: "输入/输出/损失电量数值"
        private_attributes:
          - {attr_id: line_loss_db2.原始线损率.线损率_百分比, biz_name: 线损率, physical_column_id: line_loss_db2.原始线损率.线损率_百分比}
          - {attr_id: line_loss_db2.原始线损率.线损率输入电量_kWh, biz_name: 输入电量, physical_column_id: line_loss_db2.原始线损率.线损率输入电量_kWh}
          - {attr_id: line_loss_db2.原始线损率.线损率输出电量_kWh, biz_name: 输出电量, physical_column_id: line_loss_db2.原始线损率.线损率输出电量_kWh}
          - {attr_id: line_loss_db2.原始线损率.线损率损失电量_kWh, biz_name: 损失电量, physical_column_id: line_loss_db2.原始线损率.线损率损失电量_kWh}
      - physical_entity_id: PHYSICAL.组合线损率
        physical_table_name: 组合线损率
        physical_table_id: line_loss_db2.组合线损率
        A: {cardinality: "N:1", key: 台区编号}
        R: null
        C: {LOGICAL.线损.线损Key: line_loss_db2.组合线损率.线损率关联线损Key}
        S: "多维度聚合线损率"
        private_attributes:
          - {attr_id: line_loss_db2.组合线损率.线损率_百分比, biz_name: 组合线损率, physical_column_id: line_loss_db2.组合线损率.线损率_百分比}
          - {attr_id: line_loss_db2.组合线损率.线损率输入电量_kWh, biz_name: 输入电量, physical_column_id: line_loss_db2.组合线损率.线损率输入电量_kWh}
          - {attr_id: line_loss_db2.组合线损率.线损率输出电量_kWh, biz_name: 输出电量, physical_column_id: line_loss_db2.组合线损率.线损率输出电量_kWh}
          - {attr_id: line_loss_db2.组合线损率.线损率损失电量_kWh, biz_name: 损失电量, physical_column_id: line_loss_db2.组合线损率.线损率损失电量_kWh}
      - physical_entity_id: PHYSICAL.组合分摊线损率
        physical_table_name: 组合分摊线损率
        physical_table_id: line_loss_db2.组合分摊线损率
        A: {cardinality: "N:1", key: 台区编号}
        R: null
        C: {LOGICAL.线损.线损Key: line_loss_db2.组合分摊线损率.线损率关联线损Key}
        S: "分摊后线损率"
        private_attributes:
          - {attr_id: line_loss_db2.组合分摊线损率.线损率_百分比, biz_name: 分摊线损率, physical_column_id: line_loss_db2.组合分摊线损率.线损率_百分比}
          - {attr_id: line_loss_db2.组合分摊线损率.线损率输入电量_kWh, biz_name: 输入电量, physical_column_id: line_loss_db2.组合分摊线损率.线损率输入电量_kWh}
          - {attr_id: line_loss_db2.组合分摊线损率.线损率输出电量_kWh, biz_name: 输出电量, physical_column_id: line_loss_db2.组合分摊线损率.线损率输出电量_kWh}
          - {attr_id: line_loss_db2.组合分摊线损率.线损率损失电量_kWh, biz_name: 损失电量, physical_column_id: line_loss_db2.组合分摊线损率.线损率损失电量_kWh}
      - physical_entity_id: PHYSICAL.损失电量
        physical_table_name: 损失电量
        physical_table_id: line_loss_db2.损失电量
        A: {cardinality: "N:1", key: 台区编号}
        R: null
        C: {LOGICAL.线损.线损Key: line_loss_db2.损失电量.损失电量关联线损Key}
        S: "配变空载损耗、考核损失电量"
        private_attributes:
          - {attr_id: line_loss_db2.损失电量.考核损失电量, biz_name: 考核损失电量, physical_column_id: line_loss_db2.损失电量.考核损失电量}
          - {attr_id: line_loss_db2.损失电量.配变空载损耗, biz_name: 空载损耗, physical_column_id: line_loss_db2.损失电量.配变空载损耗}
          - {attr_id: line_loss_db2.损失电量.损失电量阈值_取值, biz_name: 损失阈值, physical_column_id: line_loss_db2.损失电量.损失电量阈值_取值}
          - {attr_id: line_loss_db2.损失电量.损失电量状态, biz_name: 状态, physical_column_id: line_loss_db2.损失电量.损失电量状态}

  # ── 4. 计量点 (3 PE — 多视图核心) ──────────────────────
  - logical_entity_id: LOGICAL.计量点
    biz_name: 计量点
    description: "一个计量点概念 + 三类物理视图：考核户/用户/负荷"
    public_attributes:
      - {attr_id: LOGICAL.计量点.计量点编号, biz_name: 计量点编号}
      - {attr_id: LOGICAL.计量点.台区编号, biz_name: 所属台区编号}
      - {attr_id: LOGICAL.计量点.用户编号, biz_name: 所属用户编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.低压用户计量点
        physical_table_name: 低压用户计量点
        physical_table_id: line_loss_db2.低压用户计量点
        A: {cardinality: "1:1", key: 计量点编号}
        R: null
        C:
          LOGICAL.计量点.计量点编号: line_loss_db2.低压用户计量点.计量点编号
          LOGICAL.计量点.台区编号: line_loss_db2.低压用户计量点.计量点所属台区编号
          LOGICAL.计量点.用户编号: line_loss_db2.低压用户计量点.计量点所属用户编号
        S: "低压用户表计 — 线损分析主入口"
        private_attributes:
          - {attr_id: line_loss_db2.低压用户计量点.计量点名称, biz_name: 计量点名称, physical_column_id: line_loss_db2.低压用户计量点.计量点名称}
      - physical_entity_id: PHYSICAL.台区考核户计量点
        physical_table_name: 台区考核户计量点
        physical_table_id: line_loss_db2.台区考核户计量点
        A: {cardinality: "1:1", key: 计量点编号}
        R: null
        C:
          LOGICAL.计量点.计量点编号: line_loss_db2.台区考核户计量点.计量点编号
          LOGICAL.计量点.台区编号: line_loss_db2.台区考核户计量点.计量点所属台区编号
        S: "台区考核户 — 供电量校核"
        private_attributes:
          - {attr_id: line_loss_db2.台区考核户计量点.综合倍率, biz_name: 综合倍率, physical_column_id: line_loss_db2.台区考核户计量点.综合倍率}
      - physical_entity_id: PHYSICAL.计量点负荷记录
        physical_table_name: 计量点负荷记录
        physical_table_id: line_loss_db2.计量点负荷记录
        A: {cardinality: "N:1", key: 负荷记录所属计量点编号}
        R: null
        C: {LOGICAL.计量点.计量点编号: line_loss_db2.计量点负荷记录.负荷记录所属计量点编号}
        S: "电压电流负荷 — 失压失流诊断数据源"
        private_attributes:
          - {attr_id: line_loss_db2.计量点负荷记录.A相电压, biz_name: A相电压, physical_column_id: line_loss_db2.计量点负荷记录.A相电压}
          - {attr_id: line_loss_db2.计量点负荷记录.B相电压, biz_name: B相电压, physical_column_id: line_loss_db2.计量点负荷记录.B相电压}
          - {attr_id: line_loss_db2.计量点负荷记录.C相电压, biz_name: C相电压, physical_column_id: line_loss_db2.计量点负荷记录.C相电压}

  # ── 5. 电量 (1 PE) ──────────────────────────────────────
  - logical_entity_id: LOGICAL.电量
    biz_name: 电量
    description: "月度结算电量，用于抄表不同期诊断"
    public_attributes:
      - {attr_id: LOGICAL.电量.所属计量点编号, biz_name: 所属计量点编号}
      - {attr_id: LOGICAL.电量.电量数据时间, biz_name: 电量数据时间}
    physical_entities:
      - physical_entity_id: PHYSICAL.月电量记录
        physical_table_name: 月电量记录
        physical_table_id: line_loss_db2.月电量记录
        A: {cardinality: "N:1", key: 电量所属计量点编号}
        R: null
        C: {LOGICAL.电量.所属计量点编号: line_loss_db2.月电量记录.电量所属计量点编号}
        S: "月度电量结算 — 表码/有功/是否平移，不同期诊断"
        private_attributes:
          - {attr_id: line_loss_db2.月电量记录.计量点电量数据时间, biz_name: 电量时间, physical_column_id: line_loss_db2.月电量记录.计量点电量数据时间}
          - {attr_id: line_loss_db2.月电量记录.计量点电量有功总, biz_name: 有功总, physical_column_id: line_loss_db2.月电量记录.计量点电量有功总}
          - {attr_id: line_loss_db2.月电量记录.表码起始时间, biz_name: 表码起始, physical_column_id: line_loss_db2.月电量记录.表码起始时间}
          - {attr_id: line_loss_db2.月电量记录.表码终止时间, biz_name: 表码终止, physical_column_id: line_loss_db2.月电量记录.表码终止时间}
          - {attr_id: line_loss_db2.月电量记录.换表次数, biz_name: 换表次数, physical_column_id: line_loss_db2.月电量记录.换表次数}
          - {attr_id: line_loss_db2.月电量记录.是否平移, biz_name: 是否平移, physical_column_id: line_loss_db2.月电量记录.是否平移}

  # ── 6. 用户 (2 PE) ──────────────────────────────────────
  - logical_entity_id: LOGICAL.用户
    biz_name: 用户
    description: "电力用户概念：档案 + 违窃电记录"
    public_attributes:
      - {attr_id: LOGICAL.用户.用户编号, biz_name: 用户编号}
      - {attr_id: LOGICAL.用户.用户名称, biz_name: 用户名称}
    physical_entities:
      - physical_entity_id: PHYSICAL.用户
        physical_table_name: 用户
        physical_table_id: line_loss_db2.用户
        A: {cardinality: "1:1", key: 用户编号}
        R: null
        C: {LOGICAL.用户.用户编号: line_loss_db2.用户.用户编号}
        S: "用户档案"
        private_attributes:
          - {attr_id: line_loss_db2.用户.用户名称, biz_name: 用户名称, physical_column_id: line_loss_db2.用户.用户名称}
      - physical_entity_id: PHYSICAL.违窃电工单
        physical_table_name: 违窃电工单
        physical_table_id: line_loss_db2.违窃电工单
        A: {cardinality: "1:1", key: 违窃电用户编号}
        R: null
        C: {LOGICAL.用户.用户编号: line_loss_db2.违窃电工单.违窃电用户编号}
        S: "违窃电检查工单 — 用户级违窃电视图"
        private_attributes:
          - {attr_id: line_loss_db2.违窃电工单.违窃电计量点编号, biz_name: 计量点编号, physical_column_id: line_loss_db2.违窃电工单.违窃电计量点编号}
          - {attr_id: line_loss_db2.违窃电工单.违窃电工单关闭时间, biz_name: 关闭时间, physical_column_id: line_loss_db2.违窃电工单.违窃电工单关闭时间}

  # ── 7. 户变关系调整 (1 PE) ──────────────────────────────
  - logical_entity_id: LOGICAL.户变关系调整
    biz_name: 户变关系调整
    description: "用户与台区关系变更记录"
    public_attributes:
      - {attr_id: LOGICAL.户变关系调整.调整用户编号, biz_name: 调整用户编号}
      - {attr_id: LOGICAL.户变关系调整.调整前台区编号, biz_name: 调整前台区编号}
      - {attr_id: LOGICAL.户变关系调整.调整后台区编号, biz_name: 调整后台区编号}
      - {attr_id: LOGICAL.户变关系调整.调整时间, biz_name: 调整时间}
    physical_entities:
      - physical_entity_id: PHYSICAL.户变关系调整日志
        physical_table_name: 户变关系调整日志
        physical_table_id: line_loss_db2.户变关系调整日志
