mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_student_club
description: "DLR 范式 — 学生社团场景：按需字段，8 PE 聚合 7 LE，活动财务多视图解耦"
databases:
  student_club: "sqlite:///MINIDEV_sqlite/dev_databases/student_club/student_club.sqlite"

logical_entities:
  # ── 1. 社团成员 ──
  - logical_entity_id: LOGICAL.社团成员
    biz_name: 社团成员
    description: "学生社团的成员主体"
    public_attributes:
      - {attr_id: LOGICAL.社团成员.成员编号, biz_name: 成员编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.成员表
        physical_table_name: member
        physical_table_id: student_club.member
        A: {cardinality: "1:1", key: member_id}
        R: null
        C:
          LOGICAL.社团成员.成员编号: student_club.member.member_id
        S: "成员主数据表"
        private_attributes:
          - {attr_id: student_club.member.first_name, biz_name: 名, physical_column_id: student_club.member.first_name}
          - {attr_id: student_club.member.last_name, biz_name: 姓, physical_column_id: student_club.member.last_name}
          - {attr_id: student_club.member.position, biz_name: 职务, physical_column_id: student_club.member.position}
          - {attr_id: student_club.member.t_shirt_size, biz_name: T恤尺码, physical_column_id: student_club.member.t_shirt_size}
          - {attr_id: student_club.member.phone, biz_name: 电话, physical_column_id: student_club.member.phone}
          - {attr_id: student_club.member.zip, biz_name: 邮编, physical_column_id: student_club.member.zip}
          - {attr_id: student_club.member.link_to_major, biz_name: 专业ID, physical_column_id: student_club.member.link_to_major}

  # ── 2. 社团活动 ──
  - logical_entity_id: LOGICAL.社团活动
    biz_name: 社团活动
    description: "社团举办的各类活动"
    public_attributes:
      - {attr_id: LOGICAL.社团活动.活动编号, biz_name: 活动编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.活动表
        physical_table_name: event
        physical_table_id: student_club.event
        A: {cardinality: "1:1", key: event_id}
        R: null
        C:
          LOGICAL.社团活动.活动编号: student_club.event.event_id
        S: "活动记录表"
        private_attributes:
          - {attr_id: student_club.event.event_name, biz_name: 活动名称, physical_column_id: student_club.event.event_name}
          - {attr_id: student_club.event.event_date, biz_name: 活动日期, physical_column_id: student_club.event.event_date}
          - {attr_id: student_club.event.type, biz_name: 类型, physical_column_id: student_club.event.type}
          - {attr_id: student_club.event.location, biz_name: 地点, physical_column_id: student_club.event.location}
          - {attr_id: student_club.event.status, biz_name: 状态, physical_column_id: student_club.event.status}

  # ── 3. 活动出勤 ──
  - logical_entity_id: LOGICAL.活动出勤
    biz_name: 活动出勤
    description: "成员参加活动的出勤记录"
    public_attributes:
      - {attr_id: LOGICAL.活动出勤.关联活动, biz_name: 关联活动}
      - {attr_id: LOGICAL.活动出勤.关联成员, biz_name: 关联成员}
    physical_entities:
      - physical_entity_id: PHYSICAL.出勤表
        physical_table_name: attendance
        physical_table_id: student_club.attendance
        A: {cardinality: "N:1", key: link_to_event}
        R: null
        C:
          LOGICAL.活动出勤.关联活动: student_club.attendance.link_to_event
          LOGICAL.活动出勤.关联成员: student_club.attendance.link_to_member
        S: "成员-活动多对多关联表"
        private_attributes: []

  # ── 4. 活动财务 (2 PE — 多视图) ──
  - logical_entity_id: LOGICAL.活动财务
    biz_name: 活动财务
    description: "活动预算与实际支出双视图"
    public_attributes:
      - {attr_id: LOGICAL.活动财务.财务编号, biz_name: 财务编号}
      - {attr_id: LOGICAL.活动财务.关联活动, biz_name: 关联活动}
    physical_entities:
      - physical_entity_id: PHYSICAL.预算表
        physical_table_name: budget
        physical_table_id: student_club.budget
        A: {cardinality: "N:1", key: link_to_event}
        R: null
        C:
          LOGICAL.活动财务.财务编号: student_club.budget.budget_id
          LOGICAL.活动财务.关联活动: student_club.budget.link_to_event
        S: "活动预算 — 预算额度与已花费"
        private_attributes:
          - {attr_id: student_club.budget.amount, biz_name: 预算额度, physical_column_id: student_club.budget.amount}
          - {attr_id: student_club.budget.spent, biz_name: 已花费, physical_column_id: student_club.budget.spent}
          - {attr_id: student_club.budget.category, biz_name: 预算分类, physical_column_id: student_club.budget.category}
          - {attr_id: student_club.budget.remaining, biz_name: 剩余, physical_column_id: student_club.budget.remaining}
          - {attr_id: student_club.budget.event_status, biz_name: 事件状态, physical_column_id: student_club.budget.event_status}
      - physical_entity_id: PHYSICAL.支出表
        physical_table_name: expense
        physical_table_id: student_club.expense
        A: {cardinality: "N:1", key: link_to_budget}
        R: null
        C:
          LOGICAL.活动财务.财务编号: student_club.expense.link_to_budget
        S: "实际支出明细"
        private_attributes:
          - {attr_id: student_club.expense.expense_description, biz_name: 支出描述, physical_column_id: student_club.expense.expense_description}
          - {attr_id: student_club.expense.cost, biz_name: 费用, physical_column_id: student_club.expense.cost}
          - {attr_id: student_club.expense.expense_date, biz_name: 支出日期, physical_column_id: student_club.expense.expense_date}
          - {attr_id: student_club.expense.approved, biz_name: 是否批准, physical_column_id: student_club.expense.approved}
          - {attr_id: student_club.expense.link_to_member, biz_name: 经手成员, physical_column_id: student_club.expense.link_to_member}

  # ── 5. 资金收入 ──
  - logical_entity_id: LOGICAL.资金收入
    biz_name: 资金收入
    description: "社团收到的资金（会费、募捐等）"
    public_attributes:
      - {attr_id: LOGICAL.资金收入.收入编号, biz_name: 收入编号}
      - {attr_id: LOGICAL.资金收入.关联成员, biz_name: 关联成员}
    physical_entities:
      - physical_entity_id: PHYSICAL.收入表
        physical_table_name: income
        physical_table_id: student_club.income
        A: {cardinality: "N:1", key: link_to_member}
        R: null
        C:
          LOGICAL.资金收入.收入编号: student_club.income.income_id
          LOGICAL.资金收入.关联成员: student_club.income.link_to_member
        S: "收入记录表"
        private_attributes:
          - {attr_id: student_club.income.amount, biz_name: 金额, physical_column_id: student_club.income.amount}
          - {attr_id: student_club.income.source, biz_name: 来源, physical_column_id: student_club.income.source}
          - {attr_id: student_club.income.date_received, biz_name: 收到日期, physical_column_id: student_club.income.date_received}
          - {attr_id: student_club.income.notes, biz_name: 备注, physical_column_id: student_club.income.notes}

  # ── 6. 专业 ──
  - logical_entity_id: LOGICAL.专业
    biz_name: 专业
    description: "成员所属的学术专业"
    public_attributes:
      - {attr_id: LOGICAL.专业.专业编号, biz_name: 专业编号}
    physical_entities:
      - physical_entity_id: PHYSICAL.专业表
        physical_table_name: major
        physical_table_id: student_club.major
        A: {cardinality: "1:1", key: major_id}
        R: null
        C:
          LOGICAL.专业.专业编号: student_club.major.major_id
        S: "专业字典表"
        private_attributes:
          - {attr_id: student_club.major.major_name, biz_name: 专业名称, physical_column_id: student_club.major.major_name}
          - {attr_id: student_club.major.department, biz_name: 院系, physical_column_id: student_club.major.department}
          - {attr_id: student_club.major.college, biz_name: 学院, physical_column_id: student_club.major.college}

  # ── 7. 邮编区域 ──
  - logical_entity_id: LOGICAL.邮编区域
    biz_name: 邮编区域
    description: "邮编对应的地理信息"
    public_attributes:
      - {attr_id: LOGICAL.邮编区域.邮编, biz_name: 邮编}
    physical_entities:
      - physical_entity_id: PHYSICAL.邮编表
        physical_table_name: zip_code
        physical_table_id: student_club.zip_code
        A: {cardinality: "1:1", key: zip_code}
        R: null
        C:
          LOGICAL.邮编区域.邮编: student_club.zip_code.zip_code
        S: "邮编地理字典"
        private_attributes:
          - {attr_id: student_club.zip_code.city, biz_name: 城市, physical_column_id: student_club.zip_code.city}
          - {attr_id: student_club.zip_code.state, biz_name: 州, physical_column_id: student_club.zip_code.state}
          - {attr_id: student_club.zip_code.county, biz_name: 县, physical_column_id: student_club.zip_code.county}

pas_relations:
  - relation_id: LOGICAL.社团成员_TO_LOGICAL.社团活动
    relation_name: 活动参与
    P: {forward: {verb: 参与, cardinality: '1:N'}, reverse: {verb: 涉及, cardinality: '1:N'}}
    A: 成员编号
    S: "成员通过出勤表关联活动"
  - relation_id: LOGICAL.社团活动_TO_LOGICAL.活动财务
    relation_name: 预算分配
    P: {forward: {verb: 拥有, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联活动
    S: "1个活动拥有N项预算/支出"
  - relation_id: LOGICAL.社团成员_TO_LOGICAL.资金收入
    relation_name: 资金收取
    P: {forward: {verb: 收取, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 关联成员
    S: "1个成员收取N笔资金"
  - relation_id: LOGICAL.社团成员_TO_LOGICAL.专业
    relation_name: 专业归属
    P: {forward: {verb: 属于, cardinality: 'N:1'}, reverse: {verb: 包含, cardinality: '1:N'}}
    A: 专业编号
    S: "成员属于某个专业"
  - relation_id: LOGICAL.社团成员_TO_LOGICAL.邮编区域
    relation_name: 地区归属
    P: {forward: {verb: 居住于, cardinality: 'N:1'}, reverse: {verb: 包含, cardinality: '1:N'}}
    A: 邮编
    S: "成员居住于某邮编区域"
