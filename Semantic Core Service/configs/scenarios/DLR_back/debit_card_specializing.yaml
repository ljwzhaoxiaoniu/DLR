mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_debit_card
description: "DLR 范式 — 借记卡消费场景：按需字段配置，5 PE 聚合 4 LE"
databases:
  debit_card_specializing: "sqlite:///MINIDEV_sqlite/dev_databases/debit_card_specializing/debit_card_specializing.sqlite"

logical_entities:
  # ── 1. 客户 (1 PE) ──
  - logical_entity_id: LOGICAL.客户
    biz_name: 客户
    description: "借记卡客户的身份与分类"
    public_attributes:
      - {attr_id: LOGICAL.客户.客户编号, biz_name: 客户编号}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.客户表
        physical_table_name: customers
        physical_table_id: debit_card_specializing.customers
        A: {cardinality: "1:1", key: CustomerID}
        R: null
        C:
          LOGICAL.客户.客户编号: debit_card_specializing.customers.CustomerID
        S: "客户主数据表"
        private_attributes:
          - {attr_id: debit_card_specializing.customers.Segment, biz_name: 客户类型, physical_column_id: debit_card_specializing.customers.Segment}
          - {attr_id: debit_card_specializing.customers.Currency, biz_name: 结算货币, physical_column_id: debit_card_specializing.customers.Currency}

  # ── 2. 消费行为 (2 PE — 多视图) ──
  - logical_entity_id: LOGICAL.消费行为
    biz_name: 消费行为
    description: "客户消费记录：月度账单 + 交易明细"
    public_attributes:
      - {attr_id: LOGICAL.消费行为.所属客户, biz_name: 所属客户}  # JOIN key
      - {attr_id: LOGICAL.消费行为.日期, biz_name: 日期}  # JOIN key (Date)
    physical_entities:
      - physical_entity_id: PHYSICAL.月度账单
        physical_table_name: yearmonth
        physical_table_id: debit_card_specializing.yearmonth
        A: {cardinality: "N:1", key: CustomerID}
        R: null
        C:
          LOGICAL.消费行为.所属客户: debit_card_specializing.yearmonth.CustomerID
          LOGICAL.消费行为.日期: debit_card_specializing.yearmonth.Date
        S: "月度燃气消费汇总"
        private_attributes:
          - {attr_id: debit_card_specializing.yearmonth.Consumption, biz_name: 消费量, physical_column_id: debit_card_specializing.yearmonth.Consumption}
      - physical_entity_id: PHYSICAL.交易明细
        physical_table_name: transactions_1k
        physical_table_id: debit_card_specializing.transactions_1k
        A: {cardinality: "N:1", key: CustomerID}
        R: null
        C:
          LOGICAL.消费行为.所属客户: debit_card_specializing.transactions_1k.CustomerID
          LOGICAL.消费行为.日期: debit_card_specializing.transactions_1k.Date
        S: "加油站单笔交易明细"
        private_attributes:
          - {attr_id: debit_card_specializing.transactions_1k.TransactionID, biz_name: 交易ID, physical_column_id: debit_card_specializing.transactions_1k.TransactionID}
          - {attr_id: debit_card_specializing.transactions_1k.GasStationID, biz_name: 加油站ID, physical_column_id: debit_card_specializing.transactions_1k.GasStationID}
          - {attr_id: debit_card_specializing.transactions_1k.ProductID, biz_name: 商品ID, physical_column_id: debit_card_specializing.transactions_1k.ProductID}
          - {attr_id: debit_card_specializing.transactions_1k.Time, biz_name: 时间, physical_column_id: debit_card_specializing.transactions_1k.Time}
          - {attr_id: debit_card_specializing.transactions_1k.Price, biz_name: 价格, physical_column_id: debit_card_specializing.transactions_1k.Price}
          - {attr_id: debit_card_specializing.transactions_1k.Amount, biz_name: 数量, physical_column_id: debit_card_specializing.transactions_1k.Amount}

  # ── 3. 加油站 (1 PE) ──
  - logical_entity_id: LOGICAL.加油站
    biz_name: 加油站
    description: "提供加油服务的站点"
    public_attributes:
      - {attr_id: LOGICAL.加油站.站点编号, biz_name: 站点编号}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.加油站表
        physical_table_name: gasstations
        physical_table_id: debit_card_specializing.gasstations
        A: {cardinality: "1:1", key: GasStationID}
        R: null
        C:
          LOGICAL.加油站.站点编号: debit_card_specializing.gasstations.GasStationID
        S: "加油站信息"
        private_attributes:
          - {attr_id: debit_card_specializing.gasstations.Country, biz_name: 国家, physical_column_id: debit_card_specializing.gasstations.Country}
          - {attr_id: debit_card_specializing.gasstations.Segment, biz_name: 站点类型, physical_column_id: debit_card_specializing.gasstations.Segment}
          - {attr_id: debit_card_specializing.gasstations.ChainID, biz_name: 连锁编号, physical_column_id: debit_card_specializing.gasstations.ChainID}

  # ── 4. 商品 (1 PE) ──
  - logical_entity_id: LOGICAL.商品
    biz_name: 商品
    description: "加油站售卖的商品"
    public_attributes:
      - {attr_id: LOGICAL.商品.商品编号, biz_name: 商品编号}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.商品表
        physical_table_name: products
        physical_table_id: debit_card_specializing.products
        A: {cardinality: "1:1", key: ProductID}
        R: null
        C:
          LOGICAL.商品.商品编号: debit_card_specializing.products.ProductID
        S: "商品字典"
        private_attributes:
          - {attr_id: debit_card_specializing.products.Description, biz_name: 商品描述, physical_column_id: debit_card_specializing.products.Description}

pas_relations:
  - relation_id: LOGICAL.客户_TO_LOGICAL.消费行为
    relation_name: 消费产生
    P: {forward: {verb: 产生, cardinality: '1:N'}, reverse: {verb: 归属, cardinality: '1:1'}}
    A: 客户编号
    S: "1个客户产生N条消费记录"
  - relation_id: LOGICAL.加油站_TO_LOGICAL.消费行为
    relation_name: 交易发生
    P: {forward: {verb: 发生, cardinality: '1:N'}, reverse: {verb: 发生于, cardinality: '1:1'}}
    A: 站点编号
    S: "1个加油站发生N笔交易"
  - relation_id: LOGICAL.商品_TO_LOGICAL.消费行为
    relation_name: 商品消费
    P: {forward: {verb: 被购买, cardinality: '1:N'}, reverse: {verb: 购买了, cardinality: '1:1'}}
    A: 商品编号
    S: "1种商品被N笔交易购买"
