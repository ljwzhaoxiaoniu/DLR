          - {attr_id: formula_1.results.position, biz_name: finishing position, physical_column_id: formula_1.results.position}
          - {attr_id: formula_1.results.positionOrder, biz_name: finishing order, physical_column_id: formula_1.results.positionOrder}
          - {attr_id: formula_1.results.points, biz_name: points, physical_column_id: formula_1.results.points}
          - {attr_id: formula_1.results.laps, biz_name: laps, physical_column_id: formula_1.results.laps}
          - {attr_id: formula_1.results.time, biz_name: time, physical_column_id: formula_1.results.time}
