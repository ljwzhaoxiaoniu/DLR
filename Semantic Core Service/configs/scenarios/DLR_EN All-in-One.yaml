          - {attr_id: formula_1.lapTimes.position, biz_name: position, physical_column_id: formula_1.lapTimes.position}
          - {attr_id: formula_1.lapTimes.time, biz_name: lap time, physical_column_id: formula_1.lapTimes.time}
          - {attr_id: formula_1.lapTimes.milliseconds, biz_name: milliseconds, physical_column_id: formula_1.lapTimes.milliseconds}

  # ── 5. driver_standings_table (1 PE) ──
  - logical_entity_id: LOGICAL.driver_standings_table
    biz_name: driver_standings_table
    public_attributes:
      - {attr_id: LOGICAL.driver_standings_table.associated driver, biz_name: associated driver}
