mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_debit_card
description: "DLR paradigm — debit-card consumption scene：on-demand field configuration，5 PE aggregating 4 LE"
databases:
  debit_card_specializing: "sqlite:///MINIDEV_sqlite/dev_databases/debit_card_specializing/debit_card_specializing.sqlite"

logical_entities:
  # ── 1. customer (1 PE) ──
  - logical_entity_id: LOGICAL.customer
    biz_name: customer
    description: "debit card customer identity and classification"
    public_attributes:
      - {attr_id: LOGICAL.customer.client number, biz_name: client number}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.customer_table
        physical_table_name: customers
        physical_table_id: debit_card_specializing.customers
        A: {cardinality: "1:1", key: CustomerID}
        R: null
        C:
          LOGICAL.customer.client number: debit_card_specializing.customers.CustomerID
        S: "customers: primary customer master data"
        private_attributes:
          - {attr_id: debit_card_specializing.customers.Segment, biz_name: client segment, physical_column_id: debit_card_specializing.customers.Segment}
          - {attr_id: debit_card_specializing.customers.Currency, biz_name: settlement currency, physical_column_id: debit_card_specializing.customers.Currency}

  # ── 2. consumption behavior (2 PE — multi-view) ──
  - logical_entity_id: LOGICAL.consumption behavior
    biz_name: consumption behavior
    description: "customer consumption records：monthly bill + transaction line"
    public_attributes:
      - {attr_id: LOGICAL.consumption behavior.associated customer, biz_name: associated customer}  # JOIN key
      - {attr_id: LOGICAL.consumption behavior.date, biz_name: date}  # JOIN key (Date)
    physical_entities:
      - physical_entity_id: PHYSICAL.monthly bill
        physical_table_name: yearmonth
        physical_table_id: debit_card_specializing.yearmonth
        A: {cardinality: "N:1", key: CustomerID}
        R: null
        C:
          LOGICAL.consumption behavior.associated customer: debit_card_specializing.yearmonth.CustomerID
          LOGICAL.consumption behavior.date: debit_card_specializing.yearmonth.Date
        S: "monthly gas consumption summary"
        private_attributes:
          - {attr_id: debit_card_specializing.yearmonth.Consumption, biz_name: consumption amount, physical_column_id: debit_card_specializing.yearmonth.Consumption}
      - physical_entity_id: PHYSICAL.transaction line
        physical_table_name: transactions_1k
        physical_table_id: debit_card_specializing.transactions_1k
        A: {cardinality: "N:1", key: CustomerID}
        R: null
        C:
          LOGICAL.consumption behavior.associated customer: debit_card_specializing.transactions_1k.CustomerID
          LOGICAL.consumption behavior.date: debit_card_specializing.transactions_1k.Date
        S: "gas station: individual transaction line items"
        private_attributes:
          - {attr_id: debit_card_specializing.transactions_1k.TransactionID, biz_name: transactionID, physical_column_id: debit_card_specializing.transactions_1k.TransactionID}
          - {attr_id: debit_card_specializing.transactions_1k.GasStationID, biz_name: gas stationID, physical_column_id: debit_card_specializing.transactions_1k.GasStationID}
          - {attr_id: debit_card_specializing.transactions_1k.ProductID, biz_name: productID, physical_column_id: debit_card_specializing.transactions_1k.ProductID}
          - {attr_id: debit_card_specializing.transactions_1k.Time, biz_name: time, physical_column_id: debit_card_specializing.transactions_1k.Time}
          - {attr_id: debit_card_specializing.transactions_1k.Price, biz_name: price, physical_column_id: debit_card_specializing.transactions_1k.Price}
          - {attr_id: debit_card_specializing.transactions_1k.Amount, biz_name: quantity, physical_column_id: debit_card_specializing.transactions_1k.Amount}

  # ── 3. gas station (1 PE) ──
  - logical_entity_id: LOGICAL.gas station
    biz_name: gas station
    description: "sites providing fuel service"
    public_attributes:
      - {attr_id: LOGICAL.gas station.station number, biz_name: station number}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.gas_station_table
        physical_table_name: gasstations
        physical_table_id: debit_card_specializing.gasstations
        A: {cardinality: "1:1", key: GasStationID}
        R: null
        C:
          LOGICAL.gas station.station number: debit_card_specializing.gasstations.GasStationID
        S: "gas station information"
        private_attributes:
          - {attr_id: debit_card_specializing.gasstations.Country, biz_name: country, physical_column_id: debit_card_specializing.gasstations.Country}
          - {attr_id: debit_card_specializing.gasstations.Segment, biz_name: station type, physical_column_id: debit_card_specializing.gasstations.Segment}
          - {attr_id: debit_card_specializing.gasstations.ChainID, biz_name: chain number, physical_column_id: debit_card_specializing.gasstations.ChainID}

  # ── 4. product (1 PE) ──
  - logical_entity_id: LOGICAL.product
    biz_name: product
    description: "products sold at gas stations"
    public_attributes:
      - {attr_id: LOGICAL.product.product number, biz_name: product number}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.product_table
        physical_table_name: products
        physical_table_id: debit_card_specializing.products
        A: {cardinality: "1:1", key: ProductID}
        R: null
        C:
          LOGICAL.product.product number: debit_card_specializing.products.ProductID
        S: "product dictionary"
        private_attributes:
          - {attr_id: debit_card_specializing.products.Description, biz_name: product description, physical_column_id: debit_card_specializing.products.Description}

pas_relations:
  - relation_id: LOGICAL.customer_TO_LOGICAL.consumption behavior
    relation_name: consumption_generation
    P: {forward: {verb: generates, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: client number
    S: "1customer generatesNconsumption record"
  - relation_id: LOGICAL.gas station_TO_LOGICAL.consumption behavior
    relation_name: transaction_occurs
    P: {forward: {verb: occurs, cardinality: '1:N'}, reverse: {verb: occurs at, cardinality: '1:1'}}
    A: station number
    S: "1gas station recordsNtransaction"
  - relation_id: LOGICAL.product_TO_LOGICAL.consumption behavior
    relation_name: product_consumption
    P: {forward: {verb: is purchased by, cardinality: '1:N'}, reverse: {verb: purchased, cardinality: '1:1'}}
    A: product number
    S: "1product isNtransaction purchasing"
---
mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_california_schools
description: "DLR paradigm — California schools scene：on-demand fields，3 PE aggregating 2 LE，school-performance multi-view decoupling"
databases:
  california_schools: "sqlite:///MINIDEV_sqlite/dev_databases/california_schools/california_schools.sqlite"

logical_entities:
  # ── 1. school ──
  - logical_entity_id: LOGICAL.school
    biz_name: school
    description: "California schools basic profile"
    public_attributes:
      - {attr_id: LOGICAL.school.school code, biz_name: school code}
    physical_entities:
      - physical_entity_id: PHYSICAL.school_table
        physical_table_name: schools
        physical_table_id: california_schools.schools
        A: {cardinality: "1:1", key: CDSCode}
        R: null
        C:
          LOGICAL.school.school code: california_schools.schools.CDSCode
        S: "school profile master table"
        private_attributes:
          - {attr_id: california_schools.schools.School, biz_name: school name, physical_column_id: california_schools.schools.School}
          - {attr_id: california_schools.schools.City, biz_name: city, physical_column_id: california_schools.schools.City}
          - {attr_id: california_schools.schools.County, biz_name: county, physical_column_id: california_schools.schools.County}
          - {attr_id: california_schools.schools.District, biz_name: district, physical_column_id: california_schools.schools.District}
          - {attr_id: california_schools.schools.Street, biz_name: street, physical_column_id: california_schools.schools.Street}
          - {attr_id: california_schools.schools.State, biz_name: state, physical_column_id: california_schools.schools.State}
          - {attr_id: california_schools.schools.Zip, biz_name: zip code, physical_column_id: california_schools.schools.Zip}
          - {attr_id: california_schools.schools.Phone, biz_name: phone, physical_column_id: california_schools.schools.Phone}
          - {attr_id: california_schools.schools.Virtual, biz_name: is virtual, physical_column_id: california_schools.schools.Virtual}
          - {attr_id: california_schools.schools.Charter, biz_name: is charter, physical_column_id: california_schools.schools.Charter}
          - {attr_id: california_schools.schools.CharterNum, biz_name: charter number, physical_column_id: california_schools.schools.CharterNum}
          - {attr_id: california_schools.schools.FundingType, biz_name: funding type, physical_column_id: california_schools.schools.FundingType}
          - {attr_id: california_schools.schools.DOC, biz_name: DOC, physical_column_id: california_schools.schools.DOC}
          - {attr_id: california_schools.schools.SOC, biz_name: SOC, physical_column_id: california_schools.schools.SOC}
          - {attr_id: california_schools.schools.EdOpsCode, biz_name: EdOpsCode, physical_column_id: california_schools.schools.EdOpsCode}
          - {attr_id: california_schools.schools.Magnet, biz_name: magnet program, physical_column_id: california_schools.schools.Magnet}
          - {attr_id: california_schools.schools.OpenDate, biz_name: school opened date, physical_column_id: california_schools.schools.OpenDate}
          - {attr_id: california_schools.schools.ClosedDate, biz_name: closed date, physical_column_id: california_schools.schools.ClosedDate}
          - {attr_id: california_schools.schools.StatusType, biz_name: status type, physical_column_id: california_schools.schools.StatusType}
          - {attr_id: california_schools.schools.GSoffered, biz_name: grades offered, physical_column_id: california_schools.schools.GSoffered}
          - {attr_id: california_schools.schools.GSserved, biz_name: grades served, physical_column_id: california_schools.schools.GSserved}
          - {attr_id: california_schools.schools.MailStreet, biz_name: mailing street, physical_column_id: california_schools.schools.MailStreet}
          - {attr_id: california_schools.schools.AdmFName1, biz_name: admin first name1, physical_column_id: california_schools.schools.AdmFName1}
          - {attr_id: california_schools.schools.AdmLName1, biz_name: admin last name1, physical_column_id: california_schools.schools.AdmLName1}
          - {attr_id: california_schools.schools.AdmFName2, biz_name: admin first name2, physical_column_id: california_schools.schools.AdmFName2}
          - {attr_id: california_schools.schools.AdmLName2, biz_name: admin last name2, physical_column_id: california_schools.schools.AdmLName2}
          - {attr_id: california_schools.schools.AdmFName3, biz_name: admin first name3, physical_column_id: california_schools.schools.AdmFName3}
          - {attr_id: california_schools.schools.AdmLName3, biz_name: admin last name3, physical_column_id: california_schools.schools.AdmLName3}
          - {attr_id: california_schools.schools.AdmEmail1, biz_name: admin email1, physical_column_id: california_schools.schools.AdmEmail1}
          - {attr_id: california_schools.schools.AdmEmail2, biz_name: admin email2, physical_column_id: california_schools.schools.AdmEmail2}
          - {attr_id: california_schools.schools.longitude, biz_name: longitude, physical_column_id: california_schools.schools.longitude}

  # ── 2. school performance (2 PE — multi-view core) ──
  - logical_entity_id: LOGICAL.school performance
    biz_name: school performance
    description: "school academic achievement and subsidy dual view：SATscore+free/reduced-price meal subsidy"
    public_attributes:
      - {attr_id: LOGICAL.school performance.associated school, biz_name: associated school}
    physical_entities:
      - physical_entity_id: PHYSICAL.SATsatscore_table
        physical_table_name: satscores
        physical_table_id: california_schools.satscores
        A: {cardinality: "1:1", key: cds}
        R: null
        C:
          LOGICAL.school performance.associated school: california_schools.satscores.cds
        S: "SATscore summary — math/reading/writing average"
        private_attributes:
          - {attr_id: california_schools.satscores.AvgScrMath, biz_name: average math score, physical_column_id: california_schools.satscores.AvgScrMath}
          - {attr_id: california_schools.satscores.AvgScrRead, biz_name: average reading score, physical_column_id: california_schools.satscores.AvgScrRead}
          - {attr_id: california_schools.satscores.AvgScrWrite, biz_name: average writing score, physical_column_id: california_schools.satscores.AvgScrWrite}
          - {attr_id: california_schools.satscores.NumTstTakr, biz_name: test takers, physical_column_id: california_schools.satscores.NumTstTakr}
          - {attr_id: california_schools.satscores.NumGE1500, biz_name: ≥1500count, physical_column_id: california_schools.satscores.NumGE1500}
      - physical_entity_id: PHYSICAL.frpm_table
        physical_table_name: frpm
        physical_table_id: california_schools.frpm
        A: {cardinality: "1:1", key: CDSCode}
        R: null
        C:
          LOGICAL.school performance.associated school: california_schools.frpm.CDSCode
        S: "free/FRPM statistics — enrollment and subsidized count"
        private_attributes:
          - {attr_id: california_schools.frpm.`Enrollment (K-12)`, biz_name: K-12enrollment, physical_column_id: california_schools.frpm.`Enrollment (K-12)`}
          - {attr_id: california_schools.frpm.`Enrollment (Ages 5-17)`, biz_name: 5-17age enrollment, physical_column_id: california_schools.frpm.`Enrollment (Ages 5-17)`}
          - {attr_id: california_schools.frpm.`Free Meal Count (K-12)`, biz_name: K-12free meal count, physical_column_id: california_schools.frpm.`Free Meal Count (K-12)`}
          - {attr_id: california_schools.frpm.`Free Meal Count (Ages 5-17)`, biz_name: 5-17age free meal count, physical_column_id: california_schools.frpm.`Free Meal Count (Ages 5-17)`}
          - {attr_id: california_schools.frpm.`FRPM Count (K-12)`, biz_name: K-12 FRPMcount, physical_column_id: california_schools.frpm.`FRPM Count (K-12)`}
          - {attr_id: california_schools.frpm.`FRPM Count (Ages 5-17)`, biz_name: 5-17-year-oldFRPMcount, physical_column_id: california_schools.frpm.`FRPM Count (Ages 5-17)`}
          - {attr_id: california_schools.frpm.`NSLP Provision Status`, biz_name: NSLPstatus, physical_column_id: california_schools.frpm.`NSLP Provision Status`}
          - {attr_id: california_schools.frpm.`Charter Funding Type`, biz_name: charter funding type, physical_column_id: california_schools.frpm.`Charter Funding Type`}
          - {attr_id: california_schools.frpm.`District Name`, biz_name: district name, physical_column_id: california_schools.frpm.`District Name`}
          - {attr_id: california_schools.frpm.`School Name`, biz_name: school name, physical_column_id: california_schools.frpm.`School Name`}
          - {attr_id: california_schools.frpm.`School Type`, biz_name: school type, physical_column_id: california_schools.frpm.`School Type`}
          - {attr_id: california_schools.frpm.`Academic Year`, biz_name: school year, physical_column_id: california_schools.frpm.`Academic Year`}
          - {attr_id: california_schools.frpm.`District Code`, biz_name: district code, physical_column_id: california_schools.frpm.`District Code`}

pas_relations:
  - relation_id: LOGICAL.school_TO_LOGICAL.school performance
    relation_name: performance_yielded
    P: {forward: {verb: yielded by, cardinality: '1:1'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: school code
    S: "1school corresponds to1entrySATscore + 1subsidy statistic"
---
mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_card_games
description: "DLR paradigm — card game scene：on-demand fields，6 PE aggregating 4 LE，card-expansion multi-view decoupling"
databases:
  card_games: "sqlite:///MINIDEV_sqlite/dev_databases/card_games/card_games.sqlite"

logical_entities:
  # ── 1. card ──
  - logical_entity_id: LOGICAL.card
    biz_name: card
    description: "individual card entity in card game"
    public_attributes:
      - {attr_id: LOGICAL.card.card number, biz_name: card number}
    physical_entities:
      - physical_entity_id: PHYSICAL.card_table
        physical_table_name: cards
        physical_table_id: card_games.cards
        A: {cardinality: "1:1", key: uuid}
        R: null
        C:
          LOGICAL.card.card number: card_games.cards.uuid
        S: "card attribute table"
        private_attributes:
          - {attr_id: card_games.cards.id, biz_name: cardID, physical_column_id: card_games.cards.id}
          - {attr_id: card_games.cards.name, biz_name: card name, physical_column_id: card_games.cards.name}
          - {attr_id: card_games.cards.setCode, biz_name: set code, physical_column_id: card_games.cards.setCode}
          - {attr_id: card_games.cards.borderColor, biz_name: border color, physical_column_id: card_games.cards.borderColor}
          - {attr_id: card_games.cards.rarity, biz_name: rarity, physical_column_id: card_games.cards.rarity}
          - {attr_id: card_games.cards.convertedManaCost, biz_name: mana cost, physical_column_id: card_games.cards.convertedManaCost}
          - {attr_id: card_games.cards.power, biz_name: power, physical_column_id: card_games.cards.power}
          - {attr_id: card_games.cards.artist, biz_name: artist, physical_column_id: card_games.cards.artist}
          - {attr_id: card_games.cards.frameVersion, biz_name: border version, physical_column_id: card_games.cards.frameVersion}
          - {attr_id: card_games.cards.layout, biz_name: layout, physical_column_id: card_games.cards.layout}
          - {attr_id: card_games.cards.types, biz_name: type, physical_column_id: card_games.cards.types}
          - {attr_id: card_games.cards.originalType, biz_name: original type, physical_column_id: card_games.cards.originalType}
          - {attr_id: card_games.cards.colors, biz_name: color, physical_column_id: card_games.cards.colors}
          - {attr_id: card_games.cards.subtypes, biz_name: subtype, physical_column_id: card_games.cards.subtypes}
          - {attr_id: card_games.cards.supertypes, biz_name: supertype, physical_column_id: card_games.cards.supertypes}
          - {attr_id: card_games.cards.hasContentWarning, biz_name: content warning, physical_column_id: card_games.cards.hasContentWarning}
          - {attr_id: card_games.cards.isPromo, biz_name: is promo, physical_column_id: card_games.cards.isPromo}
          - {attr_id: card_games.cards.isStorySpotlight, biz_name: story spotlight, physical_column_id: card_games.cards.isStorySpotlight}
          - {attr_id: card_games.cards.isTextless, biz_name: is textless, physical_column_id: card_games.cards.isTextless}
          - {attr_id: card_games.cards.edhrecRank, biz_name: EDHRecranking, physical_column_id: card_games.cards.edhrecRank}
          - {attr_id: card_games.cards.availability, biz_name: availability, physical_column_id: card_games.cards.availability}
          - {attr_id: card_games.cards.cardKingdomFoilId, biz_name: FoilID, physical_column_id: card_games.cards.cardKingdomFoilId}
          - {attr_id: card_games.cards.cardKingdomId, biz_name: KingdomID, physical_column_id: card_games.cards.cardKingdomId}
          - {attr_id: card_games.cards.side, biz_name: face, physical_column_id: card_games.cards.side}
          - {attr_id: card_games.cards.duelDeck, biz_name: duel deck, physical_column_id: card_games.cards.duelDeck}

  # ── 2. cardexpansion_info (3 PE — multi-view core) ──
  - logical_entity_id: LOGICAL.cardexpansion_info
    biz_name: cardexpansion_info
    description: "card rules and legalities、legality、foreign language translation"
    public_attributes:
      - {attr_id: LOGICAL.cardexpansion_info.linked tocard, biz_name: linked tocard}
    physical_entities:
      - physical_entity_id: PHYSICAL.legality_table
        physical_table_name: legalities
        physical_table_id: card_games.legalities
        A: {cardinality: "N:1", key: uuid}
        R: null
        C:
          LOGICAL.cardexpansion_info.linked tocard: card_games.legalities.uuid
        S: "card legality by format"
        private_attributes:
          - {attr_id: card_games.legalities.format, biz_name: format, physical_column_id: card_games.legalities.format}
          - {attr_id: card_games.legalities.status, biz_name: status, physical_column_id: card_games.legalities.status}
      - physical_entity_id: PHYSICAL.ruling_table
        physical_table_name: rulings
        physical_table_id: card_games.rulings
        A: {cardinality: "N:1", key: uuid}
        R: null
        C:
          LOGICAL.cardexpansion_info.linked tocard: card_games.rulings.uuid
        S: "card rulings text"
        private_attributes:
          - {attr_id: card_games.rulings.text, biz_name: ruling text, physical_column_id: card_games.rulings.text}
      - physical_entity_id: PHYSICAL.foreign_data_table
        physical_table_name: foreign_data
        physical_table_id: card_games.foreign_data
        A: {cardinality: "N:1", key: uuid}
        R: null
        C:
          LOGICAL.cardexpansion_info.linked tocard: card_games.foreign_data.uuid
        S: "card foreign translation version"
        private_attributes:
          - {attr_id: card_games.foreign_data.name, biz_name: foreign name, physical_column_id: card_games.foreign_data.name}
          - {attr_id: card_games.foreign_data.language, biz_name: language, physical_column_id: card_games.foreign_data.language}
          - {attr_id: card_games.foreign_data.flavorText, biz_name: flavor text, physical_column_id: card_games.foreign_data.flavorText}
          - {attr_id: card_games.foreign_data.multiverseid, biz_name: multiverse ID, physical_column_id: card_games.foreign_data.multiverseid}

  # ── 3. card set ──
  - logical_entity_id: LOGICAL.card set
    biz_name: card set
    description: "card expansion or set"
    public_attributes:
      - {attr_id: LOGICAL.card set.set number, biz_name: set number}
    physical_entities:
      - physical_entity_id: PHYSICAL.set_table
        physical_table_name: sets
        physical_table_id: card_games.sets
        A: {cardinality: "1:1", key: code}
        R: null
        C:
          LOGICAL.card set.set number: card_games.sets.code
        S: "set information"
        private_attributes:
          - {attr_id: card_games.sets.name, biz_name: set name, physical_column_id: card_games.sets.name}
          - {attr_id: card_games.sets.block, biz_name: legal in environment, physical_column_id: card_games.sets.block}
          - {attr_id: card_games.sets.baseSetSize, biz_name: base card count, physical_column_id: card_games.sets.baseSetSize}
          - {attr_id: card_games.sets.mcmName, biz_name: MCMname, physical_column_id: card_games.sets.mcmName}
          - {attr_id: card_games.sets.mtgoCode, biz_name: MTGOcode, physical_column_id: card_games.sets.mtgoCode}
          - {attr_id: card_games.sets.isForeignOnly, biz_name: overseas only, physical_column_id: card_games.sets.isForeignOnly}

  # ── 4. set translation ──
  - logical_entity_id: LOGICAL.set translation
    biz_name: set translation
    description: "card set multilingual translations"
    public_attributes:
      - {attr_id: LOGICAL.set translation.associated set, biz_name: associated set}
