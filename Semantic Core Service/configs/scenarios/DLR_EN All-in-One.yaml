      - {attr_id: LOGICAL.driver.driver number, biz_name: driver number}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.driver_table
        physical_table_name: drivers
        physical_table_id: formula_1.drivers
        A: {cardinality: "1:1", key: driverId}
        R: null
        C:
          LOGICAL.driver.driver number: formula_1.drivers.driverId
        S: "driver master data"
        private_attributes:
          - {attr_id: formula_1.drivers.driverRef, biz_name: referencedname, physical_column_id: formula_1.drivers.driverRef}
          - {attr_id: formula_1.drivers.nationality, biz_name: nationality, physical_column_id: formula_1.drivers.nationality}
          - {attr_id: formula_1.drivers.forename, biz_name: name, physical_column_id: formula_1.drivers.forename}
          - {attr_id: formula_1.drivers.surname, biz_name: surname, physical_column_id: formula_1.drivers.surname}
          - {attr_id: formula_1.drivers.dob, biz_name: birthdate, physical_column_id: formula_1.drivers.dob}
