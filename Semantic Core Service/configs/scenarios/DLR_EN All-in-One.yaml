          - {attr_id: formula_1.races.time, biz_name: time, physical_column_id: formula_1.races.time}

  # ── 4. driver_event_data (3 PE — DLR multi-view core) ──
  - logical_entity_id: LOGICAL.driver_event_data
    biz_name: driver_event_data
    description: "driver performance at each race：qualifying+race results+lap speed"
    public_attributes:
      - {attr_id: LOGICAL.driver_event_data.associated driver, biz_name: associated driver}  # JOIN key
