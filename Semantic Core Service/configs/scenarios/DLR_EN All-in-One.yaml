pas_relations:
  - relation_id: LOGICAL.customer_TO_LOGICAL.account association
    relation_name: account_holds
    P: {forward: {verb: holds, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: associated client
    S: "1customer holds multiple account authorizations"
  - relation_id: LOGICAL.bank account_TO_LOGICAL.account association
    relation_name: account_authorizes
    P: {forward: {verb: owns, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: associated account
    S: "1account has multiple authorizations（including credit card）"
  - relation_id: LOGICAL.bank account_TO_LOGICAL.loan
    relation_name: loan_disbursed
    P: {forward: {verb: disbursed, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: associated account
    S: "1account linked to multiple loans"
  - relation_id: LOGICAL.bank account_TO_LOGICAL.transaction history
    relation_name: transaction_generated
    P: {forward: {verb: generates, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: associated account
    S: "1account generatesNtransaction"
  - relation_id: LOGICAL.bank account_TO_LOGICAL.permanent order
    relation_name: order_linked
    P: {forward: {verb: owns, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: associated account
    S: "1account ownsNpermanent order"
  - relation_id: LOGICAL.district_TO_LOGICAL.bank account
    relation_name: district_belongs_to
    P: {forward: {verb: includes, cardinality: '1:N'}, reverse: {verb: located_in, cardinality: 'N:1'}}
    A: district number
    S: "1district containsNaccount"
---
mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_formula_1
description: "DLR paradigm — F1F1 racing scene：on-demand fields，11 PE aggregating 8 LE，driver/constructor-event multi-view decoupling"
databases:
  formula_1: "sqlite:///MINIDEV_sqlite/dev_databases/formula_1/formula_1.sqlite"

logical_entities:
  # ── 1. driver (1 PE) ──
  - logical_entity_id: LOGICAL.driver
    biz_name: driver
