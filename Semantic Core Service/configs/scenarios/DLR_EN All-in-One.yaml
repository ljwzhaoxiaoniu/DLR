pas_relations:
  - relation_id: LOGICAL.patient_TO_LOGICAL.lab test
    relation_name: lab_test_ordered
    P: {forward: {verb: generates, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: patient number
    S: "1patient generatedNlab test record"
  - relation_id: LOGICAL.patient_TO_LOGICAL.clinical_performed
    relation_name: clinical_performed
    P: {forward: {verb: received, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: patient number
    S: "1patient receivedNclinical exam"
---
mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_toxicology
description: "DLR paradigm — toxicology scene：on-demand fields，4 PE aggregating 3 LE，chemical bond+bond-connection multi-view decoupling"
databases:
  toxicology: "sqlite:///MINIDEV_sqlite/dev_databases/toxicology/toxicology.sqlite"

logical_entities:
  # ── 1. molecule ──
  - logical_entity_id: LOGICAL.molecule
    biz_name: molecule
    description: "chemical molecules and carcinogenicity labels"
    public_attributes:
      - {attr_id: LOGICAL.molecule.molecule number, biz_name: molecule number}
    physical_entities:
      - physical_entity_id: PHYSICAL.molecule_table
        physical_table_name: molecule
        physical_table_id: toxicology.molecule
        A: {cardinality: "1:1", key: molecule_id}
        R: null
        C:
          LOGICAL.molecule.molecule number: toxicology.molecule.molecule_id
        S: "molecule master table"
        private_attributes:
          - {attr_id: toxicology.molecule.label, biz_name: carcinogenicity label, physical_column_id: toxicology.molecule.label}

  # ── 2. atom ──
  - logical_entity_id: LOGICAL.atom
    biz_name: atom
    description: "atom information constituting molecules"
    public_attributes:
      - {attr_id: LOGICAL.atom.atom number, biz_name: atom number}
      - {attr_id: LOGICAL.atom.associated molecule, biz_name: associated molecule}
    physical_entities:
      - physical_entity_id: PHYSICAL.atom_table
        physical_table_name: atom
        physical_table_id: toxicology.atom
        A: {cardinality: "N:1", key: molecule_id}
        R: null
        C:
          LOGICAL.atom.atom number: toxicology.atom.atom_id
          LOGICAL.atom.associated molecule: toxicology.atom.molecule_id
        S: "atom composition table"
        private_attributes:
          - {attr_id: toxicology.atom.element, biz_name: element type, physical_column_id: toxicology.atom.element}

  # ── 3. chemical bond (2 PE — multi-view core) ──
  - logical_entity_id: LOGICAL.chemical bond
    biz_name: chemical bond
    description: "molecular bonds and their connections，master table+association_table dual view"
    public_attributes:
      - {attr_id: LOGICAL.chemical bond.bond number, biz_name: bond number}
      - {attr_id: LOGICAL.chemical bond.associated molecule, biz_name: associated molecule}
    physical_entities:
      - physical_entity_id: PHYSICAL.bond_table
        physical_table_name: bond
        physical_table_id: toxicology.bond
        A: {cardinality: "N:1", key: molecule_id}
        R: null
        C:
          LOGICAL.chemical bond.bond number: toxicology.bond.bond_id
          LOGICAL.chemical bond.associated molecule: toxicology.bond.molecule_id
        S: "chemical bond master table — bond type"
        private_attributes:
          - {attr_id: toxicology.bond.bond_type, biz_name: bond type, physical_column_id: toxicology.bond.bond_type}
      - physical_entity_id: PHYSICAL.connected_table
        physical_table_name: connected
        physical_table_id: toxicology.connected
        A: {cardinality: "N:1", key: bond_id}
        R: null
        C:
          LOGICAL.chemical bond.bond number: toxicology.connected.bond_id
        S: "bond-atom-bond connection relationship — which two atoms are connected by which bond"
        private_attributes:
          - {attr_id: toxicology.connected.atom_id, biz_name: atom1, physical_column_id: toxicology.connected.atom_id}
          - {attr_id: toxicology.connected.atom_id2, biz_name: atom2, physical_column_id: toxicology.connected.atom_id2}

pas_relations:
  - relation_id: LOGICAL.molecule_TO_LOGICAL.atom
    relation_name: molecule_composed_of
    P: {forward: {verb: includes, cardinality: '1:N'}, reverse: {verb: composed of, cardinality: '1:1'}}
    A: associated molecule
    S: "1molecule composed ofNatom constitutes"
  - relation_id: LOGICAL.molecule_TO_LOGICAL.chemical bond
    relation_name: chemical bond
    P: {forward: {verb: includes, cardinality: '1:N'}, reverse: {verb: belongs to, cardinality: '1:1'}}
    A: associated molecule
    S: "1molecule containsNchemical bond"
