          - {attr_id: formula_1.results.fastestLapTime, biz_name: fastest lap time, physical_column_id: formula_1.results.fastestLapTime}
          - {attr_id: formula_1.results.fastestLapSpeed, biz_name: fastest lap speed, physical_column_id: formula_1.results.fastestLapSpeed}
          - {attr_id: formula_1.results.rank, biz_name: ranking, physical_column_id: formula_1.results.rank}
          - {attr_id: formula_1.results.statusId, biz_name: statusID, physical_column_id: formula_1.results.statusId}
      - physical_entity_id: PHYSICAL.lap_time_table
        physical_table_name: lapTimes
        physical_table_id: formula_1.lapTimes
        A: {cardinality: "N:1", key: raceId}
        R: null
