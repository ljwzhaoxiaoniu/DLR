mapping_type: "dlr"
version: "2.0"
scenario_name: dlr_financial
description: "DLR paradigm - Financial scenario: on-demand fields, 7 PEs aggregated into 7 LEs"
databases:
  financial: "sqlite:///MINIDEV_sqlite/dev_databases/financial/financial.sqlite"
logical_entities:
  - logical_entity_id: LOGICAL.Account
    biz_name: Account
    public_attributes:
      - {attr_id: LOGICAL.Account.AccountID, biz_name: AccountID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Account
        physical_table_name: account
        physical_table_id: financial.account
        A: {cardinality: "1:1", key: account_id}
        R: null
        C: LOGICAL.Account.AccountID: financial.account.account_id
        S: "Account master"
        private_attributes:
          - {attr_id: financial.account.frequency, biz_name: frequency, physical_column_id: financial.account.frequency}
          - {attr_id: financial.account.district_id, biz_name: district_id, physical_column_id: financial.account.district_id}
          - {attr_id: financial.account.date, biz_name: date, physical_column_id: financial.account.date}
  - logical_entity_id: LOGICAL.Client
    biz_name: Client
    public_attributes:
      - {attr_id: LOGICAL.Client.ClientID, biz_name: ClientID}
    physical_entities:
      - physical_entity_id: PHYSICAL.Client
        physical_table_name: client
        physical_table_id: financial.client
        A: {cardinality: "1:1", key: client_id}
        R: null
        C: LOGICAL.Client.ClientID: financial.client.client_id
        S: "Client master"
        private_attributes:
          - {attr_id: financial.client.gender, biz_name: gender, physical_column_id: financial.client.gender}
          - {attr_id: financial.client.birth_date, biz_name: birth_date, physical_column_id: financial.client.birth_date}
          - {attr_id: financial.client.district_id, biz_name: district_id, physical_column_id: financial.client.district_id}
  - logical_entity_id: LOGICAL.AccountRelation
    biz_name: AccountRelation
    description: "Client-account authorization + credit cards"
    public_attributes:
      - {attr_id: LOGICAL.AccountRelation.Account, biz_name: Account}
      - {attr_id: LOGICAL.AccountRelation.Client, biz_name: Client}
    physical_entities:
      - physical_entity_id: PHYSICAL.Disp
        physical_table_name: disp
        physical_table_id: financial.disp
        A: {cardinality: "N:1", key: account_id}
        R: null
        C: {LOGICAL.AccountRelation.Account: financial.disp.account_id, LOGICAL.AccountRelation.Client: financial.disp.client_id}
        S: "Client-account authorization"
        private_attributes:
          - {attr_id: financial.disp.disp_id, biz_name: disp_id, physical_column_id: financial.disp.disp_id}
          - {attr_id: financial.disp.type, biz_name: type, physical_column_id: financial.disp.type}
      - physical_entity_id: PHYSICAL.Card
        physical_table_name: card
        physical_table_id: financial.card
        A: {cardinality: "N:1", key: disp_id}
        R: null
        C: LOGICAL.AccountRelation.Account: financial.card.disp_id
        S: "Credit card information"
