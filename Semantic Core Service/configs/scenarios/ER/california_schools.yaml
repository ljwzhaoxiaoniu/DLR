  - attr_id: california_schools.schools.Virtual
    biz_name: Virtual
    description: 'This field identifies the type of virtual instruction offered by
      the school. Virtual instruction is instruction in which students and teachers
      are separated by time and/or location, and interaction occurs via computers
      and/or telecommunications technologies.. The field is coded as follows:


      ·       F = Exclusively Virtual – The school has no physical building where
      students meet with each other or with teachers, all instruction is virtual.


      ·       V = Primarily Virtual – The school focuses on a systematic program of
      virtual instruction but includes some physical meetings among students or with
      teachers.


      ·       C = Primarily Classroom – The school offers virtual courses but virtual
      instruction is not the primary means of instruction.


      ·       N = Not Virtual – The school does not offer any virtual instruction.


      ·       P = Partial Virtual – The school offers some, but not all, instruction
      through virtual instruction. Note: This value was retired and replaced with
      the Primarily Virtual and Primarily Classroom values beginning with the 2016–17
      school year.'
    physical_column_id: california_schools.schools.Virtual
    data_type: text
  - attr_id: california_schools.schools.Magnet
    biz_name: Magnet
    description: 'This field identifies whether a school is a magnet school and/or
      provides a magnet program.. The field is coded as follows:


      ·       1 = Magnet - The school is a magnet school and/or offers a magnet program.


      ·       0 = Not Magnet - The school is not a magnet school and/or does not offer
      a magnet program.


      commonsense evidence:


      Note: Preschools and adult education centers do not contain a magnet school
      indicator.'
    physical_column_id: california_schools.schools.Magnet
    data_type: integer
  - attr_id: california_schools.schools.Latitude
