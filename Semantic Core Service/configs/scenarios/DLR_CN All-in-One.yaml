          - {attr_id: formula_1.qualifying.q2, biz_name: Q2, physical_column_id: formula_1.qualifying.q2}
          - {attr_id: formula_1.qualifying.q3, biz_name: Q3, physical_column_id: formula_1.qualifying.q3}
      - physical_entity_id: PHYSICAL.正赛结果表
        physical_table_name: results
        physical_table_id: formula_1.results
        A: {cardinality: "N:1", key: raceId}
        R: null
        C:
          LOGICAL.车手赛事数据.所属车手: formula_1.results.driverId
          LOGICAL.车手赛事数据.所属赛事: formula_1.results.raceId
        S: "正赛结果"
        private_attributes:
          - {attr_id: formula_1.results.resultId, biz_name: 结果ID, physical_column_id: formula_1.results.resultId}
          - {attr_id: formula_1.results.constructorId, biz_name: 车队ID, physical_column_id: formula_1.results.constructorId}
          - {attr_id: formula_1.results.number, biz_name: 车号, physical_column_id: formula_1.results.number}
          - {attr_id: formula_1.results.grid, biz_name: 发车位, physical_column_id: formula_1.results.grid}
          - {attr_id: formula_1.results.position, biz_name: 名次, physical_column_id: formula_1.results.position}
