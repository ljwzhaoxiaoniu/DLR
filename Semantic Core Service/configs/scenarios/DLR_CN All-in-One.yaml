    physical_entities:
      - physical_entity_id: PHYSICAL.车手表
        physical_table_name: drivers
        physical_table_id: formula_1.drivers
        A: {cardinality: "1:1", key: driverId}
        R: null
        C:
          LOGICAL.车手.车手编号: formula_1.drivers.driverId
        S: "车手主数据"
        private_attributes:
          - {attr_id: formula_1.drivers.driverRef, biz_name: 引用名, physical_column_id: formula_1.drivers.driverRef}
          - {attr_id: formula_1.drivers.nationality, biz_name: 国籍, physical_column_id: formula_1.drivers.nationality}
          - {attr_id: formula_1.drivers.forename, biz_name: 名, physical_column_id: formula_1.drivers.forename}
          - {attr_id: formula_1.drivers.surname, biz_name: 姓, physical_column_id: formula_1.drivers.surname}
