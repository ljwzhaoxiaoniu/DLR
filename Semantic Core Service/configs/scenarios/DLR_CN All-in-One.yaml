          - {attr_id: formula_1.drivers.number, biz_name: 车号, physical_column_id: formula_1.drivers.number}
          - {attr_id: formula_1.drivers.code, biz_name: 代码, physical_column_id: formula_1.drivers.code}
          - {attr_id: formula_1.drivers.url, biz_name: 网页, physical_column_id: formula_1.drivers.url}

  # ── 2. 赛道 (1 PE) ──
  - logical_entity_id: LOGICAL.赛道
    biz_name: 赛道
    public_attributes:
      - {attr_id: LOGICAL.赛道.赛道编号, biz_name: 赛道编号}  # JOIN key
    physical_entities:
      - physical_entity_id: PHYSICAL.赛道表
        physical_table_name: circuits
        physical_table_id: formula_1.circuits
        A: {cardinality: "1:1", key: circuitId}
