<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDF R2RML 映射可视化</title>
    <link rel="icon" href="data:;base64,=">
    <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .container { display: flex; height: 100vh; }

        /* ---------- left panel ---------- */
        .left-panel {
            width: 300px; min-width: 260px;
            background: #f5f5f5; border-right: 1px solid #ddd;
            display: flex; flex-direction: column;
        }
        .left-header {
            padding: 12px 16px; background: white;
            border-bottom: 1px solid #ddd;
            display: flex; justify-content: space-between; align-items: center;
        }
        .left-header h1 { font-size: 16px; color: #333; }
        #searchBox {
            padding: 8px 12px; border-bottom: 1px solid #ddd;
            background: white;
        }
        #searchBox input {
            width: 100%; padding: 6px 10px; font-size: 13px;
            border: 1px solid #ccc; border-radius: 4px; outline: none;
        }
        #searchBox input:focus { border-color: #4ECDC4; }
        .entity-list { flex: 1; overflow-y: auto; padding: 8px; }
        .entity-item {
            padding: 10px 12px; margin-bottom: 4px; border-radius: 4px;
            cursor: pointer; font-size: 13px;
            background: white; border: 1px solid #eee;
        }
        .entity-item:hover { background: #e3f2fd; border-color: #4ECDC4; }
        .entity-item.active { background: #5c3d99; color: white; font-weight: bold; }
        .entity-item .badge {
            display: inline-block; font-size: 10px; padding: 1px 5px;
            border-radius: 3px; margin-right: 4px; vertical-align: middle;
            background: #e0e0e0; color: #555;
        }
        .entity-item.active .badge { background: white; color: #5c3d99; }
        .relation-item {
            padding: 8px 12px; margin-bottom: 3px; border-radius: 4px;
            font-size: 12px; background: #fff8e1; border: 1px solid #ffe082;
            cursor: pointer;
        }
        .relation-item:hover { background: #ffecb3; border-color: #ffca28; }
        .relation-item.active { background: #ffca28; color: #333; font-weight: bold; }
        .section-hint {
            padding: 6px 12px; font-size: 11px; color: #999;
            text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px;
        }

        /* ---------- right panel ---------- */
        .right-panel { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header {
            padding: 12px 16px; background: white;
            border-bottom: 1px solid #ddd;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 16px; color: #333; }
        .stats { font-size: 12px; color: #666; }
        .legend {
            display: flex; gap: 14px; font-size: 11px; color: #666;
            padding: 6px 16px; background: #fafafa; border-bottom: 1px solid #eee;
        }
        .legend span { display: flex; align-items: center; gap: 4px; }
        .legend i {
            display: inline-block; width: 12px; height: 12px;
            border-radius: 3px; vertical-align: middle;
        }
        .legend .lg-table  { background: #FFB5BA; border-radius: 3px; }
        .legend .lg-col    { background: #64B5F6; border-radius: 50%; width:10px;height:10px; }
        .legend .lg-join   { background: #FFDAB9; border-radius: 3px; }
        .legend .toggle-fields { margin-left: auto; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
        #network { flex: 1; background: #fafafa; min-height: 400px; }

        /* ---------- attribute panel ---------- */
        .attr-panel {
            position: absolute; right: 0; top: 0; width: 300px; height: 100%;
            background: white; border-left: 1px solid #ddd;
            padding: 16px; overflow-y: auto; display: none; z-index: 100;
        }
        .attr-panel h3 { margin-bottom: 16px; color: #333;
            padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .attr-item { margin-bottom: 12px; }
        .attr-label { font-size: 12px; color: #666; margin-bottom: 4px; }
        .attr-value { font-size: 13px; color: #333; word-break: break-all; }
        .close-btn {
            position: absolute; right: 16px; top: 16px; cursor: pointer;
            color: #999; font-size: 18px;
        }
        .close-btn:hover { color: #333; }
        .mapping-info { background: #e8f5e9; padding: 8px; border-radius: 4px;
            margin-top: 8px; font-size: 12px; }
        .mapping-info .m-field { margin-bottom: 4px; }
        .mapping-info .m-label { color: #2e7d32; font-weight: 600; }
        .join-info { background: #fff3e0; padding: 8px; border-radius: 4px;
            margin-top: 8px; font-size: 12px; }
        .join-info .j-field { margin-bottom: 4px; }
        .join-info .j-label { color: #e65100; font-weight: 600; }
        .tag { display: inline-block; padding: 2px 6px; margin: 2px;
            font-size: 11px; border-radius: 3px; background: #e3f2fd; color: #1565c0; }
        .tag-join { background: #fff8e1; color: #e65100; }
    </style>
</head>
<body>
<div class="container">
    <div class="left-panel">
        <div class="left-header"><h1>物理表 (TriplesMap)</h1></div>
        <div id="searchBox"><input id="searchInput" type="text" placeholder="搜索表名 / 字段..."></div>
        <div class="entity-list" id="entityList">
            <div style="padding:20px;text-align:center;color:#999" id="loadingMsg">加载中...</div>
        </div>
    </div>

    <div class="right-panel">
        <div class="header">
            <h1>R2RML 映射关系图谱</h1>
            <div class="stats" id="stats">等待数据...</div>
        </div>
        <div class="legend">
            <span><i class="lg-table"></i> 物理表 (TriplesMap)</span>
            <span><i class="lg-col"></i> 字段 / 对象属性</span>
            <span><i class="lg-join"></i> JOIN 目标表</span>
            <label class="toggle-fields"><input type="checkbox" id="showFields"> 显示字段节点</label>
        </div>
        <div id="network" class="network"></div>
    </div>

    <div class="attr-panel" id="attrPanel">
        <span class="close-btn" id="closeAttr">&times;</span>
        <h3 id="attrTitle">详情</h3>
        <div id="attrContent"></div>
    </div>
</div>

<script>
const RDFVis = {
    state: {
        tables: [],          // [{table, db, columns, relations}]
        network: null,
        nodeData: {},        // id -> {kind, payload}
        selectedId: null,
    },
    CONST: {
        /* macaron palette — same as DLR */
        MACARON: [
            '#FFB5BA', '#FFDAB9', '#FFF6CC', '#C1E6C6', '#A8E6CF',
            '#B5EAD7', '#C7CEEA', '#E0BBE4', '#FEC8D8', '#FFDFD3'
        ],
        TM_BORDER:    '#333',          // TriplesMap border (dark, same as DLR LE)
        COL_COLOR:    { background: '#64B5F6', border: '#1565C0' },   // column — DLR mapping-attr blue
        JOIN_COLOR:   { background: '#FFDAB9', border: '#e65100' },   // JOIN target — warm macaron
        COL_EDGE:     '#90CAF9',
        JOIN_EDGE:    '#e65100',
    },
};

/* ===================================================================
 *  HELPERS
 * =================================================================== */

/** Extract the final segment after the last '/' or '#' */
function shortUri(uri) {
    if (!uri) return '';
    const m = uri.match(/([^\/#]+)[#\/]?$/);
    return m ? m[1] : uri;
}

/* ===================================================================
 *  DATA LOAD
 * =================================================================== */

async function loadData() {
    try {
        const res = await fetch('/api/v1/rdf/mapping/all');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.error) {
            document.getElementById('stats').textContent = '错误: ' + data.error;
            return false;
        }

        RDFVis.state.tables = data.tables || [];

        document.getElementById('stats').textContent =
            data.total_tables + ' 物理表 | ' +
            RDFVis.state.tables.reduce((s, t) => s + (t.columns ? t.columns.length : 0), 0) + ' 字段 | ' +
            data.total_joins + ' JOIN';

        return true;
    } catch (e) {
        document.getElementById('stats').textContent = '加载失败: ' + e.message;
        document.getElementById('stats').style.color = '#f44336';
        return false;
    }
}

/* ===================================================================
 *  LEFT PANEL  — table list  (also table + relations on click)
 * =================================================================== */

function renderEntityList() {
    const el = document.getElementById('entityList');
    const filter = (document.getElementById('searchInput').value || '').toLowerCase();
    el.innerHTML = '';

    const tables = RDFVis.state.tables.filter(t =>
        !filter || t.table.toLowerCase().includes(filter) ||
        (t.columns || []).some(c => c.toLowerCase().includes(filter))
    );

    if (tables.length === 0) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:#999">无匹配表</div>';
        return;
    }

    tables.forEach(t => {
        const div = document.createElement('div');
        div.className = 'entity-item';
        div.dataset.id = t.table;
        div.innerHTML = '<span class="badge">TM</span>' + t.table +
            (t.columns && t.columns.length
                ? ' <span style="color:#999;font-size:11px">(' + t.columns.length + ')</span>'
                : '');
        div.addEventListener('click', () => {
            document.querySelectorAll('.entity-item').forEach(x => x.classList.remove('active'));
            div.classList.add('active');
            showTableDetail(t.table);
            focusNode('tm:' + t.table);
        });
        el.appendChild(div);
    });
}

/* ===================================================================
 *  ATTR PANEL  — table / column / join details
 * =================================================================== */

function showTableDetail(tableName) {
    const t = RDFVis.state.tables.find(x => x.table === tableName);
    if (!t) return;

    document.getElementById('attrTitle').textContent = '物理表: ' + tableName;

    let html = '<div class="attr-item"><div class="attr-label">TriplesMap</div>' +
               '<div class="attr-value">' + tableName + '</div></div>';

    if (t.columns && t.columns.length) {
        html += '<div style="margin:10px 0;border-bottom:1px solid #eee;"></div>';
        html += '<h4 style="margin-bottom:8px;">字段 (' + t.columns.length + ')</h4>';
        t.columns.forEach(c => { html += '<span class="tag">' + c + '</span>'; });
    }

    if (t.relations && t.relations.length) {
        html += '<div style="margin:12px 0;border-bottom:1px solid #eee;"></div>';
        html += '<h4 style="margin-bottom:8px;">JOIN 关系 (' + t.relations.length + ')</h4>';
        t.relations.forEach(r => {
            html += '<div class="join-info">' +
                '<div class="j-field"><span class="j-label">目标表</span>: ' +
                '<a href="#" onclick="focusNode(\'tm:' + r.target_table + '\');return false">' + r.target_table + '</a></div>' +
                '<div class="j-field" style="font-family:monospace;font-size:11px;color:#555">' +
                r.join_condition + '</div>' +
                '</div>';
        });
    }

    document.getElementById('attrContent').innerHTML = html;
    document.getElementById('attrPanel').style.display = 'block';
}

/* ===================================================================
 *  VIS-NETWORK  — Plan-A graph: tables + columns + joins
 * =================================================================== */

function buildGraph() {
    const nodes = [], edges = [];
    const seen = {};

    RDFVis.state.tables.forEach((t, idx) => {
        const tmId = 'tm:' + t.table;
        const macaron = RDFVis.CONST.MACARON[idx % RDFVis.CONST.MACARON.length];

        // ---- TriplesMap node — macaron box ----
        if (!seen[tmId]) {
            seen[tmId] = true;
            nodes.push({
                id: tmId,
                label: t.table,
                shape: 'box',
                color: { background: macaron, border: RDFVis.CONST.TM_BORDER,
                          highlight: { background: macaron, border: '#000' } },
                font: { color: '#333333', size: 13, face: 'Arial', bold: true },
                borderWidth: 2,
                size: 28,
                margin: { top: 10, bottom: 10, left: 8, right: 8 },
                shapeProperties: { borderRadius: 6 },
            });
            RDFVis.state.nodeData[tmId] = { kind: 'table', payload: t };
        }

        // ---- column / object-property leaf nodes — blue dot (DLR mapping-attr style) ----
        if (document.getElementById('showFields').checked) {
            (t.columns || []).forEach(c => {
                const colId = tmId + '::col::' + c;
                if (!seen[colId]) {
                    seen[colId] = true;
                    nodes.push({
                        id: colId,
                        label: shortUri(c),
                        shape: 'dot',
                        color: RDFVis.CONST.COL_COLOR,
                        size: 9,
                        font: { size: 9, color: '#1565c0' },
                    });
                    RDFVis.state.nodeData[colId] = { kind: 'column', parent: t.table, name: c };
                }
                const ed = tmId + '--col--' + colId;
                if (!seen[ed]) {
                    seen[ed] = true;
                    edges.push({ from: tmId, to: colId, arrows: 'to',
                        color: RDFVis.CONST.COL_EDGE, width: 1, dashes: true });
                }
            });
        }

        // ---- JOIN target nodes + edges — warm macaron box ----
        (t.relations || []).forEach(r => {
            const targetId = 'tm:' + r.target_table;
            if (!seen[targetId]) {
                seen[targetId] = true;
                nodes.push({
                    id: targetId,
                    label: r.target_table,
                    shape: 'box',
                    color: { ...RDFVis.CONST.JOIN_COLOR,
                             highlight: { background: '#FFDAB9', border: '#bf360c' } },
                    font: { color: '#333333', size: 13, face: 'Arial', bold: true },
                    borderWidth: 2,
                    size: 28,
                    margin: { top: 10, bottom: 10, left: 8, right: 8 },
                    shapeProperties: { borderRadius: 6 },
                });
                RDFVis.state.nodeData[targetId] = { kind: 'table', payload:
                    RDFVis.state.tables.find(x => x.table === r.target_table)
                    || {table: r.target_table, columns: [], relations: []} };
            }
            const ed = tmId + '--join--' + targetId;
            if (!seen[ed]) {
                seen[ed] = true;
                edges.push({
                    from: tmId, to: targetId, arrows: 'to',
                    color: RDFVis.CONST.JOIN_EDGE, width: 2,
                    label: r.join_condition,
                    font: { size: 9, color: '#e65100', strokeWidth: 3, strokeColor: '#fff' },
                });
            }
        });
    });

    return { nodes, edges };
}

function initNetwork() {
    const container = document.getElementById('network');
    const { nodes, edges } = buildGraph();

    if (nodes.length === 0) {
        container.innerHTML = '<div style="padding:40px;text-align:center;color:#999">无可视化数据</div>';
        return;
    }

    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
        nodes: { borderWidth: 1, shadow: false },
        edges: { smooth: { type: 'continuous' } },
        physics: {
            enabled: true,
            solver: 'barnesHut',
            barnesHut: { gravitationalConstant: -800, centralGravity: 0.15,
                springLength: 150, springConstant: 0.04, damping: 0.6 },
            maxVelocity: 15,
            stabilization: { iterations: 80, fit: true },
        },
        layout: { improvedLayout: true, hierarchical: false },
        interaction: { hover: true, tooltipDelay: 200 },
    };

    RDFVis.state.network = new vis.Network(container, data, options);

    /* stop physics once settled + zoom-to-fit (same pattern as ER / DLR) */
    RDFVis.state.network.once('stabilizationIterationsDone', () => {
        RDFVis.state.network.setOptions({ physics: { enabled: false } });
        RDFVis.state.network.moveTo({
            position: { x: 0, y: 0 }, offset: { x: 0, y: 0 }, scale: 0.5,
            animation: { duration: 300, easingFunction: 'easeInOutQuad' }
        });
    });

    RDFVis.state.network.on('click', params => {
        if (params.nodes.length > 0) {
            focusNodeDetail(params.nodes[0]);
        }
    });
}

function focusNode(nodeId) {
    if (!RDFVis.state.network) return;
    RDFVis.state.network.selectNodes([nodeId]);
    RDFVis.state.network.focus(nodeId, { scale: 1.1, animation: { duration: 400 } });
}

function focusNodeDetail(nodeId) {
    const info = RDFVis.state.nodeData[nodeId];
    if (!info) return;
    if (info.kind === 'table') {
        document.querySelectorAll('.entity-item').forEach(el =>
            el.classList.toggle('active', el.dataset.id === info.payload.table));
        showTableDetail(info.payload.table);
    } else if (info.kind === 'column') {
        document.getElementById('attrTitle').textContent = '字段: ' + info.name;
        document.getElementById('attrContent').innerHTML =
            '<div class="attr-item"><div class="attr-label">所在表</div>' +
            '<div class="attr-value">' + info.parent + '</div></div>' +
            '<div class="attr-item"><div class="attr-label">字段 ID</div>' +
            '<div class="attr-value">' + info.name + '</div></div>';
        document.getElementById('attrPanel').style.display = 'block';
    }
}

/* ===================================================================
 *  EVENTS  +  INIT
 * =================================================================== */

function bindEvents() {
    document.getElementById('searchInput').addEventListener('input', renderEntityList);
    document.getElementById('closeAttr').addEventListener('click',
        () => document.getElementById('attrPanel').style.display = 'none');
    document.getElementById('showFields').addEventListener('change', () => {
        if (RDFVis.state.network) {
            const { nodes, edges } = buildGraph();
            RDFVis.state.network.setData({ nodes, edges });
        }
    });
}

async function init() {
    const ok = await loadData();
    if (!ok) return;
    renderEntityList();
    bindEvents();
    initNetwork();
}

init();
</script>
</body>
</html>
