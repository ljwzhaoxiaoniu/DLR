<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDF 语义元数据 · W3C Standard</title>
    <link rel="icon" href="data:;base64,=">
    <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        .container { display: flex; height: 100vh; }
        .left-panel {
            width: 320px; min-width: 280px; background: #f5f5f5;
            border-right: 1px solid #ddd; display: flex; flex-direction: column;
        }
        .left-header { padding: 12px 16px; background: white; border-bottom: 1px solid #ddd; }
        .left-header h1 { font-size: 15px; color: #333; font-weight: 600; }
        .left-header .sub { font-size: 11px; color: #999; margin-top: 2px; }
        .filters { padding: 10px 16px; background: white; border-bottom: 1px solid #eee; }
        .filters label { font-size: 11px; color: #555; display: block; margin-bottom: 3px; }
        .filters select, .filters input {
            width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 12px; font-family: inherit; margin-bottom: 6px;
        }
        .search-box { flex: 1; overflow-y: auto; padding: 8px; }
        .triple-item {
            padding: 8px 10px; margin-bottom: 3px; border-radius: 4px;
            cursor: pointer; font-size: 11px; background: white; border: 1px solid #eee;
            line-height: 1.4;
        }
        .triple-item:hover { background: #e8f0fe; border-color: #4285f4; }
        .triple-item .s { color: #1a73e8; }
        .triple-item .p { color: #e8710a; }
        .triple-item .o { color: #0d904f; }
        .right-panel { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header {
            padding: 10px 16px; background: white; border-bottom: 1px solid #ddd;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 14px; color: #333; }
        .stats { font-size: 11px; color: #666; }
        .toolbar { padding: 8px 16px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; gap: 8px; }
        .toolbar button {
            padding: 5px 10px; font-size: 11px; border: 1px solid #ccc; background: white;
            border-radius: 3px; cursor: pointer;
        }
        .toolbar button.active { background: #4285f4; color: white; border-color: #4285f4; }
        #network { flex: 1; background: #fafafa; min-height: 300px; }
        .attr-panel {
            position: absolute; right: 0; top: 0; width: 320px; height: 100%;
            background: white; border-left: 1px solid #ddd; padding: 14px;
            overflow-y: auto; display: none; z-index: 100;
        }
        .attr-panel h3 { margin-bottom: 12px; color: #333; padding-bottom: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
        .attr-item { margin-bottom: 8px; }
        .attr-label { font-size: 11px; color: #666; margin-bottom: 2px; }
        .attr-value { font-size: 12px; color: #333; word-break: break-all; font-family: monospace; }
        .close-btn { position: absolute; right: 12px; top: 10px; cursor: pointer; color: #999; font-size: 16px; }
        .close-btn:hover { color: #333; }
        .sparql-box { padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #eee; display: none; }
        .sparql-box textarea {
            width: 100%; min-height: 70px; padding: 8px; font-family: monospace;
            font-size: 11px; border: 1px solid #ddd; border-radius: 4px; resize: vertical;
        }
        .sparql-box .actions { display: flex; gap: 6px; margin-top: 6px; }
        .sparql-box button {
            padding: 4px 12px; font-size: 11px; border: 1px solid #4285f4; background: #4285f4;
            color: white; border-radius: 3px; cursor: pointer;
        }
        .sparql-box button.secondary { background: white; color: #4285f4; }
        .sparql-results { padding: 10px 16px; background: white; border-top: 1px solid #eee; font-size: 11px; font-family: monospace; max-height: 200px; overflow: auto; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="left-header">
                <h1>RDF 语义元数据 · W3C Standard</h1>
                <div class="sub">rdflib · SPARQL · Turtle / JSON-LD</div>
            </div>
            <div class="filters">
                <label>类 (rr:class)</label>
                <select id="classFilter"><option value="">— 全部 —</option></select>
                <label>谓词</label>
                <select id="predFilter"><option value="">— 全部 —</option></select>
                <label>文本搜索</label>
                <input type="text" id="searchInput" placeholder="搜索 URI / 文字...">
            </div>
            <div class="search-box" id="tripleList">
                <div style="padding:20px;text-align:center;color:#999;">加载中...</div>
            </div>
        </div>
        <div class="right-panel">
            <div class="header">
                <h1>RDF 三元组图谱</h1>
                <div class="stats" id="stats">等待数据...</div>
            </div>
            <div class="toolbar">
                <button id="btnGraph" class="active" onclick="switchView('graph')">图谱</button>
                <button id="btnSparql" onclick="switchView('sparql')">SPARQL</button>
                <button id="btnTurtle" onclick="switchView('turtle')">Turtle</button>
            </div>
            <div class="sparql-box" id="sparqlBox">
                <textarea id="sparqlQuery" placeholder="SELECT ?s ?p ?o WHERE { ?s a rr:TriplesMap . ?s ?p ?o } LIMIT 20">SELECT ?s ?p ?o WHERE {
  ?s a rr:TriplesMap .
  ?s ?p ?o .
} LIMIT 50</textarea>
                <div class="actions">
                    <button onclick="runSparql()">执行查询</button>
                    <button class="secondary" onclick="document.getElementById('sparqlQuery').value=''">清空</button>
                </div>
            </div>
            <div class="sparql-results" id="sparqlResults"></div>
            <div id="network"></div>
            <div class="attr-panel" id="attrPanel">
                <span class="close-btn" id="closeAttr">×</span>
                <h3 id="attrTitle">详情</h3>
                <div id="attrContent"></div>
            </div>
        </div>
    </div>

<script>
const RDFVis = {
    state: {
        triples: [],
        classes: [],
        predicates: [],
        network: null,
        edgeData: {},
        graphMode: 'graph',
    },
    CONST: {
        NS_rr: 'http://www.w3.org/ns/r2rml#',
        NS_rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#',
    }
};

function shortUri(uri) {
    if (!uri) return '';
    for (const [pfx, base] of [['rr:', RDFVis.CONST.NS_rr], ['rdf:', RDFVis.CONST.NS_rdf], ['rdfs:', 'http://www.w3.org/2000/01/rdf-schema#'], ['xsd:', 'http://www.w3.org/2001/XMLSchema#']]) {
        if (uri.startsWith(base)) return pfx + uri.slice(base.length);
    }
    const m = uri.match(/([^\/#]+)[#\/]?$/);
    return m ? m[1] : uri;
}

async function loadData() {
    try {
        const res = await fetch('/api/v1/rdf/graph');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        RDFVis.state.triples = [];
        RDFVis.state.classes = data.classes || [];
        RDFVis.state.predicates = data.predicates || [];

        const tres = await fetch('/api/v1/rdf/triples');
        const tdata = await tres.json();
        RDFVis.state.triples = tdata.triples || [];

        document.getElementById('stats').textContent =
            data.total_triples + ' triples | ' +
            (data.classes ? data.classes.length : 0) + ' classes | ' +
            (data.predicates ? data.predicates.length : 0) + ' predicates';

        // populate filters
        const classSel = document.getElementById('classFilter');
        classSel.innerHTML = '<option value="">— 全部 —</option>' +
            (data.classes || []).map(c => '<option value="' + c + '">' + shortUri(c) + '</option>').join('');
        const predSel = document.getElementById('predFilter');
        predSel.innerHTML = '<option value="">— 全部 —</option>' +
            (data.predicates || []).map(p => '<option value="' + p + '">' + shortUri(p) + '</option>').join('');

        return true;
    } catch (e) {
        document.getElementById('stats').textContent = '加载失败: ' + e.message;
        return false;
    }
}

function filterTriples() {
    const cls = document.getElementById('classFilter').value;
    const pred = document.getElementById('predFilter').value;
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    let all = RDFVis.state.triples;
    if (cls) all = all.filter(t => t.object === cls && t.predicate.endsWith('#type'));
    if (pred) all = all.filter(t => t.predicate === pred);
    if (q) all = all.filter(t => (t.subject + t.predicate + t.object).toLowerCase().includes(q));
    return all;
}

function renderTripleList() {
    const list = filterTriples().slice(0, 200);
    const el = document.getElementById('tripleList');
    el.innerHTML = list.length === 0 ? '<div style="padding:20px;text-align:center;color:#999;">无匹配三元组</div>' :
        list.map((t, i) => '<div class="triple-item" data-idx="' + i + '">' +
            '<span class="s">' + shortUri(t.subject) + '</span><br>' +
            '  <span class="p">' + shortUri(t.predicate) + '</span><br>' +
            '  <span class="o">' + shortUri(t.object) + '</span>' +
        '</div>').join('');

    document.querySelectorAll('.triple-item').forEach(el => {
        el.addEventListener('click', () => {
            document.querySelectorAll('.triple-item').forEach(e => e.style.background = '');
            el.style.background = '#e8f0fe');
            const triple = filterTriples()[parseInt(el.dataset.idx)];
            showTripleDetail(triple);
        });
    });
}

function initNetwork(const tripleFilter = null) {
    // Build a graph from TriplesMap subject + rr:class edges.
    const subjects = new Set();
    const classNodes = new Set();
    const edges = [];
    const edgesSeen = {};

    // Use class-focus: TriplesMap → rr:class → Class node
    const tm2class = {};
    (tripleFilter || RDFVis.state.triples).forEach(t => {
        if (t.predicate.endsWith('/type') || t.predicate.endsWith('#type')) {
            // skip generic rdf:type triples
            if (t.object.endsWith('#type') || t.predicate.endsWith('#Pred')) return;
            if (t.predicate.includes('22-rdf-syntax-ns#type')) {
                tm2class[t.subject] = t.object;
                classNodes.add(t.object);
            }
        }
        subjects.add(t.subject);
    });

    // show TriplesMap nodes + their class nodes
    const nodes = [];
    const shown = new Set();
    for (const [tm, cls] of Object.entries(tm2class)) {
        if (!shown.has(cls)) {
            nodes.push({ id: cls, label: shortUri(cls), color: {'background':'#FF6B6B','border':'#c0392b'}, shape:'circle', size:40 });
            shown.add(cls);
        }
        if (!shown.has(tm)) {
            const tmLabel = shortUri(tm);
            nodes.push({ id: tm, label: tmLabel, color: {'background':'#4ECDC4','border':'#1a936f'}, shape:'box', size:28 });
            shown.add(tm);
        }
        const ed = tm + '->' + cls;
        if (!edgesSeen[ed]) {
            edgesSeen[ed] = true;
            edges.push({ id: ed, from: tm, to: cls, arrows: 'to', color: '#45a049', width: 2, label: 'a' });
        }
    }

    const container = document.getElementById('network');
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
        nodes: { font: { size: 12, color: '#333' } },
        edges: { smooth: { type: 'continuous' }, color: '#999', width: 2, arrows: { to: { enabled: true, scaleFactor: 0.5 }}, font: { size: 9 }},
        physics: {
            enabled: true,
            barnesHut: { gravitationalConstant: -1200, centralGravity: 0.15, springLength: 130, springConstant: 0.04, damping: 0.5 },
            stabilization: { iterations: 80 }
        }
    };
    try {
        RDFVis.state.network = new vis.Network(container, data, options);
        RDFVis.state.network.once('stabilizationIterationsDone', () => {
            RDFVis.state.network.setOptions({ physics: { enabled: false } });
        });
        RDFVis.state.network.on('click', params => {
            if (params.nodes.length > 0) {
                // show node info
                const nodeId = params.nodes[0];
                showNodeDetail(nodeId);
            }
        });
    } catch(e) {
        console.error(e);
    }
}

function showNodeDetail(nodeId) {
    const triples = filterTriples().filter(t => t.subject === nodeId || t.object === nodeId);
    document.getElementById('attrTitle').textContent = shortUri(nodeId);
    let html = '<div class="attr-item"><div class="attr-label">URI</div><div class="attr-value">' + nodeId + '</div></div>';
    html += '<div style="margin:10px 0;border-bottom:1px solid #eee;"></div>';
    html += '<h4 style="margin-bottom:8px;">关联三元组 (' + triples.length + ')</h4>';
    triples.slice(0, 20).forEach(t => {
        html += '<div style="margin-bottom:6px;padding:4px;background:#f5f5f5;border-radius:3px;font-size:11px;">';
        html += '<span class="s">' + shortUri(t.subject) + '</span> ';
        html += '<span class="p">' + shortUri(t.predicate) + '</span> ';
        html += '<span class="o">' + shortUri(t.object) + '</span></div>';
    });
    document.getElementById('attrContent').innerHTML = html;
    document.getElementById('attrPanel').style.display = 'block';
}

function showTripleDetail(triple) {
    document.getElementById('attrTitle').textContent = 'Triple';
    let html = '';
    for (const role of ['subject', 'predicate', 'object']) {
        html += '<div class="attr-item"><div class="attr-label">' + role + '</div><div class="attr-value">' + triple[role] + '</div></div>';
    }
    document.getElementById('attrContent').innerHTML = html;
    document.getElementById('attrPanel').style.display = 'block';
}

function switchView(mode) {
    RDFVis.state.graphMode = mode;
    document.getElementById('btnGraph').classList.toggle('active', mode === 'graph');
    document.getElementById('btnSparql').classList.toggle('active', mode === 'sparql');
    document.getElementById('btnTurtle').classList.toggle('active', mode === 'turtle');
    document.getElementById('network').style.display = mode === 'graph' ? '' : 'none';
    document.getElementById('sparqlBox').style.display = mode === 'sparql' ? '' : 'none';
    if (mode === 'turtle') showTurtle();
}

async function showTurtle() {
    const res = await fetch('/api/v1/rdf/serialize?format=turtle');
    const text = await res.text();
    document.getElementById('attrPanel').style.display = 'block';
    document.getElementById('attrTitle').textContent = 'Turtle Serialization';
    document.getElementById('attrContent').innerHTML = '<pre style="font-size:11px;white-space:pre-wrap;max-height:60vh;overflow:auto;background:#f5f5f5;padding:8px;border-radius:3px;">' + text + '</pre>';
}

async function runSparql() {
    const q = document.getElementById('sparqlQuery').value;
    const res = await fetch('/api/v1/rdf/sparql', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ question: q }) });
    const data = await res.json();
    const results = document.getElementById('sparqlResults');
    results.style.display = 'block';
    if (data.error) {
        results.textContent = 'Error: ' + data.error;
    } else if (typeof data.boolean === 'boolean') {
        results.textContent = 'ASK result: ' + data.boolean;
    } else if (data.bindings) {
        const vars_ = data.head ? data.head.vars : Object.keys(data.bindings[0] || {});
        results.innerHTML = '<b>SELECT (' + data.bindings.length + ')</b><br>' +
            vars_.join(' | ') + '<br>' +
            data.bindings.map(b => vars_.map(v => b[v]).join(' | ')).join('<br>');
    } else if (data.triples) {
        results.innerHTML = '<b>CONSTRUCT (' + data.triples.length + ' triples)</b><br>' +
            data.triples.slice(0, 20).map(t => shortUri(t.subject) + ' ' + shortUri(t.predicate) + ' ' + shortUri(t.object)).join('<br>');
    }
}

function bindEvents() {
    document.getElementById('classFilter').addEventListener('change', renderTripleList);
    document.getElementById('predFilter').addEventListener('change', renderTripleList);
    document.getElementById('searchInput').addEventListener('input', renderTripleList);
    document.getElementById('closeAttr').addEventListener('click', () => document.getElementById('attrPanel').style.display = 'none');
}

async function init() {
    const ok = await loadData();
    if (ok) {
        renderTripleList();
        bindEvents();
        initNetwork();
    }
}

init();
</script>
</body>
</html>
