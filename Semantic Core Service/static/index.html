<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语义元数据可视化</title>
    <link rel="icon" href="data:;base64,=">
    <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .container { display: flex; height: 100vh; }
        .left-panel {
            width: 280px; min-width: 250px; background: #f5f5f5;
            border-right: 1px solid #ddd; display: flex; flex-direction: column;
        }
        .left-header {
            padding: 12px 16px; background: white; border-bottom: 1px solid #ddd;
            display: flex; justify-content: space-between; align-items: center;
        }
        .left-header h1 { font-size: 16px; color: #333; }
        .entity-list { flex: 1; overflow-y: auto; padding: 8px; }
        .entity-item {
            padding: 10px 12px; margin-bottom: 4px; border-radius: 4px;
            cursor: pointer; font-size: 13px; background: white; border: 1px solid #eee;
        }
        .entity-item:hover { background: #e3f2fd; border-color: #2196f3; }
        .entity-item.active { background: #2196f3; color: white; font-weight: bold; }
        .right-panel { flex: 1; display: flex; flex-direction: column; position: relative; }
        .network { flex: 1; background: #fafafa; min-height: 400px; }
        .attr-panel {
            position: absolute; right: 0; top: 0; width: 280px; height: 100%;
            background: white; border-left: 1px solid #ddd; padding: 16px;
            overflow-y: auto; display: none; z-index: 100;
        }
        .attr-panel h3 { margin-bottom: 16px; color: #333; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .attr-item { margin-bottom: 12px; }
        .attr-label { font-size: 12px; color: #666; margin-bottom: 4px; }
        .attr-value { font-size: 13px; color: #333; word-break: break-all; }
        .close-btn {
            position: absolute; right: 16px; top: 16px; cursor: pointer;
            color: #999; font-size: 18px;
        }
        .close-btn:hover { color: #333; }
        .header {
            padding: 12px 16px; background: white; border-bottom: 1px solid #ddd;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 16px; color: #333; }
        .stats { font-size: 12px; color: #666; }
        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85); display: flex; align-items: center;
            justify-content: center; z-index: 200; font-size: 14px; color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="left-header"><h1>业务实体列表</h1></div>
            <div class="entity-list" id="entityList">
                <div style="padding:20px;text-align:center;color:#999;">加载中...</div>
            </div>
        </div>
        <div class="right-panel">
            <div class="header">
                <h1>语义元数据关系图谱</h1>
                <div class="stats" id="stats">等待数据...</div>
            </div>
            <div id="network" class="network"></div>
            <div class="loading-overlay" id="loadingOverlay">加载图谱数据中...</div>
        </div>
        <div class="attr-panel" id="attrPanel">
            <span class="close-btn" id="closeAttr">×</span>
            <h3 id="attrTitle">实体属性</h3>
            <div id="attrContent"></div>
        </div>
    </div>

<script>
const SemanticVis = {
    state: {
        entities: [],
        relations: [],
        network: null,
        edgeData: {}
    },
    CONST: {
        MACARON_COLORS: [
            '#FFB5BA','#FFDAB9','#FFF6CC','#C1E6C6','#A8E6CF',
            '#B5EAD7','#C7CEEA','#E0BBE4','#FEC8D8','#FFDFD3'
        ]
    }
};

async function loadData() {
    try {
        // 单次请求获取实体（含属性）+ 关系，避免 N+1 请求
        const res = await fetch('/api/v1/graph');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        SemanticVis.state.entities = data.entities || [];
        SemanticVis.state.relations = data.relations || [];
        document.getElementById('stats').textContent =
            '实体数：' + SemanticVis.state.entities.length +
            ' | 关系数：' + SemanticVis.state.relations.length;
        return true;
    } catch (error) {
        document.getElementById('stats').textContent = '加载失败：' + error.message;
        document.getElementById('stats').style.color = '#f44336';
        return false;
    } finally {
        document.getElementById('loadingOverlay').style.display = 'none';
    }
}

function renderEntityList() {
    const listEl = document.getElementById('entityList');
    listEl.innerHTML = SemanticVis.state.entities.map(e => {
        const name = e.name || e.entity_id || '未知';
        const id = e.entity_id || '未知';
        return '<div class="entity-item" data-id="' + id + '">' +
            '<div>' + name + '</div>' +
            '<div style="font-size:11px;color:#999;">' + id + '</div>' +
            '</div>';
    }).join('');
}

function initNetwork() {
    if (typeof vis === 'undefined') {
        document.getElementById('stats').textContent = 'vis.js加载失败';
        return;
    }

    const nodes = [];
    const edges = [];
    const edgeData = {};

    // 实体节点 + 属性小节点（静态渲染，物理引擎稳定后关闭）
    SemanticVis.state.entities.forEach((e, index) => {
        const name = e.name || e.entity_id || '未知';
        const id = e.entity_id || '未知';
        const color = SemanticVis.CONST.MACARON_COLORS[index % SemanticVis.CONST.MACARON_COLORS.length];
        nodes.push({
            id: id,
            label: name,
            title: name + '\nID: ' + id + (e.source_table ? '\n表: ' + e.source_table : ''),
            color: { background: color, border: '#333' },
            font: { color: '#333', size: 14, face: 'Arial' },
            borderWidth: 3,
            shape: 'circle',
            size: 60
        });
        // 属性节点
        const attrs = e.attributes || {};
        Object.keys(attrs).slice(0, 12).forEach(attrName => {
            const attr = attrs[attrName];
            const attrNodeId = id + '_attr_' + attrName;
            nodes.push({
                id: attrNodeId,
                label: attrName.length > 6 ? attrName.substring(0, 6) + '..' : attrName,
                title: attrName + (attr.physical_column_id ? '\n物理列: ' + attr.physical_column_id : ''),
                color: { background: '#9e9e9e', border: '#666' },
                font: { color: '#fff', size: 10 }, borderWidth: 1, shape: 'circle', size: 14
            });
            edges.push({ id: id + '_edge_' + attrName, from: id, to: attrNodeId, color: '#bdbdbd', width: 0.5, arrows: '', smooth: true, length: 60 });
        });
    });

    // 关系边
    SemanticVis.state.edgeData = {};
    SemanticVis.state.relations.forEach((r, index) => {
        const fromId = r.from || r.from_entity_attr_id || '未知';
        const toId = r.to || r.to_entity_attr_id || '未知';
        const label = r.type || r.biz_name || '';
        const edgeId = fromId + '-' + toId + '-' + index;
        edges.push({
            id: edgeId,
            from: fromId,
            to: toId,
            label: label,
            arrows: 'to',
            color: '#6666ff',
            width: 2,
            smooth: { type: 'continuous' },
            length: 500
        });
        SemanticVis.state.edgeData[edgeId] = {
            from: fromId, to: toId,
            type: r.type, biz_name: r.biz_name,
            relation_id: r.relation_id,
            from_entity_attr_id: r.from_entity_attr_id,
            to_entity_attr_id: r.to_entity_attr_id,
            description: r.description,
            fromEntity: SemanticVis.state.entities.find(e => e.entity_id === fromId),
            toEntity: SemanticVis.state.entities.find(e => e.entity_id === toId)
        };
    });

    const container = document.getElementById('network');
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
        nodes: { font: { size: 14, color: '#fff', face: 'Arial' } },
        edges: {
            smooth: { type: 'continuous' },
            color: '#999', width: 2,
            arrows: { to: { enabled: true, scaleFactor: 0.5 } },
            font: { size: 10, color: '#333', align: 'middle' }
        },
        physics: {
            enabled: true,
            barnesHut: {
                gravitationalConstant: -800,
                centralGravity: 0.15,
                springLength: 150,
                springConstant: 0.04,
                damping: 0.6
            },
            maxVelocity: 15,
            solver: 'barnesHut',
            stabilization: {
                enabled: true,
                iterations: 80,
                updateInterval: 20,
                fit: true
            }
        }
    };

    try {
        SemanticVis.state.network = new vis.Network(container, data, options);

        // 稳定后关闭物理引擎，避免持续计算导致卡顿
        SemanticVis.state.network.on('stabilizationIterationsDone', function() {
            SemanticVis.state.network.setOptions({ physics: { enabled: false } });
            SemanticVis.state.network.moveTo({
                position: { x: 0, y: 0 }, offset: { x: 0, y: 0 }, scale: 0.5,
                animation: { duration: 300, easingFunction: 'easeInOutQuad' }
            });
        });

        SemanticVis.state.network.on('click', function(params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                showEntityDetail(nodeId);
            } else if (params.edges.length > 0) {
                showRelationDetail(params.edges[0]);
            }
        });
    } catch (error) {
        console.error('网络创建失败:', error);
    }
}

function bindEvents() {
    document.getElementById('entityList').addEventListener('click', e => {
        const item = e.target.closest('.entity-item');
        if (item) {
            const entityId = item.dataset.id;
            document.querySelectorAll('.entity-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            if (SemanticVis.state.network) {
                SemanticVis.state.network.selectNodes([entityId]);
                try {
                    SemanticVis.state.network.focus(entityId, { animation: { duration: 300 } });
                } catch (err) {
                    const node = SemanticVis.state.network.body.nodes[entityId];
                    if (node) {
                        SemanticVis.state.network.moveTo({
                            position: { x: node.x, y: node.y },
                            scale: 0.6, animation: { duration: 300 }
                        });
                    }
                }
            }
            showEntityDetail(entityId);
        }
    });

    document.getElementById('closeAttr').addEventListener('click', () => {
        document.getElementById('attrPanel').style.display = 'none';
    });
}

function showRelationDetail(edgeId) {
    const data = SemanticVis.state.edgeData && SemanticVis.state.edgeData[edgeId];
    if (!data) return;

    document.getElementById('attrTitle').textContent = data.type || data.biz_name || '业务关系';
    let html =
        '<div class="attr-item"><div class="attr-label">关系名称</div><div class="attr-value">' + (data.type || data.biz_name || '-') + '</div></div>' +
        '<div class="attr-item"><div class="attr-label">关系ID</div><div class="attr-value">' + (data.relation_id || '-') + '</div></div>' +
        '<div style="margin:12px 0;border-bottom:1px solid #eee;"></div>' +
        '<h4 style="margin-bottom:12px;">源业务实体</h4>' +
        '<div class="attr-item"><div class="attr-label">实体名称</div><div class="attr-value">' + (data.fromEntity?.name || data.from || '-') + '</div></div>' +
        '<div class="attr-item"><div class="attr-label">关联属性</div><div class="attr-value">' + (data.from_entity_attr_id || '-') + '</div></div>' +
        '<div style="margin:12px 0;border-bottom:1px solid #eee;"></div>' +
        '<h4 style="margin-bottom:12px;">目标业务实体</h4>' +
        '<div class="attr-item"><div class="attr-label">实体名称</div><div class="attr-value">' + (data.toEntity?.name || data.to || '-') + '</div></div>' +
        '<div class="attr-item"><div class="attr-label">关联属性</div><div class="attr-value">' + (data.to_entity_attr_id || '-') + '</div></div>';
    if (data.description) {
        html += '<div style="margin:12px 0;border-bottom:1px solid #eee;"></div>' +
            '<div class="attr-item"><div class="attr-label">关系描述</div><div class="attr-value">' + data.description + '</div></div>';
    }
    document.getElementById('attrContent').innerHTML = html;
    document.getElementById('attrPanel').style.display = 'block';
}

function showEntityDetail(entityId) {
    const entity = SemanticVis.state.entities.find(e => e.entity_id === entityId);
    if (!entity) return;

    document.getElementById('attrTitle').textContent = '业务' + (entity.name || entityId);
    let html =
        '<div class="attr-item"><div class="attr-label">业务实体名称</div><div class="attr-value">' + (entity.name || '-') + '</div></div>' +
        '<div class="attr-item"><div class="attr-label">实体ID</div><div class="attr-value">' + (entity.entity_id || '-') + '</div></div>' +
        '<div class="attr-item"><div class="attr-label">来源表</div><div class="attr-value">' + (entity.source_table || '-') + '</div></div>' +
        '<div class="attr-item"><div class="attr-label">描述</div><div class="attr-value">' + (entity.description || '-') + '</div></div>';

    const attrs = entity.attributes || {};
    const attrKeys = Object.keys(attrs);
    html += '<div style="margin:16px 0;border-bottom:1px solid #eee;"></div>' +
        '<h4 style="margin-bottom:12px;">属性列表 (' + attrKeys.length + '个)</h4>';

    if (attrKeys.length > 0) {
        html += attrKeys.map(attrName => {
            const attr = attrs[attrName];
            return '<div class="attr-item" style="background:#f9f9f9;padding:8px;border-radius:4px;margin-bottom:8px;">' +
                '<div class="attr-label">' + (attr.name || attr.attr_id || attrName) + '</div>' +
                '<div class="attr-value">' + (attr.description || attr.physical_column_id || '-') + '</div>' +
                '</div>';
        }).join('');
    } else {
        html += '<div style="color:#999;font-size:14px;">暂无属性</div>';
    }

    document.getElementById('attrContent').innerHTML = html;
    document.getElementById('attrPanel').style.display = 'block';
}

async function init() {
    const success = await loadData();
    if (success && SemanticVis.state.entities.length > 0) {
        renderEntityList();
        initNetwork();
        bindEvents();
    } else if (SemanticVis.state.entities.length === 0) {
        document.getElementById('stats').textContent = '请先构建知识库数据（运行 build 命令）';
        document.getElementById('stats').style.color = '#f44336';
    }
}

init();
</script>
</body>
</html>
