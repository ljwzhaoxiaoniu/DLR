# Cloud-OpsBench 场景 · L1（dlr-state）—— boutique
#
# 结构（DLR 词汇）：LE = 本系统**有独立生命周期**的对象（服务 / 节点 / 命名空间）；
#                  PE = 每个对象的**状态观测面**（deployment / pods / service+endpoints / telemetry / logs；boutique 另有 code）；
#                  PAS = 本系统的**服务调用图**（自快照的依赖图读得，逐 case 稳定）。
# 锚：同一对象的所有观测面共享**应用标签**（app=<service>）——ARCS.A.key = app_label；
#     节点面按 node_name、命名空间面按 namespace 锚定。
# 边界：实例（pod 名 / IP / 状态值 / 日志内容）不入模型——由 agent 经工具沿面实查。
# 源：LLM4Ops/Cloud-OpsBench @ ea05daf（2026-10-10 拉取）；调用图/名册自 tool_cache 样本抽取。

mapping_type: dlr-state
version: '2.0'
scenario_name: dlr_cloudopsbench_boutique
description: boutique system of Cloud-OpsBench — its services and nodes (LE), the resource / observation surfaces
  through which each object's state is read from deterministic Kubernetes snapshots (PE), and the service call topology
  (PAS).
source:
  kind: kubernetes-state-snapshots
  repo: LLM4Ops/Cloud-OpsBench
  pin: ea05daf
  system: boutique
logical_entities:
- logical_entity_id: LOGICAL.boutique.frontend
  biz_name: frontend
  description: 'Web frontend and entry point of Online Boutique — a Go HTTP server (port 8080) that renders the
    shop and fans out to all shopping services (ad, cart, checkout, currency, product, recommendation, shipping).
    Every user request enters here (Upstream: user traffic).'
  physical_entities:
  - physical_entity_id: PHYSICAL.boutique.frontend.deployment
    resource: deployments
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: desired state of the service — replicas, pod template (image / probes / ports), service account and config
      references
    attributes:
    - name: app_label
      description: the identifying application label (app=frontend) shared by every surface of this service
      public: true
    - name: replicas
      description: desired vs ready replica count (AVAILABLE) — 0/1 means the service is drained; read from the
        deployments listing or the app YAML
    - name: probes
      description: liveness / readiness probe configuration (protocol / port / timing / commands) — a probe that
        can never succeed restarts containers in a loop; read from the app YAML
    - name: env_addresses
      description: downstream call addresses carried as environment variables (host:port of the services this one
        calls) — the addressing surface for call failures; read from the app YAML
    - name: config_refs
      description: referenced objects — serviceAccountName, secrets / configmaps, PVC-PV claims, image reference;
        missing refs surface as pod events (FailedCreate / FailedMount / image-pull messages)
  - physical_entity_id: PHYSICAL.boutique.frontend.pods
    resource: pods
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: instances — scheduling, creation, startup and health of the containers running this service
    attributes:
    - name: app_label
      description: application label of the pod set (app=frontend)
      public: true
    - name: phase_status
      description: pod phase and container states — Running / Pending / CrashLoopBackOff / ImagePullBackOff / ErrImagePull
        / ContainerCreating (STATUS column of the pods listing)
    - name: restarts
      description: container restart count — the first-level liveness symptom; the outlier row among healthy peers
        (RESTARTS column)
    - name: last_termination
      description: last terminated container state — reason + exit code (Error 143 = SIGTERM sent by kubelet; OOMKilled
        137 = memory limit hit); read from the pod detail
    - name: node
      description: node the pod is placed on — placement surface to pair with node state (taints / capacity / cordon);
        read from the pod detail or pods -o wide
    - name: events
      description: 'pod events — the mechanism record: FailedScheduling / FailedCreate / FailedMount / FailedAttachVolume
        / Unhealthy (probe) / Killing / BackOff / image-pull messages; read from the pod detail Events section'
  - physical_entity_id: PHYSICAL.boutique.frontend.service_endpoints
    resource: services + endpoints
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: reachability as seen by callers — the Service object and its endpoint binding result
    attributes:
    - name: cluster_ip_ports
      description: ClusterIP and port mapping (port → targetPort → protocol) — a wrong mapping leaves callers with
        connection failures; read from the services listing / service detail
    - name: selector_match
      description: label selector → matched pods; a selector matching nothing leaves the endpoints empty
    - name: endpoints_binding
      description: ready addresses bound to the service (<none> = no serving pod) — the surface behind caller-side
        'connection refused' logs; read from the endpoints object
  - physical_entity_id: PHYSICAL.boutique.frontend.telemetry
    resource: alerts + metrics
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'anomaly signals — self-describing alerts and, when the snapshot carries them, performance metric series
      (alerts are a symptom pointer: close on object-layer evidence)'
    attributes:
    - name: alerts
      description: active alerts naming entity and anomaly class (e.g. latency percentiles before → after) — read
        with GetAlerts
    - name: metrics
      description: metric readings (latency / error / resource usage) present only in performance-manifesting snapshots
        — read with GetAlerts
  - physical_entity_id: PHYSICAL.boutique.frontend.logs
    resource: logs
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: application log stream of the service as captured in the snapshot
    attributes:
    - name: recent_logs
      description: recent log lines of frontend — routine and abnormal messages; read with GetRecentLogs(service_name=frontend)
    - name: error_logs
      description: error-level log lines — connection failures, panics, gRPC/HTTP exceptions, business errors; the
        causal narrative surface; read with GetErrorLogs
  - physical_entity_id: PHYSICAL.boutique.frontend.code
    resource: code artifact
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: trimmed service sources shipped with the snapshot — the source-defect surface (error message → file / function
      → code evidence)
    attributes:
    - name: source_files
      description: recorded source files of frontend — list with ListCodeFiles(service_name=frontend)
    - name: source_code
      description: file contents — locate the defect anchor (wrong argument order / wrong return / busy loop / artificial
        delay / missing parameter); read with GetSourceCode
