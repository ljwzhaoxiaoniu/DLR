# Cloud-OpsBench 场景 · L1 源（非数据库形态）
# 案例说明（方案与来源）：scenarios/cloudopsbench/modeling-plan.md（v1，双语）
# 本文件 = 方案 §3.1–3.3 三张表的机器可读形态，行级 1:1（row 字段回指行号）；schema 注记见文件尾。

mapping_type: dlr-obs
version: '2.0'
scenario_name: dlr_cloudopsbench
description: 'Kubernetes RCA state snapshots (Online Boutique + Train-Ticket, 754 cases): service-level entities (LE), physical resource kinds (PE), relations carrying observation slots, and symptom entry slices.'
source:
  kind: kubernetes-state-snapshots
  repo: LLM4Ops/Cloud-OpsBench
  pin: ea05daf              # main, commit 2026-10-06; pulled 2026-10-10
  system_scope: [Online Boutique, Train-Ticket]

entities:
- entity_id: LOGICAL.Service
  side: LE
  row: 1
  description: 'reachability as seen by callers (endpoint binding, connectivity)'
- entity_id: LOGICAL.Workload
  side: LE
  row: 2
  description: 'desired-state owner: replicas / template / refs / ports / probes (Deployment; StatefulSet / DaemonSet / Job observe the same way)'
- entity_id: LOGICAL.RequestPath
  side: LE
  row: 3
  description: 'who calls whom; addresses (env / DNS / ingress)'
- entity_id: PHYSICAL.ReplicaSet
  side: PE
  row: 4
  description: 'instance lifecycle: scheduled? created? started? healthy?'
- entity_id: PHYSICAL.Pod
  side: PE
  row: 4
  description: 'instance lifecycle: scheduled? created? started? healthy?'
- entity_id: PHYSICAL.Container
  side: PE
  row: 4
  description: 'instance lifecycle: scheduled? created? started? healthy?'
- entity_id: PHYSICAL.Node
  side: PE
  row: 5
  description: 'placement & scope: taints / labels / capacity / cordon'
- entity_id: PHYSICAL.Namespace
  side: PE
  row: 5
  description: 'the namespace scope'
- entity_id: PHYSICAL.Endpoints
  side: PE
  row: 6
  description: 'the svc↔pod binding result'
- entity_id: PHYSICAL.ServiceAccount
  side: PE
  row: 7
  description: 'referenced-existence / bindability'
- entity_id: PHYSICAL.Secret
  side: PE
  row: 7
  description: 'referenced-existence / bindability'
- entity_id: PHYSICAL.ConfigMap
  side: PE
  row: 7
  description: 'referenced-existence / bindability'
- entity_id: PHYSICAL.PVC
  side: PE
  row: 7
  description: 'referenced-existence / bindability'
- entity_id: PHYSICAL.PV
  side: PE
  row: 7
  description: 'referenced-existence / bindability'
- entity_id: PHYSICAL.StorageClass
  side: PE
  row: 7
  description: 'referenced-existence / bindability'
- entity_id: PHYSICAL.ResourceQuota
  side: PE
  row: 8
  description: 'creation permission'
- entity_id: PHYSICAL.NetworkPolicy
  side: PE
  row: 8
  description: 'traffic permission'
- entity_id: PHYSICAL.RoleBinding
  side: PE
  row: 8
  description: 'creation permission'
- entity_id: PHYSICAL.Event
  side: PE
  row: 9
  description: 'the mechanism record (why X failed)'
- entity_id: PHYSICAL.LogStream
  side: PE
  row: 10
  description: 'telemetry surface per entity'
- entity_id: PHYSICAL.MetricSeries
  side: PE
  row: 10
  description: 'telemetry surface per entity'
- entity_id: PHYSICAL.Alert
  side: PE
  row: 10
  description: 'telemetry surface per entity'
- entity_id: PHYSICAL.CodeArtifact
  side: PE
  row: 11
  description: 'source-defect surface: which file / function carries the fault'
- entity_id: PHYSICAL.NodeService
  side: PE
  row: 12
  description: 'node-internal mechanism: why pods on this node cannot run'

relations:
- id: 1
  class: ARCS
  relation: 'Deployment → ReplicaSet → Pod'
  entities: [LOGICAL.Workload, PHYSICAL.Pod]
  carries: 'desired→actual replica chain'
  slot:
    tools: [GetResources]
    read: 'deployments / replicasets / pods'
- id: 2
  class: ARCS
  relation: 'Service → Endpoints ← Pod'
  entities: [LOGICAL.Service, PHYSICAL.Endpoints, PHYSICAL.Pod]
  carries: 'selector match + readiness'
  slot:
    tools: [GetResources, DescribeResource]
    read: 'services · endpoints; pods --show-labels'
- id: 3
  class: ARCS
  relation: 'Pod → Node'
  entities: [PHYSICAL.Pod, PHYSICAL.Node]
  carries: 'scheduling constraints vs node state'
  slot:
    tools: [DescribeResource, GetClusterConfiguration, CheckNodeServiceStatus]
    read: 'pod: Events FailedScheduling, Node-Selectors; node: Unschedulable / taints'
- id: 4
  class: ARCS
  relation: 'spec → ServiceAccount / Secret / ConfigMap / PVC-PV; image → registry'
  entities: [LOGICAL.Workload, PHYSICAL.ServiceAccount, PHYSICAL.Secret, PHYSICAL.ConfigMap, PHYSICAL.PVC, PHYSICAL.PV]
  carries: 'referenced-existence / pullability'
  slot:
    tools: [GetAppYAML, GetResources]
    read: 'existence; pod Events (FailedMount / image-pull messages)'
- id: 5
  class: ARCS
  relation: 'creation admission → ResourceQuota / RoleBinding / ServiceAccount'
  entities: [LOGICAL.Workload, PHYSICAL.ResourceQuota, PHYSICAL.RoleBinding, PHYSICAL.ServiceAccount]
  carries: 'creation permission'
  slot:
    tools: [GetResources]
    read: 'resourcequota · rolebindings · serviceaccounts; pod Events (FailedCreate message family)'
- id: 6
  class: ARCS
  relation: 'Container → probes (liveness / readiness)'
  entities: [PHYSICAL.Container]
  carries: 'health gating'
  slot:
    tools: [DescribeResource, GetAppYAML]
    read: 'pod: probe failures, restarts; probe config'
- id: 7
  class: PAS
  relation: 'Service ↔ Service (dependency / addressing)'
  entities: [LOGICAL.Service]
  carries: 'call reachability & addresses'
  slot:
    tools: [GetServiceDependencies, CheckServiceConnectivity, GetAppYAML, GetErrorLogs]
    read: 'call edges · connectivity probes · env addresses · error logs'
- id: 8
  class: observation
  relation: 'entity → telemetry surface'
  entities: [PHYSICAL.LogStream, PHYSICAL.MetricSeries, PHYSICAL.Alert]
  carries: 'anomaly signals'
  slot:
    tools: [GetAlerts, GetErrorLogs, GetRecentLogs]
    read: 'anomaly signals (alerts are a pointer, not evidence — see plan §4)'
- id: 9
  class: observation
  relation: 'Workload → code artifact (code/)'
  entities: [LOGICAL.Workload, PHYSICAL.CodeArtifact]
  carries: 'defect localization: error message → file / function → code evidence'
  slot:
    tools: [GetErrorLogs, GetRecentLogs, ListCodeFiles, GetSourceCode]
    read: 'message → file/function → code evidence (Boutique-only hard gate)'
- id: 10
  class: ARCS
  relation: 'Node → node runtime services'
  entities: [PHYSICAL.Node, PHYSICAL.NodeService]
  carries: 'node-side mechanism (e.g. containerd down)'
  slot:
    tools: [CheckNodeServiceStatus]
    read: 'node service status (containerd / kubelet …)'

symptom_slices:
- template: 'Partial Service Unreachability.'
  cases: {boutique: 220, trainticket: 70}
  entry_chain: 'reachability chain: caller error logs → endpoint binding → owner chain → stage evidence'
- template: 'Service Availability Disruption.'
  cases: {boutique: 214, trainticket: 87}
  entry_chain: 'same reachability chain (spans scheduling / startup / … stages)'
- template: 'Service Performance Degradation.'
  cases: {boutique: 51, trainticket: 0}
  entry_chain: 'telemetry entry: GetAlerts → object-layer exclusion'
- template: 'Service abnormal restart.'
  cases: {boutique: 36, trainticket: 0}
  entry_chain: 'health chain: restarts → probe / OOM evidence'
- template: 'Service latency increased significantly'
  cases: {boutique: 18, trainticket: 0}
  entry_chain: 'telemetry (as Performance Degradation)'
- template: 'Service quality degradation.'
  cases: {boutique: 11, trainticket: 47}
  entry_chain: 'telemetry (as Performance Degradation)'

# ---------------------------------------------------------------------------
# Schema 注记（dlr-obs = DLR 的非数据库形态；对照 sources/configs/DLR 下 dlr 型 yaml）：
# - 共享词汇与约定：LE/PE 双侧、ARCS（纵向锚定）/PAS（横向路由）类别、LOGICAL./PHYSICAL. id、
#   描述纪律（只写源自身事实；不写题面口径与实例级事实）。
# - 差异：无 databases / attributes（数据源是 K8s 快照而非数据库）；关系携带**观测槽**
#   （slot = 工具 → 读哪段）——本形态的核心列（agent 依它找数据，见方案 §四）。
# - 实体粒度：按方案 §3.1 行 1:1 序列化（row 回指行号）；分组行拆为逐 kind 实体、共享描述。
# - build 接入：本文件是 L1 源；由 tsm build 相应 builder（按 mapping_type 分派）编译为
#   运行态（向量 + 图）。该 builder 与运行时服务属**实现外延**（契约在内、实现在外），尚未实现。
# - 源：LLM4Ops/Cloud-OpsBench @ ea05daf（main，2026-10-06；2026-10-10 拉取、树干净）。
# ---------------------------------------------------------------------------
