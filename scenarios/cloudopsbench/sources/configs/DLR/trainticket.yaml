# Cloud-OpsBench 场景 · L1（dlr-state）—— trainticket
#
# 结构（DLR 词汇，v3 · 2026-10-12）：
#   LE = **可指认的对象**（名字 + 描述）——不设 kind / 基类；语义全走边与名字。
#   每服务三件（拆分判据：可指认 ∧ 面群同锚 ∧ 母 LE 不空）：
#     业务对象 <svc>          PE：调用依赖清单（service_name 锚）+ 源码（boutique）
#     部署载体 <svc>-deploy   PE：deployment / pods / service_endpoints（app_label 锚）
#     观测集合 <svc>-obs      PE：telemetry / logs（service_name 锚）
#   边：调用（service→service）· 部署载体（<svc>→<svc>-deploy）· 观测信号（<svc>-deploy→<svc>-obs）。
#   节点 / 命名空间为对象 LE；调度是实例事实（读 pods 面的 node 字段指到节点），schema 不连边。
# 锚 = **剪枝**：A 是取数时的 WHERE 键——每个面都带锚定读法（S 里的 read: 模板），
#     返回体 = 该对象的薄切片而不是集群全量；唯一合法的全量 = 首轮症状扫描（找锚），其后一律收窄。
# 边界：实例（pod 名 / IP / 状态值 / 日志内容）不入模型——由 agent 经工具沿面实查。
# 源：LLM4Ops/Cloud-OpsBench @ ea05daf（2026-10-10 拉取）；调用图/名册自 tool_cache 样本抽取。

mapping_type: dlr-state
version: '3.0'
scenario_name: dlr_cloudopsbench_trainticket
description: trainticket system of Cloud-OpsBench — its services (business objects with their deployment carriers
  and observation sets), nodes and namespace (LE), the resource / observation surfaces through which each object's
  state is read from deterministic Kubernetes snapshots (PE), and the call / carrier / signal edges (PAS).
source:
  kind: kubernetes-state-snapshots
  repo: LLM4Ops/Cloud-OpsBench
  pin: ea05daf
  system: trainticket
logical_entities:
- logical_entity_id: LOGICAL.trainticket.ts-ui-dashboard
  biz_name: ts-ui-dashboard
  description: Train-Ticket web UI — the browser-facing dashboard (entry of user traffic).
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.ts-ui-dashboard.deps
    resource: service dependency graph
    A:
      cardinality: 1:N
      key: service_name
    R: null
    S: 'the call relationships of this service as captured in the snapshot — upstream (called by) and downstream
      (calls)；read: GetServiceDependencies(service_name=<svc>)'
    attributes:
    - name: upstream
      description: who calls this service — the symptom usually enters from here; read from the dependency graph
    - name: downstream
      description: services this one calls — call failures originate on these edges; read from the dependency graph
- logical_entity_id: LOGICAL.trainticket.ts-ui-dashboard.deploy
  biz_name: ts-ui-dashboard-deploy
  description: The Kubernetes deployment carrier of ts-ui-dashboard — the Deployment / Pod / Endpoint resource instances
    that realize it (image, probes, ports, placement, reachability). Every surface here is anchored by the app label.
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.ts-ui-dashboard.deployment
    resource: deployments
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: 'desired state of the service — replicas, pod template (image / probes / ports), service account and config
      references；read: GetAppYAML(app_name=<svc>) / GetResources(deployments, label_selector=app=<svc>)'
    attributes:
    - name: app_label
      description: the identifying application label (app=ts-ui-dashboard) shared by every surface of this service
      public: true
    - name: replicas
      description: desired vs ready replica count (AVAILABLE) — 0/1 means the service is drained; read from the
        deployments listing or the app YAML
    - name: probes
      description: liveness / readiness probe configuration (protocol / port / timing / commands) — a probe that
        can never succeed restarts containers in a loop; read from the app YAML
    - name: env_addresses
      description: downstream call addresses carried as environment variables (host:port of the services this one
        calls) — the addressing surface for call failures; read from the app YAML
    - name: config_refs
      description: referenced objects — serviceAccountName, secrets / configmaps, PVC-PV claims, image reference;
        missing refs surface as pod events (FailedCreate / FailedMount / image-pull messages)
  - physical_entity_id: PHYSICAL.trainticket.ts-ui-dashboard.pods
    resource: pods
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'instances — scheduling, creation, startup and health of the containers running this service；read: GetResources(pods,
      label_selector=app=<svc>) → DescribeResource(pod, name=<命中>)'
    attributes:
    - name: app_label
      description: application label of the pod set (app=ts-ui-dashboard)
      public: true
    - name: phase_status
      description: pod phase and container states — Running / Pending / CrashLoopBackOff / ImagePullBackOff / ErrImagePull
        / ContainerCreating (STATUS column of the pods listing)
    - name: restarts
      description: container restart count — the first-level liveness symptom; the outlier row among healthy peers
        (RESTARTS column)
    - name: last_termination
      description: last terminated container state — reason + exit code (Error 143 = SIGTERM sent by kubelet; OOMKilled
        137 = memory limit hit); read from the pod detail
    - name: node
      description: node the pod is placed on — placement surface to pair with node state (taints / capacity / cordon);
        read from the pod detail or pods -o wide
    - name: events
      description: 'pod events — the mechanism record: FailedScheduling / FailedCreate / FailedMount / FailedAttachVolume
        / Unhealthy (probe) / Killing / BackOff / image-pull messages; read from the pod detail Events section'
  - physical_entity_id: PHYSICAL.trainticket.ts-ui-dashboard.service_endpoints
    resource: services + endpoints
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: 'reachability as seen by callers — the Service object and its endpoint binding result；read: GetResources(services,
      name=<svc>)（+ GetResources(endpoints, name=<svc>) 对照）'
    attributes:
    - name: cluster_ip_ports
      description: ClusterIP and port mapping (port → targetPort → protocol) — a wrong mapping leaves callers with
        connection failures; read from the services listing / service detail
    - name: selector_match
      description: label selector → matched pods; a selector matching nothing leaves the endpoints empty
    - name: endpoints_binding
      description: ready addresses bound to the service (<none> = no serving pod) — the surface behind caller-side
        'connection refused' logs; read from the endpoints object
- logical_entity_id: LOGICAL.trainticket.ts-ui-dashboard.obs
  biz_name: ts-ui-dashboard-obs
  description: The observation signal set of ts-ui-dashboard's deployment instances — anomaly alerts / metrics and
    the application log stream captured in the snapshot. Anchored by service name.
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.ts-ui-dashboard.telemetry
    resource: alerts + metrics
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'anomaly signals — self-describing alerts and, when the snapshot carries them, performance metric series
      (alerts are a symptom pointer: close on object-layer evidence)；read: GetAlerts()（按 <svc> 收窄阅读；告警是指针，证据回对象层闭环）'
    attributes:
    - name: alerts
      description: active alerts naming entity and anomaly class (e.g. latency percentiles before → after) — read
        with GetAlerts
    - name: metrics
      description: metric readings (latency / error / resource usage) present only in performance-manifesting snapshots
        — read with GetAlerts
  - physical_entity_id: PHYSICAL.trainticket.ts-ui-dashboard.logs
    resource: logs
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'application log stream of the service as captured in the snapshot；read: GetRecentLogs(service_name=<svc>)
      / GetErrorLogs(service_name=<svc>)'
    attributes:
    - name: recent_logs
      description: recent log lines of ts-ui-dashboard — routine and abnormal messages; read with GetRecentLogs(service_name=ts-ui-dashboard)
    - name: error_logs
      description: error-level log lines — connection failures, panics, gRPC/HTTP exceptions, business errors; the
        causal narrative surface; read with GetErrorLogs
