- logical_entity_id: LOGICAL.trainticket.tsdb-mysql.deploy
  biz_name: tsdb-mysql-deploy
  description: The Kubernetes deployment carrier of tsdb-mysql — the Deployment / Pod / Endpoint resource instances
    that realize it (image, probes, ports, placement, reachability). Every surface here is anchored by the app label.
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.tsdb-mysql.deployment
    resource: deployments
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: 'desired state of the service — replicas, pod template (image / probes / ports), service account and config
      references；read: GetAppYAML(app_name=<svc>) / GetResources(deployments, label_selector=app=<svc>)'
    attributes:
    - name: app_label
      description: the identifying application label (app=tsdb-mysql) shared by every surface of this service
      public: true
    - name: replicas
      description: desired vs ready replica count (AVAILABLE) — 0/1 means the service is drained; read from the
        deployments listing or the app YAML
    - name: probes
      description: liveness / readiness probe configuration (protocol / port / timing / commands) — a probe that
        can never succeed restarts containers in a loop; read from the app YAML
    - name: env_addresses
      description: downstream call addresses carried as environment variables (host:port of the services this one
        calls) — the addressing surface for call failures; read from the app YAML
    - name: config_refs
      description: referenced objects — serviceAccountName, secrets / configmaps, PVC-PV claims, image reference;
        missing refs surface as pod events (FailedCreate / FailedMount / image-pull messages)
  - physical_entity_id: PHYSICAL.trainticket.tsdb-mysql.pods
    resource: pods
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'instances — scheduling, creation, startup and health of the containers running this service；read: GetResources(pods,
      label_selector=app=<svc>) → DescribeResource(pod, name=<命中>)'
    attributes:
    - name: app_label
      description: application label of the pod set (app=tsdb-mysql)
      public: true
    - name: phase_status
      description: pod phase and container states — Running / Pending / CrashLoopBackOff / ImagePullBackOff / ErrImagePull
        / ContainerCreating (STATUS column of the pods listing)
    - name: restarts
      description: container restart count — the first-level liveness symptom; the outlier row among healthy peers
        (RESTARTS column)
    - name: last_termination
      description: last terminated container state — reason + exit code (Error 143 = SIGTERM sent by kubelet; OOMKilled
        137 = memory limit hit); read from the pod detail
    - name: node
      description: node the pod is placed on — placement surface to pair with node state (taints / capacity / cordon);
        read from the pod detail or pods -o wide
    - name: events
      description: 'pod events — the mechanism record: FailedScheduling / FailedCreate / FailedMount / FailedAttachVolume
        / Unhealthy (probe) / Killing / BackOff / image-pull messages; read from the pod detail Events section'
  - physical_entity_id: PHYSICAL.trainticket.tsdb-mysql.service_endpoints
    resource: services + endpoints
    A:
      cardinality: '1:1'
      key: app_label
    R: null
    S: 'reachability as seen by callers — the Service object and its endpoint binding result；read: GetResources(services,
      name=<svc>)（+ GetResources(endpoints, name=<svc>) 对照）'
    attributes:
    - name: cluster_ip_ports
      description: ClusterIP and port mapping (port → targetPort → protocol) — a wrong mapping leaves callers with
        connection failures; read from the services listing / service detail
    - name: selector_match
      description: label selector → matched pods; a selector matching nothing leaves the endpoints empty
    - name: endpoints_binding
      description: ready addresses bound to the service (<none> = no serving pod) — the surface behind caller-side
        'connection refused' logs; read from the endpoints object
- logical_entity_id: LOGICAL.trainticket.tsdb-mysql.obs
  biz_name: tsdb-mysql-obs
  description: The observation signal set of tsdb-mysql's deployment instances — anomaly alerts / metrics and the
    application log stream captured in the snapshot. Anchored by service name.
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.tsdb-mysql.telemetry
    resource: alerts + metrics
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'anomaly signals — self-describing alerts and, when the snapshot carries them, performance metric series
      (alerts are a symptom pointer: close on object-layer evidence)；read: GetAlerts()（按 <svc> 收窄阅读；告警是指针，证据回对象层闭环）'
    attributes:
    - name: alerts
      description: active alerts naming entity and anomaly class (e.g. latency percentiles before → after) — read
        with GetAlerts
    - name: metrics
      description: metric readings (latency / error / resource usage) present only in performance-manifesting snapshots
        — read with GetAlerts
  - physical_entity_id: PHYSICAL.trainticket.tsdb-mysql.logs
    resource: logs
    A:
      cardinality: 1:N
      key: app_label
    R: null
    S: 'application log stream of the service as captured in the snapshot；read: GetRecentLogs(service_name=<svc>)
      / GetErrorLogs(service_name=<svc>)'
    attributes:
    - name: recent_logs
      description: recent log lines of tsdb-mysql — routine and abnormal messages; read with GetRecentLogs(service_name=tsdb-mysql)
    - name: error_logs
      description: error-level log lines — connection failures, panics, gRPC/HTTP exceptions, business errors; the
        causal narrative surface; read with GetErrorLogs
- logical_entity_id: LOGICAL.trainticket.node.master
  biz_name: master
  description: Kubernetes node master of the trainticket cluster — a placement target with its own runtime services;
    hosts service pods and can itself be the fault object (node-side faults).
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.node.master.node
    resource: nodes
    A:
      cardinality: '1:1'
      key: node_name
    R: null
    S: 'the node object — placement-related state；read: DescribeResource(node, name=<node>) / GetClusterConfiguration()'
    attributes:
    - name: node_name
      description: node identity (master)
      public: true
    - name: conditions
      description: Ready / MemoryPressure / DiskPressure / PIDPressure condition rows
    - name: taints_labels
      description: taints and labels — what the scheduler filters on; node affinity / selector mismatches show here
    - name: capacity_allocatable
      description: CPU / memory capacity vs allocatable — insufficient capacity blocks scheduling
    - name: unschedulable
      description: cordoned (Unschedulable) flag — a cordoned node receives no new pods; read from the node listing
        / cluster configuration
  - physical_entity_id: PHYSICAL.trainticket.node.master.node_services
    resource: node runtime services
    A:
      cardinality: 1:N
      key: node_name
    R: null
    S: 'node-internal mechanisms — systemd services on the node (why pods on this node cannot run)；read: CheckNodeServiceStatus(node_name=<node>,
      service_name=kubelet|containerd|kube-proxy|…)'
    attributes:
    - name: kubelet
      description: kubelet status (active/inactive) — kubelet down breaks the node's pod lifecycle
    - name: containerd
      description: container runtime status (active/inactive) — a dead containerd stops all container operations
        on the node
    - name: kube_proxy
      description: kube-proxy status — forwarding rules for service traffic
    - name: kube_scheduler
      description: kube-scheduler status (master-side) — where scheduling is decided; read with CheckNodeServiceStatus(node_name,
        service_name)
