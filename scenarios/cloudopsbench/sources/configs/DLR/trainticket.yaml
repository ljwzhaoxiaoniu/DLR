- logical_entity_id: LOGICAL.trainticket.namespace
  biz_name: train-ticket namespace
  description: 'The train-ticket namespace — the scope of the system: admission objects (service accounts, RBAC,
    quotas, network policies) and referenced config storage live here; namespace-level faults block object creation
    or traffic wholesale.'
  physical_entities:
  - physical_entity_id: PHYSICAL.trainticket.namespace.serviceaccounts
    resource: serviceaccounts
    A:
      cardinality: 1:N
      key: namespace
    R: null
    S: service accounts referenced by workload specs — creation admission surface
    attributes:
    - name: serviceaccounts
      description: 'existing service accounts; a spec referencing a missing one fails pod creation (FailedCreate:
        serviceaccount not found)'
  - physical_entity_id: PHYSICAL.trainticket.namespace.rolebindings
    resource: rolebindings
    A:
      cardinality: 1:N
      key: namespace
    R: null
    S: RBAC bindings — creation permission surface
    attributes:
    - name: rolebindings
      description: role bindings in the namespace; missing bindings surface as FailedCreate (forbidden) on pods
  - physical_entity_id: PHYSICAL.trainticket.namespace.resourcequotas
    resource: resourcequota
    A:
      cardinality: 1:N
      key: namespace
    R: null
    S: namespace quota limits — creation admission surface
    attributes:
    - name: hard_used
      description: quota hard limits vs used — exceeded CPU / memory / pod / service / storage quota blocks new
        objects (FailedCreate with quota message)
  - physical_entity_id: PHYSICAL.trainticket.namespace.networkpolicies
    resource: networkpolicies
    A:
      cardinality: 1:N
      key: namespace
    R: null
    S: traffic permission surface
    attributes:
    - name: networkpolicies
      description: pod-selector traffic rules — a policy matching the service can silently drop callers' traffic
  - physical_entity_id: PHYSICAL.trainticket.namespace.config_objects
    resource: configmaps + secrets + pvc/pv
    A:
      cardinality: 1:N
      key: namespace
    R: null
    S: referenced config storage — existence and bindability surface
    attributes:
    - name: configmaps_secrets
      description: configmaps and secrets present in the namespace — missing entries surface as FailedMount / CreateContainerConfigError
    - name: volumes
      description: PVC / PV / StorageClass bindability — mismatched selector / class / access mode / capacity leaves
        claims Pending
