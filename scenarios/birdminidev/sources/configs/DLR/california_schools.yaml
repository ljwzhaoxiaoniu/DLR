mapping_type: dlr
version: '2.0'
scenario_name: dlr_california_schools
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
description: 'California public schools: school profile (location, district, grade span, charter/funding) and academic performance (SAT/ACT scores, FRPM enrollment).'
  multi-view decoupling'
databases:
  california_schools: sqlite:///MINIDEV_sqlite/dev_databases/california_schools/california_schools.sqlite
logical_entities:
- logical_entity_id: LOGICAL.School
  biz_name: School
  description: California school profile — CDSCode, School name, Street, City, County, District, Zip, State, Charter, FundingType
  physical_entities:
  - physical_entity_id: PHYSICAL.School
    physical_table_name: schools
    physical_table_id: california_schools.schools
    A:
      cardinality: '1:1'
      key: CDSCode
    R: null
    S: School master — CDSCode, name, address, district
    attributes:
    - column: california_schools.schools.CDSCode
      biz_name: SchoolCode
      description: ''
      public: true
    - column: california_schools.schools.School
      biz_name: SchoolName
      description: School name
      public: true
    - column: california_schools.schools.Street
      biz_name: Street
      description: Street address
      public: true
    - column: california_schools.schools.City
      biz_name: City
      description: City name
      public: true
    - column: california_schools.schools.State
      biz_name: State
      description: State code
      public: true
    - column: california_schools.schools.Zip
      biz_name: Zip
      description: Zip code
      public: true
    - column: california_schools.schools.County
      biz_name: County
      description: County name
      public: true
    - column: california_schools.schools.District
      biz_name: District
      description: District
    - column: california_schools.schools.Phone
      biz_name: Phone
      description: Phone
    - column: california_schools.schools.Virtual
      biz_name: Virtual
      description: 'This field identifies the type of virtual instruction offered by the school. Virtual instruction is instruction
        in which students and teachers are separated by time and/or location, and interaction occurs via computers and/or
        telecommunications technologies.. The field is coded as follows: · F = Exclusively Virtual – The school has no physical
        building where students meet with each other or with teachers, all instruction is virtual. · V = Primarily Virtual
        – The school focuses on a systematic program of virtual instruction but includes some physical meetings among students
        or with teachers. · C = Primarily Classroom – The school offers virtual courses but virtual instruction is not the
        primary means of instruction. · N = Not Virtual – The school does not offer any virtual instruction. · P = Partial
        Virtual – The school offers some, but not all, instruction through virtual instruction. Note: This value was retired
        and replaced with the Primarily Virtual and Primarily Classroom values beginning with the 2016–17 school year.'
    - column: california_schools.schools.Charter
      biz_name: Charter
      description: 'This field identifies a charter school.. The field is coded as follows: · 1 = The school is a charter
        · 0 = The school is not a charter'
    - column: california_schools.schools.CharterNum
      biz_name: CharterNum
      description: The charter school number,. 4-digit number assigned to a charter school.
    - column: california_schools.schools.FundingType
      biz_name: FundingType
      description: 'Indicates the charter school funding type. Values are as follows: · Not in CS (California School) funding
        model · Locally funded · Directly funded'
    - column: california_schools.schools.DOC
      biz_name: District Ownership Code
      description: 'District Ownership Code. The District Ownership Code (DOC) is the numeric code used to identify the category
        of the Administrative Authority. • 00 - County Office of Education • 02 – State Board of Education • 03 – Statewide
        Benefit Charter • 31 – State Special Schools • 34 – Non-school Location* • 52 – Elementary School District • 54 –
        Unified School District • 56 – High School District • 98 – Regional Occupational Center/Program (ROC/P) commonsense
        evidence: *Only the California Education Authority has been included in the non-school location category.'
    - column: california_schools.schools.SOC
      biz_name: School Ownership Code
      description: The School Ownership Code is a numeric code used to identify the type of school.. • 08 - Preschool • 09
        – Special Education Schools (Public) • 11 – Youth Authority Facilities (CEA) • 13 – Opportunity Schools • 14 – Juvenile
        Court Schools • 15 – Other County or District Programs • 31 – State Special Schools • 60 – Elementary School (Public)
        • 61 – Elementary School in 1 School District (Public) • 62 – Intermediate/Middle Schools (Public) • 63 – Alternative
        Schools of Choice • 64 – Junior High Schools (Public) • 65 – K-12 Schools (Public) • 66 – High Schools (Public) •
        67 – High Schools in 1 School District (Public) • 68 – Continuation High Schools • 69 – District Community Day Schools
        • 70 – Adult Education Centers • 98 – Regional Occupational Center/Program (ROC/P)
    - column: california_schools.schools.EdOpsCode
      biz_name: Education Option Code
      description: The Education Option Code is a short text description of the type of education offered.. • ALTSOC – Alternative
        School of Choice • COMM – County Community School • COMMDAY – Community Day School • CON – Continuation School • JUV
        – Juvenile Court School • OPP – Opportunity School • YTH – Youth Authority School • SSS – State Special School • SPEC
        – Special Education School • TRAD – Traditional • ROP – Regional Occupational Program • HOMHOS – Home and Hospital
        • SPECON – District Consortia Special Education School
    - column: california_schools.schools.Magnet
      biz_name: Magnet
      description: 'This field identifies whether a school is a magnet school and/or provides a magnet program.. The field
        is coded as follows: · 1 = Magnet - The school is a magnet school and/or offers a magnet program. · 0 = Not Magnet
        - The school is not a magnet school and/or does not offer a magnet program. commonsense evidence: Note: Preschools
        and adult education centers do not contain a magnet school indicator.'
    - column: california_schools.schools.OpenDate
      biz_name: OpenDate
      description: The date the school opened.
    - column: california_schools.schools.ClosedDate
      biz_name: ClosedDate
      description: The date the school closed.
    - column: california_schools.schools.StatusType
      biz_name: StatusType
      description: 'This field identifies the status of the district.. Definitions of the valid status types are listed below:
        · Active: The district is in operation and providing instructional services. · Closed: The district is not in operation
        and no longer providing instructional services. · Merged: The district has combined with another district or districts.
        · Pending: The district has not opened for operation and instructional services yet, but plans to open within the
        next 9–12 months.'
    - column: california_schools.schools.GSoffered
      biz_name: grade span offered
      description: 'The grade span offered is the lowest grade and the highest grade offered or supported by the school, district,
        or administrative authority. This field might differ from the grade span served as reported in the most recent certified
        California Longitudinal Pupil Achievement (CALPADS) Fall 1 data collection.. For example XYZ School might display
        the following data: GSoffered = P–Adult GSserved = K–12'
    - column: california_schools.schools.GSserved
      biz_name: grade span served.
      description: 'It is the lowest grade and the highest grade of student enrollment as reported in the most recent certified
        CALPADS Fall 1 data collection. Only K–12 enrollment is reported through CALPADS. This field may differ from the grade
        span offered.. commonsense evidence: 1. Only K–12 enrollment is reported through CALPADS 2. Note: Special programs
        at independent study, alternative education, and special education schools will often exceed the typical grade span
        for schools of that type'
    - column: california_schools.schools.MailStreet
      biz_name: MailStreet
      description: 'MailStreet. The unabbreviated mailing address of the school, district, or administrative authority. Note:
        1) Some entities (primarily closed or retired schools) may not have data in this field; 2) Many active entities have
        not provided a mailing street address. For your convenience we have filled the unpopulated MailStreet cells with Street
        data.'
    - column: california_schools.schools.AdmFName1
      biz_name: administrator's first name
      description: 'administrator''s first name. The superintendent’s or principal’s first name. commonsense evidence: Only
        active and pending districts and schools will display administrator information, if applicable.'
    - column: california_schools.schools.AdmLName1
      biz_name: administrator's last name
      description: 'administrator''s last name. The superintendent’s or principal’s last name. commonsense evidence: Only
        active and pending districts and schools will display administrator information, if applicable.'
    - column: california_schools.schools.AdmFName2
      biz_name: AdmFName2
      description: AdmFName2. SAME as 1
    - column: california_schools.schools.AdmLName2
      biz_name: AdmLName2
      description: AdmLName2
    - column: california_schools.schools.AdmFName3
      biz_name: AdmFName3
      description: AdmFName3. not useful
    - column: california_schools.schools.AdmLName3
      biz_name: AdmLName3
      description: AdmLName3. not useful
    - column: california_schools.schools.AdmEmail1
      biz_name: administrator's email address
      description: 'administrator''s email address. The superintendent’s or principal’s email address. commonsense evidence:
        Only active and pending districts and schools will display administrator information, if applicable.'
    - column: california_schools.schools.AdmEmail2
      biz_name: AdmEmail2
      description: AdmEmail2
    - column: california_schools.schools.Longitude
      biz_name: Longitude
      description: The angular distance (expressed in degrees) between the location of the school, district, or administrative
        authority and the prime meridian (Greenwich, England) measured from west to east.. The angular distance (expressed
        in degrees) between the location of the school, district, or administrative authority and the prime meridian (Greenwich,
        England) measured from west to east.
    - column: california_schools.schools.NCESDist
      biz_name: National Center for Educational Statistics school district identification number
      description: This field represents the 7-digit National Center for Educational Statistics (NCES) school district identification
        number. The first 2 digits identify the state and the last 5 digits identify the school district. Combined, they make
        a unique 7-digit ID for each school district.
    - column: california_schools.schools.NCESSchool
      biz_name: National Center for Educational Statistics school identification number
      description: This field represents the 5-digit NCES school identification number. The NCESSchool combined with the NCESDist
        form a unique 12-digit ID for each school.
    - column: california_schools.schools.StreetAbr
      biz_name: street address
      description: 'The abbreviated street address of the school, district, or administrative authority’s physical location..
        The abbreviated street address of the school, district, or administrative authority’s physical location. Note: Some
        records (primarily records of closed or retired schools) may not have data in this field.'
    - column: california_schools.schools.MailStrAbr
      biz_name: mailing street address
      description: 'mailing street address. the abbreviated mailing street address of the school, district, or administrative
        authority.Note: Many active entities have not provided a mailing street address. For your convenience we have filled
        the unpopulated MailStrAbr cells with StreetAbr data.'
    - column: california_schools.schools.MailCity
      biz_name: mailing city
      description: 'mailing city. The city associated with the mailing address of the school, district, or administrative
        authority. Note: Many entities have not provided a mailing address city. For your convenience we have filled the unpopulated
        MailCity cells with City data.'
    - column: california_schools.schools.MailZip
      biz_name: mailing zip
      description: 'mailing zip. The zip code associated with the mailing address of the school, district, or administrative
        authority. Note: Many entities have not provided a mailing address zip code. For your convenience we have filled the
        unpopulated MailZip cells with Zip data.'
    - column: california_schools.schools.MailState
      biz_name: mailing state
      description: mailing state. The state within the mailing address. For your convenience we have filled the unpopulated
        MailState cells with State data.
    - column: california_schools.schools.Ext
      biz_name: extension
      description: The phone number extension of the school, district, or administrative authority.. The phone number extension
        of the school, district, or administrative authority.
    - column: california_schools.schools.Website
      biz_name: Website
      description: The website address of the school, district, or administrative authority.. The website address of the school,
        district, or administrative authority.
    - column: california_schools.schools.DOCType
      biz_name: The District Ownership Code Type
      description: The District Ownership Code Type is the text description of the DOC category.. (See text values in DOC
        field description above)
    - column: california_schools.schools.SOCType
      biz_name: School Ownership Code Type
      description: The School Ownership Code Type is the text description of the type of school.. The School Ownership Code
        Type is the text description of the type of school.
    - column: california_schools.schools.EdOpsName
      biz_name: Educational Option Name
      description: Educational Option Name. The Educational Option Name is the long text description of the type of education
        being offered.
    - column: california_schools.schools.EILCode
      biz_name: Educational Instruction Level Code
      description: The Educational Instruction Level Code is a short text description of the institution's type relative to
        the grade range served.. • A – Adult • ELEM – Elementary • ELEMHIGH – Elementary-High Combination • HS – High School
        • INTMIDJR – Intermediate/Middle/Junior High • PS – Preschool • UG – Ungraded
    - column: california_schools.schools.EILName
      biz_name: Educational Instruction Level Name
      description: The Educational Instruction Level Name is the long text description of the institution’s type relative
        to the grade range served.. The Educational Instruction Level Name is the long text description of the institution’s
        type relative to the grade range served.
    - column: california_schools.schools.Latitude
      biz_name: Latitude
      description: The angular distance (expressed in degrees) between the location of the school, district, or administrative
        authority and the equator measured north to south.. The angular distance (expressed in degrees) between the location
        of the school, district, or administrative authority and the equator measured north to south.
    - column: california_schools.schools.AdmEmail3
      biz_name: AdmEmail3
      description: AdmEmail3. not useful
    - column: california_schools.schools.LastUpdate
      biz_name: LastUpdate
      description: LastUpdate. when is this record updated last time
