mapping_type: dlr
version: '2.0'
scenario_name: dlr_formula_1
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
description: 'Formula 1 racing: drivers, constructors, circuits, races, qualifying/results/lap times, standings, and pit stops.'
  multi-view decoupling'
databases:
  formula_1: sqlite:///MINIDEV_sqlite/dev_databases/formula_1/formula_1.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Driver
  biz_name: Driver
  physical_entities:
  - physical_entity_id: PHYSICAL.Driver
    physical_table_name: drivers
    physical_table_id: formula_1.drivers
    A:
      cardinality: '1:1'
      key: driverId
    R: null
    S: Driver master data
    attributes:
    - column: formula_1.drivers.driverId
      biz_name: DriverID
      description: 'Driver ID: unique F1 driver identifier'
      public: true
    - column: formula_1.drivers.driverRef
      biz_name: driver reference name
      description: driver reference name
    - column: formula_1.drivers.nationality
      biz_name: nationality
      description: nationality of drivers
    - column: formula_1.drivers.forename
      biz_name: forename
      description: forename
    - column: formula_1.drivers.surname
      biz_name: surname
      description: surname
    - column: formula_1.drivers.dob
      biz_name: date of birth
      description: date of birth
    - column: formula_1.drivers.number
      biz_name: number
      description: number
    - column: formula_1.drivers.code
      biz_name: code
      description: abbreviated code for drivers. if "null" or empty, it means it doesn't have code
    - column: formula_1.drivers.url
      biz_name: url
      description: the introduction website of the drivers
- logical_entity_id: LOGICAL.Circuit
  biz_name: Circuit
  physical_entities:
  - physical_entity_id: PHYSICAL.Circuit
    physical_table_name: circuits
    physical_table_id: formula_1.circuits
    A:
      cardinality: '1:1'
      key: circuitId
    R: null
    S: Circuit information
    attributes:
    - column: formula_1.circuits.circuitId
      biz_name: CircuitID
      description: 'Circuit ID: unique F1 circuit identifier'
      public: true
    - column: formula_1.circuits.name
      biz_name: name
      description: full name of circuit
    - column: formula_1.circuits.country
      biz_name: country
      description: country of circuit
    - column: formula_1.circuits.circuitRef
      biz_name: circuit reference name
      description: circuit reference name
    - column: formula_1.circuits.location
      biz_name: location
      description: location of circuit
    - column: formula_1.circuits.lat
      biz_name: latitude
      description: latitude of location of circuit
    - column: formula_1.circuits.lng
      biz_name: longitude
      description: 'longitude of location of circuit. commonsense evidence: Location coordinates: (lat, lng)'
    - column: formula_1.circuits.alt
      biz_name: alt
      description: alt. not useful
    - column: formula_1.circuits.url
      biz_name: url
      description: url
- logical_entity_id: LOGICAL.Race
  biz_name: Race
  description: F1 race event — year, race name, date, circuit; drivers compete with qualifying results, race results (position,
    time, laps), and lap times
  physical_entities:
  - physical_entity_id: PHYSICAL.Race
    physical_table_name: races
    physical_table_id: formula_1.races
    A:
      cardinality: '1:1'
      key: raceId
    R: null
    S: Race master record
    attributes:
    - column: formula_1.races.raceId
      biz_name: RaceID
      description: 'Race ID: unique identifier'
      public: true
    - column: formula_1.races.year
      biz_name: Year
      description: 'Year: race season year'
      public: true
    - column: formula_1.races.name
      biz_name: Name
      description: 'Race name: e.g. Bahrain Grand Prix'
      public: true
    - column: formula_1.races.round
      biz_name: round
      description: round
    - column: formula_1.races.circuitId
      biz_name: Circuit Id
      description: circuit Id
    - column: formula_1.races.date
      biz_name: date
      description: duration time
    - column: formula_1.races.time
      biz_name: time
      description: time of the location
    - column: formula_1.races.url
      biz_name: url
      description: introduction of races
- logical_entity_id: LOGICAL.DriverRaceData
  biz_name: DriverRaceData
  description: 'Driver performance in a race: qualifying + race results + lap times'
  physical_entities:
  - physical_entity_id: PHYSICAL.Qualifying
    physical_table_name: qualifying
    physical_table_id: formula_1.qualifying
    A:
      cardinality: N:1
      key: raceId
    R: null
    S: Qualifying results
    attributes:
    - column: formula_1.qualifying.driverId
      biz_name: Driver
      description: 'Driver ID: FK to drivers table'
      public: true
    - column: formula_1.qualifying.raceId
      biz_name: Race
      description: 'Race ID: FK to races table'
      public: true
    - column: formula_1.qualifying.qualifyId
      biz_name: qualify Id
      description: "the unique identification number identifying qualifying. How does F1 Sprint qualifying work? Sprint qualifying\
        \ is essentially a short-form Grand Prix \x96 a race that is one-third the number of laps of the main event on Sunday.\
        \ However, the drivers are battling for positions on the grid for the start of Sunday's race."
    - column: formula_1.qualifying.number
      biz_name: number
      description: number
    - column: formula_1.qualifying.position
      biz_name: position
      description: position or track of circuit
    - column: formula_1.qualifying.q1
      biz_name: qualifying 1
      description: 'time in qualifying 1. in minutes / seconds / ... commonsense evidence: Q1 lap times determine pole position
        and the order of the front 10 positions on the grid. The slowest driver in Q1 starts 10th, the next starts ninth and
        so on. All 20 F1 drivers participate in the first period, called Q1, with each trying to set the fastest time possible.
        Those in the top 15 move on to the next period of qualifying, called Q2. The five slowest drivers are eliminated and
        will start the race in the last five positions on the grid.'
    - column: formula_1.qualifying.q2
      biz_name: qualifying 2
      description: 'time in qualifying 2. in minutes / seconds / ... commonsense evidence: only top 15 in the q1 has the record
        of q2 Q2 is slightly shorter but follows the same format. Drivers try to put down their best times to move on to Q1
        as one of the 10 fastest cars. The five outside of the top 10 are eliminated and start the race from 11th to 15th
        based on their best lap time.'
    - column: formula_1.qualifying.q3
      biz_name: qualifying 3
      description: 'time in qualifying 3. in minutes / seconds / ... commonsense evidence: only top 10 in the q2 has the record
        of q3'
    - column: formula_1.qualifying.constructorId
      biz_name: constructor id
      description: constructor Id
  - physical_entity_id: PHYSICAL.Result
    physical_table_name: results
    physical_table_id: formula_1.results
    A:
      cardinality: N:1
      key: raceId
    R: null
    S: Race results
    attributes:
    - column: formula_1.results.driverId
      biz_name: Driver
      description: 'Driver ID: FK to drivers table'
      public: true
    - column: formula_1.results.raceId
      biz_name: Race
      description: 'Race ID: FK to races table'
      public: true
    - column: formula_1.results.resultId
      biz_name: Result ID
      description: the unique identification number identifying race result
    - column: formula_1.results.constructorId
      biz_name: constructor Id
      description: the identification number identifying which constructors
    - column: formula_1.results.number
      biz_name: number
      description: number
    - column: formula_1.results.grid
      biz_name: grid
      description: the number identifying the area where cars are set into a grid formation in order to start the race.
    - column: formula_1.results.position
      biz_name: position
      description: The finishing position or track of circuits
    - column: formula_1.results.positionOrder
      biz_name: position order
      description: the finishing order of positions
    - column: formula_1.results.points
      biz_name: points
      description: points
    - column: formula_1.results.laps
      biz_name: laps
      description: lap number
    - column: formula_1.results.time
      biz_name: time
      description: 'finish time. commonsense evidence: 1. if the value exists, it means the driver finished the race. 2. Only
        the time of the champion shows in the format of "minutes: seconds.millionsecond", the time of the other drivers shows
        as "seconds.millionsecond" , which means their actual time is the time of the champion adding the value in this cell.'
    - column: formula_1.results.fastestLap
      biz_name: fastest lap
      description: fastest lap number
    - column: formula_1.results.fastestLapTime
      biz_name: fastest Lap Time
      description: fastest Lap Time. faster (smaller in the value) "fastestLapTime" leads to higher rank (smaller is higher
        rank)
    - column: formula_1.results.fastestLapSpeed
      biz_name: fastest Lap Speed
      description: fastest Lap Speed. (km / h)
    - column: formula_1.results.rank
      biz_name: rank
      description: starting rank positioned by fastest lap speed
    - column: formula_1.results.statusId
      biz_name: status Id
      description: status ID. its category description appear in the table status
    - column: formula_1.results.positionText
      biz_name: position text
      description: position text. not quite useful
    - column: formula_1.results.milliseconds
      biz_name: milliseconds
      description: the actual finishing time of drivers in milliseconds. the actual finishing time of drivers
  - physical_entity_id: PHYSICAL.LapTime
    physical_table_name: lapTimes
    physical_table_id: formula_1.lapTimes
    A:
      cardinality: N:1
      key: raceId
    R: null
    S: Lap times
    attributes:
    - column: formula_1.lapTimes.driverId
      biz_name: Driver
      description: 'Driver ID: FK to drivers table'
      public: true
    - column: formula_1.lapTimes.raceId
      biz_name: Race
      description: 'Race ID: FK to races table'
      public: true
    - column: formula_1.lapTimes.lap
      biz_name: lap
      description: lap number
    - column: formula_1.lapTimes.position
      biz_name: position
      description: position or track of circuits
    - column: formula_1.lapTimes.time
      biz_name: time
      description: lap time. in minutes / seconds / ...
    - column: formula_1.lapTimes.milliseconds
      biz_name: milliseconds
      description: milliseconds
- logical_entity_id: LOGICAL.DriverStandings
  biz_name: DriverStandings
  physical_entities:
  - physical_entity_id: PHYSICAL.DriverStanding
    physical_table_name: driverStandings
    physical_table_id: formula_1.driverStandings
    A:
      cardinality: N:1
      key: raceId
    R: null
    S: Driver season standings
    attributes:
    - column: formula_1.driverStandings.driverId
      biz_name: Driver
      description: ''
      public: true
    - column: formula_1.driverStandings.raceId
      biz_name: Race
      description: ''
      public: true
    - column: formula_1.driverStandings.driverStandingsId
      biz_name: driver Standings Id
      description: the unique identification number identifying driver standing records
    - column: formula_1.driverStandings.points
      biz_name: points
      description: how many points acquired in each race
    - column: formula_1.driverStandings.position
      biz_name: position
      description: position or track of circuits
    - column: formula_1.driverStandings.wins
      biz_name: wins
      description: wins
    - column: formula_1.driverStandings.positionText
      biz_name: position text
      description: position text. same with position, not quite useful
