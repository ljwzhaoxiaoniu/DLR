    - column: european_football_2.Player_Attributes.gk_reflexes
      biz_name: goalkeep reflexes
      description: the player's goalkeep reflexes score. 0-100 which is calculated by FIFA
- logical_entity_id: LOGICAL.Team
  biz_name: Team
  description: Football team — team_long_name, team_short_name, team_fifa_api_id; tactical attributes (buildUpPlay speed/passing,
    chanceCreation, defence) tracked by date
  physical_entities:
  - physical_entity_id: PHYSICAL.Team
    physical_table_name: Team
    physical_table_id: european_football_2.Team
    A:
      cardinality: '1:1'
      key: team_api_id
    R: null
    S: Team basic info — team_api_id, team_fifa_api_id, team_long_name, team_short_name
    attributes:
    - column: european_football_2.Team.team_api_id
      biz_name: TeamID
      description: the id of the team api
      public: true
    - column: european_football_2.Team.team_fifa_api_id
      biz_name: TeamFIFAID
      description: the id of the team fifa api
      public: true
    - column: european_football_2.Team.team_long_name
      biz_name: team_long_name
      description: "the team's long name"
      public: true
    - column: european_football_2.Team.team_short_name
      biz_name: team_short_name
      description: "the team's short name"
      public: true
    - column: european_football_2.Team.id
      biz_name: id
      description: the unique id for teams
  - physical_entity_id: PHYSICAL.TeamAttribute
    physical_table_name: Team_Attributes
    physical_table_id: european_football_2.Team_Attributes
    A:
      cardinality: N:1
      key: team_api_id
    R: null
    S: Team tactical attributes — buildUpPlay speed/passing, chanceCreation, defence
    attributes:
    - column: european_football_2.Team_Attributes.team_api_id
      biz_name: TeamID
      description: the id of the team api
      public: true
    - column: european_football_2.Team_Attributes.buildUpPlaySpeed
      biz_name: buildUpPlaySpeed
      description: 'The speed in which attacks are put together: the score which is between 1-100 to measure the team''s attack speed'
      public: true
    - column: european_football_2.Team_Attributes.buildUpPlayPassing
      biz_name: buildUpPlayPassing
      description: affects passing distance and support from teammates
      public: true
    - column: european_football_2.Team_Attributes.date
      biz_name: TacticsDate
      description: "Date. e.g. 2010-02-22 00:00:00"
      public: true
    - column: european_football_2.Team_Attributes.buildUpPlaySpeedClass
      biz_name: BuildUpPlaySpeedClass
      description: 'The speed class: Slow (1-33) / Balanced (34-66) / Fast (66-100)'
      public: true
    - column: european_football_2.Team_Attributes.buildUpPlayPassingClass
      biz_name: BuildUpPlayPassingClass
      description: 'The passing class: Short (1-33) / Mixed (34-66) / Long (66-100)'
      public: true
    - column: european_football_2.Team_Attributes.buildUpPlayDribbling
      biz_name: build Up Play Dribbling
      description: the tendency/ frequency of dribbling
    - column: european_football_2.Team_Attributes.buildUpPlayDribblingClass
      biz_name: build Up Play Dribbling Class
      description: "the dribbling class. commonsense reasoning: \x95 Little: 1-33 \x95 Normal: 34-66 \x95 Lots: 66-100"
    - column: european_football_2.Team_Attributes.chanceCreationPassing
      biz_name: ChanceCreationPassing
      description: Amount of risk in pass decision and run support
      public: true
    - column: european_football_2.Team_Attributes.chanceCreationPassingClass
      biz_name: ChanceCreationPassingClass
      description: 'The chance creation passing class: Safe (1-33) / Normal (34-66) / Risky (66-100)'
      public: true
    - column: european_football_2.Team_Attributes.chanceCreationCrossing
      biz_name: chance Creation Crossing
      description: The tendency / frequency of crosses into the box
    - column: european_football_2.Team_Attributes.chanceCreationCrossingClass
      biz_name: chance Creation Crossing Class
      description: "the chance creation crossing class. commonsense reasoning: \x95 Little: 1-33 \x95 Normal: 34-66 \x95 Lots:\
        \ 66-100"
    - column: european_football_2.Team_Attributes.chanceCreationShooting
      biz_name: chance Creation Shooting
      description: The tendency / frequency of shots taken
    - column: european_football_2.Team_Attributes.chanceCreationShootingClass
      biz_name: chance Creation Shooting Class
      description: "the chance creation shooting class. commonsense reasoning: \x95 Little: 1-33 \x95 Normal: 34-66 \x95 Lots:\
        \ 66-100"
    - column: european_football_2.Team_Attributes.defencePressure
      biz_name: defence Pressure
      description: Affects how high up the pitch the team will start pressuring
    - column: european_football_2.Team_Attributes.defencePressureClass
      biz_name: defence Pressure Class
      description: "the defence pressure class. commonsense reasoning: \x95 Deep: 1-33 \x95 Medium: 34-66 \x95 High: 66-100"
    - column: european_football_2.Team_Attributes.defenceAggression
      biz_name: defence Aggression
      description: "Affect the team\x92s approach to tackling the ball possessor"
    - column: european_football_2.Team_Attributes.defenceAggressionClass
      biz_name: DefenceAggressionClass
      description: 'The defence aggression class: Contain (1-33) / Press (34-66) / Double (66-100)'
      public: true
    - column: european_football_2.Team_Attributes.defenceTeamWidth
      biz_name: defence Team Width
      description: Affects how much the team will shift to the ball side
    - column: european_football_2.Team_Attributes.defenceTeamWidthClass
      biz_name: defence Team Width Class
      description: "the defence team width class. commonsense reasoning: \x95 Narrow: 1-33 \x95 Normal: 34-66 \x95 Wide: 66-100"
    - column: european_football_2.Team_Attributes.defenceDefenderLineClass
      biz_name: defence Defender Line Class
      description: Affects the shape and strategy of the defence. Cover/ Offside Trap
    - column: european_football_2.Team_Attributes.chanceCreationPositioningClass
      biz_name: chance Creation Positioning Class
      description: "A team\x92s freedom of movement in the final third of the pitch. Organised / Free Form"
    - column: european_football_2.Team_Attributes.buildUpPlayPositioningClass
      biz_name: build Up Play Positioning Class
      description: A team's freedom of movement in the 1st two thirds of the pitch. Organised / Free Form
    - column: european_football_2.Team_Attributes.id
      biz_name: id
      description: the unique id for teams
    - column: european_football_2.Team_Attributes.team_fifa_api_id
      biz_name: TeamFIFAID
      description: the id of the team fifa api
      public: true
