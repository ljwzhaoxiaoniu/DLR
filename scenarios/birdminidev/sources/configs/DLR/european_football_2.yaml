# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
description: 'European football: players and teams with FIFA-style skill attributes, leagues, and match results.'
databases:
  european_football_2: sqlite:///MINIDEV_sqlite/dev_databases/european_football_2/european_football_2.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Player
  biz_name: Player
  description: Football player — player_name, birthday, height, weight, and FIFA skill ratings (overall_rating, potential,
    finishing, dribbling, sprint_speed, etc.) tracked by date
  physical_entities:
  - physical_entity_id: PHYSICAL.Player
    physical_table_name: Player
    physical_table_id: european_football_2.Player
    A:
      cardinality: '1:1'
      key: player_api_id
    R: null
    S: Player basic info — name, birthday, height, weight
    attributes:
    - column: european_football_2.Player.player_api_id
      biz_name: PlayerID
      description: the id of the player api
      public: true
    - column: european_football_2.Player.player_name
      biz_name: player_name
      description: player name
      public: true
    - column: european_football_2.Player.birthday
      biz_name: birthday
      description: 'The player''s birthday. Player A is older than player B when A''s birthday is earlier than B''s'
      public: true
    - column: european_football_2.Player.height
      biz_name: height
      description: 'The player''s height'
      public: true
    - column: european_football_2.Player.weight
      biz_name: weight
      description: 'The player''s weight'
      public: true
    - column: european_football_2.Player.player_fifa_api_id
      biz_name: PlayerFIFAID
      description: the id of the player fifa api
      public: true
    - column: european_football_2.Player.id
      biz_name: id
      description: the unique id for players
  - physical_entity_id: PHYSICAL.PlayerAttribute
    physical_table_name: Player_Attributes
    physical_table_id: european_football_2.Player_Attributes
    A:
      cardinality: N:1
      key: player_api_id
    R: null
    S: Player FIFA attributes — overall_rating, potential, and skill ratings tracked by date
    attributes:
    - column: european_football_2.Player_Attributes.player_api_id
      biz_name: PlayerID
      description: the id of the player api
      public: true
    - column: european_football_2.Player_Attributes.overall_rating
      biz_name: overall_rating
      description: The overall rating of the player (0-100 which is calculated by FIFA)
      public: true
    - column: european_football_2.Player_Attributes.potential
      biz_name: potential
      description: "potential of the player. commonsense reasoning: The potential score is between 0-100 which is calculated by FIFA. Higher potential score means that the player has more potential"
      public: true
    - column: european_football_2.Player_Attributes.date
      biz_name: RatingDate
      description: "date. e.g. 2016-02-18 00:00:00"
      public: true
    - column: european_football_2.Player_Attributes.heading_accuracy
      biz_name: heading_accuracy
      description: 'Heading accuracy: head ball precision score'
      public: true
    - column: european_football_2.Player_Attributes.sprint_speed
      biz_name: sprint_speed
      description: 'Sprint speed: sprinting speed score'
      public: true
    - column: european_football_2.Player_Attributes.finishing
      biz_name: finishing
      description: 'Finishing: shot finishing ability score'
      public: true
    - column: european_football_2.Player_Attributes.dribbling
      biz_name: dribbling
      description: 'Dribbling: ball control while running score'
      public: true
    - column: european_football_2.Player_Attributes.ball_control
      biz_name: ball_control
      description: 'Ball control: overall ball handling score'
      public: true
    - column: european_football_2.Player_Attributes.crossing
      biz_name: crossing
      description: 'Crossing: cross pass accuracy score'
      public: true
    - column: european_football_2.Player_Attributes.short_passing
      biz_name: short_passing
      description: 'Short passing: short distance pass accuracy score'
      public: true
    - column: european_football_2.Player_Attributes.long_shots
      biz_name: long_shots
      description: 'Long shots: long distance shooting score'
      public: true
    - column: european_football_2.Player_Attributes.free_kick_accuracy
      biz_name: free_kick_accuracy
      description: 'Free kick accuracy: free kick precision score'
      public: true
    - column: european_football_2.Player_Attributes.jumping
      biz_name: jumping
      description: 'Jumping: jumping height/ability score'
      public: true
    - column: european_football_2.Player_Attributes.preferred_foot
      biz_name: PreferredFoot
      description: 'The player''s preferred foot when attacking: right/ left'
      public: true
    - column: european_football_2.Player_Attributes.attacking_work_rate
      biz_name: AttackingWorkRate
      description: 'The player''s attacking work rate. high: implies that the player is going to be in all of your attack moves; medium: implies that the player will select the attack actions he will join in; low: remain in his position while the team attacks'
      public: true
    - column: european_football_2.Player_Attributes.defensive_work_rate
      biz_name: DefensiveWorkRate
      description: 'The player''s defensive work rate. high: remain in his position and defense while the team attacks; medium: implies that the player will select the defensive actions he will join in; low: implies that the player is going to be in all of your attack moves instead of defensing'
      public: true
    - column: european_football_2.Player_Attributes.volleys
      biz_name: Volleys
      description: 'The player''s volley score. 0-100 which is calculated by FIFA'
      public: true
    - column: european_football_2.Player_Attributes.curve
      biz_name: Curve
      description: 'The player''s curve score. 0-100 which is calculated by FIFA'
      public: true
    - column: european_football_2.Player_Attributes.id
      biz_name: id
      description: the unique id for players
    - column: european_football_2.Player_Attributes.player_fifa_api_id
      biz_name: PlayerFIFAID
      description: the id of the player fifa api
      public: true
    - column: european_football_2.Player_Attributes.long_passing
      biz_name: long passing
      description: the player's long passing score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.acceleration
      biz_name: acceleration
      description: the player's acceleration score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.agility
      biz_name: agility
      description: the player's agility. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.reactions
      biz_name: reactions
      description: the player's reactions score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.balance
      biz_name: balance
      description: the player's balance score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.shot_power
      biz_name: shot power
      description: the player's shot power. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.stamina
      biz_name: stamina
      description: the player's stamina score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.strength
      biz_name: Strength
      description: 'the player''s strength score. 0-100 which is calculated by FIFA'
      public: true
    - column: european_football_2.Player_Attributes.aggression
      biz_name: Aggression
      description: 'the player''s aggression score. 0-100 which is calculated by FIFA'
      public: true
    - column: european_football_2.Player_Attributes.interceptions
      biz_name: interceptions
      description: the player's interceptions score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.positioning
      biz_name: positioning
      description: the player's positioning score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.vision
      biz_name: vision
      description: the player's vision score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.penalties
      biz_name: penalties
      description: the player's penalties score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.marking
      biz_name: marking
      description: the player's markingscore. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.standing_tackle
      biz_name: standing tackle
      description: the player's standing tackle score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.sliding_tackle
      biz_name: sliding tackle
      description: the player's sliding tackle score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.gk_diving
      biz_name: goalkeep diving
      description: the player's goalkeep diving score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.gk_handling
      biz_name: goalkeep handling
      description: the player's goalkeep diving score. 0-100 which is calculated by FIFA
    - column: european_football_2.Player_Attributes.gk_kicking
