mapping_type: dlr
version: '2.0'
scenario_name: dlr_toxicology
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
description: 'Toxicology: molecules, their atoms, and the bonds connecting atoms (carcinogenicity labels on molecules).'
databases:
  toxicology: sqlite:///MINIDEV_sqlite/dev_databases/toxicology/toxicology.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Molecule
  biz_name: Molecule
  description: Chemical molecule — identified by molecule_id, classified by carcinogenicity label (carcinogenic or not); contains
    atoms and bonds
  physical_entities:
  - physical_entity_id: PHYSICAL.Molecule
    physical_table_name: molecule
    physical_table_id: toxicology.molecule
    A:
      cardinality: '1:1'
      key: molecule_id
    R: null
    S: Molecule master — molecule_id and carcinogenicity label
    attributes:
    - column: toxicology.molecule.molecule_id
      biz_name: MoleculeID
      description: "unique id of molecule. \"+\" --> this molecule / compound is carcinogenic '-' this molecule is not / compound carcinogenic"
      public: true
    - column: toxicology.molecule.label
      biz_name: label
      description: whether this molecule is carcinogenic or not
      public: true
- logical_entity_id: LOGICAL.Atom
  biz_name: Atom
  description: Atoms composing molecules — element symbol (o, c, h, n, s, etc.), identified by atom_id, belonging to a molecule
    via molecule_id
  physical_entities:
  - physical_entity_id: PHYSICAL.Atom
    physical_table_name: atom
    physical_table_id: toxicology.atom
    A:
      cardinality: '1:N'
      key: molecule_id
    R: null
    S: Atom composition — atom_id, element symbol, and molecule membership
    attributes:
    - column: toxicology.atom.atom_id
      biz_name: AtomID
      description: the unique id of atoms
      public: true
    - column: toxicology.atom.molecule_id
      biz_name: Molecule
      description: "identifying the molecule to which the atom belongs. commonsense evidence: TRXXX_i represents ith atom of molecule TRXXX"
      public: true
    - column: toxicology.atom.element
      biz_name: element
      description: "the element of the toxicology.  cl: chlorine  c: carbon  h: hydrogen  o: oxygen  s: sulfur  n: nitrogen  p: phosphorus  na: sodium  br: bromine  f: fluorine  i: iodine  sn: Tin  pb: lead  te: tellurium  ca: Calcium"
      public: true
- logical_entity_id: LOGICAL.Bond
  biz_name: Bond
  description: Chemical bonds — bond_type (= double, - single,
  physical_entities:
  - physical_entity_id: PHYSICAL.Bond
    physical_table_name: bond
    physical_table_id: toxicology.bond
    A:
      cardinality: '1:N'
      key: molecule_id
    R: null
    S: Bond master — bond_id, bond_type, and molecule membership
    attributes:
    - column: toxicology.bond.bond_id
      biz_name: BondID
      description: "unique id representing bonds. TRxxx_A1_A2: TRXXX refers to which molecule A1 and A2 refers to which atom"
      public: true
    - column: toxicology.bond.molecule_id
      biz_name: Molecule
      description: identifying the molecule in which the bond appears
      public: true
    - column: toxicology.bond.bond_type
      biz_name: bond_type
      description: "type of the bond. commonsense evidence: -: single bond '=': double bond '#': triple bond"
      public: true
  - physical_entity_id: PHYSICAL.Connected
    physical_table_name: connected
    physical_table_id: toxicology.connected
    A:
      cardinality: '1:N'
      key: bond_id
    R: null
    S: Bond-atom junction — each bond connects exactly 2 atoms (atom_id + atom_id2)
    attributes:
    - column: toxicology.connected.bond_id
      biz_name: BondID
      description: bond id representing bond between two atoms
      public: true
    - column: toxicology.connected.atom_id
      biz_name: atom1
      description: id of the first atom
      public: true
    - column: toxicology.connected.atom_id2
      biz_name: atom2
      description: id of the second atom
      public: true
pas_relations:
- relation_id: LOGICAL.Molecule_TO_LOGICAL.Atom
  relation_name: Contains
  P:
    forward:
      verb: contains
      cardinality: 1:N
    reverse:
      verb: constitutes
      cardinality: '1:1'
  A: Molecule
  S: 1 molecule contains N atoms — atom.molecule_id → molecule.molecule_id
- relation_id: LOGICAL.Molecule_TO_LOGICAL.Bond
  relation_name: HasBond
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Molecule
  S: 1 molecule contains N bonds — bond.molecule_id → molecule.molecule_id
- relation_id: LOGICAL.Bond_TO_LOGICAL.Atom
  relation_name: Connects
  P:
    forward:
      verb: connects
      cardinality: 1:N
    reverse:
      verb: participates in
      cardinality: 1:N
  A: Atom
  S: 1 bond connects 2 atoms via connected table — connected.atom_id → atom.atom_id AND connected.atom_id2 → atom.atom_id
    (UNION both ends to get all atoms in the bond)
