mapping_type: dlr
version: '2.0'
scenario_name: dlr_card_games
description: 'DLR paradigm - Card games scenario: on-demand fields, 6 PEs aggregated into 4 LEs, card extension multi-view
  decoupling'
databases:
  card_games: sqlite:///MINIDEV_sqlite/dev_databases/card_games/card_games.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Card
  biz_name: Card
  description: Individual card entity with attributes, printings, and game mechanics
  physical_entities:
  - physical_entity_id: PHYSICAL.Card
    physical_table_name: cards
    physical_table_id: card_games.cards
    A:
      cardinality: '1:1'
      key: uuid
    R: null
    S: Card attributes
    attributes:
    - column: card_games.cards.uuid
      biz_name: CardID
      description: The globally unique identifier for the card (UUID). Same card name may have multiple printings with different
        UUIDs.
      public: true
    - column: card_games.cards.id
      biz_name: PrintID
      description: The integer primary key for a specific printing version. Different printings of the same card name have
        different IDs.
      public: true
    - column: card_games.cards.name
      biz_name: name
      description: The name of the card.. Cards with multiple faces, like "Split" and "Meld" cards are given a delimiter.
    - column: card_games.cards.setCode
      biz_name: Set Code
      description: The set printing code that the card is from.
    - column: card_games.cards.borderColor
      biz_name: border Color
      description: The color of the card border.. "black", "borderless", "gold", "silver", "white"
    - column: card_games.cards.rarity
      biz_name: rarity
      description: The card printing rarity.
    - column: card_games.cards.convertedManaCost
      biz_name: converted Mana Cost
      description: The converted mana cost of the card. Use the manaValue property.. if value is higher, it means that this
        card cost more converted mana
    - column: card_games.cards.power
      biz_name: power
      description: 'The power of the card.. commonsense evidence: ∞ means infinite power null or * refers to unknown power'
    - column: card_games.cards.artist
      biz_name: artist
      description: The name of the artist that illustrated the card art.
    - column: card_games.cards.frameVersion
      biz_name: frame Version
      description: The version of the card frame style.. "1993", "1997", "2003", "2015", "future"
    - column: card_games.cards.layout
      biz_name: layout
      description: The type of card layout. For a token card, this will be "token"
    - column: card_games.cards.types
      biz_name: types
      description: A list of all card types of the card, including Un‑sets and gameplay variants.
    - column: card_games.cards.originalType
      biz_name: originalType
      description: original Type. The type of the card as originally printed. Includes any supertypes and subtypes.
    - column: card_games.cards.colors
      biz_name: colors
      description: A list of all the colors in manaCost and colorIndicator.. Some cards may not have values, such as cards
        with "Devoid" in its text.
    - column: card_games.cards.subtypes
      biz_name: subtypes
      description: A list of card subtypes found after em-dash.
    - column: card_games.cards.supertypes
      biz_name: super types
      description: 'A list of card supertypes found before em-dash.. commonsense evidence: list of all types should be the
        union of subtypes and supertypes'
    - column: card_games.cards.hasContentWarning
      biz_name: has Content Warning
      description: 'If the card marked by Wizards of the Coast (opens new window) for having sensitive content. See this official
        article (opens new window) for more information.. 0: doesn''t have 1: has sensitve content or Wizards of the Coast
        commonsense evidence: Cards with this property may have missing or degraded properties and values.'
    - column: card_games.cards.isPromo
      biz_name: is Promotion
      description: 'If the card is a promotional printing.. 0: is not 1: is'
    - column: card_games.cards.isStorySpotlight
      biz_name: is Story Spotlight
      description: 'If the card is a Story Spotlight card.. 0: is not 1: is'
    - column: card_games.cards.isTextless
      biz_name: is Text less
      description: 'If the card does not have a text box.. commonsense evidence: 0: has a text box; 1: doesn''t have a text
        box;'
    - column: card_games.cards.edhrecRank
      biz_name: rec Rank in edh
      description: The card rank on EDHRec
    - column: card_games.cards.availability
      biz_name: availability
      description: A list of the card's available printing types.. "arena", "dreamcast", "mtgo", "paper", "shandalar"
    - column: card_games.cards.cardKingdomFoilId
      biz_name: card Kingdom Foil Id
      description: 'card Kingdom Foil Id. commonsense evidence: cardKingdomFoilId, when paired with cardKingdomId that is
        not Null, is incredibly powerful.'
    - column: card_games.cards.cardKingdomId
      biz_name: card Kingdom Id
      description: card Kingdom Id. A list of all the colors in the color indicator
    - column: card_games.cards.side
      biz_name: side
      description: 'The identifier of the card side.. Used on cards with multiple faces on the same card. commonsense evidence:
        if this value is empty, then it means this card doesn''t have multiple faces on the same card.'
    - column: card_games.cards.duelDeck
      biz_name: duel Deck
      description: The indicator for which duel deck the card is in.
    - column: card_games.cards.asciiName
      biz_name: ascii Name
      description: The ASCII(opens new window) (Basic/128) code formatted card name with no special unicode characters.
    - column: card_games.cards.colorIdentity
      biz_name: color Identity
      description: A list of all the colors found in manaCost, colorIndicator, and text
    - column: card_games.cards.colorIndicator
      biz_name: color Indicator
      description: A list of all the colors in the color indicator (The symbol prefixed to a card's types).
    - column: card_games.cards.faceConvertedManaCost
      biz_name: face Converted Mana Cost
      description: The converted mana cost or mana value for the face for either half or part of the card.. if value is higher,
        it means that this card cost more converted mana for the face
    - column: card_games.cards.faceName
      biz_name: face Name
      description: The name on the face of the card.
    - column: card_games.cards.flavorName
      biz_name: flavor Name
      description: The promotional card name printed above the true card name on special cards that has no game function..
        The promotional card name printed above the true card name on special cards that has no game function.
    - column: card_games.cards.flavorText
      biz_name: flavor Text
      description: The italicized text found below the rules text that has no game function.. The italicized text found below
        the rules text that has no game function.
    - column: card_games.cards.frameEffects
      biz_name: frame Effects
      description: The visual frame effects.. "colorshifted", "companion", "compasslanddfc", "devoid", "draft", "etched",
        "extendedart", "fullart", "inverted", "legendary", "lesson", "miracle", "mooneldrazidfc", "nyxtouched", "originpwdfc",
        "showcase", "snow", "sunmoondfc", "textless", "tombstone", "waxingandwaningmoondfc"
    - column: card_games.cards.hand
      biz_name: hand
      description: 'The starting maximum hand size total modifier.. A + or - character precedes an integer. commonsense evidence:
        positive maximum hand size: +1, +2, .... negative maximum hand size: -1, .... neural maximum hand size: 0....'
    - column: card_games.cards.hasAlternativeDeckLimit
      biz_name: has Alternative Deck Limit
      description: 'If the card allows a value other than 4 copies in a deck.. 0: disallow 1: allow'
    - column: card_games.cards.hasFoil
      biz_name: has Foil
      description: 'If the card can be found in foil. 0: cannot be found 1: can be found'
    - column: card_games.cards.hasNonFoil
      biz_name: has Non Foil
      description: 'If the card can be found in non-foil. 0: cannot be found 1: can be found'
    - column: card_games.cards.isAlternative
      biz_name: is Alternative
      description: 'If the card is an alternate variation to an original printing. 0: is not 1: is'
    - column: card_games.cards.isFullArt
      biz_name: is Full Art
      description: 'If the card has full artwork.. 0: doesn''t have, 1: has full artwork'
    - column: card_games.cards.isOnlineOnly
      biz_name: is Online Only
      description: 'If the card is only available in online game variations.. 0: is not 1: is'
    - column: card_games.cards.isOversized
      biz_name: is Oversized
      description: 'If the card is oversized.. 0: is not 1: is'
    - column: card_games.cards.isReprint
      biz_name: is Reprint
      description: 'If the card has been reprinted.. 0: has not 1: has not been'
    - column: card_games.cards.isReserved
      biz_name: is Reserved
      description: 'If the card is on the Magic: The Gathering Reserved List (opens new window). If the card is on the Magic,
        it will appear in The Gathering Reserved List'
    - column: card_games.cards.isStarter
      biz_name: is Starter
      description: 'If the card is found in a starter deck such as Planeswalker/Brawl decks.. 0: is not 1: is'
    - column: card_games.cards.isTimeshifted
      biz_name: is Time shifted
      description: 'If the card is time shifted. commonsense evidence: If the card is "timeshifted", a feature of certain
        sets where a card will have a different frameVersion.'
    - column: card_games.cards.keywords
      biz_name: keywords
      description: A list of keywords found on the card.
    - column: card_games.cards.leadershipSkills
      biz_name: leadership Skills
      description: A list of formats the card is legal to be a commander in
    - column: card_games.cards.life
      biz_name: life
      description: The starting life total modifier. A plus or minus character precedes an integer.
    - column: card_games.cards.loyalty
      biz_name: loyalty
      description: The starting loyalty value of the card.. Used only on cards with "Planeswalker" in its types. empty means
        unkown
    - column: card_games.cards.manaCost
      biz_name: mana Cost
      description: 'The mana cost of the card wrapped in brackets for each value.. commonsense evidence: manaCost is unconverted
        mana cost'
    - column: card_games.cards.mcmId
      biz_name: mcmId
      description: mcmId. NOT USEFUL
    - column: card_games.cards.mcmMetaId
      biz_name: mcmMetaId
      description: mcmMetaId. NOT USEFUL
    - column: card_games.cards.mtgArenaId
      biz_name: mtgArenaId
      description: mtgArenaId. NOT USEFUL
    - column: card_games.cards.mtgjsonV4Id
      biz_name: mtgjsonV4Id
      description: mtgjsonV4Id. NOT USEFUL
    - column: card_games.cards.mtgoFoilId
      biz_name: mtgoFoilId
      description: mtgoFoilId. NOT USEFUL
    - column: card_games.cards.mtgoId
      biz_name: mtgoId
      description: mtgoId. NOT USEFUL
    - column: card_games.cards.multiverseId
      biz_name: multiverseId
      description: multiverseId. NOT USEFUL
    - column: card_games.cards.number
      biz_name: number
      description: The number of the card
    - column: card_games.cards.originalReleaseDate
      biz_name: originalReleaseDate
      description: original Release Date. The original release date in ISO 8601(opens new window) format for a promotional
        card printed outside of a cycle window, such as Secret Lair Drop promotions.
    - column: card_games.cards.originalText
      biz_name: originalText
      description: original Text. The text on the card as originally printed.
    - column: card_games.cards.otherFaceIds
      biz_name: otherFaceIds
      description: other Face Ids. A list of card UUID's to this card's counterparts, such as transformed or melded faces.
    - column: card_games.cards.printings
      biz_name: printings
      description: A list of set printing codes the card was printed in, formatted in uppercase.
    - column: card_games.cards.promoTypes
      biz_name: promo Types
      description: A list of promotional types for a card.. "arenaleague", "boosterfun", "boxtopper", "brawldeck", "bundle",
        "buyabox", "convention", "datestamped", "draculaseries", "draftweekend", "duels", "event", "fnm", "gameday", "gateway",
        "giftbox", "gilded", "godzillaseries", "instore", "intropack", "jpwalker", "judgegift", "league", "mediainsert", "neonink",
        "openhouse", "planeswalkerstamped", "playerrewards", "playpromo", "premiereshop", "prerelease", "promopack", "release",
        "setpromo", "stamped", "textured", "themepack", "thick", "tourney", "wizardsplaynetwork"
    - column: card_games.cards.purchaseUrls
      biz_name: purchase Urls
      description: Links that navigate to websites where the card can be purchased.
    - column: card_games.cards.scryfallId
      biz_name: scryfallId
      description: scryfallId. NOT USEFUL
    - column: card_games.cards.scryfallIllustrationId
      biz_name: scryfallIllustrationId
      description: scryfallIllustrationId. NOT USEFUL
    - column: card_games.cards.scryfallOracleId
      biz_name: scryfallOracleId
      description: scryfallOracleId. NOT USEFUL
    - column: card_games.cards.tcgplayerProductId
      biz_name: tcg player ProductId
      description: tcg player ProductId
    - column: card_games.cards.text
      biz_name: text
      description: The rules text of the card.
    - column: card_games.cards.toughness
      biz_name: toughness
      description: The toughness of the card.
    - column: card_games.cards.type
      biz_name: type
      description: The type of the card as visible, including any supertypes and subtypes.. "Artifact", "Card", "Conspiracy",
        "Creature", "Dragon", "Dungeon", "Eaturecray", "Elemental", "Elite", "Emblem", "Enchantment", "Ever", "Goblin", "Hero",
        "Instant", "Jaguar", "Knights", "Land", "Phenomenon", "Plane", "Planeswalker", "Scariest", "Scheme", "See", "Sorcery",
        "Sticker", "Summon", "Token", "Tribal", "Vanguard", "Wolf", "You’ll", "instant"
    - column: card_games.cards.variations
      biz_name: variations
      description: variations
    - column: card_games.cards.watermark
      biz_name: watermark
      description: The name of the watermark on the card.
- logical_entity_id: LOGICAL.CardExtension
  biz_name: CardExtension
  description: Card extensions — format legality (commander/modern/legacy etc.) with status, official rulings (text/date),
    and foreign language translations; linked to card via uuid
  physical_entities:
  - physical_entity_id: PHYSICAL.Legality
    physical_table_name: legalities
    physical_table_id: card_games.legalities
    A:
      cardinality: N:1
      key: uuid
    R: null
    S: Format legalities — format name and legality status per card
    attributes:
    - column: card_games.legalities.uuid
      biz_name: Card
      description: ''
      public: true
    - column: card_games.legalities.format
      biz_name: format
      description: 'Format name: e.g. commander, modern, legacy, vintage, pauper, duel, premodern, penny'
      public: true
    - column: card_games.legalities.status
      biz_name: status
      description: 'The legality status of the card in this format: Legal, Banned, or Restricted.'
      public: true
    - column: card_games.legalities.id
      biz_name: id
      description: unique id identifying this legality
  - physical_entity_id: PHYSICAL.Ruling
    physical_table_name: rulings
    physical_table_id: card_games.rulings
    A:
      cardinality: N:1
      key: uuid
    R: null
    S: Rulings
    attributes:
    - column: card_games.rulings.uuid
      biz_name: Card
      description: ''
      public: true
    - column: card_games.rulings.text
      biz_name: text
      description: description about this ruling
    - column: card_games.rulings.id
      biz_name: id
      description: unique id identifying this ruling
    - column: card_games.rulings.date
      biz_name: date
      description: date
  - physical_entity_id: PHYSICAL.ForeignData
    physical_table_name: foreign_data
    physical_table_id: card_games.foreign_data
    A:
      cardinality: N:1
      key: uuid
    R: null
    S: Foreign translations
    attributes:
    - column: card_games.foreign_data.uuid
      biz_name: Card
      description: ''
      public: true
    - column: card_games.foreign_data.language
      biz_name: language
      description: 'Foreign language: e.g. Chinese Simplified, French, German, Italian, Portuguese (Brasil), Korean, Japanese,
        Spanish, Russian.'
      public: true
    - column: card_games.foreign_data.name
      biz_name: name
      description: The foreign name of the card.
    - column: card_games.foreign_data.flavorText
      biz_name: flavor Text
      description: The foreign flavor text of the card.
    - column: card_games.foreign_data.multiverseid
      biz_name: multiverseid
      description: The foreign multiverse identifier of the card.
    - column: card_games.foreign_data.id
      biz_name: id
      description: unique id number identifying this row of data
    - column: card_games.foreign_data.text
      biz_name: text
      description: The foreign text ruling of the card.
    - column: card_games.foreign_data.type
      biz_name: type
      description: The foreign type of the card. Includes any supertypes and subtypes.
- logical_entity_id: LOGICAL.CardSet
  biz_name: CardSet
  description: Card expansion sets grouped by block
  physical_entities:
  - physical_entity_id: PHYSICAL.Set
    physical_table_name: sets
    physical_table_id: card_games.sets
    A:
      cardinality: '1:1'
      key: code
    R: null
    S: Set information — set name, block, size, and marketplace identifiers
    attributes:
    - column: card_games.sets.code
      biz_name: SetID
      description: The set code (e.g., ARC, CMD).
      public: true
    - column: card_games.sets.name
      biz_name: name
      description: The name of the set.
    - column: card_games.sets.block
      biz_name: block
      description: The block name the set was in.
    - column: card_games.sets.baseSetSize
      biz_name: base Set Size
      description: The number of cards in the set.
    - column: card_games.sets.mcmName
      biz_name: magic card market name
      description: magic card market name
    - column: card_games.sets.mtgoCode
      biz_name: magic the gathering online code
      description: 'The set code for the set as it appears on Magic: The Gathering Online. commonsense evidence: if the value
        is null or empty, then it doesn''t appear on Magic: The Gathering Online'
    - column: card_games.sets.isForeignOnly
      biz_name: is Foreign Only
      description: If the set is available only outside the United States of America.
    - column: card_games.sets.id
      biz_name: id
      description: unique id identifying this set
    - column: card_games.sets.booster
      biz_name: booster
      description: A breakdown of possibilities and weights of cards in a booster pack.
    - column: card_games.sets.isFoilOnly
      biz_name: is Foil Only
      description: If the set is only available in foil.
    - column: card_games.sets.isNonFoilOnly
      biz_name: is Non Foil Only
      description: If the set is only available in non-foil.
    - column: card_games.sets.isOnlineOnly
      biz_name: is Online Only
      description: If the set is only available in online game variations.
    - column: card_games.sets.isPartialPreview
      biz_name: is Partial Preview
      description: If the set is still in preview (spoiled). Preview sets do not have complete data.
    - column: card_games.sets.keyruneCode
      biz_name: keyrune Code
      description: The matching Keyrune code for set image icons.
    - column: card_games.sets.mcmId
      biz_name: magic card market id
      description: The Magic Card Marketset identifier.
    - column: card_games.sets.mcmIdExtras
      biz_name: magic card market ID Extras
      description: The split Magic Card Market set identifier if a set is printed in two sets. This identifier represents
        the second set's identifier.
    - column: card_games.sets.parentCode
      biz_name: parent Code
      description: The parent set code for set variations like promotions, guild kits, etc.
    - column: card_games.sets.releaseDate
      biz_name: release Date
      description: The release date in ISO 8601 format for the set.
    - column: card_games.sets.tcgplayerGroupId
      biz_name: tcg player Group Id
      description: The group identifier of the set on TCGplayer
    - column: card_games.sets.totalSetSize
      biz_name: total Set Size
      description: The total number of cards in the set, including promotional and related supplemental products but excluding
        Alchemy modifications - however those cards are included in the set itself.
    - column: card_games.sets.type
      biz_name: type
      description: The expansion type of the set.. "alchemy", "archenemy", "arsenal", "box", "commander", "core", "draft_innovation",
        "duel_deck", "expansion", "from_the_vault", "funny", "masterpiece", "masters", "memorabilia", "planechase", "premium_deck",
        "promo", "spellbook", "starter", "token", "treasure_chest", "vanguard"
- logical_entity_id: LOGICAL.SetTranslation
  biz_name: SetTranslation
  description: Set translations
  physical_entities:
  - physical_entity_id: PHYSICAL.SetTranslation
    physical_table_name: set_translations
    physical_table_id: card_games.set_translations
    A:
      cardinality: N:1
      key: setCode
    R: null
    S: Set translations
    attributes:
    - column: card_games.set_translations.setCode
      biz_name: Set
      description: ''
      public: true
    - column: card_games.set_translations.language
      biz_name: Language
      description: ''
      public: true
    - column: card_games.set_translations.translation
      biz_name: translation
      description: translation of this card
    - column: card_games.set_translations.id
      biz_name: id
      description: unique id identifying this set
pas_relations:
- relation_id: LOGICAL.CardSet_TO_LOGICAL.Card
  relation_name: Contains
  P:
    forward:
      verb: contains
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: SetID
  S: 1 set contains N cards
- relation_id: LOGICAL.Card_TO_LOGICAL.CardExtension
  relation_name: HasExtension
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Card
  S: 1 card has N extensions (legalities/rulings/foreign)
- relation_id: LOGICAL.CardSet_TO_LOGICAL.SetTranslation
  relation_name: HasTranslation
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Set
  S: 1 set has N language translations
