mapping_type: dlr
version: '2.0'
scenario_name: dlr_thrombosis
description: 'DLR paradigm - Thrombosis prediction: 3 tables, 1 LE (Patient) with 3 PEs via ARCS'
databases:
  thrombosis_prediction: sqlite:///MINIDEV_sqlite/dev_databases/thrombosis_prediction/thrombosis_prediction.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Patient
  biz_name: Patient
  description: 'Patient medical records: demographics, primary diagnosis, laboratory test results (biochemistry markers including
    UA/uric acid, HGB/hemoglobin, PLT/platelet, LDH, GPT, ALB, blood lipids, glucose), and clinical examination findings (thrombosis
    degree, coagulation markers RVVT/KCT/LAC, antibodies ANA/aCL, symptoms)'
  physical_entities:
  - physical_entity_id: PHYSICAL.PatientMaster
    physical_table_name: Patient
    physical_table_id: thrombosis_prediction.Patient
    A:
      cardinality: '1:1'
      key: ID
    R: null
    S: Patient demographics and primary diagnosis (master table)
    attributes:
    - column: thrombosis_prediction.Patient.ID
      biz_name: PatientID
      description: 'Patient ID: unique identifier'
      public: true
    - column: thrombosis_prediction.Patient.SEX
      biz_name: SEX
      description: 'Gender: M (male) / F (female)'
      public: true
    - column: thrombosis_prediction.Patient.Birthday
      biz_name: Birthday
      description: Date of birth
      public: true
    - column: thrombosis_prediction.Patient.Diagnosis
      biz_name: PrimaryDiagnosis
      description: 'Primary diagnosis: e.g. SLE, DVT, PE'
      public: true
    - column: thrombosis_prediction.Patient.Admission
      biz_name: Admission
      description: 'Admission type: + (inpatient), - (outpatient)'
      public: true
    - column: thrombosis_prediction.Patient.Description
      biz_name: ConditionNotes
      description: 'Patient condition notes: detailed description or suspected diagnosis (e.g. RA susp., PSS, SLE)'
      public: true
    - column: thrombosis_prediction.Patient.First Date
      biz_name: FirstDate
      description: Date when patient first came to the hospital
      public: true
  - physical_entity_id: PHYSICAL.LabResults
    physical_table_name: Laboratory
    physical_table_id: thrombosis_prediction.Laboratory
    A:
      cardinality: N:1
      key: ID
    R: null
    S: Laboratory test results (biochemistry, blood, urine) — N:1 per patient
    attributes:
    - column: thrombosis_prediction.Laboratory.ID
      biz_name: PatientID
      description: 'Patient ID: unique identifier'
      public: true
    - column: thrombosis_prediction.Laboratory.Date
      biz_name: LabDate
      description: Laboratory test date
      public: true
    - column: thrombosis_prediction.Laboratory.UA
      biz_name: UA
      description: Uric acid level
      public: true
    - column: thrombosis_prediction.Laboratory.HGB
      biz_name: HGB
      description: Hemoglobin level
      public: true
    - column: thrombosis_prediction.Laboratory.PLT
      biz_name: PLT
      description: Platelet count
      public: true
    - column: thrombosis_prediction.Laboratory.LDH
      biz_name: LDH
      description: Lactate dehydrogenase level
      public: true
    - column: thrombosis_prediction.Laboratory.GOT
      biz_name: GOT
      description: AST glutamic oxaloacetic transaminase
      public: true
    - column: thrombosis_prediction.Laboratory.GPT
      biz_name: GPT
      description: ALT glutamic pyruvic transaminase
      public: true
    - column: thrombosis_prediction.Laboratory.ALB
      biz_name: ALB
      description: Albumin level
      public: true
    - column: thrombosis_prediction.Laboratory.T-CHO
      biz_name: TCHO
      description: Total cholesterol
      public: true
    - column: thrombosis_prediction.Laboratory.TG
      biz_name: TG
      description: Triglyceride level
      public: true
    - column: thrombosis_prediction.Laboratory.GLU
      biz_name: GLU
      description: Blood glucose level
      public: true
    - column: thrombosis_prediction.Laboratory.WBC
      biz_name: WBC
      description: White blood cell count
      public: true
    - column: thrombosis_prediction.Laboratory.RBC
      biz_name: RBC
      description: Red blood cell count
      public: true
    - column: thrombosis_prediction.Laboratory.IGG
      biz_name: IGG
      description: Immunoglobulin G level
      public: true
    - column: thrombosis_prediction.Laboratory.IGA
      biz_name: IGA
      description: Immunoglobulin A level
      public: true
    - column: thrombosis_prediction.Laboratory.IGM
      biz_name: IGM
      description: Immunoglobulin M level
      public: true
    - column: thrombosis_prediction.Laboratory.CRP
      biz_name: CRP
      description: C-reactive protein
      public: true
    - column: thrombosis_prediction.Laboratory.CPK
      biz_name: CPK
      description: Creatinine phosphokinase
      public: true
    - column: thrombosis_prediction.Laboratory.CRE
      biz_name: CRE
      description: Creatinine level
      public: true
    - column: thrombosis_prediction.Laboratory.UN
      biz_name: UN
      description: Urea nitrogen level
      public: true
    - column: thrombosis_prediction.Laboratory.T-BIL
      biz_name: TBIL
      description: Total bilirubin
      public: true
    - column: thrombosis_prediction.Laboratory.FG
      biz_name: FG
      description: Fibrinogen level
      public: true
    - column: thrombosis_prediction.Laboratory.PT
      biz_name: PT
      description: Prothrombin time
      public: true
    - column: thrombosis_prediction.Laboratory.ALP
      biz_name: alkaliphophatase
      description: 'alkaliphophatase. Commonsense evidence: Normal range: N < 300'
    - column: thrombosis_prediction.Laboratory.TP
      biz_name: total protein
      description: 'total protein. Commonsense evidence: Normal range: 6.0 < N < 8.5'
    - column: thrombosis_prediction.Laboratory.HCT
      biz_name: Hematoclit
      description: 'Hematoclit. Commonsense evidence: Normal range: 29 < N < 52'
    - column: thrombosis_prediction.Laboratory.APTT
      biz_name: activated partial prothrombin time
      description: 'activated partial prothrombin time. Commonsense evidence: Normal range: N < 45'
    - column: thrombosis_prediction.Laboratory.PIC
      biz_name: PIC
      description: PIC
    - column: thrombosis_prediction.Laboratory.TAT
      biz_name: TAT
      description: TAT
    - column: thrombosis_prediction.Laboratory.TAT2
      biz_name: TAT2
      description: TAT2
    - column: thrombosis_prediction.Laboratory.U-PRO
      biz_name: proteinuria
      description: 'proteinuria. Commonsense evidence: Normal range: 0 < N < 30'
    - column: thrombosis_prediction.Laboratory.RA
      biz_name: Rhuematoid Factor
      description: 'Rhuematoid Factor. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.RF
      biz_name: RAHA
      description: 'RAHA. Commonsense evidence: Normal range: N < 20'
    - column: thrombosis_prediction.Laboratory.C3
      biz_name: complement 3
      description: 'complement 3. Commonsense evidence: Normal range: N > 35'
    - column: thrombosis_prediction.Laboratory.C4
      biz_name: complement 4
      description: 'complement 4. Commonsense evidence: Normal range: N > 10'
    - column: thrombosis_prediction.Laboratory.RNP
      biz_name: anti-ribonuclear protein
      description: 'anti-ribonuclear protein. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.SM
      biz_name: anti-SM
      description: 'anti-SM. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.SC170
      biz_name: anti-scl70
      description: 'anti-scl70. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.SSA
      biz_name: anti-SSA
      description: 'anti-SSA. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.SSB
      biz_name: anti-SSB
      description: 'anti-SSB. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.CENTROMEA
      biz_name: anti-centromere
      description: 'anti-centromere. Commonsense evidence: Normal range: N= -, +-'
    - column: thrombosis_prediction.Laboratory.DNA
      biz_name: anti-DNA
      description: 'anti-DNA. Commonsense evidence: Normal range: N < 8'
    - column: thrombosis_prediction.Laboratory.DNA-II
      biz_name: anti-DNA
      description: 'anti-DNA. Commonsense evidence: Normal range: N < 8'
  - physical_entity_id: PHYSICAL.ExamFindings
    physical_table_name: Examination
    physical_table_id: thrombosis_prediction.Examination
    A:
      cardinality: N:1
      key: ID
    R: null
    S: Clinical examination findings (thrombosis, coagulation, antibodies) — N:1 per patient
    attributes:
    - column: thrombosis_prediction.Examination.ID
      biz_name: PatientID
      description: 'Patient ID: unique identifier'
      public: true
    - column: thrombosis_prediction.Examination.Examination Date
      biz_name: ExamDate
      description: Clinical examination date
      public: true
    - column: thrombosis_prediction.Examination.Thrombosis
      biz_name: Thrombosis
      description: 'Thrombosis degree: 0 (negative), 1 (most severe), 2 (severe), 3 (mild)'
      public: true
    - column: thrombosis_prediction.Examination.RVVT
      biz_name: RVVT
      description: 'Coagulation marker RVVT: + (positive), - (negative)'
      public: true
    - column: thrombosis_prediction.Examination.KCT
      biz_name: KCT
      description: 'Coagulation marker KCT: + (positive), - (negative)'
      public: true
    - column: thrombosis_prediction.Examination.LAC
      biz_name: LAC
      description: 'Coagulation marker LAC: + (positive), - (negative)'
      public: true
    - column: thrombosis_prediction.Examination.ANA
      biz_name: ANA
      description: Anti-nuclear antibody level
      public: true
    - column: thrombosis_prediction.Examination.ANA Pattern
      biz_name: ANAPattern
      description: Pattern observed in ANA examination
      public: true
    - column: thrombosis_prediction.Examination.aCL IgG
      biz_name: aCLIgG
      description: Anti-cardiolipin antibody IgG concentration
      public: true
    - column: thrombosis_prediction.Examination.aCL IgM
      biz_name: aCLIgM
      description: Anti-cardiolipin antibody IgM concentration
      public: true
    - column: thrombosis_prediction.Examination.aCL IgA
      biz_name: aCLIgA
      description: Anti-cardiolipin antibody IgA concentration
      public: true
    - column: thrombosis_prediction.Examination.Symptoms
      biz_name: Symptoms
      description: Other symptoms observed during examination
      public: true
    - column: thrombosis_prediction.Examination.Diagnosis
      biz_name: ExamDiagnosis
      description: Diagnosis noted during this specific exam, may include comorbidities (e.g. SLE+Psy), differs from PrimaryDiagnosis
        which is the main diagnosis
      public: true
pas_relations: []
