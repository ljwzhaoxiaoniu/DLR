mapping_type: dlr
version: '2.1'
scenario_name: dlr_financial
description: 'DLR paradigm - Financial: clients hold accounts via disp (junction absorbed as PE); accounts have loans, transactions,
  permanent orders; districts with demographic statistics. 6 LE, 10 PE — 2026-08-02 refactor: AccountRelation LE eliminated
  (pure junction, no business lifecycle)'
databases:
  financial: sqlite:///MINIDEV_sqlite/dev_databases/financial/financial.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Account
  biz_name: Account
  description: Bank account — identified by account_id, located in a district, with open date and statement frequency; holds
    loans, transactions, permanent orders, client authorizations (disp) and credit cards
  physical_entities:
  - physical_entity_id: PHYSICAL.Account
    physical_table_name: account
    physical_table_id: financial.account
    A:
      cardinality: '1:1'
      key: account_id
    R: null
    S: Account master — account_id, district, open date, frequency
    attributes:
    - column: financial.account.account_id
      biz_name: AccountID
      description: ''
      public: true
    - column: financial.account.district_id
      biz_name: DistrictID
      description: District where the account branch is located
      public: true
    - column: financial.account.date
      biz_name: date
      description: Account open date
      public: true
    - column: financial.account.frequency
      biz_name: frequency
      description: frequency of the acount
  - physical_entity_id: PHYSICAL.Disp
    physical_table_name: disp
    physical_table_id: financial.disp
    A:
      cardinality: N:1
      key: account_id
    R: null
    S: Client-account authorization (junction) — client_id, account_id, type (OWNER/DISPONENT)
    attributes:
    - column: financial.disp.account_id
      biz_name: AccountID
      description: ''
      public: true
    - column: financial.disp.client_id
      biz_name: ClientID
      description: Client who holds this account via disp
      public: true
    - column: financial.disp.disp_id
      biz_name: disposition id
      description: unique number of identifying this row of record
    - column: financial.disp.type
      biz_name: type
      description: 'type of disposition. "OWNER" : "USER" : "DISPONENT" commonsense evidence: the account can only have the
        right to issue permanent orders or apply for loans'
  - physical_entity_id: PHYSICAL.CreditCard
    physical_table_name: card
    physical_table_id: financial.card
    A:
      cardinality: N:1
      key: disp_id
    R: null
    S: Credit card information — card_id, type, issued date
    attributes:
    - column: financial.card.disp_id
      biz_name: AccountID
      description: ''
      public: true
    - column: financial.card.card_id
      biz_name: credit card id
      description: id number of credit card
    - column: financial.card.type
      biz_name: type
      description: 'type of credit card. "junior": junior class of credit card; "classic": standard class of credit card;
        "gold": high-level credit card'
    - column: financial.card.issued
      biz_name: issued
      description: the date when the credit card issued. in the form YYMMDD
- logical_entity_id: LOGICAL.Client
  biz_name: Client
  description: Bank client — gender (M/F), birth_date, district of residence; identified by client_id; holds accounts via
    disp authorization; often referred to as 'customer' in queries
  physical_entities:
  - physical_entity_id: PHYSICAL.Client
    physical_table_name: client
    physical_table_id: financial.client
    A:
      cardinality: '1:1'
      key: client_id
    R: null
    S: Client master — client_id, gender, birth_date, district
    attributes:
    - column: financial.client.client_id
      biz_name: ClientID
      description: ''
      public: true
    - column: financial.client.district_id
      biz_name: DistrictID
      description: District where the client resides
      public: true
    - column: financial.client.gender
      biz_name: gender
      description: 'Gender: M (male) or F (female)'
      public: true
    - column: financial.client.birth_date
      biz_name: birth_date
      description: Birth date of the client, YYYY-MM-DD format
      public: true
- logical_entity_id: LOGICAL.District
  biz_name: District
  description: Demographic district — district name (A2), region (A3), inhabitants (A4), average salary (A11), unemployment
    rates (A12/A13), crime statistics (A15); clients reside here and accounts are located here
  physical_entities:
  - physical_entity_id: PHYSICAL.District
    physical_table_name: district
    physical_table_id: financial.district
    A:
      cardinality: '1:1'
      key: district_id
    R: null
    S: District demographic and economic statistics — A2(name), A3(region), A4(inhabitants), A11(avg salary), A12/A13(unemployment),
      A15(crimes)
    attributes:
    - column: financial.district.district_id
      biz_name: DistrictID
      description: ''
      public: true
    - column: financial.district.A2
      biz_name: DistrictName
      description: District name (column A2), e.g. Sokolov, Praha
      public: true
    - column: financial.district.A3
      biz_name: Region
      description: Region name (column A3)
      public: true
    - column: financial.district.A4
      biz_name: Inhabitants
      description: Number of inhabitants (column A4)
      public: true
    - column: financial.district.A11
      biz_name: AvgSalary
      description: Average salary (column A11)
      public: true
    - column: financial.district.A12
      biz_name: UnempRate95
      description: Unemployment rate 1995 (column A12)
      public: true
    - column: financial.district.A13
      biz_name: UnempRate96
      description: Unemployment rate 1996 (column A13)
      public: true
    - column: financial.district.A15
      biz_name: Crimes95
      description: Number of crimes 1995 (column A15)
      public: true
    - column: financial.district.A5
      biz_name: no. of municipalities with inhabitants < 499
      description: municipality < district < region
    - column: financial.district.A6
      biz_name: no. of municipalities with inhabitants 500-1999
      description: municipality < district < region
    - column: financial.district.A7
      biz_name: no. of municipalities with inhabitants 2000-9999
      description: municipality < district < region
    - column: financial.district.A8
      biz_name: no. of municipalities with inhabitants > 10000
      description: municipality < district < region
    - column: financial.district.A9
      biz_name: A9
      description: A9. not useful
    - column: financial.district.A10
      biz_name: ratio of urban inhabitants
      description: ratio of urban inhabitants
    - column: financial.district.A14
      biz_name: no. of entrepreneurs per 1000 inhabitants
      description: no. of entrepreneurs per 1000 inhabitants
    - column: financial.district.A16
      biz_name: no. of committed crimes 1996
      description: no. of committed crimes 1996
- logical_entity_id: LOGICAL.Loan
  biz_name: Loan
  description: Bank loan contract — amount, approval date, duration (months), monthly payments, status (A=active, B=finished,
    C=running, D=in debt); belongs to an account; has independent business lifecycle (approval → active → finished/default)
  physical_entities:
  - physical_entity_id: PHYSICAL.Loan
    physical_table_name: loan
    physical_table_id: financial.loan
    A:
      cardinality: N:1
      key: account_id
    R: null
    S: Loan contract table — amount, date, duration, payments, status
    attributes:
    - column: financial.loan.loan_id
      biz_name: LoanID
      description: ''
      public: true
    - column: financial.loan.account_id
      biz_name: Account
      description: ''
      public: true
    - column: financial.loan.amount
      biz_name: amount
      description: Loan amount
      public: true
    - column: financial.loan.date
      biz_name: date
      description: Loan approval date, YYYY-MM-DD format
      public: true
    - column: financial.loan.status
      biz_name: status
      description: 'Loan status: A=active, B=finished, C=running, D=in debt'
      public: true
    - column: financial.loan.duration
      biz_name: duration
      description: loan duration. unit：month
    - column: financial.loan.payments
      biz_name: monthly payments
      description: monthly payments. unit：month
- logical_entity_id: LOGICAL.Transaction
  biz_name: Transaction
  description: Bank transaction record — date, type (credit/debit), operation, amount, balance; belongs to an account; independent
    business concept with temporal sequence
  physical_entities:
  - physical_entity_id: PHYSICAL.Trans
    physical_table_name: trans
    physical_table_id: financial.trans
    A:
      cardinality: N:1
      key: account_id
    R: null
    S: Transaction details — date, type, operation, amount, balance
    attributes:
    - column: financial.trans.account_id
      biz_name: Account
      description: ''
      public: true
    - column: financial.trans.amount
      biz_name: amount
      description: Transaction amount
      public: true
    - column: financial.trans.balance
      biz_name: balance
      description: Account balance after transaction
      public: true
    - column: financial.trans.date
      biz_name: date
      description: Transaction date
      public: true
    - column: financial.trans.trans_id
      biz_name: transaction id
      description: transaction id
    - column: financial.trans.type
      biz_name: +/- transaction
      description: +/- transaction. "PRIJEM" stands for credit "VYDAJ" stands for withdrawal
    - column: financial.trans.operation
      biz_name: mode of transaction
      description: 'mode of transaction. "VYBER KARTOU": credit card withdrawal "VKLAD": credit in cash "PREVOD Z UCTU" :collection
        from another bank "VYBER": withdrawal in cash "PREVOD NA UCET": remittance to another bank'
    - column: financial.trans.k_symbol
      biz_name: characterization of the transaction
      description: 'characterization of the transaction. "POJISTNE": stands for insurrance payment "SLUZBY": stands for payment
        for statement "UROK": stands for interest credited "SANKC. UROK": sanction interest if negative balance "SIPO": stands
        for household "DUCHOD": stands for old-age pension "UVER": stands for loan payment'
    - column: financial.trans.bank
      biz_name: bank of the partner
      description: bank of the partner. each bank has unique two-letter code
    - column: financial.trans.account
      biz_name: account of the partner
      description: account of the partner
- logical_entity_id: LOGICAL.PermanentOrder
  biz_name: PermanentOrder
  description: Permanent payment order — bank_to, account_to, amount; belongs to an account; has independent lifecycle (creation
    → active → cancellation)
  physical_entities:
  - physical_entity_id: PHYSICAL.Order
    physical_table_name: order
    physical_table_id: financial.order
    A:
      cardinality: N:1
      key: account_id
    R: null
    S: Permanent payment orders — bank_to, account_to, amount, k_symbol
    attributes:
    - column: financial.order.account_id
      biz_name: Account
      description: ''
      public: true
    - column: financial.order.amount
      biz_name: amount
      description: Order amount
      public: true
    - column: financial.order.order_id
      biz_name: order_id
      description: identifying the unique order
    - column: financial.order.bank_to
      biz_name: bank of the recipient
      description: bank of the recipient
    - column: financial.order.account_to
      biz_name: account of the recipient
      description: account of the recipient. each bank has unique two-letter code
    - column: financial.order.k_symbol
      biz_name: characterization of the payment
      description: purpose of the payment. "POJISTNE" stands for insurance payment "SIPO" stands for household payment "LEASING"
        stands for leasing "UVER" stands for loan payment
pas_relations:
- relation_id: LOGICAL.Client_TO_LOGICAL.Account
  relation_name: Holds
  P:
    forward:
      verb: holds
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: ClientID
  S: 1 client holds N accounts — via disp.client_id → client.client_id
- relation_id: LOGICAL.Account_TO_LOGICAL.Loan
  relation_name: HasLoan
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Account
  S: 1 account has N loans — loan.account_id → account.account_id
- relation_id: LOGICAL.Account_TO_LOGICAL.Transaction
  relation_name: Generates
  P:
    forward:
      verb: generates
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Account
  S: 1 account generates N transactions — trans.account_id → account.account_id
- relation_id: LOGICAL.Account_TO_LOGICAL.PermanentOrder
  relation_name: HasOrder
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Account
  S: 1 account has N permanent orders — order.account_id → account.account_id
- relation_id: LOGICAL.Client_TO_LOGICAL.District
  relation_name: ResidesIn
  P:
    forward:
      verb: resides in
      cardinality: N:1
    reverse:
      verb: contains
      cardinality: 1:N
  A: DistrictID
  S: N clients reside in 1 district — client.district_id → district.district_id
- relation_id: LOGICAL.District_TO_LOGICAL.Account
  relation_name: Contains
  P:
    forward:
      verb: contains
      cardinality: 1:N
    reverse:
      verb: is located in
      cardinality: N:1
  A: DistrictID
  S: 1 district contains N accounts — account.district_id → district.district_id
