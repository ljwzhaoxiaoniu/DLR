mapping_type: dlr
version: '2.0'
scenario_name: dlr_superhero
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
description: 'Superhero registry: hero identities with physical attributes, alignments, publishers, and their superpowers.'
databases:
  superhero: sqlite:///MINIDEV_sqlite/dev_databases/superhero/superhero.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Superhero
  biz_name: Superhero
  description: 超级英雄本体(Superhero/hero/character)，集成了所有 1:1 维度查表（颜色/eye colour/种族/race/性别/gender/出版商/publisher/阵营/alignment），碎片化物理表对
    Agent 透明。Each superhero has a unique name (superhero_name), height, weight, and links to colour/race/gender/publisher/alignment
    tables.
  physical_entities:
  - physical_entity_id: PHYSICAL.Superhero
    physical_table_name: superhero
    physical_table_id: superhero.superhero
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: Hero master — 主记录, FK→colour/race/gender/publisher/alignment
    attributes:
    - column: superhero.superhero.id
      biz_name: HeroID
      description: '英雄ID: 超级英雄唯一标识符'
      public: true
    - column: superhero.superhero.superhero_name
      biz_name: HeroName
      description: '英雄代号: 如 "Batman", "Spider-Man"'
      public: true
    - column: superhero.superhero.height_cm
      biz_name: Height_cm
      description: 身高(cm)
      public: true
    - column: superhero.superhero.weight_kg
      biz_name: Weight_kg
      description: 体重(kg)
      public: true
    - column: superhero.superhero.full_name
      biz_name: full name
      description: 'the full name of the superhero. commonsense evidence: The full name of a person typically consists of
        their given name, also known as their first name or personal name, and their surname, also known as their last name
        or family name. For example, if someone''s given name is "John" and their surname is "Smith," their full name would
        be "John Smith."'
    - column: superhero.superhero.eye_colour_id
      biz_name: eye colour id
      description: the id of the superhero's eye color
    - column: superhero.superhero.hair_colour_id
      biz_name: hair colour id
      description: the id of the superhero's hair color
    - column: superhero.superhero.skin_colour_id
      biz_name: skin colour id
      description: the id of the superhero's skin color
    - column: superhero.superhero.race_id
      biz_name: race id
      description: the id of the superhero's race
    - column: superhero.superhero.gender_id
      biz_name: gender id
      description: the id of the superhero's gender
    - column: superhero.superhero.publisher_id
      biz_name: publisher id
      description: the id of the publisher
    - column: superhero.superhero.alignment_id
      biz_name: alignment id
      description: the id of the superhero's alignment
  - physical_entity_id: PHYSICAL.Colour
    physical_table_name: colour
    physical_table_id: superhero.colour
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 颜色字典 — superhero.eye_colour_id / hair_colour_id / skin_colour_id 三条 FK 路径均指向此表
    attributes:
    - column: superhero.colour.id
      biz_name: HeroID
      description: '英雄ID: 超级英雄唯一标识符'
      public: true
    - column: superhero.colour.colour
      biz_name: EyeColour
      description: '眼睛颜色: 如 Blue, Brown, Gold, Red, Green'
      public: true
  - physical_entity_id: PHYSICAL.HeroRace
    physical_table_name: race
    physical_table_id: superhero.race
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 种族字典 — superhero.race_id → race.id
    attributes:
    - column: superhero.race.id
      biz_name: HeroID
      description: '英雄ID: 超级英雄唯一标识符'
      public: true
    - column: superhero.race.race
      biz_name: Race
      description: '种族: 如 Human, Kryptonian, Mutant'
      public: true
  - physical_entity_id: PHYSICAL.Gender
    physical_table_name: gender
    physical_table_id: superhero.gender
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 性别字典 — superhero.gender_id → gender.id
    attributes:
    - column: superhero.gender.id
      biz_name: HeroID
      description: '英雄ID: 超级英雄唯一标识符'
      public: true
    - column: superhero.gender.gender
      biz_name: Gender
      description: '性别: Male / Female'
      public: true
  - physical_entity_id: PHYSICAL.Publisher
    physical_table_name: publisher
    physical_table_id: superhero.publisher
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 出版商字典 — superhero.publisher_id → publisher.id
    attributes:
    - column: superhero.publisher.id
      biz_name: HeroID
      description: '英雄ID: 超级英雄唯一标识符'
      public: true
    - column: superhero.publisher.publisher_name
      biz_name: PublisherName
      description: '出版商名称: 如 Marvel Comics, DC Comics'
      public: true
  - physical_entity_id: PHYSICAL.Alignment
    physical_table_name: alignment
    physical_table_id: superhero.alignment
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 阵营字典 — superhero.alignment_id → alignment.id
    attributes:
    - column: superhero.alignment.id
      biz_name: HeroID
      description: '英雄ID: 超级英雄唯一标识符'
      public: true
    - column: superhero.alignment.alignment
      biz_name: Alignment
      description: '阵营: Good / Bad / Neutral'
      public: true
- logical_entity_id: LOGICAL.Power
  biz_name: Power
  description: Superpowers — e.g. Super Strength, Agility, Flight, Telepathy, Energy Blast; linked to heroes via hero_power
    junction table (many-to-many)
  physical_entities:
  - physical_entity_id: PHYSICAL.HeroPower
    physical_table_name: hero_power
    physical_table_id: superhero.hero_power
    A:
      cardinality: N:1
      key: hero_id
    R: null
    S: Junction 表 — hero_id→superhero.id + power_id→superpower.id, 1 英雄可有 N 条记录
    attributes:
    - column: superhero.hero_power.hero_id
      biz_name: HeroID
      description: 'HeroID: FK→superhero.id'
      public: true
    - column: superhero.hero_power.power_id
      biz_name: power id
      description: 'the id of the power Maps to superpower(id). commonsense evidence: In general, a superhero''s attributes
        provide the foundation for their abilities and help to define who they are, while their powers are the specific abilities
        that they use to fight crime and protect others.'
  - physical_entity_id: PHYSICAL.Superpower
    physical_table_name: superpower
    physical_table_id: superhero.superpower
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 超能力字典
    attributes:
    - column: superhero.superpower.id
      biz_name: PowerID
      description: 'Power ID: unique identifier'
      public: true
    - column: superhero.superpower.power_name
      biz_name: power_name
      description: 'Power name: e.g. Super Strength, Agility, Flight, Telepathy, Energy Blast, etc.'
      public: true
- logical_entity_id: LOGICAL.Attribute
  biz_name: Attribute
  description: Hero attributes with numeric values — Intelligence, Strength, Speed, Agility, Durability, Power, Combat; linked
    to heroes via hero_attribute junction table (many-to-many)
  physical_entities:
  - physical_entity_id: PHYSICAL.HeroAttribute
    physical_table_name: hero_attribute
    physical_table_id: superhero.hero_attribute
    A:
      cardinality: N:1
      key: hero_id
    R: null
    S: Junction 表 — hero_id→superhero.id + attribute_id→attribute.id, 含属性值
    attributes:
    - column: superhero.hero_attribute.hero_id
      biz_name: HeroID
      description: 'HeroID: FK→superhero.id'
      public: true
    - column: superhero.hero_attribute.attribute_value
      biz_name: attribute_value
      description: 'Attribute value: numeric score of the attribute for a specific hero'
      public: true
    - column: superhero.hero_attribute.attribute_id
      biz_name: attribute id
      description: the id of the attribute Maps to attribute(id)
  - physical_entity_id: PHYSICAL.Attribute
    physical_table_name: attribute
    physical_table_id: superhero.attribute
    A:
      cardinality: '1:1'
      key: id
    R: null
    S: 属性字典
    attributes:
    - column: superhero.attribute.id
      biz_name: AttrID
      description: 'Attribute ID: unique identifier'
      public: true
    - column: superhero.attribute.attribute_name
      biz_name: attribute_name
      description: 'Attribute name: e.g. Intelligence, Strength, Speed, Agility, Durability, Power, Combat'
      public: true
pas_relations:
- relation_id: LOGICAL.Superhero_TO_LOGICAL.Power
  relation_name: Possesses
  P:
    forward:
      verb: possesses
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: HeroID
  S: '1 英雄拥有 N 个超能力; 逆: 1 个能力属于 1 个英雄'
- relation_id: LOGICAL.Superhero_TO_LOGICAL.Attribute
  relation_name: HasAttribute
  P:
    forward:
      verb: has attribute
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: HeroID
  S: '1 英雄有 N 个属性值; 逆: 1 个属性值属于 1 个英雄'
