mapping_type: dlr
version: '2.0'
scenario_name: dlr_student_club
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
# 案例说明（原料 → 装载 → 抽象决策）：scenarios/birdminidev/README.md
description: 'Student club operations: members, events, attendance, budgets, expenses, incomes, and member majors/zip codes.'
databases:
  student_club: sqlite:///MINIDEV_sqlite/dev_databases/student_club/student_club.sqlite
logical_entities:
- logical_entity_id: LOGICAL.Member
  biz_name: Member
  description: Student club member — first_name, last_name, position, phone, T-shirt size, zip code, and major; the central
    entity for member activities, expenses, and income
  physical_entities:
  - physical_entity_id: PHYSICAL.Member
    physical_table_name: member
    physical_table_id: student_club.member
    A:
      cardinality: '1:1'
      key: member_id
    R: null
    S: Member master
    attributes:
    - column: student_club.member.member_id
      biz_name: MemberID
      description: 'the member id: unique identifier of the student club member'
      public: true
    - column: student_club.member.first_name
      biz_name: first name
      description: member's first name
    - column: student_club.member.last_name
      biz_name: last name
      description: 'member''s last name. commonsense evidence: full name is first_name + last_name. e.g. A member''s first
        name is Angela and last name is Sanders. Thus, his/her full name is Angela Sanders.'
    - column: student_club.member.position
      biz_name: position
      description: The position the member holds in the club
    - column: student_club.member.t_shirt_size
      biz_name: t_shirt_size
      description: 'The size of tee shirt that member wants when shirts are ordered. commonsense evidence: usually the student
        ordered t-shirt with lager size has bigger body shape'
    - column: student_club.member.phone
      biz_name: phone
      description: The best telephone at which to contact the member
    - column: student_club.member.zip
      biz_name: zip
      description: the zip code of the member's hometown
      public: true
    - column: student_club.member.link_to_major
      biz_name: link to major
      description: The unique identifier of the major of the member. References the Major table
      public: true
    - column: student_club.member.email
      biz_name: email
      description: member's email
- logical_entity_id: LOGICAL.Event
  biz_name: Event
  description: Club events — event_name, event_date, type, location, status; has budgets and records member attendance
  physical_entities:
  - physical_entity_id: PHYSICAL.Event
    physical_table_name: event
    physical_table_id: student_club.event
    A:
      cardinality: '1:1'
      key: event_id
    R: null
    S: Event records
    attributes:
    - column: student_club.event.event_id
      biz_name: EventID
      description: 'Event ID: unique identifier'
      public: true
    - column: student_club.event.event_name
      biz_name: EventName
      description: Event name
      public: true
    - column: student_club.event.event_date
      biz_name: EventDate
      description: Event date
      public: true
    - column: student_club.event.type
      biz_name: Type
      description: 'Event type: Meeting, fundraiser, etc.'
      public: true
    - column: student_club.event.notes
      biz_name: notes
      description: A free text field for any notes about the event
    - column: student_club.event.location
      biz_name: location
      description: Address where the event was held or is to be held or the name of such a location
    - column: student_club.event.status
      biz_name: status
      description: One of three values indicating if the event is in planning, is opened, or is closed. Open/ Closed/ Planning
- logical_entity_id: LOGICAL.Attendance
  biz_name: Attendance
  description: Member attendance at events — many-to-many junction linking members to events they attended
  physical_entities:
  - physical_entity_id: PHYSICAL.Attendance
    physical_table_name: attendance
    physical_table_id: student_club.attendance
    A:
      cardinality: '1:N'
      key: link_to_event
    R: null
    S: Member-event many-to-many
    attributes:
    - column: student_club.attendance.link_to_event
      biz_name: Event
      description: 'the event attended: FK to the event table'
      public: true
    - column: student_club.attendance.link_to_member
      biz_name: Member
      description: 'the member attending: FK to the member table'
      public: true
- logical_entity_id: LOGICAL.Budget
  biz_name: Budget
  description: Event budget tracking — allocated amount, spent, remaining, category, and status per event; funds member expenses
  physical_entities:
  - physical_entity_id: PHYSICAL.Budget
    physical_table_name: budget
    physical_table_id: student_club.budget
    A:
      cardinality: '1:N'
      key: link_to_event
    R: null
    S: Event budget item — amount, spent, remaining, category
    attributes:
    - column: student_club.budget.budget_id
      biz_name: BudgetID
      description: 'the budget id: unique identifier of the budget line'
      public: true
    - column: student_club.budget.link_to_event
      biz_name: Event
      description: 'Event ID: FK to event table'
      public: true
    - column: student_club.budget.amount
      biz_name: Amount
      description: 'Budget amount: total allocated budget'
      public: true
    - column: student_club.budget.spent
      biz_name: Spent
      description: 'the amount spent out of this budget, the unit is dollar. This is summarized from the Expense table'
      public: true
    - column: student_club.budget.category
      biz_name: category
      description: The area for which the amount is budgeted, such as, advertisement, food, parking
    - column: student_club.budget.remaining
      biz_name: remaining
      description: 'A value calculated as the amount budgeted minus the amount spent. the unit is dollar commonsense evidence:
        If the remaining < 0, it means that the cost has exceeded the budget.'
    - column: student_club.budget.event_status
      biz_name: event status
      description: "the status of the event. Closed / Open/ Planning commonsense evidence: \x95 Closed: It means that the\
        \ event is closed. The spent and the remaining won't change anymore. \x95 Open: It means that the event is already\
        \ opened. The spent and the remaining will change with new expenses. \x95 Planning: The event is not started yet but\
        \ is planning. The spent and the remaining won't change at this stage."
- logical_entity_id: LOGICAL.Expense
  biz_name: Expense
  description: Member expense records — individual spending with cost, expense_date, description, and approval status; incurred
    by members, funded by event budgets
  physical_entities:
  - physical_entity_id: PHYSICAL.Expense
    physical_table_name: expense
    physical_table_id: student_club.expense
    A:
      cardinality: '1:N'
      key: link_to_member
    R: null
    S: Individual member expense at an event — cost, date, description, approval status
    attributes:
    - column: student_club.expense.expense_id
      biz_name: ExpenseID
      description: 'the expense id: unique identifier of the expense record'
      public: true
    - column: student_club.expense.link_to_member
      biz_name: Member
      description: 'the member who spent: FK to the member table'
      public: true
    - column: student_club.expense.link_to_budget
      biz_name: Budget
      description: 'the budget this expense belongs to: FK to the budget table'
      public: true
    - column: student_club.expense.cost
      biz_name: cost
      description: 'The dollar amount of the expense. the unit is dollar'
      public: true
    - column: student_club.expense.expense_date
      biz_name: expense_date
      description: 'the date the expense was made (YYYY-MM-DD)'
      public: true
    - column: student_club.expense.expense_description
      biz_name: expense description
      description: A textual description of what the money was spend for
    - column: student_club.expense.approved
      biz_name: approved
      description: A true or false value indicating if the expense was approved. true/ false
- logical_entity_id: LOGICAL.Income
  biz_name: Income
  description: Funds received by the club — amount, source, date_received, and notes; received by members
  physical_entities:
  - physical_entity_id: PHYSICAL.Income
    physical_table_name: income
    physical_table_id: student_club.income
    A:
      cardinality: '1:N'
      key: link_to_member
    R: null
    S: Income records
    attributes:
    - column: student_club.income.income_id
      biz_name: IncomeID
      description: ''
      public: true
    - column: student_club.income.link_to_member
      biz_name: Member
      description: ''
      public: true
    - column: student_club.income.amount
      biz_name: amount
      description: amount of funds. the unit is dollar
    - column: student_club.income.source
      biz_name: source
      description: A value indicating where the funds come from such as dues, or the annual university allocation
    - column: student_club.income.date_received
      biz_name: date received
      description: the date that the fund received
    - column: student_club.income.notes
      biz_name: notes
      description: A free-text value giving any needed details about the receipt of funds
- logical_entity_id: LOGICAL.Major
  biz_name: Major
  description: Academic major — major_name, department, and college
  physical_entities:
  - physical_entity_id: PHYSICAL.Major
    physical_table_name: major
    physical_table_id: student_club.major
    A:
      cardinality: '1:1'
      key: major_id
    R: null
    S: Major dictionary
    attributes:
    - column: student_club.major.major_id
      biz_name: MajorID
      description: 'the major id: unique identifier of the major'
      public: true
    - column: student_club.major.major_name
      biz_name: major name
      description: major name
    - column: student_club.major.department
      biz_name: department
      description: The name of the department that offers the major
    - column: student_club.major.college
      biz_name: college
      description: The name college that houses the department that offers the major
- logical_entity_id: LOGICAL.ZipCode
  biz_name: ZipCode
  description: Zip code geographic information — city, state, and county
  physical_entities:
  - physical_entity_id: PHYSICAL.ZipCode
    physical_table_name: zip_code
    physical_table_id: student_club.zip_code
    A:
      cardinality: '1:1'
      key: zip_code
    R: null
    S: Zip code dictionary
    attributes:
    - column: student_club.zip_code.zip_code
      biz_name: Zip
      description: ''
      public: true
    - column: student_club.zip_code.city
      biz_name: city
      description: The city to which the ZIP pertains
    - column: student_club.zip_code.state
      biz_name: state
      description: The name of the state to which the ZIP pertains
    - column: student_club.zip_code.county
      biz_name: county
      description: The county to which the ZIP pertains
    - column: student_club.zip_code.type
      biz_name: type
      description: 'The kind of ZIP code. commonsense evidence: � Standard: the normal codes with which most people are familiar
        � PO Box: zip codes have post office boxes � Unique: zip codes that are assigned to individual organizations.'
    - column: student_club.zip_code.short_state
      biz_name: short state
      description: The abbreviation of the state to which the ZIP pertains
pas_relations:
- relation_id: LOGICAL.Member_TO_LOGICAL.Event
  relation_name: Participates
  P:
    forward:
      verb: participates
      cardinality: 1:N
    reverse:
      verb: involves
      cardinality: 1:N
  A: MemberID
  S: Members participate in events via attendance
- relation_id: LOGICAL.Event_TO_LOGICAL.Budget
  relation_name: HasBudget
  P:
    forward:
      verb: has
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Event
  S: 1 event has N budget items — amount, spent, remaining per event
- relation_id: LOGICAL.Budget_TO_LOGICAL.Expense
  relation_name: Funds
  P:
    forward:
      verb: funds
      cardinality: 1:N
    reverse:
      verb: is funded by
      cardinality: '1:N'
  A: Budget
  S: 1 budget item funds N member expenses — expense.link_to_budget → budget.budget_id
- relation_id: LOGICAL.Member_TO_LOGICAL.Expense
  relation_name: Incurs
  P:
    forward:
      verb: incurs
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:N'
  A: Member
  S: 1 member incurs N expenses at events — expense.link_to_member → member.member_id
- relation_id: LOGICAL.Member_TO_LOGICAL.Income
  relation_name: Receives
  P:
    forward:
      verb: receives
      cardinality: 1:N
    reverse:
      verb: belongs to
      cardinality: '1:1'
  A: Member
  S: 1 member receives N income entries
- relation_id: LOGICAL.Member_TO_LOGICAL.Major
  relation_name: BelongsTo
  P:
    forward:
      verb: belongs to
      cardinality: '1:N'
    reverse:
      verb: contains
      cardinality: 1:N
  A: MajorID
  S: Members belong to a major
- relation_id: LOGICAL.Member_TO_LOGICAL.ZipCode
  relation_name: LivesIn
  P:
    forward:
      verb: lives in
      cardinality: '1:N'
    reverse:
      verb: contains
      cardinality: 1:N
  A: Zip
  S: Members live in a zip code area
