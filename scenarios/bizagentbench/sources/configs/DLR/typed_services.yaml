- logical_entity_id: LOGICAL.operations_desk.ContinuousGuarantee
  biz_name: ContinuousGuarantee
  description: 'Guarantee renewal and temporary cover: a renewal submission pays the offer fee immediately but is not cover; replacement
    cover activates at the offer''s activation minute only when the full required cash margin is already lodged; a missed activation
    is reconsidered later without backdating; bridge cover and supplier bills are separate obligations. Contract: Guarantee renewal,
    temporary cover and cash margin. Actions: submit_renewal / add_margin / withdraw_margin / buy_bridge / pay_supplier. Instruction
    data: submit_renewal {offer_id}; add_margin/withdraw_margin {guarantee_id, amount_minor}; buy_bridge {offer_id}; pay_supplier {bill_id,
    amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_guarantee_continuity
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: submit_renewal / add_margin / withdraw_margin / buy_bridge / pay_supplier; checks actual records for eligibility,
      coverage, cash and timing; local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-continuous_guarantees
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
