- logical_entity_id: LOGICAL.operations_desk.ReconciledDebit
  biz_name: ReconciledDebit
  description: 'Direct-debit settlement and reconciliation: physical bank debits link to debtor invoices and periods; posted credits
    reduce them; pending credits have no posted value; mandates gate new collections; customer-requested returns are unconditional within
    the still-returnable settled amount; a returned debit may be re-presented. Contract: Direct-debit settlement, returns and mandate
    retirement. Actions: return_debit / revoke_mandate / recall_collection / pay_invoice. Instruction data: return_debit {record_id,
    amount_minor}; revoke_mandate {record_id}; recall_collection {record_id}; pay_invoice {record_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_debit_reconciliation
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: return_debit / revoke_mandate / recall_collection / pay_invoice; checks actual records for eligibility, coverage,
      cash and timing; local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-reconciled_debits
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
  physical_entities:
  - physical_entity_id: PHYSICAL.operations_desk.ReconciledDebit.case
    resource: service_cases
    A:
      cardinality: 1:N
      key: kind
    S: 'search_records("service_cases", filters={"kind": "reconciled_debits"}) — the signed-in customer''s reconciled_debits service
      cases; get_record(id) reads status, cash, fees and state. Do not infer other kinds'' records from a failed lookup.'
    attributes:
    - name: capital_arrangement_id
      description: Record ID in joint_agreements. Use get_record on that collection; the link does not make other rows implicitly belong
        to the same object.
      public: false
    - name: cash_minor
      description: Operating cash held by this object, in minor units. It is distinct from restricted sources, unposted capital and
        quota.
