- logical_entity_id: LOGICAL.operations_desk.VersionedAuthority
  biz_name: VersionedAuthority
  description: 'Corporate payment controls and signed instruments: an invoice instruction carries the authority and attached genuine
    signature copies; a bank execution receipt certifies the actual debit and receiving details but does not certify that the company''s
    additional control mandate was satisfied; the attached set can be replaced before payment. Contract: Corporate payment controls
    and signed instruments. Actions: attach_signatures / pay_invoice. Instruction data: attach_signatures {record_id, signature_ids};
    pay_invoice {record_id, amount_minor, bank_version}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_corporate_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: attach_signatures / pay_invoice; checks actual records for eligibility, coverage, cash and timing; local legality
      does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-versioned_authority
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
