- logical_entity_id: LOGICAL.operations_desk.ProspectiveBilling
  biz_name: ProspectiveBilling
  description: 'Consolidated subscription billing: each billing period elects its own plan; the fixed subscription fee is charged once
    for the billing group and variable fees use that period''s plan rates; usage aggregates over the arrangement''s operating accounts;
    a partner campaign voucher is reserved to one open period; closing an account updates unused offer eligibility. Contract: Consolidated
    subscription billing and partner credits. Actions: select_plan / reserve_voucher / close_account. Instruction data: select_plan
    {record_id, plan_id}; reserve_voucher {record_id, code}; close_account {record_id}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_subscription_election
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: select_plan / reserve_voucher / close_account; checks actual records for eligibility, coverage, cash and timing;
      local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-prospective_billing
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
