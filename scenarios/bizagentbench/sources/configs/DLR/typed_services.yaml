- logical_entity_id: LOGICAL.operations_desk.JointAgreement
  biz_name: JointAgreement
  description: Customer-owned capital arrangement that allocates registered settlement capital to service wallets. The agreement records
    capital by case and account, continuous cash floors, delivery mode, fee cadence, fee ceiling, terms version and any assessment event.
    capital_by_case is the contractual total for each service and initial_operating_by_case is already in that service wallet; at reconciliation,
    deliver each service's remaining registered capital exactly (not merely the current payment shortfall), while respecting permitted_case_ids,
    source release conditions, the route fee ceiling and the uncommitted cash floor. Capital delivery is not a supplier payment or refund;
    delivered money cannot be recalled or swept to another service.
  capabilities:
  - name: propose_joint_capital_delivery
    kind: write
    anchor:
      param: agreement_id
      role: primary
    guard: inside the funding deadline; positive allocations not above source balance or remaining registered capital; route terms version
      current; first delivery to a service incurs the route fee
    source: JOINT-CASH-delivery
