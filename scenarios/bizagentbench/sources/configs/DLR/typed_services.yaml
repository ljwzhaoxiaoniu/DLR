- logical_entity_id: LOGICAL.operations_desk.SubscriptionProration
  biz_name: SubscriptionProration
  description: 'Subscription proration: amend an invoice for the actual service period, refund an overpayment and handle renewals and
    collections under the subscription terms. A renewal is a new period, not a correction of the old invoice. Contract: Mid-period service
    changes and delayed collections. Actions: amend_invoice / refund. Instruction data: amend_invoice {amount_minor}; refund {amount_minor};
    pay_balance {amount_minor}; recall_collection {}; set_renewal {active: boolean}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_payment_subscription_proration
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: amend_invoice / refund; checks actual records for eligibility, coverage, cash and timing; local legality does not
      prove the commercial objective; portal approval and execute_request required'
    source: PAYMENT-payment_subscription_proration
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
