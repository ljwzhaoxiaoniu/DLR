- logical_entity_id: LOGICAL.operations_desk.ActualCollection
  biz_name: ActualCollection
  description: 'Export-bill collection: a buyer acceptance notice is not cash; each physical bill has its own face, prior receipts,
    acceptance result and title; the acceptance event records the actual accepted amount; a bill may be discounted once after actual
    acceptance; original documents deliver to the buyer or return to the exporter. Contract: Collection acceptance, bill finance and
    original delivery. Actions: discount / pay / deliver / return_documents. Instruction data: discount {bill_id, amount_minor}; pay
    {payable_id, amount_minor}; deliver {bill_id, quantity_units}; return_documents {bill_id, quantity_units}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_actual_collection
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: discount / pay / deliver / return_documents; checks actual records for eligibility, coverage, cash and timing;
      local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-actual_collections
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
