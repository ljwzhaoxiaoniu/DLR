- logical_entity_id: LOGICAL.operations_desk.TemporalCertificate
  biz_name: TemporalCertificate
  description: 'Evidence certificates and dependent authorities: a certificate covers a stated interval for the same entity, account
    and required attributes; a partner file has its own business period and acceptance day; issued certificates are ordered for a fee,
    reliance can be reopened with a version advance, evidence is submitted, and continuing authority is rebound to listed current versions.
    Contract: Certificate withdrawal, signature validity and dependent approvals. Actions: order_certificate / reopen_reliance / submit_evidence
    / rebind_authority. Instruction data: order_certificate {record_id}; reopen_reliance {record_id}; submit_evidence {record_id, certificate_id};
    rebind_authority {record_id, versions}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_certificate_remediation
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: order_certificate / reopen_reliance / submit_evidence / rebind_authority; checks actual records for eligibility,
      coverage, cash and timing; local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-temporal_certificates
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
