- logical_entity_id: LOGICAL.operations_desk.DocumentTitleAllocation
  biz_name: DocumentTitleAllocation
  description: 'Cargo release under ACTIVE title documents: endorsement names the destination; a joint title can be endorsed whole or
    split into its exact child titles; pickup windows open by scheduled events; dispatch consumes the lot''s full handling units and
    is irreversible; storage charges depend on the dispatch minute relative to free_through and the window rates. Contract: Current
    title documents, pickup windows and storage charges. Actions: activate_split / endorse_title / dispatch. Instruction data: activate_split
    {title_id}; endorse_title {title_id, destination_id}; dispatch {lot_id, window_id, destination_id}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_title_release
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: activate_split / endorse_title / dispatch; checks actual records for eligibility, coverage, cash and timing; local
      legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-document_title_allocation
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
