- logical_entity_id: LOGICAL.operations_desk.InspectionEscrow
  biz_name: InspectionEscrow
  description: 'Per-lot equipment escrow: each lot is independently funded; final inspection sets accepted prices; warranty retention
    stays in the lot; assigned proceeds are paid in priority order (ELIGIBLE_GROSS_CAPPED, then REMAINDER_PERCENTAGE); buyer refunds
    follow posted deposits and ascending refund_order. Contract: Equipment escrow acceptance and assigned proceeds. Actions: distribute
    / refund_buyer / return_distribution. Instruction data: distribute {lot_id, recipient_id, amount_minor}; refund_buyer {lot_id, recipient_id,
    amount_minor}; return_distribution {lot_id, recipient_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_escrow_settlement
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: distribute / refund_buyer / return_distribution; checks actual records for eligibility, coverage, cash and timing;
      local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-inspection_escrow
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
