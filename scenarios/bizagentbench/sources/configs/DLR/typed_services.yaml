# BizAgentBench · typed services (cases 6-30) · L1
# LE = service-case business object; PE = service_cases / service_records / service_bookings surfaces;
# PAS = case membership, joint-capital funding and link contracts. Schema level only.
mapping_type: dlr-state
version: '3.0'
scenario_name: dlr_bizagentbench_typed
description: 'Typed service contracts of BizAgentBench Operations Desk (cases 6-30): specialist and payment service cases living in
  service_cases/service_records/service_bookings, plus joint-capital agreements, their sources/routes/fundings, and link contracts between
  service cases. Schema level only; instance values are read at runtime.'
source:
  kind: synthetic-payment-world
  system: operations_desk
  docs: DIVERSE-* / PAYMENT-* / TRADE-common / JOINT-CASH-delivery / LINK-* / DB-service-* / DB-joint_* / DB-link_contracts / tool_catalog
logical_entities:
- logical_entity_id: LOGICAL.operations_desk.DatedCollateral
  biz_name: DatedCollateral
  description: 'Corporate-lending contract where dated securities back a loan: eligibility by owner, security class, custody status
    and inclusive dates; haircut lending value; issuer concentration caps; continuing principal cover; custody events publish actual
    values; principal repayment is irreversible and the first repayment charges the loan servicing fee. Contract: Dated security substitution
    and custody settlement. Actions: repay / pledge / release / pay_bill. Instruction data: repay {record_id, amount_minor}; pledge
    {record_id, loan_id}; release {record_id}; pay_bill {record_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_dated_collateral
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: repay / pledge / release / pay_bill; checks actual records for eligibility, coverage, cash and timing; local legality
      does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-dated_collateral
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
