- logical_entity_id: LOGICAL.operations_desk.ReconciledSync
  biz_name: ReconciledSync
  description: 'Merchant sales synchronization and receivable finance: per-store order and return streams have separate permissions
    and cursors; event identity is store plus stream plus native event plus revision; imported events post idempotently against canonical
    keys; a failed sync may leave committed postings and an older cursor; receivables can be financed and unwound, and USD withdrawn
    to a verified CNY recipient. Contract: Merchant sales synchronization and receivable finance. Actions: grant_stream / import_window
    / finance / unwind / withdraw / pay_supplier. Instruction data: grant_stream {record_id}; import_window {record_id, after_cursor,
    through_cursor}; finance {record_id}; unwind {record_id}; withdraw {record_id, amount_minor}; pay_supplier {record_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_sales_recovery
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: grant_stream / import_window / finance / unwind / withdraw / pay_supplier; checks actual records for eligibility,
      coverage, cash and timing; local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-reconciled_sync
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
