- logical_entity_id: LOGICAL.operations_desk.ContingentForward
  biz_name: ContingentForward
  description: 'Treasury forward-currency contracts with separately held margin, lot-sized exercises and nominations, cumulative proportional
    margin release, spot exchange and supplier remittances. Confirmed-but-unpaid deliveries can be retried; closing an uncommitted remainder
    releases its margin and charges the recorded closeout fee. Contract: Forward currency delivery and margin settlement. Actions: exercise
    / nominate / settle_confirmed / close_remainder / spot / pay_invoice. Instruction data: exercise {record_id, amount_minor}; nominate
    {record_id, amount_minor}; settle_confirmed {record_id}; close_remainder {record_id}; spot {currency, side, amount_minor}; pay_invoice
    {record_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_forward_delivery
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: exercise / nominate / settle_confirmed / close_remainder / spot / pay_invoice; checks actual records for eligibility,
      coverage, cash and timing; local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-contingent_forwards
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
