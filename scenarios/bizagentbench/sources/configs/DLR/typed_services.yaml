- logical_entity_id: LOGICAL.operations_desk.ReconciledExpense
  biz_name: ReconciledExpense
  description: 'Travel-expense funding and advance reconciliation: only final receipt items for registered business activity qualify;
    lodging, meals and taxis qualify and private activity is excluded; a void receipt or unsettled authorization is not a reimbursable
    expense; expense caps group by beneficiary natural person, expense day and category; staff settlement nets eligible personal-funded
    shares against outstanding advances. Contract: Travel expense funding and advance reconciliation. Actions: reimburse / recover_advance.
    Instruction data: reimburse {employee_id, amount_minor, bank_version}; recover_advance {employee_id, amount_minor, bank_version}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_expense_reconciliation
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: reimburse / recover_advance; checks actual records for eligibility, coverage, cash and timing; local legality does
      not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-reconciled_expenses
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
