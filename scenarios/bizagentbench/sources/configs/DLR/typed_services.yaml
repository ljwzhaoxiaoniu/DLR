- logical_entity_id: LOGICAL.operations_desk.CrossCalendarDelivery
  biz_name: CrossCalendarDelivery
  description: 'Cross-calendar currency delivery: reserve route capacity and send currency so the beneficiary receives value on the
    required calendar day; route terms, cutoffs and settlement calendars determine when the credit is actually available. Contract:
    Cross-calendar currency delivery. Actions: reserve_route / send_currency. Instruction data: reserve_route {invoice_id, route_id};
    send_currency {invoice_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_payment_cross_calendar_delivery
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: reserve_route / send_currency; checks actual records for eligibility, coverage, cash and timing; local legality
      does not prove the commercial objective; portal approval and execute_request required'
    source: PAYMENT-payment_cross_calendar_delivery
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
