- logical_entity_id: LOGICAL.operations_desk.DatedPayroll
  biz_name: DatedPayroll
  description: 'Payroll with attachment priorities: disposable earnings equal gross wages less payroll tax; the employee retains the
    protected disposable amount, so total attachment cannot exceed the positive difference; business-expense repayments are additional
    and never enter the attachment base; court notices and attachment orders are dated obligations with creditor priorities. Contract:
    Payroll attachment priorities and prospective court decisions. Actions: pay_employee / pay_tax / pay_attachment. Instruction data:
    pay_employee {record_id, amount_minor, bank_version}; pay_tax {record_id, amount_minor}; pay_attachment {record_id, order_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_payroll_remittance
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: pay_employee / pay_tax / pay_attachment; checks actual records for eligibility, coverage, cash and timing; local
      legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-dated_payroll
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
