- logical_entity_id: LOGICAL.operations_desk.DatedInterest
  biz_name: DatedInterest
  description: 'Value-date evidence and closed-statement interest: a posted bank item keeps its principal, booking day and original
    value day; an economic-date amendment is a separate record; signed historical statements are not current available cash; interest
    adjustments post to the statement account and accountant obligations are paid to verified external recipients. Contract: Value-date
    evidence and closed-statement interest adjustments. Actions: record_value_date / post_adjustment / pay_accountant. Instruction data:
    record_value_date {item_id, bank_message_id, value_day}; post_adjustment {statement_id, period_id, amount_minor}; pay_accountant
    {obligation_id, payer_account_id, recipient_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_interest_correction
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: record_value_date / post_adjustment / pay_accountant; checks actual records for eligibility, coverage, cash and
      timing; local legality does not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-dated_interest
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
