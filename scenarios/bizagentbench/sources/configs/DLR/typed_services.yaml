- logical_entity_id: LOGICAL.operations_desk.LateCardReconciliation
  biz_name: LateCardReconciliation
  description: 'Corporate-card presentments and merchant credits: each presentment is a physical card posting identified by card, entity,
    cardholder, merchant case, settlement trace, amount and service day; a declined authorization does not prove a later presentment
    was unauthorized; each dispute charges one fixed fee on the physical presentment; company cash accounts pay the card. Contract:
    Corporate-card presentments, merchant credits and disputes. Actions: file_dispute / pay_card. Instruction data: file_dispute {presentment_id,
    amount_minor}; pay_card {card_account_id, cash_account_id, amount_minor}.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: propose_card_reconciliation
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: 'actions: file_dispute / pay_card; checks actual records for eligibility, coverage, cash and timing; local legality does
      not prove the commercial objective; portal approval and execute_request required'
    source: DIVERSE-late_card_reconciliation
  - name: propose_service_inquiry
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: opens one inquiry for a case and record; the receipt arrives after the record's delay; a PENDING inquiry is not the receipt
    source: TRADE-common
  - name: propose_service_payment
    kind: write
    anchor:
      param: case_id
      role: primary
    guard: pays a named service obligation from its specified service wallet; the bank checks available cash, not the commercial amount
      still remaining
    source: TRADE-common
