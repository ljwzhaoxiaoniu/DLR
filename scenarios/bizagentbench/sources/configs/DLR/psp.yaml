    above a recipient''s per-instruction maximum are declined before cash posting. Source articles: Tax agent review, routing and jurisdiction;
    Agency processing reservations and amendments; Authority remittance amount and delivery conditions; Predecessor allocation estimates
    and accepted receipts; Tax agency processing capacity service interfaces.'
