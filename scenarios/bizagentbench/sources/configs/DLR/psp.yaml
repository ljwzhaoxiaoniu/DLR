    group; the residency review publishes the actual withholding rate and route eligibility together. Source articles: Shared FX proceeds:
    exact largest-remainder rights; Royalty payment service capacity and charges; Beneficiary receipt timing and effective routing conditions;
    Residency review publication and provisional payment instructions; Royalty capacity release service interfaces.'
