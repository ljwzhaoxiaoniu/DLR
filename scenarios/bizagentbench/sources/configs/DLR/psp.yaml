# BizAgentBench · Payment Expansion (PSP, cases 31-50) · L1
# LE = product-family business object; PE = xp_* record surfaces; capabilities from PX-*/IFACE-* articles.
# Schema level only; no instance values.
mapping_type: dlr-state
version: '3.0'
scenario_name: dlr_bizagentbench_psp
description: 'Payment Expansion (PSP) namespace of BizAgentBench (cases 31-50): twenty product families built from their PX-* / IFACE-*
  product articles, with their xp_* record surfaces, product capabilities and the shared customer case and accounts. Schema level only;
  instance values are read at runtime.'
source:
  kind: synthetic-payment-world
  system: psp
  docs: PX-* / IFACE-* / PX-DATABASE / tool_catalog
logical_entities:
- logical_entity_id: LOGICAL.psp.XpCase
  biz_name: XpCase
  description: 'Signed-in customer''s business case in the Payment Expansion sandbox: the starting context for record navigation, carrying
    the customer, account, business area, related resources and case status. It is not a universal record ID; product records are found
    in their own collections.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: record_case_outcome
    kind: write
    anchor:
      param: outcome
      role: primary
    guard: exactly once after the applicable work is done; a premature or repeated closure fails the process
    source: PX-COMMON
  physical_entities:
  - physical_entity_id: PHYSICAL.psp.XpCase.record
    resource: xp_cases
    A:
      cardinality: 1:N
      key: customer_id
    S: search_records("xp_cases", filters={}) — start record navigation here; get_record(id) reads the business_area, account_id, related_resources
      and status of the customer case. Empty results do not prove another collection is empty.
    attributes:
    - name: account_id
      description: account_id — public field of xp_cases
      public: true
    - name: business_area
      description: business_area — public field of xp_cases
      public: true
    - name: customer_id
      description: customer_id — public field of xp_cases
      public: true
    - name: id
      description: id — public field of xp_cases
      public: true
    - name: name
      description: name — public field of xp_cases
      public: true
    - name: number
      description: number — public field of xp_cases
      public: false
    - name: reasoning_version
      description: reasoning_version — public field of xp_cases
      public: false
    - name: related_resources
      description: related_resources — public field of xp_cases
      public: false
    - name: status
      description: status — public field of xp_cases
      public: true
- logical_entity_id: LOGICAL.psp.XpAccount
  biz_name: XpAccount
  description: 'Payment Expansion account and wallet: balance, currency, usage and withdrawal basis. Cash movements are posted by executed
    requests and completed bank events; accounts cannot overdraw and the cash journal is immutable.'
  physical_entities:
  - physical_entity_id: PHYSICAL.psp.XpAccount.record
    resource: xp_accounts
    A:
      cardinality: 1:N
      key: customer_id
    S: search_records("xp_accounts", filters={}) — the customer's accounts and wallets; get_record(id) reads balance_minor, currency,
      usage and withdrawal_basis. A balance is not proof that a pending payment has not already consumed it.
    attributes:
    - name: balance_minor
      description: balance_minor — public field of xp_accounts
      public: false
    - name: currency
      description: currency — public field of xp_accounts
      public: false
    - name: customer_id
      description: customer_id — public field of xp_accounts
      public: true
    - name: id
      description: id — public field of xp_accounts
      public: true
    - name: name
      description: name — public field of xp_accounts
      public: true
    - name: usage
      description: usage — public field of xp_accounts
      public: false
    - name: withdrawal_basis
      description: withdrawal_basis — public field of xp_accounts
      public: false
- logical_entity_id: LOGICAL.psp.QuarantineDispute
  biz_name: QuarantineDispute
  description: 'Unknown incoming payment under ownership investigation: the incoming record, its quarantine dispute and the separate
    trustee custody service. Principal stays in a segregated quarantine account until an original-route return, a signed trustee deposit
    or an authorized owner claim disposes it; ordinary supplier invoices compete for the same operating cash. A return along the original
    route cannot be cancelled after initiation. Source articles: Unknown-funds ownership and original-route return; Segregated incoming
    dispute escrow; Dispute trustee onboarding and activation timing; Operating payments and segregated dispute balances; Accidental-transfer
    refunds and ordinary supply cash.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: a_dispose_incoming_balance
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Return quarantined funds along their original bank route or claim funds supported by a published ownership decision. Funds
      cannot be sent to a claimant's substitute account throug… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-OWNER
  - name: a_investigate_incoming_owner
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Register an ownership investigation using an original remittance proof. Knowing an amount or sending an email does not establish
      ownership. The bank result is an independent envir… Portal approval of the exact terms and execute_request are required; the bank
      checks local legality, not the commercial objective.
    source: PX-A-OWNER
  - name: a_submit_receipt_claim
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Register a claim while a sender recall is under review. Submission is not an ownership decision and does not cancel the parallel
      recall. Portal approval of the exact terms and execute_request are required; the bank checks local legality, not the commercial
      objective.
    source: PX-A-OWNER
  - name: a_submit_quarantine_escrow_direction
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Submit the existing two-party dispute direction. The bank publishes the disputed amount (`disputed_minor`) and named escrow
      trustee (`authorized_trustee_id`); it neither credits operating cash nor pays a substitute claimant. Portal approval of the exact
      terms and execute_request are required; the bank checks local legality, not the commercial objective.
    source: PX-A-D31
  - name: a_activate_dispute_custody
    kind: write
    anchor:
      param: contract_id
      role: primary
    guard: Purchase the selected trustee activation after review. Operating cash pays the fee, and custody becomes usable only on the
      actual activation event. It does not transfer segregated… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-R-CUSTODY-ONBOARDING
  - name: a_order_trustee_review
    kind: write
    anchor:
      param: contract_id
      role: primary
    guard: Buy a trustee onboarding review. The nonrefundable fee is charged to operating cash; the completed review publishes actual
      activation offers for the named dispute trustee. Portal approval of the exact terms and execute_request are required; the bank
      checks local legality, not the commercial objective.
    source: PX-A-R-CUSTODY-ONBOARDING
  - name: a_partition_quarantined_funds
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Dispose the whole segregated principal into original-route return (`return_minor`), trustee escrow (`escrow_minor`) and
      operating claim (`claim_minor`) amounts to the named trustee (`trustee_id`). Every amount is nonnegative and their sum must
      equal principal. Thes… Portal approval of the exact terms and execute_request are required; the bank checks local legality,
      not the commercial objective.
    source: PX-A-R-CUSTODY-ONBOARDING
  - name: a_pay_business_invoice
    kind: write
    anchor:
      param: invoice_id
      role: primary
    guard: Send an irrevocable bank payment against an invoice. The bank checks cash, recipient availability and account-scoped idempotency,
      not whether the customer's commercial obligation… Portal approval of the exact terms and execute_request are required; the bank
      checks local legality, not the commercial objective.
    source: PX-A-R-RETURN-WORKING-CASH
  - name: a_return_duplicate_transfer
    kind: write
    anchor:
      param: bank_transaction_id
      role: primary
    guard: Return a real credited bank transfer to the original sender. Identical notification amounts do not establish that a bank
      transfer was economically duplicated. Portal approval of the exact terms and execute_request are required; the bank checks local
      legality, not the commercial objective.
    source: PX-A-R-RETURN-WORKING-CASH
