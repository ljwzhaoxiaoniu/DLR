- logical_entity_id: LOGICAL.psp.RecalledSale
  biz_name: RecalledSale
  description: 'Recalled remittance and returned goods: a bank recall controls ownership of the original remittance but does not cancel
    the sale invoice; returned goods create a separate credit entitlement after inspection; replacement remittances, replacement receipts
    and a buyer-collection calendar settle the remaining sale value. The collectible amount is invoice face less issued commercial credit,
    retained principal and replacement principal already received or requested. Source articles: Unknown-funds ownership and original-route
    return; Recalled remittances, returned goods and commercial receivables; Buyer recollection services and reserved bank capacity;
    Return inspection and buyer collection milestones.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: a_dispose_incoming_balance
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Return quarantined funds along their original bank route or claim funds supported by a published ownership decision. Funds
      cannot be sent to a claimant's substitute account throug… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-OWNER
  - name: a_investigate_incoming_owner
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Register an ownership investigation using an original remittance proof. Knowing an amount or sending an email does not establish
      ownership. The bank result is an independent envir… Portal approval of the exact terms and execute_request are required; the bank
      checks local legality, not the commercial objective.
    source: PX-A-OWNER
  - name: a_submit_receipt_claim
    kind: write
    anchor:
      param: incoming_id
      role: primary
    guard: Register a claim while a sender recall is under review. Submission is not an ownership decision and does not cancel the parallel
      recall. Portal approval of the exact terms and execute_request are required; the bank checks local legality, not the commercial
      objective.
    source: PX-A-OWNER
  - name: a_apply_replacement_receipt
    kind: write
    anchor:
      param: receipt_id
      role: primary
    guard: Apply authentic replacement cash to its commercial invoice. Application does not create or move bank cash. The same receipt
      can be applied once and only to its linked sale. Portal approval of the exact terms and execute_request are required; the bank
      checks local legality, not the commercial objective.
    source: PX-A-RECALL-SALE
  - name: a_issue_sale_credit
    kind: write
    anchor:
      param: sale_id
      role: primary
    guard: Issue an irrevocable commercial credit note. Any amount up to the remaining invoice face is operationally accepted. The returned-goods
      agreement determines how much debt the custo… Portal approval of the exact terms and execute_request are required; the bank checks
      local legality, not the commercial objective.
    source: PX-A-RECALL-SALE
  - name: a_refund_replacement_overpayment
    kind: write
    anchor:
      param: receipt_id
      role: primary
    guard: Refund a portion of a bank-confirmed replacement remittance to its original buyer. The bank accepts any amount within the
      receipt balance; the commercial invoice and approved retu… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-RECALL-SALE
  - name: a_request_replacement_remittance
    kind: write
    anchor:
      param: sale_id
      role: primary
    guard: Request the buyer to pay the remaining commercial balance after the original recalled principal has been finally disposed
      of. The buyer pays the invoice face less posted credit no… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-RECALL-SALE
  - name: a_book_buyer_collection
    kind: write
    anchor:
      param: service_id
      role: primary
    guard: Purchase reserved buyer recollection capacity under a published service. The booking fee is nonrefundable. Booking holds
      capacity, does not collect money, and can be made before t… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-BUYER-COLLECTION-CALENDAR
  - name: a_collect_remaining_sale
    kind: write
    anchor:
      param: sale_id
      role: primary
    guard: Request a chosen portion of the actual commercial debt through a previously booked buyer service. Concurrent requests count
      toward the same unpaid debt; bank receipts arrive after… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-A-BUYER-COLLECTION-CALENDAR
  - name: a_review_sale_return
    kind: write
    anchor:
      param: sale_id
      role: primary
    guard: Review the returned-goods evidence against a recalled sale. The later commercial review publishes the credit-note entitlement;
      it does not determine ownership of the original bank… Portal approval of the exact terms and execute_request are required; the
      bank checks local legality, not the commercial objective.
    source: PX-A-RETURN-VALUATION
