      role: primary
    guard: Post a bank receipt into the supplier payable ledger. RETURNED or PROCESSING reopens the invoice amount; SETTLED clears it.
      This legacy posting interface accepts any receipt for t… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
