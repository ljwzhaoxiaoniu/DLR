- logical_entity_id: LOGICAL.psp.BankReceiptCorrection
  biz_name: BankReceiptCorrection
  description: 'Causal bank-receipt projection and supplier payables: bank_sequence is causal order and delivery_minute is message transport
    order; a later RETURNED genuinely corrects an earlier SETTLED and refunds principal, while older PROCESSING messages cannot undo
    a later settlement. Supplier payables start at zero when invoices were paid; a return reopens the debt. Supplier credit notes offset
    the reopened debt or are redeemed for cash, not both. Source articles: Causal bank-event projection; Causal bank corrections and
    supplier payables; Supplier credit instruments and reopened invoice principal; Supplier credit cash redemption, fees and value dates;
    Accidental-transfer refunds and ordinary supply cash.'
