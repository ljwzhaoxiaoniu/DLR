- logical_entity_id: LOGICAL.psp.WalletAutomation
  biz_name: WalletAutomation
  description: 'Wallet feedback control: xp_c_controllers holds a topup rule, a sweep rule and one business purchase. Topup credits
    its amount less the disclosed fee when the balance is below its threshold; sweep moves cash above its trigger down to its target.
    A sweep target below the topup threshold can recreate the trigger; the target alone does not prove a loop, so observation must show
    the repeated cycle. The payroll batch uses the same wallet after the merchant capture runs, and may be funded by the automation
    or an explicit manual transfer. Source articles: Wallet feedback control and observation; Wallet payroll batches and post-capture
    operating bands; Wallet-funded payroll service interfaces.'
  lifecycle:
    states:
    - OPEN
    - COMPLETED
    transitions:
    - from: OPEN
      to: COMPLETED
      by: record_case_outcome
  capabilities:
  - name: configure_wallet_automation
    kind: write
    anchor:
      param: controller_id
      role: primary
    guard: Configure the synthetic wallet controller. topup triggers below threshold_minor and transfers amount_minor, with its fee
      deducted from the credited amount; sweep triggers above th… Portal approval of the exact terms and execute_request are required;
      the bank checks local legality, not the commercial objective.
    source: PX-C-50
  - name: manage_wallet_purchase_order
    kind: write
    anchor:
      param: record_id
      role: primary
    guard: Import merchant order cancellations, distinguish a duplicate from the required purchase, reserve the live merchant obligation
      and set its settlement priority. Reconcile the actual… Portal approval of the exact terms and execute_request are required; the
      bank checks local legality, not the commercial objective.
    source: PX-C-50
  - name: run_wallet_observation
    kind: write
    anchor:
      param: controller_id
      role: primary
    guard: Run a finite number of real automation cycles, 1--12. Each cycle applies topup, then sweep, then retries the single due business
      purchase. Every cash movement and fee is posted; t… Portal approval of the exact terms and execute_request are required; the bank
      checks local legality, not the commercial objective.
    source: PX-C-50
  - name: settle_wallet_payroll
    kind: write
    anchor:
      param: payroll_id
      role: primary
    guard: Pay the actual payroll notice from the wallet at its current controller cycle. A late bank-accepted payment retains its true
      execution cycle. Portal approval of the exact terms and execute_request are required; the bank checks local legality, not the
      commercial objective.
    source: PX-C-R50
  - name: fund_wallet_payroll
    kind: write
    anchor:
      param: payroll_id
      role: primary
    guard: Transfer explicit operating cash into the payroll wallet, charging the disclosed manual funding fee. This is separate from
      configured automatic topups. Portal approval of the exact terms and execute_request are required; the bank checks local legality,
      not the commercial objective.
    source: IFACE-WALLET-PAYROLL
