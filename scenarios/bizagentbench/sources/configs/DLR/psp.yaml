  biz_name: NegotiatedPaymentPlan
  description: 'Negotiated infeasible payment plan: xp_c_negotiations exposes available cash, verified future receivable and the proposal
    directory; xp_c_negotiation_plans states the exact principal/deadline change and fee. Adopting a plan charges its fee and binds
    the revised obligation. The debtor confirmation states the undisputed face; collections arrive in tranches, and the disputed portion
    stays separate. A residual assignment transfers only the uncollected undisputed remainder without recourse. Source articles: Negotiated
    infeasible payment plans; Partial debtor collections and nonrecourse residual assignments.'
